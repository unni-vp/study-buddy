Acknowledge</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">build:</tspan> respond to another</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">person’s point, not just your prepared script.</text><path class="section-divider" d="M18 109H358" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use feedback to develop the idea. Thoughtful</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">qualification can show stronger understanding</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">than certainty.</text></g></g></svg>