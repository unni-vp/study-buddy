<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Language, structure and judgement</title><desc id="map-description">Word to meaning: “Swallowed” time: personification makes another minute seem irretrievably consumed. Name the method only when useful. Explain the particular meaning rather than saying a word is effective. An image develops: The repaired glove: practical care becomes a “crooked bridge”. The simile suggests an imperfect continuing connection, not that every disagreement has disappeared. Narrative focus: Close viewpoint: Ada expects confrontation before the father’s purpose is known. Follow changes in what the reader knows and how the character interprets them. Control the pace: “She turned.” The isolated movement delays the revelation at a decisive moment. Longer description keeps us waiting earlier. Sentence length has no single automatic effect. Build the paragraph: Claim → evidence → explanation: connect a precise choice to the question. Impression: father seems threatening. Evidence: forceful footsteps. Explain Ada’s anxious interpretation. Evaluate with nuance: Determined, not simply impulsive: months of saving qualify the secret departure. The final letter suggests connection. Reach a judgement that accounts for both the hurt and the ambition.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,346,229" transform="translate(18 18)"><rect width="346" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Word to meaning</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“Swallowed”</tspan> <tspan font-weight="700">time:</tspan> personification makes</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">another minute seem irretrievably</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">consumed.</text><path class="section-divider" d="M18 131H328" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Name the method only when useful. Explain</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the particular meaning rather than saying a</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">word is effective.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,346,207" transform="translate(18 259)"><rect width="346" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">An image develops</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">The</tspan> <tspan font-weight="700">repaired</tspan> <tspan font-weight="700">glove:</tspan> practical care becomes</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a “crooked bridge”.</text><path class="section-divider" d="M18 109H328" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The simile suggests an imperfect continuing</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">connection, not that every disagreement has</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">disappeared.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,362,333" transform="translate(376 18)"><rect width="362" height="333" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="344" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Narrative focus</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Close</tspan> <tspan font-weight="700">viewpoint:</tspan> Ada expects confrontation</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">before the father’s purpose is known.</text><path class="section-divider" d="M18 109H344" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Follow changes in what the reader knows and</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">how the character interprets them.</text><g transform="translate(18 172)"><g class="concept-illustration"><rect x="1" y="0" width="324" height="30" rx="5" fill="#f3f6fb" stroke="#77879a"/><text class="diagram-label" x="163.0" y="21" font-size="16" fill="#000000" font-weight="400" text-anchor="middle">Opening: isolation</text><path d="M163.0 33v11m-4-4 4 4 4-4" stroke="#526e83" fill="none" stroke-width="1.5"/><rect x="1" y="48" width="324" height="30" rx="5" fill="#f3f6fb" stroke="#77879a"/><text class="diagram-label" x="163.0" y="69" font-size="16" fill="#000000" font-weight="400" text-anchor="middle">Turning point: arrival</text><path d="M163.0 81v11m-4-4 4 4 4-4" stroke="#526e83" fill="none" stroke-width="1.5"/><rect x="1" y="96" width="324" height="30" rx="5" fill="#f3f6fb" stroke="#77879a"/><text class="diagram-label" x="163.0" y="117" font-size="16" fill="#000000" font-weight="400" text-anchor="middle">Ending: connection</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,362,185" transform="translate(376 363)"><rect width="362" height="185" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="344" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Control the pace</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“She</tspan> <tspan font-weight="700">turned.”</tspan> The isolated movement delays</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the revelation at a decisive moment.</text><path class="section-divider" d="M18 109H344" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Longer description keeps us waiting earlier.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sentence length has no single automatic effect.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,207" transform="translate(750 18)"><rect width="352" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Build the paragraph</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Claim</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">evidence</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">explanation:</tspan> connect</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a precise choice to the question.</text><path class="section-divider" d="M18 109H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Impression: father seems threatening.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Evidence: forceful footsteps. Explain Ada’s</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">anxious interpretation.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,229" transform="translate(750 237)"><rect width="352" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Evaluate with nuance</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Determined,</tspan> <tspan font-weight="700">not</tspan> <tspan font-weight="700">simply</tspan> <tspan font-weight="700">impulsive:</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">months of saving qualify the secret</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">departure.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The final letter suggests connection. Reach a</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">judgement that accounts for both the hurt</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and the ambition.</text></g></g></svg>