<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Sentences, punctuation and editing</title><desc id="map-description">Choose precise words: Specific nouns and verbs: searched a pocket twice gives more than very worried. Use vocabulary accurately. More adjectives and longer words do not automatically improve a sentence. Vary for meaning: Short emphasis: isolate a deadline or discovery. Longer sentence: connect action, thought and consequence. Choose the effect in context; do not force every sentence to be short or elaborate. Secure the boundaries: Comma splice: two complete clauses joined only by a comma. Use a full stop, conjunction or suitable semicolon. Colon: after a complete clause, introduce an explanation or detail. Control the dialogue: New speaker, new paragraph. Put the question mark or comma where the spoken words require it. Keep dialogue tags and surrounding narrative grammatically connected. Keep the viewpoint steady: Tense and reference: check who is acting and when. Signal memories and return to the main timeline. Check agreement, pronouns, apostrophes, its/it’s and common spellings. Read twice to edit: Meaning pass: prompt, development, sequence, viewpoint and ending. Accuracy pass: sentences, punctuation and spelling. Remove repetition rather than adding decoration.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,207" transform="translate(18 18)"><rect width="354" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Choose precise words</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Specific</tspan> <tspan font-weight="700">nouns</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">verbs:</tspan> searched a</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pocket twice gives more than very worried.</text><path class="section-divider" d="M18 109H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use vocabulary accurately. More adjectives</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and longer words do not automatically</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">improve a sentence.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,207" transform="translate(18 237)"><rect width="354" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Vary for meaning</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Short</tspan> <tspan font-weight="700">emphasis:</tspan> isolate a deadline or</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">discovery. <tspan font-weight="700">Longer</tspan> <tspan font-weight="700">sentence:</tspan> connect action,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">thought and consequence.</text><path class="section-divider" d="M18 131H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Choose the effect in context; do not force</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">every sentence to be short or elaborate.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,207" transform="translate(384 18)"><rect width="354" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Secure the boundaries</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Comma</tspan> <tspan font-weight="700">splice:</tspan> two complete clauses joined</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">only by a comma. Use a full stop, conjunction</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">or suitable semicolon.</text><path class="section-divider" d="M18 131H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Colon:</tspan> after a complete clause, introduce an</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">explanation or detail.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,207" transform="translate(384 237)"><rect width="354" height="207" rx="16" fill="white" stroke="#765