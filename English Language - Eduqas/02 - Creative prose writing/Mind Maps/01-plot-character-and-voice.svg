<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Plot, character and voice</title><desc id="map-description">A choice matters: Café worker: catch the bus or return the glasses. Both wishes make the choice meaningful. The encounter exposes a mistaken judgement, creating a change without a dramatic new subplot. Open a useful question: Significant object: abandoned glasses suggest someone missing and something needing attention. Give enough information to follow the event. Confusion is not the same as suspense. Develop the viewpoint: First person: report what I notice, remember and infer. Other minds are not automatically known. A brief memory can explain the present concern; return clearly to the main event. Show and summarise: Close detail: a repeated pocket search shows anxiety. Summary: an afternoon’s work can pass in a sentence, leaving space for the decisive encounter. Let dialogue act: Purpose: reveal a relationship, pressure a choice or move the event. Use small actions beside speech. Avoid long exchanges that explain what both speakers already know. Make the ending earned: Motif: an object returns with changed meaning. A photograph can preserve the marks without stopping the move. Resolve the main episode before adding another plot. Avoid an unprepared twist that cancels the story.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,398,333" transform="translate(18 18)"><rect width="398" height="333" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">A choice matters</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Café</tspan> <tspan font-weight="700">worker:</tspan> catch the bus or return the glasses.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Both wishes make the choice meaningful.</text><path class="section-divider" d="M18 109H380" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The encounter exposes a mistaken judgement,</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">creating a change without a dramatic new subplot.</text><g transform="translate(18 172)"><g class="concept-illustration"><rect x="1" y="0" width="360" height="30" rx="5" fill="#f3f6fb" stroke="#77879a"/><text class="diagram-label" x="181.0" y="21" font-size="16" fill="#000000" font-weight="400" text-anchor="middle">Starting belief</text><path d="M181.0 33v11m-4-4 4 4 4-4" stroke="#526e83" fill="none" stroke-width="1.5"/><rect x="1" y="48" width="360" height="30" rx="5" fill="#f3f6fb" stroke="#77879a"/><text class="diagram-label" x="181.0" y="69" font-size="16" fill="#000000" font-weight="400" text-anchor="middle">Choice under pressure</text><path d="M181.0 81v11m-4-4 4 4 4-4" stroke="#526e83" fill="none" stroke-width="1.5"/><rect x="1" y="96" width="360" height="30" rx="5" fill="#f3f6fb" stroke="#77879a"/><text class="diagram-label" x="181.0" y="117" font-size="16" fill="#000000" font-weight="400" text-anchor="middle">Changed understanding</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,398,185" transform="translate(18 363)"><rect width="398" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Open a useful question</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="