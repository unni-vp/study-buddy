<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Physics maths overview</title><desc id="map-description">Plan the calculation: Identify unknown and known quantities with units. Choose relationship and check conditions. Convert, rearrange, substitute, calculate and check. An equation sheet does not choose the method for you. Numbers and units: Use standard form with 1 ≤ coefficient &lt; 10. kilo 10³, milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹. Area conversion squares the scale factor. Volume cubes it. Round final answer, not every intermediate step. Relationships: Direct proportion: straight line through origin. Inverse: doubling one halves the other. Squared: doubling variable multiplies result by four. Conditions include constant temperature or acceleration and ideal transformers. Graph tools: Gradient = Δy/Δx, with y-unit/x-unit. Tangent gives rate at one point on a curve. Velocity–time signed area gives displacement. Force–extension area gives work transferred. Data summaries: Mean, median, mode and range answer different questions. Percentage change uses original denominator. Frequency-table mean is weighted. Correlation alone does not prove cause. Geometry and checking: Use perpendicular moment distance and angles from normal. Areas and volumes need matching units. Check physical meaning, direction and plausible size. Efficiency cannot exceed 100%.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" 