ext><text class="diagram-label" x="205.0" y="213" font-size="16" fill="#000000" text-anchor="middle">Tangent gradient: speed at that instant</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,314,353" transform="translate(476 18)"><rect width="314" height="353" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Area and displacement</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Velocity–time signed area gives</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">displacement.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Area magnitudes add for distance.</text><g transform="translate(18 137)"><g class="concept-illustration"><title>Shows the signed area represented by a positive velocity–time graph.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Velocity (m/s)</text><path d="M18 31V126H274" fill="none" stroke="#667781" stroke-width="1"/><path d="M20 124L155.68 48H266V124Z" fill="#e1edf8"/><path d="M20 124L155.68 48H266" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="139.0" y="150" font-size="16" fill="#000000" text-anchor="middle">Time (s)</text><text class="diagram-label" x="139.0" y="175" font-size="16" fill="#000000" text-anchor="middle">Shaded area: displacement</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3"