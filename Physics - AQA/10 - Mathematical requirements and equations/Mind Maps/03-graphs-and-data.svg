<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Graphs and data</title><desc id="map-description">Linear relationships: y = mx + c: gradient m, intercept c. Gradient = Δy/Δx. Use a large triangle on best-fit line. F against extension gives k. I against V gives 1/R. Axis order changes the gradient’s meaning. Curved graph: A tangent gives the rate at a chosen point. On distance–time, its gradient gives instantaneous speed. Area and displacement: Velocity–time signed area gives displacement. Area magnitudes add for distance. Area methods: Rectangle: base × height. Triangle: ½ × base × height. Count squares for curved or irregular areas, allowing for each square’s units. F–extension area gives work to spring. Distance–time area does not give distance. Statistical summaries: Mean = sum/count. Frequency tables need weighted sum. Median: middle after sorting. Mode: most frequent. Range: maximum − minimum. Percentage change = change/original ×100. Chart interpretation: Bar charts compare categories. Scatter graphs show correlation. Histogram frequency is area density = frequency/interval width. Correlation does not establish cause. Use units, uncertainties and actual data in conclusions.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,446,229" transform="translate(18 18)"><rect width="446" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="428" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Linear relationships</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">y</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mx</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">c:</tspan> gradient m, intercept c.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gradient</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">Δy/Δx.<