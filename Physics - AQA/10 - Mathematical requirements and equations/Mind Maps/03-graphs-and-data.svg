7.0" y="213" font-size="16" fill="#000000" text-anchor="middle">Tangent gradient: speed at that instant</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,314,353" transform="translate(460 18)"><rect width="314" height="353" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Area and displacement</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Velocity–time signed area gives</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">displacement.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Area magnitudes add for distance.</text><g transform="translate(18 137)"><g class="concept-illustration"><title>Shows the signed area represented by a positive velocity–time graph.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Velocity (m/s)</text><path d="M18 31V126H274" fill="none" stroke="#667781" stroke-width="1"/><path d="M20 124L155.68 48H266V124Z" fill="#e1edf8"/><path d="M20 124L155.68 48H266" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="139.0" y="150" font-size="16" fill="#000000" text-anchor="middle">Time (s)</text><text class="diagram-label" x="139.0" y="175" font-size="16" fill="#000000" text-anchor="middle">Shaded area: displacement</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,314,251" transform="translate(460 383)"><rect width="314" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Area methods</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rectangle: base × height.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Triangle: ½ × base × height.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Count squares for curved or irregular</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">areas, allowing for each square’s units.</text><path class="section-divider" d="M18 153H296" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">F–extension area gives work to spring.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Distance–time area does not give</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">distance.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,316,251" transform="translate(786 18)"><rect width="316" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="298" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Statistical summaries</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mean = sum/count.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Frequency tables need weighted sum.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Median: middle after sorting.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mode: most frequent.</text><path class="section-divider" d="M18 153H298" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Range: maximum − minimum.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Percentage change = change/original</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">×100.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,316,251" transform="translate(786 281)"><rect width="316" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="298" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Chart interpretation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bar charts compare categories.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Scatter graphs show correlation.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Histogram frequency is area</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">density = frequency/interval width.</text><path class="section-divider" d="M18 153H298" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Correlation does not establish cause.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use units, uncertainties and actual</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">data in conclusions.</text></g></g></svg>