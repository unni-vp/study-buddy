<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Equation toolkit</title><desc id="map-description">Stores and thermal energy: Eₖ = ½mv².  Eₚ = mgh.  Eₑ = ½ke². ΔE = mcΔθ: temperature rise. E = mL: state change. Add separate stages if both happen. Power and electricity: P = E/t = W/t.  E = Pt. Efficiency: useful output/total input, energy or power. Q = It.  V = IR.  P = VI = I²R.  E = QV. Use seconds, A, V, Ω, W and J. Matter and pressure: ρ = m/V. p = F/A. p = hρg. Convert area and volume carefully. p₁V₁ = p₂V₂: fixed gas mass and temperature. Check whether liquid-column or total pressure is requested. Forces and motion: W = mg.  Work = Fs.  F = ke.  M = Fd. s = vt. a = (v − u)/t. v² − u² = 2as.  F = ma. Use resultant force, extension and perpendicular distance. p = mv.  F = Δp/Δt. Include direction. Waves and images: T = 1/f. v = fλ. Echo distance = vt/2, because time covers both journeys. Magnification = image height/object height. No unit. Frequency stays constant across a medium boundary. Magnetism and links: F = BIl for a perpendicular conductor. Vₚ/Vₛ = nₚ/nₛ. Ideal: VₚIₚ = VₛIₛ. Energy to useful power to input power uses linked equations. Real losses need efficiency, not ideal balance.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,342,229" transform="translate(18 18)"><rect width="342" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Stores and thermal energy</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₖ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">½mv².</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₚ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mgh.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000"