</tspan> <tspan font-weight="700">Pt.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Efficiency: useful output/total input,</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">energy or power.</text><path class="section-divider" d="M18 153H324" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Q</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">It.</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">V</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">IR.</tspan></text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">P</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">VI</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">I²R.</tspan></text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">E</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">QV.</tspan></text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use seconds, A, V, Ω, W and J.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,366,207" transform="translate(372 18)"><rect width="366" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Matter and pressure</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">ρ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">m/V.</tspan> <tspan font-weight="700">p</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">F/A.</tspan> <tspan font-weight="700">p</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">hρg.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Convert area and volume carefully.</text><path class="section-divider" d="M18 109H348" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">p₁V₁</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">p₂V₂:</tspan> fixed gas mass and temperature.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Check whether liquid-column or total</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pressure is requested.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,366,317" transform="translate(372 237)"><rect width="366" height="317" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="70