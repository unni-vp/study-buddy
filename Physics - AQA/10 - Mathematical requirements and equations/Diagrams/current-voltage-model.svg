<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc"><title id="title">Current against potential difference for a five-ohm resistor</title><desc id="desc">Points at 0 volts 0 amps, 1 volt 0.2 amps, 2 volts 0.4 amps, 3 volts 0.6 amps and 4 volts 0.8 amps lie on a straight line through the origin. The gradient is 0.20 amps per volt.</desc><rect width="640" height="390" fill="white"/><g font-family="Arial,sans-serif" font-size="18" fill="black"><text x="20" y="28">Current (A)</text><text x="285" y="375">Potential difference (V)</text><g stroke="#ddd"><path d="M90 65V305 M90 305H570"/><path d="M210 65V305 M90 245H570"/><path d="M330 65V305 M90 185H570"/><path d="M450 65V305 M90 125H570"/><path d="M570 65V305 M90 65H570"/></g><path d="M90 60V305H580" fill="none" stroke="black" stroke-width="2"/><path d="M90 305L570 65" stroke="#177c85" stroke-width="3"/><g fill="#177c85"><circle cx="90" cy="305" r="5"/><circle cx="210" cy="245" r="5"/><circle cx="330" cy="185" r="5"/><circle cx="450" cy="125" r="5"/><circle cx="570" cy="65" r="5"/></g><text x="90" y="333" text-anchor="middle">0</text><text x="72" y="311" text-anchor="end">0.0</text><text x="210" y="333" text-anchor="middle">1</text><text x="72" y="251" text-anchor="end">0.2</text><text x="330" y="333" text-anchor="middle">2</text><text x="72" y="191" text-anchor="end">0.4</text><text x="450" y="333" text-anchor="middle">3</text><text x="72" y="131" text-anchor="end">0.6</text><text x="570" y="333" text-anchor="middle">4</text><text x="72" y="71" text-anchor="end">0.8</text><text x="330" y="95">Gradient = 0.20 A/V</text></g></svg>