<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="title"><title id="title">Energy is conserved: 100 J becomes 60 J useful and 40 J dissipated.</title><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="40" font-size="27" text-anchor="start" fill="#18344a">Follow the whole 100 J</text><rect x="45" y="100" width="280" height="100" rx="8" fill="#e7f0fb" stroke="#517386"/><text x="185" y="144" font-size="23" text-anchor="middle" fill="#18344a">Electrical input</text><text x="185" y="176" font-size="23" text-anchor="middle" fill="#18344a">100 J</text><path d="M325 150H430V105H570m-12-8 12 8-12 8" stroke="#2166ad" stroke-width="3" fill="none"/><path d="M430 150V265H570m-12-8 12 8-12 8" stroke="#bc7132" stroke-width="3" fill="none"/><rect x="580" y="60" width="375" height="100" rx="8" fill="#e0f1e8" stroke="#517386"/><text x="767" y="100" font-size="22" text-anchor="middle" fill="#18344a">Useful lifting energy: 60 J</text><text x="767" y="134" font-size="20" text-anchor="middle" fill="#18344a">Gravitational potential store</text><rect x="580" y="215" width="375" height="100" rx="8" fill="#fbe8d8" stroke="#517386"/><text x="767" y="255" font-size="22" text-anchor="middle" fill="#18344a">Unwanted heating: 40 J</text><text x="767" y="289" font-size="20" text-anchor="middle" fill="#18344a">Motor + surroundings</text><text x="45" y="344" font-size="21" text-anchor="start" fill="#18344a">Efficiency = 60 / 100 = 0.60 = 60%; total output = total input.</text></g></svg>