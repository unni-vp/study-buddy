<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Specific heat capacity: heat an insulated block</title><desc id="desc">An insulated metal block contains a heater and temperature probe. A meter records electrical energy supplied.</desc><rect width="1000" height="570" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Specific heat capacity: heat an insulated block</text><rect x="290" y="220" width="320" height="250" rx="5" fill="#f1e8d6" stroke="#182c3b" stroke-width="2"/><rect x="320" y="245" width="260" height="200" rx="5" fill="#cbd8df" stroke="#182c3b" stroke-width="2"/><rect x="365" y="155" width="30" height="220" rx="5" fill="#e4c1a0" stroke="#182c3b" stroke-width="2"/><rect x="500" y="120" width="22" height="255" rx="5" fill="#fafafa" stroke="#182c3b" stroke-width="2"/><circle cx="511" cy="370" r="13" fill="#cb5749" stroke="#182c3b" stroke-width="2"/><path d="M370 155V95H145M390 155V130H145" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="35" y="75" width="110" height="80" rx="5" fill="#e6f3f1" stroke="#182c3b" stroke-width="2"/><text x="90" y="110" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">Energy</text><text x="90" y="138" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">meter</text><text x="650" y="155" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Temperature probe</text><path d="M638 149L520 230" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="255" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Heater</text><path d="M638 249L392 270" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="355" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Metal block</text><path d="M638 349L575 350" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="440" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Insulation</text><path d="M638 434L606 410" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="515" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Measure block mass, electrical energy supplied and temperature rise.</text><text x="35" y="545" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Good thermal contact and insulation reduce energy loss.</text></g></svg>