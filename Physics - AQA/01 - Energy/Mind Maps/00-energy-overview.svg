<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Energy overview</title><desc id="map-description">Stores → transfers: Energy is conserved. Stores include kinetic, gravitational, elastic, thermal, chemical and nuclear. Transfers: mechanically, electrically, by heating or radiation. Light and sound are not stores. Calculate store changes: Eₖ = ½mv²  Eₚ = mgΔh  Eₑ = ½ke². Use kg, m, m/s and N/m. Spring: extension, not total length stay within proportional limit. Doubling v or e quadruples energy. Power &amp; efficiency: P = E/t = W/t. Watts = joules per second. Same work in less time → greater power. Efficiency = useful output / total input ×100 for %. Dissipated energy is less useful, not destroyed. Heating &amp; insulation: ΔE = mcΔθ. Temperature change, not final temperature. Measure mass, energy and temperature rise. Insulation: low conductivity and greater thickness reduce transfer. Compare cooling with controls. Resources &amp; reliability: Non-renewable: coal, oil, gas, nuclear. Renewable: biofuel, wind, Sun, tides, waves, hydro, geothermal. Uses: heating, transport, electricity. Wind/Sun vary tides are predictable but not continuous. Evaluate a choice: Compare emissions, waste, habitat effects, cost, reliability and suitable sites. A resource mix helps match demand. Science informs decisions economic and social choices matter.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,251" transform="translate(18 18)"><rect width="290" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Stores → transfers</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Energy</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">conserved.</tspan> Stores</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">include kinetic, gravitational,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">elastic, thermal, chemical and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">nuclear.</text><path class="section-divider" d="M18 153H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Transfers:</tspan> mechanically,</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electrically, by heating or radiation.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Light and sound are not stores.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,301" transform="translate(18 281)"><rect width="290" height="301" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="64" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Calculate store</text><text class="panel-title" x="50" y="62" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">changes</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₖ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">½mv²</tspan></text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₚ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mgΔh</tspan></text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₑ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">½ke².</tspan> Use kg, m, m/s and</text><text class="body-text" x="18" y="169" font-size="16" fill="#000000" font-weight="400" text-anchor="start">N/m.</text><path class="section-divider" d="M18 181H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Spring:</tspan> extension, not total length</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stay within proportional limit.</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Doubling v or e quadruples</text><text class="body-text" x="18" y="270" font-size="16" fill="#000000" font-weight="400" text-anchor="start">energy.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,442,372" transform="translate(320 18)"><rect width="442" height="372" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="424" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Power &amp; efficiency</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">P</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">E/t</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">W/t.</tspan> Watts = joules per second.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same work in less time → greater power.</text><path class="section-divider" d="M18 109H424" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Efficiency = useful output / total input</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">×100 for %.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dissipated energy is less useful, not destroyed.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Shows that useful and dissipated outputs still add up to the supplied energy.</title><text class="diagram-label" x="203.0" y="16" font-size="16" fill="#000000" text-anchor="middle">100 J supplied</text><rect y="30" width="243.6" height="26" fill="#b3ded4"/><rect x="243.6" y="30" width="162.4" height="26" fill="#edc4a5"/><text class="diagram-label" x="121.8" y="81" font-size="16" fill="#000000" text-anchor="middle">60 J useful</text><text class="diagram-label" x="324.8" y="81" font-size="16" fill="#000000" text-anchor="middle">40 J dissipated</text><text class="diagram-label" x="203.0" y="111" font-size="16" fill="#000000" text-anchor="middle">100 J = 60 J + 40 J</text><text class="diagram-label" x="203.0" y="137" font-size="16" fill="#000000" text-anchor="middle">Total energy is conserved</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,442,207" transform="translate(320 402)"><rect width="442" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="424" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Heating &amp; insulation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">ΔE</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mcΔθ.</tspan> Temperature change, not final temperature.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Measure mass, energy and temperature rise.</text><path class="section-divider" d="M18 109H424" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Insulation:</tspan> low conductivity and greater thickness</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reduce transfer.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare cooling with controls.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,328,229" transform="translate(774 18)"><rect width="328" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="310" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Resources &amp; reliability</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Non-renewable:</tspan> coal, oil, gas, nuclear.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Renewable:</tspan> biofuel, wind, Sun, tides,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">waves, hydro, geothermal.</text><path class="section-divider" d="M18 131H310" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Uses:</tspan> heating, transport, electricity.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Wind/Sun vary</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">tides are predictable but not continuous.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,328,207" transform="translate(774 259)"><rect width="328" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="310" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Evaluate a choice</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare emissions, waste, habitat</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">effects, cost, reliability and suitable sites.</text><path class="section-divider" d="M18 109H310" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A resource mix helps match demand.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Science informs decisions</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">economic and social choices matter.</text></g></g></svg>