<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Stores &amp; calculations</title><desc id="map-description">Describe a change: Thrown ball: kinetic → gravitational air resistance also warms surroundings. Brakes: kinetic → thermal. Kettle: electrical transfer → water’s thermal store. In collisions, kinetic energy may decrease while total energy is conserved. Conservation: Closed system: no net change in total energy. Include surroundings receiving transfers. Dissipation spreads energy into less useful stores. “Wasted” does not mean destroyed. Motion &amp; height: Eₖ = ½mv²  Eₚ = mgΔh. Use given g. A 2 kg object at 3 m/s has 9 J. Rearrange: v = √(2Eₖ/m). Double speed → four times kinetic energy. Springs: Eₑ = ½ke² within proportional limit. e = stretched length − original length, in metres. k = 200 N/m e = 0.050 m → Eₑ = 0.25 J. Square the converted extension. Power is a rate: P = E/t P = W/t W: work done (J)  E = Pt. 1,800 J in 30 s → 60 W. 1 kW = 1,000 W 1 kJ = 1,000 J. Powerful does not automatically mean efficient. Efficiency: Useful output / total input, for energy or power. No unit at most 1 or 100%. 350 J useful from 500 J → 70% 150 J dissipated. Lubrication reduces friction and unwanted heating.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,326,286" transform="translate(18 18)"><rect width="326" height="286" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Describe a change</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Thrown</tspan> <tspan font-weight="700">ball:</tspan> kinetic → gravitational</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">air resistance also warms surroundings.</text><path class="section-divider" d="M18 109H308" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Brakes:</tspan> kinetic → thermal.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Kettle:</tspan> electrical transfer → water’s</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">thermal store.</text><path class="section-divider" d="M18 188H308" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">In collisions, kinetic energy may</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">decrease while total energy is</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conserved.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,326,251" transform="translate(18 316)"><rect width="326" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Conservation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Closed</tspan> <tspan font-weight="700">system:</tspan> no net change in total</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">energy.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Include surroundings receiving</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">transfers.</text><path class="section-divider" d="M18 153H308" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dissipation spreads energy into less</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">useful stores. “Wasted” does not mean</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">destroyed.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,382,229" transform="translate(356 18)"><rect width="382" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="364" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Motion &amp; height</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₖ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">½mv²</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₚ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mgΔh.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use given g.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A 2 kg object at 3 m/s has 9 J.</text><path class="section-divider" d="M18 153H364" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rearrange:</tspan> <tspan font-weight="700">v</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">√(2Eₖ/m).</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Double speed → four times kinetic energy.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,382,410" transform="translate(356 259)"><rect width="382" height="410" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="364" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Springs</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₑ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">½ke²</tspan> within proportional limit.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">e = stretched length − original length, in metres.</text><path class="section-divider" d="M18 109H364" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">k = 200 N/m</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">e = 0.050 m → Eₑ = 0.25 J.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Square the converted extension.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Shows that elastic energy is the triangular area under a proportional force–extension graph.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Force (N)</text><path d="M18 30V126H342" fill="none" stroke="#667781" stroke-width="1"/><path d="M20 124L322 43V124Z" fill="#e2eef9"/><path d="M20 124L322 43" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="211.06" y="109" font-size="16" fill="#000000" text-anchor="middle">Area = ½ke²</text><text class="diagram-label" x="173.0" y="150" font-size="16" fill="#000000" text-anchor="middle">Extension (m)</text><text class="diagram-label" x="173.0" y="175" font-size="16" fill="#000000" text-anchor="middle">Within proportional limit</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,295" transform="translate(750 18)"><rect width="352" height="295" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Power is a rate</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">P</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">E/t</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">P</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">W/t</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">W:</tspan> <tspan font-weight="700">work</tspan> <tspan font-weight="700">done</tspan> <tspan font-weight="700">(J)</tspan></text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">E</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">Pt.</tspan></text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1,800 J in 30 s → 60 W.</text><path class="section-divider" d="M18 175H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1 kW = 1,000 W</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1 kJ = 1,000 J.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Powerful does not automatically mean</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">efficient.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,273" transform="translate(750 325)"><rect width="352" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Efficiency</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Useful output / total input, for energy or</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">power.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No unit</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">at most 1 or 100%.</text><path class="section-divider" d="M18 153H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">350 J useful from 500 J → 70%</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">150 J dissipated.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lubrication reduces friction and unwanted</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">heating.</text></g></g></svg>