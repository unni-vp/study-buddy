<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Heating &amp; practicals</title><desc id="map-description">Specific heat capacity: Energy to warm 1 kg by 1°C without a state change. Units: J/kg°C. ΔE = mcΔθ. Higher c → less warming for the same mass and input. Worked example: 0.50 kg water, c = 4,200 J/kg°C, warmed 20 → 40°C. Δθ = 20°C ΔE = 0.50 × 4,200 × 20 = 42,000 J. Convert grams to kg first. Measure c: Balance → mass thermometer → rise joulemeter or Pt → energy. Insulate a block improve heater/probe contact. Record initial temperature, heat, record rise. c = E/(mΔθ). Repeat keep electrical parts dry avoid hot surfaces. Explain error: Energy also heats equipment and surroundings. Using all input for the sample makes c too high. Insulation reduces losses. Good thermal contact reduces lag. Energy vs temperature-rise gradient = mc ideally. Insulators: Thicker material or lower conductivity → slower conduction under matching conditions. Trapped air reduces transfer draught-proofing limits escaping warm air. Payback time = cost / yearly saving, assuming constant savings. Cooling investigation: Compare equal thicknesses same containers, lids, water mass, starting temperature and room. Measure temperature at equal intervals repeat and average. Smaller drop in same time → better insulation. For thickness: keep material fixed. Handle hot water safely.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,410,391" transform="translate(18 18)"><rect width="410" height="391" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="392" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Specific heat capacity</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Energy to warm <tspan font-weight="700">1</tspan> <tspan font-weight="700">kg</tspan> <tspan font-weight="700">by</tspan> <tspan font-weight="700">1°C</tspan> without a state change.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Units:</tspan> J/kg°C.</text><path class="section-divider" d="M18 109H392" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">ΔE</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mcΔθ.</tspan> Higher c → less warming for the same</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mass and input.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Compares temperature rises for equal masses with different heat capacities.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Temperature rise (°C)</text><path d="M18 31V130H370" fill="none" stroke="#667781" stroke-width="1"/><path d="M20 128L354 48" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M20 128L354 102" fill="none" stroke="#468133" stroke-width="3"/><text class="diagram-label" x="354" y="38" font-size="16" fill="#000000" text-anchor="end">Lower c</text><text class="diagram-label" x="354" y="93" font-size="16" fill="#000000" text-anchor="end">Higher c</text><text class="diagram-label" x="187.0" y="154" font-size="16" fill="#000000" text-anchor="middle">Energy supplied (J)</text><text class="diagram-label" x="187.0" y="178" font-size="16" fill="#000000" text-anchor="middle">Same mass; no state change</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,410,185" transform="translate(18 421)"><rect width="410" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="392" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Worked example</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.50 kg water, c = 4,200 J/kg°C, warmed 20 → 40°C.</text><path class="section-divider" d="M18 87H392" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Δθ = 20°C</text><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ΔE = 0.50 × 4,200 × 20 = <tspan font-weight="700">42,000</tspan> <tspan font-weight="700">J.</tspan></text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Convert grams to kg first.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,330" transform="translate(440 18)"><rect width="350" height="330" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Measure c</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balance → mass</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">thermometer → rise</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">joulemeter or Pt → energy.</text><path class="section-divider" d="M18 131H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Insulate a block</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">improve heater/probe contact.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Record initial temperature, heat, record rise.</text><path class="section-divider" d="M18 210H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">c</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">E/(mΔθ).</tspan></text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">keep electrical parts dry</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">avoid hot surfaces.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,273" transform="translate(440 360)"><rect width="350" height="273" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Explain error</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Energy also heats equipment and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">surroundings.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Using all input for the sample makes c too</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">high.</text><path class="section-divider" d="M18 153H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Insulation reduces losses.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Good thermal contact reduces lag.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Energy vs temperature-rise gradient = mc</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ideally.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,300,286" transform="translate(802 18)"><rect width="300" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="282" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Insulators</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Thicker material or lower</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conductivity → slower conduction</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">under matching conditions.</text><path class="section-divider" d="M18 131H282" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Trapped air reduces transfer</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">draught-proofing limits escaping</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">warm air.</text><path class="section-divider" d="M18 210H282" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Payback time = cost / yearly saving,</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">assuming constant savings.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,300,330" transform="translate(802 316)"><rect width="300" height="330" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="282" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Cooling investigation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare equal thicknesses</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">same containers, lids, water mass,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">starting temperature and room.</text><path class="section-divider" d="M18 131H282" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Measure temperature at equal</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">intervals</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">repeat and average.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Smaller drop in same time → better</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">insulation.</text><path class="section-divider" d="M18 254H282" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">For</tspan> <tspan font-weight="700">thickness:</tspan> keep material fixed.</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Handle hot water safely.</text></g></g></svg>