<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Infrared: separate emission from absorption</title><desc id="desc">A detector compares emission from Leslie cube faces. Separately, an infrared lamp heats matched black and shiny samples.</desc><rect width="1000" height="600" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Infrared: separate emission from absorption</text><text x="35" y="100" font-size="25" fill="#182c3b" font-weight="700" text-anchor="start">Emission: Leslie cube</text><path d="M110 180L190 140L310 180V350L230 395L110 350Z" fill="#e4e8ea" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 180L230 220L310 180M230 220V395" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M112 184L228 223V390L112 348Z" fill="#344956" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="375" y="260" width="70" height="55" rx="5" fill="#d7e9e6" stroke="#182c3b" stroke-width="2"/><path d="M370 287H255" fill="none" stroke="#ad4c10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><text x="295" y="375" font-size="20" fill="#182c3b" font-weight="400" text-anchor="start">Same detector distance</text><text x="295" y="405" font-size="20" fill="#182c3b" font-weight="400" text-anchor="start">and angle for each face</text><text x="45" y="470" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Hot water inside</text><path d="M233 464L184 174" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="530" y="100" font-size="25" fill="#182c3b" font-weight="700" text-anchor="start">Absorption: matched samples</text><rect x="545" y="260" width="55" height="70" rx="5" fill="#e9d1b2" stroke="#182c3b" stroke-width="2"/><path d="M600 260L630 245V345L600 330Z" fill="#e7bf79" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M650 270L730 270" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M719.1946347717678 275.21958640933474L730 270L719.1946347717678 264.78041359066526" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M650 300L730 300" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M719.1946347717678 305.21958640933474L730 300L719.1946347717678 294.78041359066526" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M650 330L730 330" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M719.1946347717678 335.21958640933474L730 330L719.1946347717678 324.78041359066526" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="760" y="175" width="35" height="220" rx="5" fill="#344956" stroke="#182c3b" stroke-width="2"/><rect x="875" y="175" width="35" height="220" rx="5" fill="#d3dbe1" stroke="#182c3b" stroke-width="2"/><circle cx="777" cy="300" r="12" fill="#c94d40" stroke="#182c3b" stroke-width="2"/><circle cx="892" cy="300" r="12" fill="#c94d40" stroke="#182c3b" stroke-width="2"/><text x="550" y="435" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">IR lamp</text><text x="747" y="145" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Black</text><text x="865" y="145" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Shiny</text><text x="530" y="475" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Expose one sample at a time.</text><text x="530" y="505" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Keep distance and time the same.</text><text x="530" y="535" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Compare temperature rises.</text></g></svg>