<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Wave speed: measure distance and frequency</title><desc id="desc">A ripple tank plan shows six crests spanning five wavelengths. A vibrating string shows adjacent nodes separated by half a wavelength.</desc><rect width="1000" height="640" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Wave speed: measure distance and frequency</text><text x="30" y="90" font-size="25" fill="#182c3b" font-weight="700" text-anchor="start">Ripple tank: plan view</text><rect x="40" y="120" width="400" height="250" rx="5" fill="#d8effa" stroke="#182c3b" stroke-width="2"/><rect x="55" y="150" width="16" height="190" rx="5" fill="#b3cbd3" stroke="#182c3b" stroke-width="2"/><text x="65" y="410" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Vibrating dipper</text><path d="M110 140V345" fill="none" stroke="#17658c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M165 140V345" fill="none" stroke="#17658c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M220 140V345" fill="none" stroke="#17658c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M275 140V345" fill="none" stroke="#17658c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 140V345" fill="none" stroke="#17658c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M385 140V345" fill="none" stroke="#17658c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 335V365H385V335" fill="none" stroke="#ad4c10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="245" y="450" font-size="21" fill="#182c3b" font-weight="400" text-anchor="middle">6 crests enclose 5 wavelengths</text><text x="520" y="90" font-size="25" fill="#182c3b" font-weight="700" text-anchor="start">Stretched string</text><rect x="520" y="210" width="55" height="80" rx="5" fill="#deebe5" stroke="#182c3b" stroke-width="2"/><path d="M575 250C600 160 625 160 650 250S700 340 725 250S775 160 800 250H875" fill="none" stroke="#17658c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="890" cy="258" r="16" fill="#d7dfe4" stroke="#182c3b" stroke-width="2"/><path d="M875 250Q906 238 906 268V370" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="878" y="370" width="56" height="50" rx="5" fill="#a8b9c2" stroke="#182c3b" stroke-width="2"/><circle cx="575" cy="250" r="4" fill="#ad4c10" stroke="#ad4c10" stroke-width="2"/><circle cx="650" cy="250" r="4" fill="#ad4c10" stroke="#ad4c10" stroke-width="2"/><circle cx="725" cy="250" r="4" fill="#ad4c10" stroke="#ad4c10" stroke-width="2"/><circle cx="800" cy="250" r="4" fill="#ad4c10" stroke="#ad4c10" stroke-width="2"/><path d="M650 275V315H725V275" fill="none" stroke="#ad4c10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="687" y="350" font-size="23" fill="#182c3b" font-weight="400" text-anchor="middle">λ/2</text><text x="520" y="135" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Vibration generator</text><path d="M548 150V210" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="522" y="465" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Adjacent nodes are half a wavelength apart.</text><text x="35" y="550" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Measure several spacings, then divide to find one wavelength.</text><text x="35" y="580" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Use a measured / calibrated frequency. Wave speed v = fλ.</text></g></svg>