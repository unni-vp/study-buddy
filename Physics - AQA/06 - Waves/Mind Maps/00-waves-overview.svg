<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Waves overview</title><desc id="map-description">Wave measurements: Transverse: perpendicular vibrations. Longitudinal: parallel vibrations, compressions and rarefactions. Waves transfer energy, not matter overall. v = fλ.  T = 1/f. Use m, s and Hz. Boundaries: Reflection: i = r, measured from normal. Refraction: speed changes. Oblique rays change direction. Frequency stays constant. Slower speed means shorter wavelength. Absorption transfers energy to a material. Sound and Earth: Hearing: about 20 Hz–20 kHz. Ultrasound is above 20 kHz. Echo distance: vt/2. Divide for the return journey. P-waves: solids and liquids. S-waves: solids, not liquids. Electromagnetic spectrum: Radio, microwave, IR, visible, UV, X-ray, gamma: increasing frequency. Vacuum speed: 3.0 × 10⁸ m/s. All are transverse. Match uses to absorption, transmission and risk. Lenses and colour: Convex: converges rays. Can make real or virtual images. Concave: virtual, upright, smaller for a real object. Magnification: image height / object height. Objects reflect colour. Filters transmit it. Infrared and practicals: All objects emit and absorb IR. Hotter objects emit more. Balance: equal absorbed and emitted power means constant temperature. Compare surface finish at equal temperature and detector distance.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,346,251" transform="translate(18 18)"><rect width="346" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Wave measurements</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Transverse:</tspan> perpendicular vibrations.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Longitudinal:</tspan> parallel vibrations,</text><text class="body-text" x="18" 