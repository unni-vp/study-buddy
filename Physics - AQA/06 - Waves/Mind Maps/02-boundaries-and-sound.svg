<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Boundaries and sound</title><desc id="map-description">Reflection: Draw a normal perpendicular to the boundary. i = r, measured from the normal. Smooth: specular reflection. Rough: diffuse scattering. Each patch still obeys i = r. Refraction: Oblique wavefront reaches glass at different times. One part slows first, turning the wavefront. Air to glass: towards normal. Normal incidence: no direction change. Ray practical: Trace block or mirror position. Mark narrow rays at two points. Remove apparatus. Join marks and draw normal. Measure angles. Vary incidence and material. Use fine marks and consistent eye position. Do not claim 0.1° with a 1° protractor. Sound and hearing: Sound needs a medium. Air vibrations are longitudinal. Eardrum and other parts vibrate over a limited frequency range. Normal hearing: 20 Hz–20 kHz. Pitch: frequency. Loudness: amplitude. Ultrasound and echoes: Ultrasound: above 20 kHz. Partial reflection at different-material boundaries gives echoes. Medical imaging, flaw detection and echo sounding. Distance = vt/2. Both journeys are timed. Seismic evidence: P-waves: longitudinal, solids and liquids. S-waves: transverse, not liquids. Missing S-waves across the core support a liquid outer core. Paths and arrival times reveal boundaries and core size.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,398,207" transform="translate(18 18)"><rect width="398" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Reflection</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Draw a <tspan font-weight="700">normal</tspan> perpendicular to the boundary.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">i</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">r,</tspan> measured from the normal.</text><path class="section-divider" d="M18 109H380" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Smooth: specular reflection.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rough: diffuse scattering.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Each patch still obeys i = r.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,398,491" transform="translate(18 237)"><rect width="398" height="491" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Refraction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oblique wavefront reaches glass at different times.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One part slows first, turning the wavefront.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Air</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">glass:</tspan> towards normal.</text><path class="section-divider" d="M18 131H380" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Normal</tspan> <tspan font-weight="700">incidence:</tspan> no direction change.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Shows light changing speed and bending towards the normal as it enters glass obliquely.</title><rect x="0" y="90" width="362" height="138" fill="#e1f0f4"/><path d="M0 90L362 90" fill="none" stroke="#667781" stroke-width="1"/><path d="M173.76 24L173.76 221" fill="none" stroke="#667781" stroke-width="1" stroke-dasharray="5 4"/><path d="M95.75999999999999 27L173.76 90" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M168.84025765043154 89.10773590576409L173.76 90L171.85266621033642 85.37808721254851" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M173.76 90L209.76 200" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M206.1169644451661 196.57534060872968L209.76 200L210.67341099996747 195.0841399180674" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="9" y="56" font-size="16" fill="#000000" text-anchor="start">Air</text><text class="diagram-label" x="9" y="139" font-size="16" fill="#000000" text-anchor="start">Glass</text><text class="diagram-label" x="185.76" y="18" font-size="16" fill="#000000" text-anchor="start">Normal</text><text class="diagram-label" x="181.0" y="253" font-size="16" fill="#000000" text-anchor="middle">Slower: bends towards normal</text><text class="diagram-label" x="181.0" y="278" font-size="16" fill="#000000" text-anchor="middle">Frequency stays the same</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,310,295" transform="translate(428 18)"><rect width="310" height="295" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="292" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Ray practical</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Trace block or mirror position.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mark narrow rays at two points.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Remove apparatus.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Join marks and draw normal.</text><path class="section-divider" d="M18 153H292" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Measure angles.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Vary incidence and material.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use fine marks and consistent eye</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">position.</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not claim 0.1° with a 1° protractor.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,310,251" transform="translate(428 325)"><rect width="310" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="292" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Sound and hearing</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sound needs a medium.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Air vibrations are longitudinal.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Eardrum and other parts vibrate over</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a limited frequency range.</text><path class="section-divider" d="M18 153H292" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Normal</tspan> <tspan font-weight="700">hearing:</tspan> 20 Hz–20 kHz.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Pitch:</tspan> frequency.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Loudness:</tspan> amplitude.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,251" transform="translate(750 18)"><rect width="352" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Ultrasound and echoes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ultrasound:</tspan> above 20 kHz.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Partial reflection at different-material</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">boundaries gives echoes.</text><path class="section-divider" d="M18 131H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Medical imaging, flaw detection and echo</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sounding.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Distance</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">vt/2.</tspan></text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Both journeys are timed.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,229" transform="translate(750 281)"><rect width="352" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Seismic evidence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">P-waves:</tspan> longitudinal, solids and liquids.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">S-waves:</tspan> transverse, not liquids.</text><path class="section-divider" d="M18 109H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Missing S-waves across the core support a</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">liquid outer core.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Paths and arrival times reveal boundaries</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and core size.</text></g></g></svg>