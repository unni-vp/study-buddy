<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Measuring waves</title><desc id="map-description">Vibrations: Transverse: perpendicular to energy transfer. Longitudinal: parallel. Compressions are crowded, rarefactions spread out. A cork bobs while ripples travel. Matter does not travel overall with the wave. Amplitude and wavelength: Amplitude: maximum displacement from rest. Wavelength: equivalent point to next equivalent point. Crest-to-trough height is twice amplitude. Frequency and period: Frequency: complete waves per second, Hz. Period: seconds for one complete vibration. T = 1/f. 20 Hz gives 0.050 s. A time graph gives period. A distance graph gives wavelength. Wave equation: v = fλ. Speed in m/s wavelength in m. 5 Hz × 0.060 m = 0.30 m/s. At a boundary, frequency stays constant. Changed speed means changed wavelength. Ripple tank: Use a lamp, dipper and shallow water. Keep depth fixed. Frequency: dipper setting or waves/time. Measure several wavelengths then divide. Six crests enclose five wavelengths. Repeat. Calculate v = fλ. String and sound: String: stationary loops each span λ/2. Use signal-generator f and v = fλ. Sound: two microphones record the same pulse. v = separation/time delay. Use electronic timing and repeat. Secure loads. Keep water away from electrics.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,434,207" transform="translate(18 18)"><rect width="434" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Vibrations</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Transverse:</tspan> perpendicular to energy transfer.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Longitudinal:</tspan> parallel.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weigh