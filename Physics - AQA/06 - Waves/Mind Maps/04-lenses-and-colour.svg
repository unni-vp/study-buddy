34" font-size="16" fill="#000000" text-anchor="middle">Image</text><text class="diagram-label" x="159.0" y="264" font-size="16" fill="#000000" text-anchor="middle">Real, inverted image at 2F</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,229" transform="translate(384 18)"><rect width="354" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Object position</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Beyond</tspan> <tspan font-weight="700">2F:</tspan> smaller real image.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Between</tspan> <tspan font-weight="700">F</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">2F:</tspan> larger real image.</text><path class="section-divider" d="M18 109H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">At</tspan> <tspan font-weight="700">F:</tspan> parallel outgoing rays, no finite screen</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">image.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Inside</tspan> <tspan font-weight="700">F:</tspan> upright, enlarged virtual image on</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">object side.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,251" transform="translate(384 259)"><rect width="354" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Concave and magnification</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Parallel ray diverges as if from near F.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Centre ray stays straight.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Extend rays backwards with dashed lines.</text><path class="section-divider" d="M18 131H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Concave</tspan> <tspan font-weight="700">image:</tspan> virtual, upright, smaller.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Magnification:</tspan> image height/object height.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No unit.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Match height units.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,273" transform="translate(750 18)"><rect width="352" height="273" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Objects and filters</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Opaque</tspan> <tspan font-weight="700">colour:</tspan> reflected wavelengths</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reach eye.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Others are absorbed.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">White reflects visible colours.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Black absorbs most.</text><path class="section-divider" d="M18 175H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Filter</tspan> <tspan font-weight="700">colour:</tspan> transmitted wavelengths.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Filters do not create light.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Red object under only blue light looks dark.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,273" transform="translate(750 303)"><rect width="352" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Light and surfaces</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Transparent:</tspan> transmits with little</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">scattering.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Translucent:</tspan> transmits and scatters,</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">blurring a view.</text><path class="section-divider" d="M18 153H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Smooth:</tspan> specular reflection.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rough:</tspan> diffuse.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ideal red then blue filters transmit very little</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">white light.</text></g></g></svg>