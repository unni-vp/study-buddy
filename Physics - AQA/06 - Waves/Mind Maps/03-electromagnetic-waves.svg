<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Electromagnetic waves</title><desc id="map-description">Shared properties: All are transverse and travel in a vacuum. Transfer energy from source to absorber. c = 3.0 × 10⁸ m/s in vacuum. Different materials absorb and transmit wavelengths differently. Spectrum order: Increasing frequency: radio, microwave, IR, visible, UV, X-ray, gamma. Wavelength decreases in the same order. Visible: red to violet. Eyes detect only this part. f = c/λ. Convert wavelength first. Communication: Radio: radio and TV. Oscillating circuits generate waves. A receiver can develop AC at the same frequency. Microwave: suitable waves pass through atmosphere for satellite signals. Visible: signals along optical fibres. Heating and detection: Microwaves: absorbed by food, increasing thermal energy. IR: heaters, cooking and thermal cameras. Warm objects emit detectable IR. UV: tanning and fluorescent lamps, with skin risks. Medical applications: X-ray: bone absorbs more than soft tissue, giving contrast. Gamma: suitable tracers allow imaging. Targeted radiation can damage cancer cells. Match penetration and dose to the purpose. Gamma originates from nuclear changes. Hazards and dose: UV: skin ageing and skin-cancer risk. X-rays and gamma: ionisation, cell damage, mutations and cancer risk. Risk depends on type and dose. Minimise unnecessary exposure and use shielding. 1 Sv = 1,000 mSv. Compare matching units.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,350,207" transform="translate(18 18)"><rect width="350" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Shared properties</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">All are <tspan font-weight="700">transverse</tspan> and travel in a vacuum.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Transfer energy from source to absorber.</text><path class="section-divider" d="M18 109H332" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">c</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">3.0</tspan> <tspan font-weight="700">×</tspan> <tspan font-weight="700">10⁸</tspan> <tspan font-weight="700">m/s</tspan> in vacuum.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Different materials absorb and transmit</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">wavelengths differently.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,350,229" transform="translate(18 237)"><rect width="350" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Spectrum order</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Increasing</tspan> <tspan font-weight="700">frequency:</tspan> radio, microwave,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">IR, visible, UV, X-ray, gamma.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Wavelength decreases in the same order.</text><path class="section-divider" d="M18 13