" text-anchor="start">C = A × s</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">V = J/C.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Conventional</tspan> <tspan font-weight="700">current:</tspan> + to − outside</text><text class="body-text" x="18" y="185" font-size="16" fill="#000000" font-weight="400" text-anchor="start">supply.</text><path class="section-divider" d="M18 197H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metal electrons move oppositely.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A cell provides pd</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">it does not create charge.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,229" transform="translate(18 325)"><rect width="354" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Resistance</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">R</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">V/I</tspan> in Ω.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">At fixed V, greater R gives smaller I.</text><path class="section-divider" d="M18 109H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ammeter in series, voltmeter across</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">component.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use standard symbols</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a dot marks a junction.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,185" transform="translate(384 18)"><rect width="354" height="185" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">One loop: series</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same current throughout.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Supply pd = sum of component pds.</text><path class="section-divider" d="M18 109H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">4 Ω + 8 Ω across 12 V → 12 Ω total, 1 A</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">voltage drops 4 V and 8 V.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,388" transform="translate(384 215)"><rect width="354" height="388" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Branches: parallel</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same pd across supply-connected branches</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">total I = sum of branch currents.</text><path class="section-divider" d="M18 109H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Extra paths reduce total R.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One broken branch need not stop others.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Appliances can switch independently.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Shows two genuine parallel branches connected across the same cell.</title><path d="M22 35V14H67M22 56V114H300V14H182.0M67 14H136.0M67 14V68H136.0M182.0 68H300M10 35H34M15 56H29" fill="none" stroke="#2366a0" stroke-width="2"/><rect x="136.0" y="6" width="46" height="16" fill="white" stroke="#2366a0" stroke-width="2"/><rect x="136.0" y="60" width="46" height="16" fill="white" stroke="#2366a