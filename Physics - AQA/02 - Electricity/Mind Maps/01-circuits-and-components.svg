<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Circuits &amp; components</title><desc id="map-description">Charge carries energy: Q = It  E = QV. C = A × s V = J/C. Conventional current: + to − outside supply. Metal electrons move oppositely. A cell provides pd it does not create charge. Resistance: R = V/I in Ω. At fixed V, greater R gives smaller I. Ammeter in series, voltmeter across component. Use standard symbols a dot marks a junction. One loop: series: Same current throughout. Supply pd = sum of component pds. 4 Ω + 8 Ω across 12 V → 12 Ω total, 1 A voltage drops 4 V and 8 V. Branches: parallel: Same pd across supply-connected branches total I = sum of branch currents. Extra paths reduce total R. One broken branch need not stop others. Appliances can switch independently. Resistor &amp; lamp: I vertical, V horizontal: ohmic line through origin at constant temperature slope = 1/R. Lamp heats as current rises → ions vibrate more → R increases curve flattens. Use V/I at a point. Diode &amp; sensors: Diode: high reverse R conducts forward with sufficient pd. LED emits light. Thermistor R decreases with temperature thermostat. LDR R decreases with light dark-triggered lamp controls.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><pa