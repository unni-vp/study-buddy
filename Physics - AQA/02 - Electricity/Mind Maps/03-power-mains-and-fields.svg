<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Power, mains &amp; fields</title><desc id="map-description">Energy &amp; power: P = VI  P = I²R  E = Pt  E = QV. Use W, V, A, Ω, J, s, C. 12 V × 2 A = 24 W for 30 s → 720 J. Double I at fixed R → four times heating power. Mains &amp; protection: UK: 230 V, 50 Hz ac polarity reverses. Cell: dc. Live brown neutral blue near 0 V earth green/yellow, 0 V. Earth normally has no current. Live-to-case fault → earth current → fuse/breaker disconnects. Live can remain dangerous with switch open. National Grid: Step up V for transmission for same P = VI, current falls. Cable heating I²R falls. Step down V for consumers. High voltage does not lower cable resistance. Charging by friction: Electrons transfer between insulators protons remain in nuclei. Equal opposite charges result. Gain electrons → negative. Lose electrons → positive. Like charges repel, unlike attract. Electric field: Force on a positive test charge defines direction. Isolated + sphere: outwards − sphere: inwards. Closer to sphere → stronger field. Lines never cross. Sparks: Large charge imbalance can give a strong field. Air ionises and becomes conducting. Charge flows suddenly through the air, reducing the imbalance. Force can act before contact.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,374,273" transform="translate(18 18)"><rect width="374" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="356" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Energy &amp; power</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">P</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">VI</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">P</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">I²R</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">E</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">Pt</tspan></text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">E</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">QV.</tspan></text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use W, V, A, Ω, J, s, C.</text><path class="section-divider" d="M18 175H356" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">12 V × 2 A = 24 W</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">for 30 s → 720 J.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Double I at fixed R → four times heating power.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,374,330" transform="translate(18 303)"><rect width="374" height="330" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="356" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Mains &amp; protection</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">UK:</tspan> <tspan font-weight="700">230</tspan> <tspan font-weight="700">V,</tspan> <tspan font-weight="700">50</tspan> <tspan font-weight="700">Hz</tspan> <tspan font-weight="700">ac</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">polarity reverses.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cell:</tspan> dc.</text><path class="section-divider" d="M18 131H356" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Live brown</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">neutral blue near 0 V</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">earth green/yellow, 0 V.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Earth normally has no current.</text><path class="section-divider" d="M18 232H356" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Live-to-case fault → earth current →</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fuse/breaker disconnects.</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Live can remain dangerous with switch open.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,306,229" transform="translate(404 18)"><rect width="306" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="288" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">National Grid</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Step up V for transmission</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">for same P = VI, current falls.</text><path class="section-divider" d="M18 109H288" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cable heating <tspan font-weight="700">I²R</tspan> falls.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Step down V for consumers.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">High voltage does not lower cable</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">resistance.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,306,229" transform="translate(404 259)"><rect width="306" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="288" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Charging by friction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electrons transfer between insulators</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">protons remain in nuclei.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Equal opposite charges result.</text><path class="section-divider" d="M18 131H288" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gain electrons → negative.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lose electrons → positive.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Like charges repel, unlike attract.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,380,410" transform="translate(722 18)"><rect width="380" height="410" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="362" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Electric field</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Force on a positive test charge defines direction.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Isolated</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">sphere:</tspan> outwards</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">−</tspan> <tspan font-weight="700">sphere:</tspan> inwards.</text><path class="section-divider" d="M18 131H362" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Closer to sphere → stronger field.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lines never cross.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Shows a radial field and its direction around an isolated positive sphere.</title><circle cx="172.0" cy="77" r="16" fill="#f9e6d8" stroke="#b95619"/><text class="diagram-label" x="172.0" y="82" font-size="16" fill="#000000" text-anchor="middle">+</text><path d="M194.0 77.0L242.0 77.0" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M237.61208719054812 79.39712769302102L242.0 77.0L237.61208719054812 74.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M187.55634918610406 92.55634918610404L221.49747468305833 126.49747468305833" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M216.69972653313437 125.08977702734482L221.49747468305833 126.49747468305833L220.08977702734484 121.69972653313438" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M172.0 99.0L172.0 147.0" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M169.60287230697898 142.61208719054812L172.0 147.0L174.39712769302102 142.61208719054812" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M156.44365081389594 92.55634918610404L122.50252531694167 126.49747468305833" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M123.91022297265518 121.69972653313438L122.50252531694167 126.49747468305833L127.30027346686562 125.08977702734482" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M150.0 77.0L102.0 77.00000000000001" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M106.38791280945186 74.602872306979L102.0 77.00000000000001L106.38791280945186 79.39712769302103" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M156.44365081389594 61.44365081389596L122.50252531694167 27.50252531694168" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M127.30027346686562 28.910222972655184L122.50252531694167 27.50252531694168L123.91022297265518 32.30027346686563" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M172.0 55.0L172.0 7.0" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M174.39712769302102 11.387912809451864L172.0 7.0L169.60287230697898 11.387912809451862" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M187.55634918610403 61.44365081389595L221.49747468305833 27.502525316941664" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M220.08977702734484 32.30027346686562L221.49747468305833 27.502525316941664L216.69972653313437 28.910222972655166" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="172.0" y="175" font-size="16" fill="#000000" text-anchor="middle">Positive sphere: field points outwards</text></g></g></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,380,207" transform="translate(722 440)"><rect width="380" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="362" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Sparks</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Large charge imbalance can give a strong field.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Air ionises and becomes conducting.</text><path class="section-divider" d="M18 109H362" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Charge flows suddenly through the air,</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reducing the imbalance.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Force can act before contact.</text></g></g></svg>