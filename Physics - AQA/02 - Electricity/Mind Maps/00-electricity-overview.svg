ng.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,376,432" transform="translate(726 281)"><rect width="376" height="432" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="358" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Static &amp; fields</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rubbing</tspan> <tspan font-weight="700">transfers</tspan> <tspan font-weight="700">electrons:</tspan> gain → negative</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">loss → positive.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Like repel</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">unlike attract.</text><path class="section-divider" d="M18 153H358" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Field acts on charges without contact.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Strong fields can ionise air → spark.</text><g transform="translate(18 216)"><g class="concept-illustration"><title>Shows a radial field and its direction around an isolated positive sphere.</title><circle cx="170.0" cy="77" r="16" fill="#f9e6d8" stroke="#b95619"/><text class="diagram-label" x="170.0" y="82" font-size="16" fill="#000000" text-anchor="middle">+</text><path d="M192.0 77.0L240.0 77.0" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M235.61208719054812 79.39712769302102L240.0 77.0L235.61208719054812 74.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M185.55634918610406 92.55634918610404L219.49747468305833 126.49747468305833" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M214.69972653313437 125.08977702734482L219.49747468305833 126.49747468305833L218.08977702734484 121.69972653313438" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M170.0 99.0L170.0 147.0" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M167.60287230697898 142.61208719054812L170.0 147.0L172.39712769302102 142.61208719054812" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M154.44365081389594 92.55634918610404L120.50252531694167 126.49747468305833" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M121.91022297265518 121.69972653313438L120.50252531694167 126.49747468305833L125.30027346686562 125.08977702734482" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M148.0 77.0L100.0 77.00000000000001" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M104.38791280945186 74.602872306979L100.0 77.00000000000001L104.38791280945186 79.39712769302103" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M154.44365081389594 61.44365081389596L120.50252531694167 27.50252531694168" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M125.30027346686562 28.910222972655184L120.50252531694167 27.50252531694168L121.91022297265518 32.30027346686563" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M170.0 55.0L170.0 7.0" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M172.39712769302102 11.387912809451864L170.0 7.0L167.60287230697898 11.387912809451862" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M185.55634918610403 61.44365081389595L219.49747468305833 27.502525316941664" stroke="#2366a0" stroke-width="