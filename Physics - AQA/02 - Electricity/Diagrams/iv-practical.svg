<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">Measuring an I–V characteristic</title><desc id="desc">Low-voltage supply, variable resistor, ammeter and test component in series; voltmeter across the component.</desc><rect width="1000" height="610" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Measuring an I–V characteristic</text><path d="M100 130H140M190 130H240M300 130H470M580 130H900V390H720M560 390H295M245 390H100V130" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M240 108V152M260 116V144M260 130H280M280 108V152M300 116V144" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 130L180 110" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="85" font-size="20" fill="#182c3b" font-weight="400" text-anchor="start">Switch</text><text x="270" y="87" font-size="22" fill="#182c3b" font-weight="400" text-anchor="middle">Low-voltage DC</text><rect x="470" y="115" width="110" height="30" rx="5" fill="white" stroke="#182c3b" stroke-width="2"/><path d="M475 165L575 94" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M569.21122203119 104.51142471921955L575 94L563.1677560693939 95.99950082936591" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="525" y="208" font-size="22" fill="#182c3b" font-weight="400" text-anchor="middle">Variable resistor</text><circle cx="270" cy="390" r="25" fill="white" stroke="#182c3b" stroke-width="2"/><text x="270" y="398" font-size="24" fill="#182c3b" font-weight="700" text-anchor="middle">A</text><rect x="560" y="370" width="160" height="40" rx="5" fill="white" stroke="#182c3b" stroke-width="2"/><text x="640" y="448" font-size="22" fill="#182c3b" font-weight="400" text-anchor="middle">Test component</text><path d="M530 390V280H615M665 280H750V390" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="640" cy="280" r="25" fill="white" stroke="#182c3b" stroke-width="2"/><text x="640" y="288" font-size="24" fill="#182c3b" font-weight="700" text-anchor="middle">V</text><circle cx="530" cy="390" r="4" fill="#182c3b" stroke="#182c3b" stroke-width="2"/><circle cx="750" cy="390" r="4" fill="#182c3b" stroke="#182c3b" stroke-width="2"/><text x="270" y="448" font-size="22" fill="#182c3b" font-weight="400" text-anchor="middle">Ammeter in series</text><text x="640" y="245" font-size="22" fill="#182c3b" font-weight="400" text-anchor="middle">Voltmeter across component</text><text x="40" y="510" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Swap the test component: fixed resistor, filament lamp or diode.</text><text x="40" y="540" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Vary the potential difference; record paired current and voltage readings.</text><text x="40" y="570" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">For a diode, keep a protective resistor in series and limit the current.</text></g></svg>