<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Particle model overview</title><desc id="map-description">States &amp; density: Solid: vibrate in fixed positions. Liquid: close, move past. Gas: far apart, random movement. ρ = m/V. Gas has low density from large spacing. Ice is less dense than liquid water. Density practical: Balance → mass. Regular solid: dimensions → volume. Irregular solid: displaced water → volume. Liquid: subtract empty-container mass. Read meniscus at eye level avoid trapped bubbles. Temperature changes: Internal energy = total particle kinetic + potential energy. Temperature links to average kinetic energy. ΔE = mcΔθ. c: energy to warm 1 kg by 1°C, J/kg°C. State changes: Physical and reversible mass conserved in a closed sample. E = mL. During melting/boiling, potential energy rises, temperature stays constant. Fusion: solid/liquid vaporisation: liquid/gas. Pressure from collisions: Gas particles hit walls → force per area. Force is perpendicular to wall. At fixed volume and mass, warming → faster particles, more frequent/harder collisions → higher pressure. Compress a gas: Fixed mass, constant temperature: p₁V₁ = p₂V₂. Smaller volume → more wall collisions → greater p. Rapid compression does work on gas → internal energy and temperature can increase.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,394,372" transform="translate(18 18)"><rect width="394" height="372" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="376" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">States &amp; density</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Solid:</tspan> vibrate in fixed positions.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Liquid:</tspan> close, move past.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gas:</tspan> far apart, random movement.</text><path class="section-divider" d="M18 131H376" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">ρ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">m/V.</tspan> Gas has low density from large spacing.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ice is less dense than liquid water.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Compares fixed, irregular and widely spaced particle arrangements.</title><rect x="3.0" y="0" width="113.33333333333333" height="87" rx="5" fill="#eff6fc" stroke="#8ba6bc"/><circle cx="47.666666666666664" cy="36" r="5" fill="#2366a0"/><circle cx="59.666666666666664" cy="36" r="5" fill="#2366a0"/><circle cx="71.66666666666666" cy="36" r="5" fill="#2366a0"/><circle cx="47.666666666666664" cy="48" r="5" fill="#2366a0"/><circle cx="59.666666666666664" cy="48" r="5" fill="#2366a0"/><circle cx="71.66666666666666" cy="48" r="5" fill="#2366a0"/><text class="diagram-label" x="59.666666666666664" y="110" font-size="16" fill="#000000" text-anchor="middle">Solid</text><rect x="122.33333333333333" y="0" width="113.33333333333333" height="87" rx="5" fill="#eff6fc" stroke="#8ba6bc"/><circle cx="164.0" cy="36" r="5" fill="#2366a0"/><circle cx="175.0" cy="31" r="5" fill="#2366a0"/><circle cx="187.0" cy="33" r="5" fill="#2366a0"/><circle cx="165.0" cy="48" r="5" fill="#2366a0"/><circle cx="177.0" cy="47" r="5" fill="#2366a0"/><circle cx="189.0" cy="45" r="5" fill="#2366a0"/><text class="diagram-label" x="179.0" y="110" font-size="16" fill="#000000" text-anchor="middle">Liquid</text><rect x="241.66666666666666" y="0" width="113.33333333333333" height="87" rx="5" fill="#eff6fc" stroke="#8ba6bc"/><circle cx="271.3333333333333" cy="14" r="5" fill="#2366a0"/><circle cx="326.3333333333333" cy="68" r="5" fill="#2366a0"/><circle cx="298.3333333333333" cy="41" r="5" fill="#2366a0"/><text class="diagram-label" x="298.3333333333333" y="110" font-size="16" fill="#000000" text-anchor="middle">Gas</text><text class="diagram-label" x="179.0" y="137" font-size="16" fill="#000000" text-anchor="middle">Symbols show particle arrangement</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,394,229" transform="translate(18 402)"><rect width="394" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="376" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Density practical</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balance → mass.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Regular</tspan> <tspan font-weight="700">solid:</tspan> dimensions → volume.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Irregular</tspan> <tspan font-weight="700">solid:</tspan> displaced water → volume.</text><path class="section-divider" d="M18 131H376" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Liquid:</tspan> subtract empty-container mass.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Read meniscus at eye level</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">avoid trapped bubbles.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,314,229" transform="translate(424 18)"><rect width="314" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Temperature changes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Internal energy = total particle kinetic</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">+ potential energy.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Temperature links to average kinetic</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">energy.</text><path class="section-divider" d="M18 153H296" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">ΔE</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mcΔθ.</tspan> c: energy to warm 1 kg</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">by 1°C, J/kg°C.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,314,251" transform="translate(424 259)"><rect width="314" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">State changes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Physical and reversible</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mass conserved in a closed sample.</text><path class="section-divider" d="M18 109H296" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">E</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mL.</tspan> During melting/boiling,</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">potential energy rises, temperature</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stays constant.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fusion:</tspan> solid/liquid</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">vaporisation:</tspan> liquid/gas.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,207" transform="translate(750 18)"><rect width="352" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Pressure from collisions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gas particles hit walls → force per area.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Force is perpendicular to wall.</text><path class="section-divider" d="M18 109H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">At fixed volume and mass, warming →</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">faster particles, more frequent/harder</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">collisions → higher pressure.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,251" transform="translate(750 237)"><rect width="352" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Compress a gas</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fixed</tspan> <tspan font-weight="700">mass,</tspan> <tspan font-weight="700">constant</tspan> <tspan font-weight="700">temperature:</tspan> <tspan font-weight="700">p₁V₁</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">=</tspan> <tspan font-weight="700">p₂V₂.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Smaller volume → more wall collisions →</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">greater p.</text><path class="section-divider" d="M18 153H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rapid compression does work on gas →</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">internal energy and temperature can</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">increase.</text></g></g></svg>