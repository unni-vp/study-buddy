<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">States &amp; density</title><desc id="map-description">Three states: Solid: close, fixed arrangement vibration. Liquid: close, irregular, able to flow. Gas: widely spaced, random motion easily compressed. Individual particles do not expand when heated. Physical changes: Melting/freezing boiling or evaporation/condensation sublimation solid → gas. No new substance reversing restores properties. Open-container mass loss may be escaping vapour. Regular &amp; irregular solids: Weigh solid. Cuboid volume = lwh cylinder = πr²h. Use ruler, callipers or micrometer. Irregular: fully submerge final water volume − initial = solid volume. Displacement can is an alternative. Liquids &amp; good readings: Weigh empty dry cylinder, then cylinder + liquid. Subtract to find liquid mass. Read meniscus at eye level. Avoid bubbles/splashes unsuitable for solids that dissolve or absorb water. Density equation: ρ = m/V  m = ρV  V = m/ρ. 240 g / 80 cm³ = 3.0 g/cm³ = 3,000 kg/m³. 1 cm³ = 10⁻⁶ m³. Keep units consistent. Explain changes: Fixed mass spreads over larger volume → lower density. Gas spacing explains low density. Do not claim every solid is denser than its liquid: ice is an exception. Repeats assess random variation check zero errors.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,406,394" transform="translate(18 18)"><rect width="406" height="394" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="388" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Three states</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Solid:</tspan> close, fixed arrangement</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">vibration.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Liquid:</tspan> close, irregular, able to flow.</text><path class="section-divider" d="M18 131H388" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gas:</tspan> widely spaced, random motion</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">easily compressed.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Individual particles do not expand when heated.</text><g transform="translate(18 216)"><g class="concept-illustration"><title>Compares fixed, irregular and widely spaced particle arrangements.</title><rect x="3.0" y="0" width="117.33333333333333" height="87" rx="5" fill="#eff6fc" stroke="#8ba6bc"/><circle cx="49.666666666666664" cy="36" r="5" fill="#2366a0"/><circle cx="61.666666666666664" cy="36" r="5" fill="#2366a0"/><circle cx="73.66666666666666" cy="36" r="5" fill="#2366a0"/><circle cx="49.666666666666664" cy="48" r="5" fill="#2366a0"/><circle cx="61.666666666666664" cy="48" r="5" fill="#2366a0"/><circle cx="73.66666666666666" cy="48" r="5" fill="#2366a0"/><text class="diagram-label" x="61.666666666666664" y="110" font-size="16" fill="#000000" text-anchor="middle">Solid</text><rect x="126.33333333333333" y="0" width="117.33333333333333" height="87" rx="5" fill="#eff6fc" stroke="#8ba6bc"/><circle cx="170.0" cy="36" r="5" fill="#2366a0"/><circle cx="181.0" cy="31" r="5" fill="#2366a0"/><circle cx="193.0" cy="33" r="5" fill="#2366a0"/><circle cx="171.0" cy="48" r="5" fill="#2366a0"/><circle cx="183.0" cy="47" r="5" fill="#2366a0"/><circle cx="195.0" cy="45" r="5" fill="#2366a0"/><text class="diagram-label" x="185.0" y="110" font-size="16" fill="#000000" text-anchor="middle">Liquid</text><rect x="249.66666666666666" y="0" width="117.33333333333333" height="87" rx="5" fill="#eff6fc" stroke="#8ba6bc"/><circle cx="281.3333333333333" cy="14" r="5" fill="#2366a0"/><circle cx="336.3333333333333" cy="68" r="5" fill="#2366a0"/><circle cx="308.3333333333333" cy="41" r="5" fill="#2366a0"/><text class="diagram-label" x="308.3333333333333" y="110" font-size="16" fill="#000000" text-anchor="middle">Gas</text><text class="diagram-label" x="185.0" y="137" font-size="16" fill="#000000" text-anchor="middle">Symbols show particle arrangement</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,406,229" transform="translate(18 424)"><rect width="406" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="388" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Physical changes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Melting/freezing</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">boiling or evaporation/condensation</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sublimation solid → gas.</text><path class="section-divider" d="M18 131H388" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No new substance</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reversing restores properties.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Open-container mass loss may be escaping vapour.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,302,301" transform="translate(436 18)"><rect width="302" height="301" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="64" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Regular &amp; irregular</text><text class="panel-title" x="50" y="62" font-size="20" fill="#468133" font-weight="700" text-anchor="start">solids</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Weigh solid.</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cuboid volume = lwh</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cylinder = πr²h.</text><text class="body-text" x="18" y="169" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use ruler, callipers or micrometer.</text><path class="section-divider" d="M18 181H284" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Irregular:</tspan> fully submerge</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">final water volume − initial = solid</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">volume.</text><text class="body-text" x="18" y="270" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Displacement can is an alternative.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,302,279" transform="translate(436 331)"><rect width="302" height="279" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="64" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Liquids &amp; good</text><text class="panel-title" x="50" y="62" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">readings</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Weigh empty dry cylinder, then</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cylinder + liquid.</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Subtract to find liquid mass.</text><path class="section-divider" d="M18 159H284" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Read meniscus at eye level.</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Avoid bubbles/splashes</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">unsuitable for solids that dissolve or</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">absorb water.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,242" transform="translate(750 18)"><rect width="352" height="242" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Density equation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">ρ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">m/V</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">m</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">ρV</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">V</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">m/ρ.</tspan></text><path class="section-divider" d="M18 131H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">240 g / 80 cm³ = 3.0 g/cm³ = <tspan font-weight="700">3,000</tspan> <tspan font-weight="700">kg/m³.</tspan></text><path class="section-divider" d="M18 166H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1 cm³ = 10⁻⁶ m³.</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep units consistent.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,251" transform="translate(750 272)"><rect width="352" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Explain changes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fixed mass spreads over larger volume →</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">lower density.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gas spacing explains low density.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not claim every solid is denser than its</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">liquid: ice is an exception.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeats assess random variation</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">check zero errors.</text></g></g></svg>