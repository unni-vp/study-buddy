<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Heating &amp; gas pressure</title><desc id="map-description">Internal energy: Total kinetic + potential energy of all particles. Temperature is related to average kinetic energy. ΔE = mcΔθ when temperature changes use kg, J/kg°C and a temperature difference. Latent heat: E = mL L in J/kg. Change state without changing temperature. Melting/boiling: potential energy rises. Freezing/condensing releases energy. c and L describe different changes. Heating graphs: Slopes: temperature rises. Plateaus: state changes while energy still enters. Constant-power heating: longer time means more input energy. Cooling gives the reverse changes. Combine stages: 0.10 kg ice at 0°C → water at 20°C: mL + mcΔθ. With L = 334,000 and c = 4,200 total = 41,800 J. At 100 W, ideal time = 418 s losses add time. Fixed-volume heating: Fixed mass: hotter → higher average kinetic energy → faster particles. More frequent wall collisions and larger momentum changes → greater force per area → greater pressure. Volume &amp; compression: Fixed mass, constant T: pV constant. 100 kPa × 60 cm³ = 150 kPa × 40 cm³. Rapid compression does work and may heat gas, so constant-T rule may not apply.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,322,273" transform="translate(18 18)"><rect width="322" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Internal energy</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Total kinetic + potential energy of all</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">particles.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Temperature is related to average</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">kinetic energy.</text><path class="section-divider" d="M18 153H304" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">ΔE</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mcΔθ</tspan> when temperature</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">changes</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">use kg, J/kg°C and a temperature</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">difference.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,322,273" transform="translate(18 303)"><rect width="322" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Latent heat</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">E</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mL</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">L in J/kg.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Change state without changing</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">temperature.</text><path class="section-divider" d="M18 153H304" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Melting/boiling:</tspan> potential energy</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">rises.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Freezing/condensing releases energy. c</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and L describe different changes.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,386,399" transform="translate(352 18)"><rect width="386" height="399" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="368" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Heating graphs</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Slopes:</tspan> temperature rises.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Plateaus:</tspan> state changes while energy still enters.</text><path class="section-divider" d="M18 109H368" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Constant-power</tspan> <tspan font-weight="700">heating:</tspan> longer time means</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">more input energy.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cooling gives the reverse changes.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Shows energy continuing to enter during constant-temperature changes of state.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Temperature (°C)</text><path d="M15 31V140H347" fill="none" stroke="#667781" stroke-width="1"/><path d="M20 133L87.5 104H157.5L234.5 65H301.0L343 33" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="122.49999999999999" y="130" font-size="16" fill="#000000" text-anchor="middle">Melting</text><text class="diagram-label" x="266.0" y="91" font-size="16" fill="#000000" text-anchor="middle">Boiling</text><text class="diagram-label" x="175.0" y="164" font-size="16" fill="#000000" text-anchor="middle">Energy supplied (J)</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,386,207" transform="translate(352 429)"><rect width="386" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="368" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Combine stages</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.10 kg ice at 0°C → water at 20°C: mL + mcΔθ.</text><path class="section-divider" d="M18 87H368" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start">With L = 334,000 and c = 4,200</text><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">total = <tspan font-weight="700">41,800</tspan> <tspan font-weight="700">J.</tspan></text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">At 100 W, ideal time = 418 s</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">losses add time.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,207" transform="translate(750 18)"><rect width="352" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Fixed-volume heating</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fixed</tspan> <tspan font-weight="700">mass:</tspan> hotter → higher average</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">kinetic energy → faster particles.</text><path class="section-divider" d="M18 109H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More frequent wall collisions and larger</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">momentum changes → greater force per</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">area → greater pressure.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,185" transform="translate(750 237)"><rect width="352" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Volume &amp; compression</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fixed</tspan> <tspan font-weight="700">mass,</tspan> <tspan font-weight="700">constant</tspan> <tspan font-weight="700">T:</tspan> <tspan font-weight="700">pV</tspan> <tspan font-weight="700">constant.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">100 kPa × 60 cm³ = 150 kPa × 40 cm³.</text><path class="section-divider" d="M18 109H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rapid compression does work and may</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">heat gas, so constant-T rule may not apply.</text></g></g></svg>