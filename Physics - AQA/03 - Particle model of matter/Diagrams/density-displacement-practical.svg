<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc"><title id="title">Density of an irregular solid: volume by displacement</title><desc id="desc">The water level rises from V₁ to V₂ when an irregular solid is fully submerged. Its volume is the difference.</desc><rect width="1000" height="555" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Density of an irregular solid: volume by displacement</text><text x="195" y="100" font-size="25" fill="#182c3b" font-weight="700" text-anchor="middle">Before</text><path d="M120 145V435H270V145" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 145h-10m160 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="123" y="285" width="144" height="147" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M120 145V435H270V145" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M240 180h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M240 220h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M240 260h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M240 300h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M240 340h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M240 380h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="305" y="292" font-size="25" fill="#182c3b" font-weight="400" text-anchor="start">V₁</text><path d="M270 285h25" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="625" y="100" font-size="25" fill="#182c3b" font-weight="700" text-anchor="middle">After</text><path d="M550 145V435H700V145" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M550 145h-10m160 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="553" y="220" width="144" height="212" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M550 145V435H700V145" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M670 180h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M670 220h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M670 260h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M670 300h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M670 340h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M670 380h30" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="735" y="227" font-size="25" fill="#182c3b" font-weight="400" text-anchor="start">V₂</text><path d="M700 220h25" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M615 360L655 350L660 403L605 405Z" fill="#abb7bf" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M630 357V125" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="775" y="365" font-size="20" fill="#182c3b" font-weight="400" text-anchor="start">Fully submerged</text><text x="35" y="490" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Volume of solid = V₂ − V₁. Remove trapped bubbles.</text><text x="35" y="520" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Measure its mass separately on a balance. Density = mass / volume.</text></g></svg>