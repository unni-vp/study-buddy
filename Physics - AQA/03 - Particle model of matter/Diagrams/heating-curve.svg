<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title"><title id="title">Heating curve: warming slopes alternate with melting and boiling plateaus. Schematic, not to scale.</title><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI,Arial,sans-serif"><path d="M85 70V345H940" stroke="#617480" stroke-width="2" fill="none"/><text x="45" y="39" font-size="22" text-anchor="start" fill="#18344a">Temperature</text><text x="800" y="390" font-size="22" text-anchor="start" fill="#18344a">Energy supplied</text><path d="M110 320L260 260H400L580 145H760L900 70" stroke="#2166ad" stroke-width="5" fill="none"/><text x="180" y="288" font-size="21" text-anchor="middle" fill="#18344a">Solid</text><text x="318" y="244" font-size="21" text-anchor="middle" fill="#18344a">Melting</text><text x="480" y="195" font-size="21" text-anchor="middle" fill="#18344a">Liquid</text><text x="662" y="125" font-size="21" text-anchor="middle" fill="#18344a">Boiling</text><text x="865" y="55" font-size="21" text-anchor="middle" fill="#18344a">Gas</text><text x="280" y="435" font-size="22" text-anchor="start" fill="#18344a">Flat sections: state changes, temperature stays constant.</text></g></svg>