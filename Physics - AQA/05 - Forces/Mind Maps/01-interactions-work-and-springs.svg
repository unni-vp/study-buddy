<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Interactions, work &amp; springs</title><desc id="map-description">Contact or non-contact: Contact: friction, drag, tension, normal force. Non-contact: gravity, electrostatic, magnetic. Scalar: speed, mass, energy. Vector: force, velocity, momentum. Arrow length and direction represent a vector. Weight &amp; components: W = mg, N = kg × N/kg weight acts at centre of mass. Mass stays the same if g changes. For angled forces, draw tip-to-tail at a stated scale. Diagonal = resultant perpendicular components have the same combined effect. Work done: W = Fs, distance along force. 40 N × 3 m = 120 J. Work against friction warms surfaces. A stationary object needs more than one force to change shape: pulls at opposite ends, for example. Hooke’s law: F = ke up to proportional limit. 6 N / 0.030 m = 200 N/m. Elastic = recovers shape inelastic = permanent. Losing proportionality need not immediately mean permanent deformation. Spring practical: Record unloaded length add known loads let settle read length at eye level. Extension = loaded − original. F = mg includes hanger. Repeat secure stand, avoid overload and falling masses. Graph &amp; stored energy: F vertical vs e horizontal: straight-line gradient = k. Unload to test elastic recovery. Eₑ = ½ke², triangular area under proportional F–e graph. Do not use final force × extension.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,323" transform="translate(18 18)"><rect width="290" height="323" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="64" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Contact or</text><text class="panel-title" x="50" y="62" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">non-contact</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Contact:</tspan> friction, drag, tension,</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">normal force.</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Non-contact:</tspan> gravity,</text><text class="body-text" x="18" y="169" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electrostatic, magnetic.</text><path class="section-divider" d="M18 181H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Scalar:</tspan> speed, mass, energy.</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Vector:</tspan> force, velocity,</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">momentum.</text><text class="body-text" x="18" y="270" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Arrow length and direction</text><text class="body-text" x="18" y="292" font-size="16" fill="#000000" font-weight="400" text-anchor="start">represent a vector.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,273" transform="translate(18 353)"><rect width="290" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Weight &amp; components</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">W</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mg,</tspan> N = kg × N/kg</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">weight acts at centre of mass.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mass stays the same if g changes.</text><path class="section-divider" d="M18 131H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">For angled forces, draw tip-to-tail</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">at a stated scale.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Diagonal = resultant</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">perpendicular components have</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the same combined effect.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,326,229" transform="translate(320 18)"><rect width="326" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Work done</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">W</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">Fs,</tspan> distance along force. 40 N × 3</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">m = 120 J.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Work against friction warms surfaces.</text><path class="section-divider" d="M18 131H308" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A stationary object needs more than</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">one force to change shape: pulls at</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">opposite ends, for example.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,326,251" transform="translate(320 259)"><rect width="326" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Hooke’s law</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">F</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">ke</tspan> up to proportional limit. 6 N /</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.030 m = 200 N/m.</text><path class="section-divider" d="M18 109H308" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Elastic = recovers shape</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">inelastic = permanent.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Losing proportionality need not</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">immediately mean permanent</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">deformation.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,444,273" transform="translate(658 18)"><rect width="444" height="273" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="426" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Spring practical</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Record unloaded length</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">add known loads</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">let settle</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">read length at eye level.</text><path class="section-divider" d="M18 153H426" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Extension = loaded − original.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">F = mg includes hanger.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">secure stand, avoid overload and falling masses.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,444,388" transform="translate(658 303)"><rect width="444" height="388" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="426" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Graph &amp; stored energy</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">F</tspan> <tspan font-weight="700">vertical</tspan> <tspan font-weight="700">vs</tspan> <tspan font-weight="700">e</tspan> <tspan font-weight="700">horizontal:</tspan> straight-line gradient = k.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Unload to test elastic recovery.</text><path class="section-divider" d="M18 109H426" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₑ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">½ke²,</tspan> triangular area under proportional F–e graph.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not use final force × extension.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Shows that elastic energy is the triangular area under a proportional force–extension graph.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Force (N)</text><path d="M18 30V126H404" fill="none" stroke="#667781" stroke-width="1"/><path d="M20 124L384 43V124Z" fill="#e2eef9"/><path d="M20 124L384 43" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="248.88" y="109" font-size="16" fill="#000000" text-anchor="middle">Area = ½ke²</text><text class="diagram-label" x="204.0" y="150" font-size="16" fill="#000000" text-anchor="middle">Extension (m)</text><text class="diagram-label" x="204.0" y="175" font-size="16" fill="#000000" text-anchor="middle">Within proportional limit</text></g></g></g></g></svg>