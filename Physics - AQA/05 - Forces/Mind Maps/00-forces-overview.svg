<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Forces overview</title><desc id="map-description">Vectors &amp; resultants: Vectors have magnitude + direction scalars have magnitude only. Force in N weight W = mg. Resultant combines forces. Zero resultant → constant velocity, possibly zero. Resolve perpendicular components with scale drawings. Work &amp; springs: W = Fs  F = ke  Eₑ = ½ke². Use extension in m. Spring equations within proportional limit. Elastic returns to original shape inelastic leaves deformation. Measure force/extension with ruler and known loads. Moments &amp; pressure: M = Fd, perpendicular d. Balance clockwise/anticlockwise moments. Levers/gears transmit turning. p = F/A  p = hρg. Greater depth → greater p pressure difference gives upthrust. Motion &amp; laws: v = s/t  a = Δv/t  v²−u² = 2as for constant acceleration. Distance–time slope = speed velocity–time slope = a, area = displacement. F = ma third-law forces act on different objects. Stopping &amp; falling: Stopping = thinking + braking. Thinking = vt braking transfers kinetic energy to thermal stores. Weight &gt; drag → accelerates. Drag grows with speed until forces balance at terminal velocity. Momentum: p = mv  F = Δp/Δt. Closed system: total momentum conserved. Use signed velocities. Airbags/mats increase stopping time, reducing average force for the same momentum change.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,346,295" transform="translate(18 18)"><rect width="346" height="295" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Vectors &amp; resultants</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Vectors have magnitude + direction</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">scalars have magnitude only.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Force in N</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">weight <tspan font-weight="700">W</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mg.</tspan></text><path class="section-divider" d="M18 153H328" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Resultant combines forces.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Zero resultant → constant velocity,</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">possibly zero.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Resolve perpendicular components with</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">scale drawings.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,346,273" transform="translate(18 325)"><rect width="346" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Work &amp; springs</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">W</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">Fs</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">F</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">ke</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eₑ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">½ke².</tspan> Use extension in m.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Spring equations within proportional limit.</text><path class="section-divider" d="M18 153H328" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Elastic returns to original shape</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">inelastic leaves deformation.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Measure force/extension with ruler and</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">known loads.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,362,251" transform="translate(376 18)"><rect width="362" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="344" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Moments &amp; pressure</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">M</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">Fd,</tspan> perpendicular d.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balance clockwise/anticlockwise moments.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Levers/gears transmit turning.</text><path class="section-divider" d="M18 131H344" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">p</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">F/A</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">p</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">hρg.</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Greater depth → greater p</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pressure difference gives upthrust.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,362,454" transform="translate(376 281)"><rect width="362" height="454" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="344" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Motion &amp; laws</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">v</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">s/t</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">a</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">Δv/t</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">v²−u²</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">2as</tspan> for constant acceleration.</text><path class="section-divider" d="M18 131H344" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Distance–time slope = speed</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">velocity–time slope = a, area = displacement.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">F</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">ma</tspan></text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">third-law forces act on different objects.</text><g transform="translate(18 238)"><g class="concept-illustration"><title>Shows the signed area represented by a positive velocity–time graph.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Velocity (m/s)</text><path d="M18 31V126H322" fill="none" stroke="#667781" stroke-width="1"/><path d="M20 124L182.56000000000003 48H314V124Z" fill="#e1edf8"/><path d="M20 124L182.56000000000003 48H314" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="163.0" y="150" font-size="16" fill="#000000" text-anchor="middle">Time (s)</text><text class="diagram-label" x="163.0" y="175" font-size="16" fill="#000000" text-anchor="middle">Shaded area: displacement</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,251" transform="translate(750 18)"><rect width="352" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Stopping &amp; falling</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Stopping = thinking + braking.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Thinking = vt</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">braking transfers kinetic energy to thermal</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stores.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Weight &gt; drag → accelerates.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Drag grows with speed until forces balance</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">at terminal velocity.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,251" transform="translate(750 281)"><rect width="352" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Momentum</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">p</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mv</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">F</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">Δp/Δt.</tspan> Closed system: total momentum</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conserved.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use signed velocities.</text><path class="section-divider" d="M18 153H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Airbags/mats increase stopping time,</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reducing average force for the same</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">momentum change.</text></g></g></svg>