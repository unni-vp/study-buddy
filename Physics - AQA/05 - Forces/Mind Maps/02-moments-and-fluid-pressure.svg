<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Moments &amp; fluid pressure</title><desc id="map-description">Moment: M = Fd, in Nm d is perpendicular pivot-to-force-line distance. 20 N × 0.30 m = 6 Nm. Longer lever → less force for the same turning effect. Balance, levers &amp; gears: Clockwise moments = anticlockwise moments. 30 N at 0.20 m balances 15 N at 0.40 m. Adjacent gears rotate oppositely. Larger driven gear turns more slowly with greater turning effect in an ideal system. Pressure on an area: Fluid = liquid or gas. Forces are normal to surfaces. p = F/A, Pa = N/m². Smaller area → greater p for same F. 1 cm² = 10⁻⁴ m². Pressure with depth: p = hρg for a liquid column increases with depth and density. 2 m water at g = 9.8 → 19,600 Pa above surface pressure. Δp = Δhρg add atmospheric p if total requested. Upthrust: Greater pressure on bottom than top gives upward resultant. Floating at rest: upthrust = weight. Compare average density including air spaces hollow steel ships can float. Atmosphere: Air molecules collide with surfaces. Higher altitude has less air above, lower density and lower pressure. For submerged objects, compare weight/upthrust and include other forces if present sinking does not mean zero upthrust.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,414,373" transform="translate(18 18)"><rect width="414" height="373" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="396" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Moment</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">M</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">Fd,</tspan> in Nm</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">d is perpendicular pivot-to-force-line distance.</text><path class="section-divider" d="M18 109H396" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">20 N × 0.30 m = 6 Nm.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Longer lever → less force for the same turning effect.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Shows perpendicular lever arms and opposite, equal moments with properly scaled distances.</title><path d="M8 61H370" fill="none" stroke="#2366a0" stroke-width="5"/><path d="M132.29999999999998 64l-14 25h28Z" fill="#dae6f2" stroke="#2366a0"/><text class="diagram-label" x="27" y="16" font-size="16" fill="#000000" text-anchor="middle">30 N</text><path d="M27 26L27 58" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M24.602872306978984 53.61208719054814L27 58L29.397127693021016 53.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="342.9" y="36" font-size="16" fill="#000000" text-anchor="middle">15 N</text><path d="M342.9 42L342.9 58" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M340.502872306979 53.61208719054814L342.9 58L345.29712769302097 53.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M27 94V113" fill="none" stroke="#667781" stroke-width="1"/><path d="M132.29999999999998 94V113" fill="none" stroke="#667781" stroke-width="1"/><path d="M342.9 94V113" fill="none" stroke="#667781" stroke-width="1"/><path d="M27 105H342.9" fill="none" stroke="#667781" stroke-width="1"/><text class="diagram-label" x="79.64999999999999" y="133" font-size="16" fill="#000000" text-anchor="middle">0.20 m</text><text class="diagram-label" x="237.59999999999997" y="133" font-size="16" fill="#000000" text-anchor="middle">0.40 m</text><text class="diagram-label" x="189.0" y="160" font-size="16" fill="#000000" text-anchor="middle">30 × 0.20 = 15 × 0.40 = 6 Nm</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,414,207" transform="translate(18 403)"><rect width="414" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="396" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Balance, levers &amp; gears</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Clockwise moments = anticlockwise moments. 30 N</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">at 0.20 m balances 15 N at 0.40 m.</text><path class="section-divider" d="M18 109H396" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Adjacent gears rotate oppositely.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Larger driven gear turns more slowly with greater</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">turning effect in an ideal system.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,294,229" transform="translate(444 18)"><rect width="294" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="276" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Pressure on an area</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fluid = liquid or gas.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Forces are normal to surfaces.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">p</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">F/A,</tspan> Pa = N/m².</text><path class="section-divider" d="M18 131H276" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Smaller area → greater p for same</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">F.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">1</tspan> <tspan font-weight="700">cm²</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">10⁻⁴</tspan> <tspan font-weight="700">m².</tspan></text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,294,229" transform="translate(444 259)"><rect width="294" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="276" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Pressure with depth</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">p</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">hρg</tspan> for a liquid column</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">increases with depth and density.</text><path class="section-divider" d="M18 109H276" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">2 m water at g = 9.8 → 19,600 Pa</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">above surface pressure. Δp = Δhρg</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">add atmospheric p if total</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">requested.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,229" transform="translate(750 18)"><rect width="352" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Upthrust</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Greater pressure on bottom than top gives</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">upward resultant.</text><path class="section-divider" d="M18 109H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Floating</tspan> <tspan font-weight="700">at</tspan> <tspan font-weight="700">rest:</tspan> <tspan font-weight="700">upthrust</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">weight.</tspan></text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare average density including air</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">spaces</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hollow steel ships can float.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,251" transform="translate(750 259)"><rect width="352" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Atmosphere</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Air molecules collide with surfaces.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Higher altitude has less air above, lower</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">density and lower pressure.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">For submerged objects, compare</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">weight/upthrust and include other forces if</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">present</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sinking does not mean zero upthrust.</text></g></g></svg>