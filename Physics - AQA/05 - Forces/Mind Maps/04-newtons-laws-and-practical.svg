<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Newton’s laws &amp; practical</title><desc id="map-description">First law &amp; inertia: Zero resultant → rest or constant velocity. Inertia is the tendency to retain that motion. Balanced forces do not mean no forces. A steady car has driving force = resistance. Second &amp; third laws: F = ma, using resultant F. Inertial mass = F/a. More mass → less a for same F. Third law: equal opposite forces of same type on different objects. Weight and normal force on one book are not a pair. Terminal velocity: Initially weight &gt; drag → downward acceleration. Speed rises → drag rises → resultant and a fall. Drag = weight → constant terminal velocity. Opening parachute increases drag, slowing fall to a lower terminal speed. Measure acceleration: Low-friction trolley, string, pulley, hanging mass. Light gates or motion sensor measure velocity changes. Calculate a = Δv/Δt before hanger hits floor. Secure pulley stop trolley safely control friction. Vary force: Transfer masses from trolley to hanger: total moving mass constant, driving weight increases. For whole system, driving force ≈ hanger weight if friction negligible. Trolley tension alone is not hanger weight while accelerating. Vary mass: Keep hanging mass fixed add mass to trolley. Force approximately constant, total mass increases. Repeat a vs F should be proportional at fixed mass. a vs 1/m should be proportional at fixed force.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,273" transform="translate(18 18)"><rect width="290" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">First law &amp; inertia</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Zero resultant → rest or constant</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">velocity.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Inertia is the tendency to retain</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">that motion.</text><path class="section-divider" d="M18 153H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balanced forces do not mean no</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">forces.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A steady car has driving force =</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">resistance.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,251" transform="translate(18 303)"><rect width="290" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Second &amp; third laws</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">F</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">ma,</tspan> using resultant F.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Inertial mass = F/a.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More mass → less a for same F.</text><path class="section-divider" d="M18 131H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Third</tspan> <tspan font-weight="700">law:</tspan> equal opposite forces</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">of same type on different objects.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Weight and normal force on one</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">book are not a pair.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,434,398" transform="translate(320 18)"><rect width="434" height="398" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Terminal velocity</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Initially weight &gt; drag → downward acceleration.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Speed rises → drag rises → resultant and a fall.</text><path class="section-divider" d="M18 109H416" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Drag = weight → constant terminal velocity.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Opening parachute increases drag, slowing fall to a</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">lower terminal speed.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Shows equal and opposite drag and weight at terminal velocity.</title><circle cx="199.0" cy="57" r="13" fill="#dfecf8" stroke="#2366a0"/><path d="M199.0 41L199.0 4" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M201.39712769302102 8.387912809451864L199.0 4L196.60287230697898 8.387912809451862" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M199.0 73L199.0 110" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M196.60287230697898 105.61208719054814L199.0 110L201.39712769302102 105.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="219.0" y="20" font-size="16" fill="#000000" text-anchor="start">Drag</text><text class="diagram-label" x="219.0" y="106" font-size="16" fill="#000000" text-anchor="start">Weight</text><text class="diagram-label" x="199.0" y="139" font-size="16" fill="#000000" text-anchor="middle">Drag = weight</text><text class="diagram-label" x="199.0" y="163" font-size="16" fill="#000000" text-anchor="middle">Constant downward velocity</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,434,229" transform="translate(320 428)"><rect width="434" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Measure acceleration</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Low-friction trolley, string, pulley, hanging mass.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Light gates or motion sensor measure velocity changes.</text><path class="section-divider" d="M18 109H416" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Calculate a = Δv/Δt before hanger hits floor.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Secure pulley</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stop trolley safely</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">control friction.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,336,251" transform="translate(766 18)"><rect width="336" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="318" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Vary force</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Transfer</tspan> <tspan font-weight="700">masses</tspan> <tspan font-weight="700">from</tspan> <tspan font-weight="700">trolley</tspan> <tspan font-weight="700">to</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">hanger:</tspan> total moving mass constant,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">driving weight increases.</text><path class="section-divider" d="M18 131H318" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">For whole system, driving force ≈ hanger</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">weight if friction negligible.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Trolley tension alone is not hanger</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">weight while accelerating.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,336,273" transform="translate(766 281)"><rect width="336" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="318" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Vary mass</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep hanging mass fixed</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">add mass to trolley.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Force approximately constant, total mass</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">increases.</text><path class="section-divider" d="M18 153H318" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a vs F should be proportional at fixed</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mass. a vs 1/m should be proportional at</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fixed force.</text></g></g></svg>