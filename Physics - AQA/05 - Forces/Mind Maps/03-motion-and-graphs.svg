<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Motion &amp; graphs</title><desc id="map-description">Distance vs displacement: Distance: total path, scalar. Displacement: straight start-to-finish change with direction, vector. Round trip → zero displacement, nonzero distance. Average speed = total distance / total time. Useful estimates: Walking: about 1.5 m/s. Running: about 3 m/s. Cycling: about 6 m/s. Sound in air: about 330 m/s. Conditions change these estimates. s = vt at constant speed. Convert minutes to seconds and km to m before calculating. Velocity &amp; acceleration: Velocity = speed with direction. Circle: constant speed can still mean changing velocity. a = (v−u)/t, m/s². 5 → 17 m/s in 4 s gives 3 m/s². Uniform acceleration: v²−u² = 2as only for constant acceleration. From rest a = 2 m/s² over 25 m gives v = 10 m/s. Free fall near Earth ≈ 9.8 m/s² when air resistance is negligible. Distance–time: Gradient = speed. Flat = rest straight slope = constant speed. Curved graph: draw tangent at required time gradient estimates instantaneous speed. Use a large gradient triangle. Velocity–time: Gradient = acceleration. Flat = constant velocity. Signed area = displacement sum absolute areas for distance. Triangle + rectangle areas give movement. Count squares for a curved section if needed.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,342,251" transform="translate(18 18)"><rect width="342" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Distance vs displacement</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Distance:</tspan> total path, scalar.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Displacement:</tspan> straight start-to-finish</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">change with direction, vector.</text><path class="section-divider" d="M18 131H324" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Round trip → zero displacement, nonzero</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">distance.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Average speed = total distance / total</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">time.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,342,273" transform="translate(18 281)"><rect width="342" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Useful estimates</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Walking:</tspan> about 1.5 m/s.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Running:</tspan> about 3 m/s.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cycling:</tspan> about 6 m/s.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Sound</tspan> <tspan font-weight="700">in</tspan> <tspan font-weight="700">air:</tspan> about 330 m/s.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Conditions change these estimates.</text><path class="section-divider" d="M18 175H324" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">s</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">vt</tspan> at constant speed.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Convert minutes to seconds and km to m</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">before calculating.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,207" transform="translate(372 18)"><rect width="350" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Velocity &amp; acceleration</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Velocity = speed with direction.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Circle:</tspan> constant speed can still mean</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">changing velocity.</text><path class="section-divider" d="M18 131H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">a</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">(v−u)/t,</tspan> m/s².</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">5 → 17 m/s in 4 s gives 3 m/s².</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,207" transform="translate(372 237)"><rect width="350" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Uniform acceleration</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">v²−u²</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">2as</tspan> only for constant acceleration.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">From rest</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a = 2 m/s² over 25 m gives v = 10 m/s.</text><path class="section-divider" d="M18 131H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Free fall near Earth ≈ 9.8 m/s² when air</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">resistance is negligible.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,368,229" transform="translate(734 18)"><rect width="368" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="350" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Distance–time</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gradient = speed.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Flat = rest</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">straight slope = constant speed.</text><path class="section-divider" d="M18 131H350" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Curved</tspan> <tspan font-weight="700">graph:</tspan> draw tangent at required time</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gradient estimates instantaneous speed.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use a large gradient triangle.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,368,432" transform="translate(734 259)"><rect width="368" height="432" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="350" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Velocity–time</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gradient = acceleration.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Flat = constant velocity.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Signed area = displacement</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sum absolute areas for distance.</text><path class="section-divider" d="M18 153H350" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Triangle + rectangle areas give movement.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Count squares for a curved section if needed.</text><g transform="translate(18 216)"><g class="concept-illustration"><title>Shows the signed area represented by a positive velocity–time graph.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Velocity (m/s)</text><path d="M18 31V126H328" fill="none" stroke="#667781" stroke-width="1"/><path d="M20 124L185.92000000000002 48H320V124Z" fill="#e1edf8"/><path d="M20 124L185.92000000000002 48H320" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="166.0" y="150" font-size="16" fill="#000000" text-anchor="middle">Time (s)</text><text class="diagram-label" x="166.0" y="175" font-size="16" fill="#000000" text-anchor="middle">Shaded area: displacement</text></g></g></g></g></svg>