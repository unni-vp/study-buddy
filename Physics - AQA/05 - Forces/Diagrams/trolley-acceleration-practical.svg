<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Acceleration: a trolley pulled by hanging masses</title><desc id="desc">A trolley carrying masses is pulled by a string over a pulley to a hanging mass. Light gates measure its motion.</desc><rect width="1000" height="570" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Acceleration: a trolley pulled by hanging masses</text><path d="M60 355H780" fill="none" stroke="#182c3b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="125" y="270" width="260" height="65" rx="5" fill="#dbece6" stroke="#182c3b" stroke-width="2"/><circle cx="175" cy="342" r="17" fill="#667887" stroke="#182c3b" stroke-width="2"/><circle cx="330" cy="342" r="17" fill="#667887" stroke="#182c3b" stroke-width="2"/><rect x="160" y="235" width="45" height="35" rx="5" fill="#b7c7cf" stroke="#182c3b" stroke-width="2"/><rect x="215" y="235" width="45" height="35" rx="5" fill="#b7c7cf" stroke="#182c3b" stroke-width="2"/><rect x="270" y="235" width="45" height="35" rx="5" fill="#b7c7cf" stroke="#182c3b" stroke-width="2"/><path d="M385 300H780Q810 300 810 330V440" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="790" cy="328" r="22" fill="#e0e5e7" stroke="#182c3b" stroke-width="2"/><path d="M790 306Q812 307 812 330V440" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="775" y="440" width="70" height="65" rx="5" fill="#acbbc6" stroke="#182c3b" stroke-width="2"/><rect x="190" y="210" width="15" height="60" rx="5" fill="#183b4d" stroke="#182c3b" stroke-width="2"/><path d="M450 350V235H510V350M620 350V235H680V350" fill="none" stroke="#147a70" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="200" font-size="23" fill="#182c3b" font-weight="400" text-anchor="start">Light gates / timer</text><path d="M480 215V235M650 215V235" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="150" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Trolley + masses</text><path d="M223 144L180 240" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="835" y="260" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Pulley</text><path d="M823 254L802 315" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="545" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Hanging masses</text><path d="M790 520V503" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="430" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Transfer masses from trolley to hanger</text><text x="35" y="460" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">to change force at constant total moving mass.</text><text x="35" y="490" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Record acceleration before the hanger reaches the floor.</text></g></svg>