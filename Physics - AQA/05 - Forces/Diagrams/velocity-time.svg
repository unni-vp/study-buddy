<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title"><title id="title">Velocity rises uniformly to 8 m/s in four seconds then stays constant for three seconds.</title><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="35" font-size="23" text-anchor="start" fill="#18344a">Velocity (m/s)</text><path d="M90 70V340H850" stroke="#617480" stroke-width="2" fill="none"/><path d="M90 340L490 100V340Z" fill="#dbeafa"/><path d="M490 100H790V340H490Z" fill="#deefdf"/><path d="M90 340L490 100H790" stroke="#2166ad" stroke-width="4" fill="none"/><text x="68" y="108" font-size="20" text-anchor="end" fill="#18344a">8</text><text x="68" y="348" font-size="20" text-anchor="end" fill="#18344a">0</text><text x="90" y="374" font-size="20" text-anchor="middle" fill="#18344a">0</text><text x="490" y="374" font-size="20" text-anchor="middle" fill="#18344a">4</text><text x="790" y="374" font-size="20" text-anchor="middle" fill="#18344a">7</text><text x="840" y="412" font-size="21" text-anchor="end" fill="#18344a">Time (s)</text><text x="300" y="291" font-size="21" text-anchor="middle" fill="#18344a">½ × 4 × 8 = 16 m</text><text x="640" y="230" font-size="21" text-anchor="middle" fill="#18344a">3 × 8 = 24 m</text><text x="100" y="447" font-size="23" text-anchor="start" fill="#18344a">Slope first 4 s = 2 m/s². Total area = displacement = 40 m.</text></g></svg>