<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 435" role="img" aria-labelledby="title"><title id="title">Velocity increases from 0 to 8 m/s in 4 seconds, then remains constant until 7 seconds.</title><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="35" font-size="23" text-anchor="start" fill="#18344a">Velocity (m/s)</text><path d="M90 70V340H850" stroke="#617480" stroke-width="2" fill="none"/><path d="M90 340L490 100V340Z" fill="#dbeafa"/><path d="M490 100H790V340H490Z" fill="#deefdf"/><path d="M90 340L490 100H790" stroke="#2166ad" stroke-width="4" fill="none"/><text x="68" y="108" font-size="20" text-anchor="end" fill="#18344a">8</text><text x="68" y="348" font-size="20" text-anchor="end" fill="#18344a">0</text><text x="90" y="374" font-size="20" text-anchor="middle" fill="#18344a">0</text><text x="490" y="374" font-size="20" text-anchor="middle" fill="#18344a">4</text><text x="790" y="374" font-size="20" text-anchor="middle" fill="#18344a">7</text><text x="840" y="412" font-size="21" text-anchor="end" fill="#18344a">Time (s)</text></g></svg>