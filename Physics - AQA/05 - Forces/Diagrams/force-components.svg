<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title"><title id="title">A true-scale 3–4–5 vector triangle: right and upward forces combine diagonally.</title><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="35" font-size="26" text-anchor="start" fill="#18344a">Two components, one resultant</text><path d="M100 490H400m-13-8 13 8-13 8" stroke="#18837b" stroke-width="4" fill="none"/><path d="M400 490V90m-8 13 8-13 8 13" stroke="#7750a1" stroke-width="4" fill="none"/><path d="M100 490L400 90m-15 5 15-5-1 16" stroke="#2166ad" stroke-width="4" fill="none"/><text x="250" y="535" font-size="23" text-anchor="middle" fill="#18344a">3 N right</text><text x="430" y="290" font-size="23" text-anchor="start" fill="#18344a">4 N upwards</text><text x="95" y="225" font-size="23" text-anchor="start" fill="#18344a">5 N resultant</text><text x="560" y="415" font-size="23" text-anchor="start" fill="#18344a">Tail → tip gives resultant.</text><text x="560" y="453" font-size="23" text-anchor="start" fill="#18344a">Same scale on both axes.</text></g></svg>