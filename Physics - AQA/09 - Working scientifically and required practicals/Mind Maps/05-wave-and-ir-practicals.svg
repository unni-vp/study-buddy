<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Wave and infrared practicals</title><desc id="map-description">Ripple tank: Lamp and dipper reveal waves in shallow water. Measure multiple wavelengths and calibrated frequency. Six crests contain five wavelengths. Keep depth fixed. Repeat and use v = fλ. String waves: Generator drives a stretched string at known f. Stationary loops span λ/2. Find λ then v = fλ. Keep string type and tension fixed. Electronic timing is suitable for tiny sound delays. Reflection: Trace mirror. Mark narrow incident/reflected rays at two points. Join points and draw normal. i = r from the normal. Compare smooth and rough surfaces. Use fine marks and consistent eye position. Refraction: Trace block and incident/emerging rays. Join entry and exit points inside block. Draw normal and measure angles. Vary incidence and substance. Slower at oblique entry: bends towards normal. IR emission: Leslie cube faces share temperature. Same detector distance and angle. Repeat readings. Matt black generally emits more shiny metal less. Do not confuse temperature with surface-finish effects. IR absorption: Matched samples, same mass and starting temperature. Same lamp, distance, orientation and exposure time. Compare rises and repeat. Control other energy transfers. Avoid burns and keep electrical equipment dry.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,251" transform="translate(18 18)"><rect width="290" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Ripple tank</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lamp and dipper reveal waves in</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">shallow water.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Measure multiple wavelengths and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">calibrated frequency.</text><path class="section-divider" d="M18 153H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Six crests contain five wavelengths.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep depth fixed.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat and use v = fλ.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,251" transform="translate(18 281)"><rect width="290" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">String waves</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Generator drives a stretched string</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">at known f.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Stationary loops span λ/2.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Find λ then v = fλ.</text><path class="section-divider" d="M18 153H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep string type and tension fixed.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electronic timing is suitable for</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">tiny sound delays.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,434,229" transform="translate(320 18)"><rect width="434" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Reflection</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Trace mirror.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mark narrow incident/reflected rays at two points.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Join points and draw normal.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">i</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">r</tspan> from the normal.</text><path class="section-divider" d="M18 153H416" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare smooth and rough surfaces.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use fine marks and consistent eye position.</text></g></g><g class="map-section" id="section-4" data-source-panel="4" data-bounds="0,0,434,229" transform="translate(320 259)"><rect width="434" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">IR emission</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Leslie cube faces share temperature.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same detector distance and angle.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat readings.</text><path class="section-divider" d="M18 131H416" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Matt black generally emits more</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">shiny metal less.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not confuse temperature with surface-finish effects.</text></g></g><g class="map-section" id="section-5" data-source-panel="5" data-bounds="0,0,434,207" transform="translate(320 500)"><rect width="434" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">IR absorption</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Matched samples, same mass and starting temperature.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same lamp, distance, orientation and exposure time.</text><path class="section-divider" d="M18 109H416" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare rises and repeat.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Control other energy transfers.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Avoid burns and keep electrical equipment dry.</text></g></g><g class="map-section" id="section-6" data-source-panel="3" data-bounds="0,0,336,535" transform="translate(766 18)"><rect width="336" height="535" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="318" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Refraction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Trace block and incident/emerging rays.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Join entry and exit points inside block.</text><path class="section-divider" d="M18 109H318" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Draw normal and measure angles.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Vary incidence and substance.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Slower at oblique entry: bends towards</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">normal.</text><g transform="translate(18 216)"><g class="concept-illustration"><title>Shows light changing speed and bending towards the normal as it enters glass obliquely.</title><rect x="0" y="90" width="300" height="138" fill="#e1f0f4"/><path d="M0 90L300 90" fill="none" stroke="#667781" stroke-width="1"/><path d="M144.0 24L144.0 221" fill="none" stroke="#667781" stroke-width="1" stroke-dasharray="5 4"/><path d="M66.0 27L144.0 90" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M139.08025765043155 89.10773590576409L144.0 90L142.09266621033643 85.37808721254851" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M144.0 90L180.0 200" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M176.3569644451661 196.57534060872968L180.0 200L180.91341099996748 195.0841399180674" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="9" y="56" font-size="16" fill="#000000" text-anchor="start">Air</text><text class="diagram-label" x="9" y="139" font-size="16" fill="#000000" text-anchor="start">Glass</text><text class="diagram-label" x="156.0" y="18" font-size="16" fill="#000000" text-anchor="start">Normal</text><text class="diagram-label" x="150.0" y="253" font-size="16" fill="#000000" text-anchor="middle">Slower: bends towards normal</text><text class="diagram-label" x="150.0" y="278" font-size="16" fill="#000000" text-anchor="middle">Frequency stays the same</text></g></g></g></g></svg>