<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Practical skills overview</title><desc id="map-description">Plan a fair test: Testable hypothesis based on science. Independent variable changes. Dependent variable is measured. Control variables prevent another explanation. Use a suitable range and representative samples. Choose and measure: Select apparatus for required range and resolution. Tables: quantity and unit in headings. Record raw readings. Check zero, read scales at eye level. Hazard is potential harm. Risk depends on likelihood and seriousness. Analyse and evaluate: Repeat, mean and range. Check anomalies before excluding them. Best-fit graphs show relationships. Use data and uncertainty in conclusions. Problem, effect, improvement: explain the link. Heating and mechanics: Specific heat: E, m, Δθ. Insulation: compare cooling fairly. Density: mass and appropriate volume. Spring: F versus extension. Acceleration: vary force or mass while controlling the other. Electricity: Ammeter in series. Voltmeter across component. R = V/I. Resistance: wire length and series/parallel combinations. I–V: fixed resistor, filament lamp and diode. Limit current and heating. Waves and radiation: Ripple tank and string: measure f and λ, use v = fλ. Reflection/refraction: ray marks, normal, angles. IR: matched temperature or starting conditions, distance and exposure. Control a specific cause of error.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9"