<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-labelledby="title"><title id="title">Fission splits a large nucleus and emits neutrons. Fusion joins light nuclei.</title><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="35" font-size="25" text-anchor="start" fill="#18344a">Fission: a large nucleus splits</text><text x="530" y="35" font-size="25" text-anchor="start" fill="#18344a">Fusion: light nuclei join</text><circle cx="135" cy="150" r="45" fill="#d9c8ee" stroke="#517386" stroke-width="2"/><circle cx="350" cy="105" r="28" fill="#e1c4b1" stroke="#517386" stroke-width="2"/><circle cx="350" cy="230" r="28" fill="#c7e0c7" stroke="#517386" stroke-width="2"/><circle cx="590" cy="145" r="20" fill="#d3e8fa" stroke="#517386" stroke-width="2"/><circle cx="590" cy="245" r="24" fill="#dbd0ec" stroke="#517386" stroke-width="2"/><circle cx="835" cy="195" r="38" fill="#d6e8cc" stroke="#517386" stroke-width="2"/><circle cx="40" cy="150" r="6" fill="#18344a"/><path d="M50 150H80m-8-6 8 6-8 6" stroke="#2166ad" stroke-width="3" fill="none"/><text x="35" y="115" font-size="18" text-anchor="start" fill="#18344a">neutron</text><path d="M190 150L306 112m-11-3 11 3-7 9M190 155L306 222m-6-11 6 11-12-1" stroke="#2166ad" stroke-width="3" fill="none"/><circle cx="450" cy="125" r="6" fill="#18344a"/><path d="M385 170L438 125" stroke="#2166ad" stroke-width="3" fill="none"/><circle cx="450" cy="175" r="6" fill="#18344a"/><path d="M385 170L438 175" stroke="#2166ad" stroke-width="3" fill="none"/><circle cx="450" cy="225" r="6" fill="#18344a"/><path d="M385 170L438 225" stroke="#2166ad" stroke-width="3" fill="none"/><text x="225" y="298" font-size="20" text-anchor="middle" fill="#18344a">2 smaller nuclei + neutrons</text><text x="225" y="328" font-size="20" text-anchor="middle" fill="#18344a">+ gamma + released energy</text><path d="M615 145L780 183m-8-8 8 8-12 3M621 245L780 207m-12-3 12 3-8 8" stroke="#2166ad" stroke-width="3" fill="none"/><text x="750" y="298" font-size="20" text-anchor="middle" fill="#18344a">1 heavier nucleus + energy</text><text x="30" y="381" font-size="22" text-anchor="start" fill="#18344a">Fission neutrons can trigger more fissions → chain reaction.</text><text x="30" y="415" font-size="18" text-anchor="start" fill="#18344a">Schematic: shapes show splitting/joining, not individual nucleons or scale.</text></g></svg>