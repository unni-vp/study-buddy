<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Radiation uses &amp; nuclear energy</title><desc id="map-description">Exposure routes: Irradiation: source exposes object remove/shield source → exposure ends. Contamination: unwanted radioactive material remains and decays. Alpha is especially harmful internally gamma can irradiate from outside. Dose &amp; precautions: Reduce time, increase distance, use suitable shielding and prevent inhaling/swallowing material. Background: rocks/radon, cosmic rays, living things fallout adds human-made sources. Location/work affect dose. 1 Sv = 1,000 mSv. Useful emissions: Gamma tracer escapes body choose half-life long enough to measure, short enough to limit dose. Target radiation to destroy unwanted tissue while limiting healthy-tissue damage. Beta can monitor thin-sheet thickness gamma sterilises equipment. Judge risks: Same nuclei count: shorter half-life → greater initial activity, faster decline. Long-lived contamination persists. Consider type, dose, position and time with benefit and alternatives. Peer review checks research claims. Fission: Large unstable nucleus usually absorbs a neutron and splits into two smaller nuclei. Releases 2–3 neutrons, gamma and energy products have kinetic energy. Neutrons can trigger more fissions reactor controls the chain. Fusion: Two light nuclei join into a heavier nucleus some mass becomes radiation energy. High temperatures help overcome repulsion powers stars. Not the same as melting. Both fission and fusion change nuclei.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBo