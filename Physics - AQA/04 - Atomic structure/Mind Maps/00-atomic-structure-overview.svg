<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Atomic structure overview</title><desc id="map-description">Particles &amp; isotopes: Tiny positive nucleus: protons + neutrons negative electrons in energy levels. Z = protons  A = protons + neutrons. Isotopes differ in neutrons. Losing electrons forms positive ions. Evidence changes models: Electron → plum pudding. Alpha scattering → tiny dense nucleus, mostly empty space. Bohr: specific levels Chadwick: neutrons. Absorb radiation → electron rises emit → falls. Decay &amp; equations: Random nuclear decay. Activity in Bq = decays/s detector count rate may be lower. Alpha: A−4, Z−2. Beta-minus: A unchanged, Z+1. Gamma: A and Z unchanged. Half-life: Time for activity/undecayed nuclei to halve. After n half-lives, (½)ⁿ remains. Subtract background first. After 3 half-lives, 1/8 remains and 7/8 has decayed. Hazards &amp; uses: Contamination = radioactive material present irradiation = exposure. Alpha especially harmful inside. Gamma tracers targeted treatment. Match half-life and penetration to use balance benefit and dose. Fission &amp; fusion: Fission: large nucleus absorbs neutron → splits, releasing energy, neutrons and gamma. Neutrons can cause a chain reaction. Fusion: light nuclei join some mass becomes radiation energy.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,302,251" transform="translate(18 18)"><rect width="302" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Particles &amp; isotopes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Tiny</tspan> <tspan font-weight="700">positive</tspan> <tspan font-weight="700">nucleus:</tspan> protons +</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">neutrons</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">negative electrons in energy levels.</text><path class="section-divider" d="M18 131H284" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Z</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">protons</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">A</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">protons</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">neutrons.</tspan> Isotopes</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">differ in neutrons.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Losing electrons forms positive ions.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,302,279" transform="translate(18 281)"><rect width="302" height="279" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="64" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Evidence changes</text><text class="panel-title" x="50" y="62" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">models</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electron → plum pudding.</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Alpha scattering → tiny dense</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">nucleus, mostly empty space.</text><path class="section-divider" d="M18 159H284" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Bohr:</tspan> specific levels</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Chadwick:</tspan> neutrons.</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Absorb radiation → electron rises</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">emit → falls.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,406,229" transform="translate(332 18)"><rect width="406" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="388" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Decay &amp; equations</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Random nuclear decay.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Activity in <tspan font-weight="700">Bq</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">decays/s</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">detector count rate may be lower.</text><path class="section-divider" d="M18 131H388" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Alpha:</tspan> A−4, Z−2.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Beta-minus:</tspan> A unchanged, Z+1.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gamma:</tspan> A and Z unchanged.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,406,430" transform="translate(332 259)"><rect width="406" height="430" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="388" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Half-life</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Time for activity/undecayed nuclei to halve.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">After n half-lives, <tspan font-weight="700">(½)ⁿ</tspan> <tspan font-weight="700">remains.</tspan></text><path class="section-divider" d="M18 109H388" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Subtract background first.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">After 3 half-lives, 1/8 remains and 7/8 has decayed.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Shows equal time intervals halving a background-corrected source count rate.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Source count rate (counts/s)</text><path d="M40 31V145H366" fill="none" stroke="#667781" stroke-width="1"/><text class="diagram-label" x="33" y="54.0" font-size="16" fill="#000000" text-anchor="end">400</text><path d="M40 49.0H365" fill="none" stroke="#bdcbd4" stroke-width="0.6"/><text class="diagram-label" x="33" y="102.0" font-size="16" fill="#000000" text-anchor="end">200</text><path d="M40 97.0H365" fill="none" stroke="#bdcbd4" stroke-width="0.6"/><text class="diagram-label" x="33" y="126.0" font-size="16" fill="#000000" text-anchor="end">100</text><path d="M40 121.0H365" fill="none" stroke="#bdcbd4" stroke-width="0.6"/><polyline points="50.0,49.0 53.875,50.649222539655895 57.75,52.270112423214826 61.625,53.863156388750156 65.5,55.42883281246648 69.375,56.96761185235157 73.25,58.4799555893603 77.125,59.96631816617338 81.0,61.427145923572084 84.875,62.862877534470186 88.75,64.2739441356434 92.625,65.66076945719568 96.5,67.02376994980139 100.375,68.36335490976161 104.25,69.67992660191193 108.125,70.97388038041885 112.0,72.2456048075009 115.875,73.49548177011029 119.75,74.72388659460998 123.625,75.93118815948064 127.5,77.11774900609143 131.375,78.28392544756782 135.25,79.43006767578902 139.125,80.55651986654735 143.0,81.66362028290108 146.875,82.75170137675154 150.75,83.82108988867542 154.625,84.87210694604187 158.5,85.90506815944401 162.375,86.92028371747395 166.25,87.91805847986939 170.125,88.89869206906022 174.0,89.86247896014233 177.875,90.8097085693057 181.75,91.74066534074343 185.625,92.65562883206763 189.5,93.55487379825793 193.375,94.43867027416789 197.25,95.30728365561387 2