<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Atoms &amp; nuclear equations</title><desc id="map-description">Count particles: Proton +1, neutron 0, electron −1. Neutral: protons = electrons. Carbon-14: 6p, 8n, 6e. Isotopes share proton number ions differ in electron count. Size &amp; levels: Atom radius ≈ 10⁻¹⁰ m nucleus less than 1/10,000 of that, holding almost all mass. Absorb radiation → higher electron level. Emit → lower. Removing an electron ionises the atom. Alpha scattering: Most pass straight → mostly empty space. Some deflect → positive repulsion. Very few return → mass and charge concentrated in tiny nucleus plum pudding fails. Models develop: Indivisible sphere → electron discovery → plum pudding → nuclear atom. Bohr adds specific electron levels later proton identification Chadwick gives neutron evidence. Alpha &amp; beta-minus: Alpha is ⁴₂He: daughter A−4, Z−2. Beta-minus: neutron → proton + emitted electron daughter A unchanged, Z+1. Electron is from nucleus, not shell. Balance both numbers: ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He. ¹⁴₆C → ¹⁴₇N + ⁰₋₁e. Totals of A and Z match on both sides. Gamma loses energy with no change in A or Z.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,207" transform="translate(18 18)"><rect width="354" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Count particles</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Proton +1, neutron 0, electron −1.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Neutral:</tspan> protons = electrons.</text><path class="section-divider" d="M18 109H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Carbon-14:</tspan> 6p, 8n, 6e.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Isotopes share proton number</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ions differ in electron count.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,229" transform="translate(18 237)"><rect width="354" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Size &amp; levels</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Atom radius ≈ 10⁻¹⁰ m</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">nucleus less than 1/10,000 of that, holding</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">almost all mass.</text><path class="section-divider" d="M18 131H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Absorb radiation → higher electron level.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Emit → lower.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Removing an electron ionises the atom.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,435" transform="translate(384 18)"><rect width="354" height="435" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Alpha scattering</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Most pass straight → mostly empty space.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Some deflect → positive repulsion.</text><path class="section-divider" d="M18 109H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Very few return → mass and charge</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">concentrated in tiny nucleus</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">plum pudding fails.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Shows straight-through and rare turned-back alpha paths around a small positive nucleus.</title><circle cx="203.52" cy="53" r="12" fill="#f3d3b7" stroke="#b95619"/><text class="diagram-label" x="203.52" y="58" font-size="16" fill="#000000" text-anchor="middle">+</text><text class="diagram-label" x="223.52" y="58" font-size="16" fill="#000000" text-anchor="start">Nucleus</text><path d="M2 17L315 17" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M310.61208719054815 19.397127693021016L315 17L310.61208719054815 14.602872306978984" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M2 98L315 98" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M310.61208719054815 100.39712769302102L315 98L310.61208719054815 95.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M2 51H170.52Q197.52 51 170.52 74H139.52" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M170.52 74L139.52 74" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M143.9079128094519 71.60287230697898L139.52 74L143.9079128094519 76.39712769302102" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="159.0" y="128" font-size="16" fill="#000000" text-anchor="middle">Arrows: alpha particles</text><text class="diagram-label" x="159.0" y="152" font-size="16" fill="#000000" text-anchor="middle">Most pass straight through</text><text class="diagram-label" x="159.0" y="176" font-size="16" fill="#000000" text-anchor="middle">Very few turn back</text><text class="diagram-label" x="159.0" y="200" font-size="16" fill="#000000" text-anchor="middle">Nucleus and paths not to scale</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,207" transform="translate(384 465)"><rect width="354" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Models develop</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Indivisible sphere → electron discovery →</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">plum pudding → nuclear atom.</text><path class="section-divider" d="M18 109H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bohr adds specific electron levels</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">later proton identification</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chadwick gives neutron evidence.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,207" transform="translate(750 18)"><rect width="352" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Alpha &amp; beta-minus</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Alpha</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">⁴₂He:</tspan> daughter <tspan font-weight="700">A−4,</tspan> <tspan font-weight="700">Z−2.</tspan></text><path class="section-divider" d="M18 87H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Beta-minus:</tspan> neutron → proton + emitted</text><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electron</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">daughter <tspan font-weight="700">A</tspan> <tspan font-weight="700">unchanged,</tspan> <tspan font-weight="700">Z+1.</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electron is from nucleus, not shell.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,220" transform="translate(750 237)"><rect width="352" height="220" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Balance both numbers</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He.</text><path class="section-divider" d="M18 87H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start">¹⁴₆C → ¹⁴₇N + ⁰₋₁e.</text><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Totals of A and Z match on both sides.</text><path class="section-divider" d="M18 144H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="167" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gamma loses energy with no change in A</text><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">or Z.</text></g></g></svg>