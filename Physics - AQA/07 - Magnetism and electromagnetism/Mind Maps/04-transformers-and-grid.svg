<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Transformers and the Grid</title><desc id="map-description">Changing field link: Primary AC creates a changing field in an easily magnetised iron core. This induces AC pd in the separate secondary coil. Turn ratio: Vₚ/Vₛ = nₚ/nₛ. Keep matching subscripts together. More secondary turns: step-up. Fewer: step-down. 240 V, 300 primary turns, 30 secondary: 24 V. Steady DC does not sustain transformer action. Power and current: Ideal: VₚIₚ = VₛIₛ. 12 V at 4 A gives 48 W. At 240 V input Iₚ = 0.20 A. Higher output voltage gives lower output current at equal power. No extra power is created. Real transformer: Efficiency = output power / input power. 48 W output at 80% efficiency needs 60 W input. 240 V supply then draws 0.25 A. Do not assume ideal power balance if losses are given. Transmission reasoning: Step-up raises voltage. For the same P = VI, current decreases. Cable heating = I²R. Lower current gives lower heating loss. Half the current gives one quarter of loss for fixed R. High voltage needs insulation and safe separation. From station to consumer: Power station, step-up, transmission cables, step-down, consumers. Secondary and primary are linked magnetically, not by charges crossing the core. Explain why voltage is raised and then reduced. Use same transmitted power when comparing losses.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,394,397" transform="translate(18 18)"><rect width="394" height="397" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="376" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Changing field link</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Primary AC creates a changing field in an easily</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">magnetised iron core.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">This induces AC pd in the separate secondary coil.</text><g transform="translate(18 137)"><g class="concept-illustration"><title>Shows separate coils linked by an iron core and distinguishes alternating input from induced output.</title><rect x="65" y="41" width="228" height="94" rx="14" fill="none" stroke="#b5c3cb" stroke-width="16"/><ellipse cx="65" cy="65" rx="24" ry="7" fill="none" stroke="#2366a0" stroke-width="2"/><ellipse cx="65" cy="87" rx="24" ry="7" fill="none" stroke="#2366a0" stroke-width="2"/><ellipse cx="65" cy="109" rx="24" ry="7" fill="none" stroke="#2366a0" stroke-width="2"/><ellipse cx="293" cy="54" rx="24" ry="7" fill="none" stroke="#2366a0" stroke-width="2"/><ellipse cx="293" cy="68" rx="24" ry="7" fill="none" stroke="#2366a0" stroke-width="2"/><ellipse cx="293" cy="82" rx="24" ry="7" fill="none" stroke="#2366a0" stroke-width="2"/><ellipse cx="293" cy="96" rx="24" ry="7" fill="none" stroke="#2366a0" stroke-width="2"/><ellipse cx="293" cy="110" rx="24" ry="7" fill="none" stroke="#2366a0" stroke-width="2"/><ellipse cx="293" cy="124" rx="24" ry="7" fill="none" stroke="#2366a0" stroke-width="2"/><text class="diagram-label" x="65" y="24" font-size="16" fill="#000000" text-anchor="middle">Primary</text><text class="diagram-label" x="293" y="24" font-size="16" fill="#000000" text-anchor="middle">Secondary</text><text class="diagram-label" x="65" y="164" font-size="16" fill="#000000" text-anchor="middle">AC input</text><text class="diagram-label" x="293" y="164" font-size="16" fill="#000000" text-anchor="middle">Induced AC</text><text class="diagram-label" x="179.0" y="193" font-size="16" fill="#000000" text-anchor="middle">Changing field in iron core</text><text class="diagram-label" x="179.0" y="219" font-size="16" fill="#000000" text-anchor="middle">More secondary turns: step-up</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,394,229" transform="translate(18 427)"><rect width="394" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="376" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Turn ratio</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Vₚ/Vₛ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">nₚ/nₛ.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep matching subscripts together.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More secondary turns: step-up.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fewer: step-down.</text><path class="section-divider" d="M18 153H376" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">240 V, 300 primary turns, 30 secondary: <tspan font-weight="700">24</tspan> <tspan font-weight="700">V.</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Steady DC does not sustain transformer action.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,314,251" transform="translate(424 18)"><rect width="314" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Power and current</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ideal: <tspan font-weight="700">VₚIₚ</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">VₛIₛ.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">12 V at 4 A gives 48 W.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">At 240 V input</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Iₚ = <tspan font-weight="700">0.20</tspan> <tspan font-weight="700">A.</tspan></text><path class="section-divider" d="M18 153H296" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Higher output voltage gives lower</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">output current at equal power.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No extra power is created.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,314,251" transform="translate(424 281)"><rect width="314" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Real transformer</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Efficiency</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">output</tspan> <tspan font-weight="700">power</tspan> <tspan font-weight="700">/</tspan> <tspan font-weight="700">input</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">power.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">48 W output at 80% efficiency needs</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">60 W input.</text><path class="section-divider" d="M18 153H296" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">240 V supply then draws <tspan font-weight="700">0.25</tspan> <tspan font-weight="700">A.</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not assume ideal power balance if</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">losses are given.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,273" transform="translate(750 18)"><rect width="352" height="273" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Transmission reasoning</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Step-up raises voltage.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">For the same <tspan font-weight="700">P</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">VI,</tspan> current decreases.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cable</tspan> <tspan font-weight="700">heating</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">I²R.</tspan></text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lower current gives lower heating loss.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Half the current gives one quarter of loss</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">for fixed R.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">High voltage needs insulation and safe</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">separation.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,295" transform="translate(750 303)"><rect width="352" height="295" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">From station to consumer</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Power station, step-up, transmission cables,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">step-down, consumers.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Secondary and primary are linked</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">magnetically, not by charges crossing the</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">core.</text><path class="section-divider" d="M18 175H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Explain why voltage is raised and then</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reduced.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use same transmitted power when</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">comparing losses.</text></g></g></svg>