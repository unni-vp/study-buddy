<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Magnets and fields</title><desc id="map-description">Poles and materials: Like: repel. Unlike: attract. Strongest near poles. Iron, steel, cobalt and nickel are magnetic. Not every metal is. Unmagnetised magnetic material is attracted by induction. Field direction: Outside: north to south. A north-seeking compass end gives direction. Closer field lines mean stronger field. Lines do not cross. Permanent and induced: Permanent: retains magnetism. Induced: becomes magnetic in a field and usually loses it afterwards. Attraction alone does not prove permanent magnetism. Earth’s field affects a compass far from other magnets. Plot the pattern: Trace magnet on paper. Use compass, mark needle ends, move and repeat. Join marks with curves and add direction arrows. Start at several points. Iron filings show pattern, not direction. Keep other magnetic objects away. Straight wire: Current gives circular field lines around wire. Right-hand grip: thumb follows conventional current, fingers field. More current strengthens field. Greater distance weakens it. Reverse current, reverse field. Solenoid and control: Inside: strong, approximately uniform field. Outside: bar-magnet pattern. More turns per length, more current or iron core strengthen field. Electromagnet can switch off. Relay: coil attracts armature to close a separate contact.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,362,251" transform="translate(18 18)"><rect width="362" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="344" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Poles and materials</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Like:</tspan> repel.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Unlike:</tspan> attract.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Strongest near poles.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Iron, steel, cobalt and nickel are magnetic.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Not every metal is.</text><path class="section-divider" d="M18 175H344" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Unmagnetised magnetic material is attracted</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">by induction.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,362,419" transform="translate(18 281)"><rect width="362" height="419" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="344" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Field direction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Outside: <tspan font-weight="700">north</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">south.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A north-seeking compass end gives direction.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Closer field lines mean stronger field.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lines do not cross.</text><g transform="translate(18 159)"><g class="concept-illustration"><title>Shows curved field lines outside a bar magnet pointing from north to south, matching compass direction.</title><path d="M104.32000000000001 88C54.32000000000001 88 64.32000000000001 54 163.0 54C261.68 54 271.68 88 221.68 88" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M151.0 54L175.0 54" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M170.61208719054812 56.39712769302101L175.0 54L170.61208719054812 51.60287230697899" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M104.32000000000001 100C54.32000000000001 100 64.32000000000001 134 163.0 134C261.68 134 271.68 100 221.68 100" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M151.0 134L175.0 134" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M170.61208719054812 136.39712769302102L175.0 134L170.61208719054812 131.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M104.32000000000001 83C54.32000000000001 83 64.32000000000001 22 163.0 22C261.68 22 271.68 83 221.68 83" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M151.0 22L175.0 22" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M170.61208719054812 24.397127693021016L175.0 22L170.61208719054812 19.602872306978984" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M104.32000000000001 105C54.32000000000001 105 64.32000000000001 166 163.0 166C261.68 166 271.68 105 221.68 105" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M151.0 166L175.0 166" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M170.61208719054812 168.39712769302102L175.0 166L170.61208719054812 163.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><rect x="104.32000000000001" y="79" width="117.36" height="30" fill="#e7eff7" stroke="#2366a0"/><text class="diagram-label" x="122.32000000000001" y="100" font-size="16" fill="#000000" text-anchor="middle">N</text><text class="diagram-label" x="203.68" y="100" font-size="16" fill="#000000" text-anchor="middle">S</text><text class="diagram-label" x="163.0" y="195" font-size="16" fill="#000000" text-anchor="middle">Outside magnet: N to S</text><text class="diagram-label" x="163.0" y="219" font-size="16" fill="#000000" text-anchor="middle">Compass follows field direction</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,346,251" transform="translate(392 18)"><rect width="346" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Permanent and induced</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Permanent:</tspan> retains magnetism.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Induced:</tspan> becomes magnetic in a field and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">usually loses it afterwards.</text><path class="section-divider" d="M18 131H328" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Attraction alone does not prove permanent</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">magnetism.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Earth’s field affects a compass far from</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">other magnets.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,346,273" transform="translate(392 281)"><rect width="346" height="273" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Plot the pattern</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Trace magnet on paper.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use compass, mark needle ends, move and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">repeat.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Join marks with curves and add direction</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">arrows.</text><text class="body-text" x="18" y="185" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Start at several points.</text><path class="section-divider" d="M18 197H328" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Iron filings show pattern, not direction.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep other magnetic objects away.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,251" transform="translate(750 18)"><rect width="352" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Straight wire</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Current gives circular field lines around</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">wire.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Right-hand</tspan> <tspan font-weight="700">grip:</tspan> thumb follows</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conventional current, fingers field.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More current strengthens field.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Greater distance weakens it.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Reverse current, reverse field.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,251" transform="translate(750 281)"><rect width="352" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Solenoid and control</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Inside: strong, approximately uniform field.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Outside: bar-magnet pattern.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More turns per length, more current or iron</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">core strengthen field.</text><path class="section-divider" d="M18 153H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electromagnet can switch off.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Relay: coil attracts armature to close a</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">separate contact.</text></g></g></svg>