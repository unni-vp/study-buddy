<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Motor effect and devices</title><desc id="map-description">Force direction: A wire carrying current in a magnetic field feels a force. Left hand: first finger field, second current, thumb force. All three are mutually perpendicular in the maximum-force case. Calculate force: F = BIl: N, T, A and m. Use perpendicular wire length within the field. 0.20 T × 4 A × 0.15 m = 0.12 N. 1 mT = 10⁻³ T. Change the force: Greater B, I or perpendicular length gives greater force. Reverse current or field alone to reverse force. Reverse both: original force direction. Parallel wire: no motor force in this model. Coil rotation: Opposite coil sides carry opposite currents, so their forces oppose. Different positions give a turning effect. Electrical input supplies motion. Greater field or current increases the turning effect. Continuous DC motor: Split ring: reverses coil current every half-turn. Turning effect continues in the same rotational direction. Brushes maintain contact. Do not confuse split ring with alternator slip rings. Loudspeaker: Changing current makes changing motor force on a coil. Coil and attached cone vibrate, making air pressure waves. Frequency follows signal. Larger vibration usually means louder sound. Headphones use the same principle.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,442,417" transform="translate(18 18)"><rect width="442" height="417" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="424" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Force direction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A wire carrying current in a magnetic field feels a force.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Left</tspan> <tspan font-weight="700">hand:</tspan> first finger field, second current, thumb force.</text><path class="section-divider" d="M18 109H424" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">All three are mutually perpendicular in the</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">maximum-force case.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Shows mutually perpendicular field, current and force with explicit into-page current notation.</title><rect x="5" y="45" width="48" height="64" rx="4" fill="#e7eff7" stroke="#2366a0"/><rect x="353" y="45" width="48" height="64" rx="4" fill="#e7eff7" stroke="#2366a0"/><text class="diagram-label" x="29" y="83" font-size="16" fill="#000000" text-anchor="middle">N</text><text class="diagram-label" x="377" y="83" font-size="16" fill="#000000" text-anchor="middle">S</text><path d="M60 48L346 48" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M341.61208719054815 50.39712769302101L346 48L341.61208719054815 45.60287230697899" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="203.0" y="27" font-size="16" fill="#000000" text-anchor="middle">Field: N to S</text><circle cx="203.0" cy="84" r="13" fill="white" stroke="#468133" stroke-width="2"/><path d="M197.0 78L209.0 90" fill="none" stroke="#468133" stroke-width="2"/><path d="M197.0 90L209.0 78" fill="none" stroke="#468133" stroke-width="2"/><path d="M203.0 105L203.0 151" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M200.60287230697898 146.61208719054812L203.0 151L205.39712769302102 146.61208719054812" stroke="#b95619" stroke-width="2" fill="none"/><text class="diagram-label" x="203.0" y="178" font-size="16" fill="#000000" text-anchor="middle">Force downwards</text><text class="diagram-label" x="203.0" y="204" font-size="16" fill="#000000" text-anchor="middle">×: current into the page</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,442,185" transform="translate(18 447)"><rect width="442" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="424" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Calculate force</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">F</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">BIl:</tspan> N, T, A and m.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use perpendicular wire length within the field.</text><path class="section-divider" d="M18 109H424" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.20 T × 4 A × 0.15 m = <tspan font-weight="700">0.12</tspan> <tspan font-weight="700">N.</tspan></text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1 mT = 10⁻³ T.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,290,273" transform="translate(472 18)"><rect width="290" height="273" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Change the force</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Greater B, I or perpendicular</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">length gives greater force.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Reverse current or field alone to</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reverse force.</text><path class="section-divider" d="M18 153H272" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Reverse both: original force</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">direction.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Parallel wire: no motor force in this</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">model.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,290,251" transform="translate(472 303)"><rect width="290" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Coil rotation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Opposite coil sides carry opposite</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">currents, so their forces oppose.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Different positions give a turning</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">effect.</text><path class="section-divider" d="M18 153H272" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electrical input supplies motion.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Greater field or current increases</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the turning effect.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,328,251" transform="translate(774 18)"><rect width="328" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="310" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Continuous DC motor</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Split</tspan> <tspan font-weight="700">ring:</tspan> reverses coil current every</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">half-turn.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Turning effect continues in the same</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">rotational direction.</text><path class="section-divider" d="M18 153H310" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Brushes maintain contact.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not confuse split ring with alternator</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">slip rings.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,328,273" transform="translate(774 281)"><rect width="328" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="310" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Loudspeaker</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Changing current makes changing</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">motor force on a coil.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Coil and attached cone vibrate, making</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">air pressure waves.</text><path class="section-divider" d="M18 153H310" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Frequency follows signal.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Larger vibration usually means louder</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sound.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Headphones use the same principle.</text></g></g></svg>