63,152.14 327.52,152.55 330.40,153.22 333.28,154.16 336.17,155.35 339.05,156.77 341.93,158.42 344.82,160.27 347.70,162.31 350.58,164.50 353.47,166.83 356.35,169.27 359.23,171.80 362.12,174.39 365.00,177.00" fill="none" stroke="#2366a0" stroke-width="2"/><text class="diagram-label" x="16" y="182" font-size="16" fill="#000000" text-anchor="end">0</text><text class="diagram-label" x="370" y="224" font-size="16" fill="#000000" text-anchor="end">Time</text><text class="diagram-label" x="189.0" y="249" font-size="16" fill="#000000" text-anchor="middle">Vertical axes: potential difference</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,414,207" transform="translate(324 479)"><rect width="414" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="396" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Reading generator graphs</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">AC:</tspan> changes sign, above and below zero.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">DC:</tspan> stays one direction but can pulse.</text><path class="section-divider" d="M18 109H396" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Faster rotation raises frequency and usually peak pd.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Greater field or turns can raise amplitude without</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">changing rotation frequency.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,229" transform="translate(750 18)"><rect width="352" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Microphone</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sound vibrates diaphragm and coil in a</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">magnetic field.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Changing linked field induces a changing</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electrical signal.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Uses the <tspan font-weight="700">generator</tspan> <tspan font-weight="700">effect.</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Frequency follows the sound vibrations.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,251" transform="translate