<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Orbits and satellites</title><desc id="map-description">Satellite categories: Planet: orbits a star. Natural satellite: a moon orbiting a planet. Artificial satellite: constructed and placed in orbit. All rely on gravity for orbital motion. Force versus velocity: For a circular orbit, gravity points towards the central body. Velocity points along the tangent. Speed and acceleration: Speed can stay constant while direction changes. Velocity includes direction, so velocity changes. A velocity change is acceleration. Zero acceleration is not a correct circular-orbit explanation. Stable radius: Compare circular orbits around the same central body. Smaller radius has greater orbital speed. Larger radius has lower orbital speed. If speed changes, a stable circular orbital radius must change. Orbital calculations: Distance in one orbit: 2πr. Speed: 2πr/T. Use metres and seconds. 7.0 × 10⁶ m, 6,000 s gives about 7.3 × 10³ m/s. Radius is from the central body’s centre. Read evidence carefully: Height above surface is not the orbital radius. Add planet radius when required. Gravity is an inward resultant, not cancelled by orbital motion. A stable circular orbit comparison does not describe every rocket manoeuvre.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,406,185" transform="translate(18 18)"><rect width="406" height="185" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="388" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Satellite categories</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Planet:</tspan> orbits a star.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Natural</tspan> <tspan font-weight="700">satellite:</tspan> a moon orbiting a planet.</text><path class="section-divider" d="M18 109H388" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Artificial</tspan> <tspan font-weight="700">satellite:</tspan> constructed and placed in orbit.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">All rely on gravity for orbital motion.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,406,408" transform="translate(18 215)"><rect width="406" height="408" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="388" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Force versus velocity</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">For a circular orbit, gravity points towards the</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">central body.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Velocity points along the tangent.</text><g transform="translate(18 137)"><g class="concept-illustration"><title>Distinguishes an inward gravitational force from a tangent velocity in circular orbital motion.</title><circle cx="185.0" cy="92" r="65" fill="none" stroke="#9eb3c3" stroke-width="2"/><circle cx="185.0" cy="92" r="19" fill="#edf2fa" stroke="#2366a0"/><circle cx="250.0" cy="92" r="6" fill="#b95619"/><path d="M240.0 92L210.0 92" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M214.38791280945188 89.60287230697898L210.0 92L214.38791280945188 94.39712769302102" stroke="#b95619" stroke-width="2" fill="none"/><path d="M250.0 82L250.0 26" stroke="#468133" stroke-width="2.3" fill="none"/><path d="M252.39712769302102 30.387912809451862L250.0 26L247.60287230697898 30.387912809451862" stroke="#468133" stroke-width="2" fill="none"/><text class="diagram-label" x="185.0" y="98" font-size="16" fill="#000000" text-anchor="middle">Earth</text><text class="diagram-label" x="185.0" y="181" font-size="16" fill="#000000" text-anchor="middle">Gravity acts towards the centre</text><text class="diagram-label" x="185.0" y="205" font-size="16" fill="#000000" text-anchor="middle">Velocity is tangent to the orbit</text><text class="diagram-label" x="185.0" y="230" font-size="16" fill="#000000" text-anchor="middle">Speed constant, direction changes</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,302,251" transform="translate(436 18)"><rect width="302" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Speed and acceleration</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Speed can stay constant while</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">direction changes.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Velocity includes direction, so</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">velocity changes.</text><path class="section-divider" d="M18 153H284" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A velocity change is <tspan font-weight="700">acceleration.</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Zero acceleration is not a correct</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">circular-orbit explanation.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,302,273" transform="translate(436 281)"><rect width="302" height="273" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Stable radius</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare circular orbits around the</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">same central body.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Smaller radius has greater orbital</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">speed.</text><path class="section-divider" d="M18 153H284" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Larger radius has lower orbital</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">speed.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">If speed changes, a stable circular</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">orbital radius must change.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,229" transform="translate(750 18)"><rect width="352" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Orbital calculations</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Distance</tspan> <tspan font-weight="700">in</tspan> <tspan font-weight="700">one</tspan> <tspan font-weight="700">orbit:</tspan> 2πr.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Speed:</tspan> 2πr/T.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use metres and seconds.</text><path class="section-divider" d="M18 131H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">7.0 × 10⁶ m, 6,000 s gives about <tspan font-weight="700">7.3</tspan> <tspan font-weight="700">×</tspan> <tspan font-weight="700">10³</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">m/s.</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Radius is from the central body’s centre.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,251" transform="translate(750 259)"><rect width="352" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Read evidence carefully</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Height above surface is not the orbital</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">radius.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Add planet radius when required.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gravity is an inward resultant, not cancelled</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">by orbital motion.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A stable circular orbit comparison does not</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">describe every rocket manoeuvre.</text></g></g></svg>