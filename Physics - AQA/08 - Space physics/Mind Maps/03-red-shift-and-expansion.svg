<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Red-shift and expansion</title><desc id="map-description">Observe a shift: Compare corresponding spectral lines with a laboratory pattern. Red-shift: longer observed wavelengths. Distance and recession: Most distant galaxies recede. Further galaxies generally have greater red-shift and recession speed. Red-shift is not simply red colour or greater brightness. Use the comparison or data given. Expanding space: Distance–speed pattern supports expansion of space itself. Balloon dots help picture separations increasing. The analogy does not put Earth at a special centre. Tracing expansion backwards gives a more compact past. Big Bang model: Earlier universe: extremely hot and dense. Model describes expansion from that state. It is not a stellar explosion in already empty space. Observations support and test the explanation. Accelerating expansion: Distant supernova observations indicate expansion speeding up over time. This differs from the trend of recession speed with distance. Dark energy: associated with unknown cause of acceleration. Its name is not a complete explanation. Evidence and uncertainty: Dark matter is inferred from gravitational effects without expected visible radiation. Some important causes remain unknown. Models predict observations. Reliable mismatches can require revision. Separate observation, interpretation and uncertainty.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,434,409" transform="translate(18 18)"><rect width="434" height="409" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Observe a shift</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare corresponding spectral lines with a laboratory</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pattern.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Red-shift:</tspan> longer observed wavelengths.</text><g transform="translate(18 137)"><g class="concept-illustration"><title>Compares the same spectral-line pattern at increasing wavelengths, rather than treating red-shift as an object simply appearing red.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Laboratory pattern</text><text class="diagram-label" x="0" y="114" font-size="16" fill="#000000" text-anchor="start">Distant galaxy pattern</text><rect x="7" y="28" width="384" height="44" fill="#f2f5f8" stroke="#9eb3c3"/><path d="M91.54 28L91.54 72" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M167.16 28L167.16 72" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M242.78 28L242.78 72" fill="none" stroke="#2366a0" stroke-width="3"/><rect x="7" y="128" width="384" height="44" fill="#f2f5f8" stroke="#9eb3c3"/><path d="M151.24 128L151.24 172" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M226.85999999999999 128L226.85999999999999 172" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M302.48 128L302.48 172" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="199.0" y="203" font-size="16" fill="#000000" text-anchor="middle">Matching lines at longer wavelength</text><text class="diagram-label" x="199.0" y="231" font-size="16" fill="#000000" text-anchor="middle">Wavelength increases left to right</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,434,207" transform="translate(18 439)"><rect width="434" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Distance and recession</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Most distant galaxies recede.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Further galaxies generally have greater red-shift and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">recession speed.</text><path class="section-divider" d="M18 131H416" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Red-shift is not simply red colour or greater brightness.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use the comparison or data given.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,290,273" transform="translate(464 18)"><rect width="290" height="273" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Expanding space</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Distance–speed pattern supports</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">expansion of space itself.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balloon dots help picture</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">separations increasing.</text><path class="section-divider" d="M18 153H272" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The analogy does not put Earth at</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a special centre.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Tracing expansion backwards</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gives a more compact past.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,290,273" transform="translate(464 303)"><rect width="290" height="273" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Big Bang model</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Earlier universe: <tspan font-weight="700">extremely</tspan> <tspan font-weight="700">hot</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">and</tspan> <tspan font-weight="700">dense.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Model describes expansion from</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">that state.</text><path class="section-divider" d="M18 153H272" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">It is not a stellar explosion in</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">already empty space.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Observations support and test the</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">explanation.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,336,251" transform="translate(766 18)"><rect width="336" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="318" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Accelerating expansion</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Distant supernova observations indicate</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">expansion speeding up over time.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">This differs from the trend of recession</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">speed with distance.</text><path class="section-divider" d="M18 153H318" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Dark</tspan> <tspan font-weight="700">energy:</tspan> associated with unknown</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cause of acceleration.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Its name is not a complete explanation.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,336,251" transform="translate(766 281)"><rect width="336" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="318" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Evidence and uncertainty</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dark matter is inferred from gravitational</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">effects without expected visible radiation.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Some important causes remain unknown.</text><path class="section-divider" d="M18 131H318" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Models predict observations.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Reliable mismatches can require revision.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Separate observation, interpretation and</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">uncertainty.</text></g></g></svg>