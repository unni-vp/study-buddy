<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Stars and elements</title><desc id="map-description">Starting stages: Nebula: gas and dust, mainly hydrogen. Gravity contracts cloud, increasing temperature and pressure. Protostar: heats until fusion starts. Two mass-dependent routes: Both routes share the main-sequence stage. Initial mass determines the later route. Main-sequence stability: Hydrogen nuclei fuse into helium, releasing energy. Inward gravity balances outward pressure effects maintained by fusion. Stable means forces balance, not that fusion or gravity stop. Sun-like route: Red giant: outer layers expand as core fuel changes. Outer material lost, leaving hot, dense white dwarf. Cooling leads towards expected black dwarf over extremely long time. No supernova in this route. Massive route: Red supergiant develops before collapse and supernova. Remaining core becomes neutron star or black hole. Remnant mass affects outcome. Supernova ejects material into space. Creating elements: Fusion joins nuclei, making heavier elements up to iron in massive stars. Supernova conditions can produce elements heavier than iron. Explosion spreads elements for later stars and planets. Nuclear fusion changes nuclei, unlike chemical reactions.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,366,185" transform="translate(18 18)"><rect width="366" height="185" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Starting stages</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Nebula:</tspan> gas and dust, mainly hydrogen.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gravity contracts cloud, increasing</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">temperature and pressure.</text><path class="section-divider" d="M18 131H348" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Protostar:</tspan> heats until fusion starts.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,366,503" transform="translate(18 215)"><rect width="366" height="503" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Two mass-dependent routes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Both routes share the main-sequence stage.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Initial mass determines the later route.</text><g transform="translate(18 115)"><g class="concept-illustration"><title>Separates the Sun-like and much-more-massive star routes after their common main-sequence stage.</title><text class="diagram-label" x="165.0" y="16" font-size="16" fill="#000000" text-anchor="middle">Nebula</text><path d="M165.0 25L165.0 43" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M162.60287230697898 38.61208719054814L165.0 43L167.39712769302102 38.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="165.0" y="65" font-size="16" fill="#000000" text-anchor="middle">Protostar</text><path d="M165.0 74L165.0 94" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M162.60287230697898 89.61208719054814L165.0 94L167.39712769302102 89.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="165.0" y="116" font-size="16" fill="#000000" text-anchor="middle">Main sequence</text><path d="M155.0 130L82.5 159" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M85.68380388999468 155.14469290586928L82.5 159L87.46434564043113 159.5960472819604" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M175.0 130L247.5 159" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M242.53565435956887 159.5960472819604L247.5 159L244.3161961100053 155.14469290586928" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="82.5" y="182" font-size="16" fill="#000000" text-anchor="middle">Red giant</text><text class="diagram-label" x="247.5" y="182" font-size="16" fill="#000000" text-anchor="middle">Red supergiant</text><path d="M82.5 192L82.5 211" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M80.10287230697898 206.61208719054812L82.5 211L84.89712769302102 206.61208719054812" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M247.5 192L247.5 211" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M245.10287230697898 206.61208719054812L247.5 211L249.89712769302102 206.61208719054812" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="82.5" y="235" font-size="16" fill="#000000" text-anchor="middle">White dwarf</text><text class="diagram-label" x="247.5" y="235" font-size="16" fill="#000000" text-anchor="middle">Supernova</text><path d="M82.5 245L82.5 264" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M80.10287230697898 259.61208719054815L82.5 264L84.89712769302102 259.61208719054815" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M247.5 245L247.5 264" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M245.10287230697898 259.61208719054815L247.5 264L249.89712769302102 259.61208719054815" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="82.5" y="288" font-size="16" fill="#000000" text-anchor="middle">Black dwarf</text><text class="diagram-label" x="247.5" y="288" font-size="16" fill="#000000" text-anchor="middle">Neutron star</text><text class="diagram-label" x="247.5" y="312" font-size="16" fill="#000000" text-anchor="middle">or black hole</text><text class="diagram-label" x="82.5" y="345" font-size="16" fill="#000000" text-anchor="middle">Sun-like route</text><text class="diagram-label" x="247.5" y="345" font-size="16" fill="#000000" text-anchor="middle">Massive route</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,342,229" transform="translate(396 18)"><rect width="342" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Main-sequence stability</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Hydrogen nuclei fuse into helium,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">releasing energy.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Inward gravity balances outward pressure</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">effects maintained by fusion.</text><path class="section-divider" d="M18 153H324" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Stable means forces balance, not that</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fusion or gravity stop.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,342,251" transform="translate(396 259)"><rect width="342" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Sun-like route</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Red</tspan> <tspan font-weight="700">giant:</tspan> outer layers expand as core</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fuel changes.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Outer material lost, leaving hot, dense</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">white</tspan> <tspan font-weight="700">dwarf.</tspan></text><path class="section-divider" d="M18 153H324" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cooling leads towards expected <tspan font-weight="700">black</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">dwarf</tspan> over extremely long time.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No supernova in this route.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,229" transform="translate(750 18)"><rect width="352" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Massive route</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Red</tspan> <tspan font-weight="700">supergiant</tspan> develops before collapse</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and <tspan font-weight="700">supernova.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Remaining core becomes neutron star or</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">black hole.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Remnant mass affects outcome.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Supernova ejects material into space.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,273" transform="translate(750 259)"><rect width="352" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Creating elements</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fusion joins nuclei, making heavier</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">elements up to iron in massive stars.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Supernova conditions can produce</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">elements heavier than iron.</text><path class="section-divider" d="M18 153H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Explosion spreads elements for later stars</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and planets.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Nuclear fusion changes nuclei, unlike</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">chemical reactions.</text></g></g></svg>