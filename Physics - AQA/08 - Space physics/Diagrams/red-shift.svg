<svg xmlns="http://www.w3.org/2000/svg" width="580" height="241" viewBox="0 0 580 241" role="img" font-family="Segoe UI, Arial, sans-serif"><title>Compares the same spectral-line pattern at increasing wavelengths, rather than treating red-shift as an object simply appearing red.</title><rect width="100%" height="100%" fill="white"/><g class="concept-illustration"><title>Compares the same spectral-line pattern at increasing wavelengths, rather than treating red-shift as an object simply appearing red.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Laboratory pattern</text><text class="diagram-label" x="0" y="114" font-size="16" fill="#000000" text-anchor="start">Distant galaxy pattern</text><rect x="7" y="28" width="566" height="44" fill="#f2f5f8" stroke="#9eb3c3"/><path d="M133.4 28L133.4 72" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M243.6 28L243.6 72" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M353.8 28L353.8 72" fill="none" stroke="#2366a0" stroke-width="3"/><rect x="7" y="128" width="566" height="44" fill="#f2f5f8" stroke="#9eb3c3"/><path d="M220.4 128L220.4 172" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M330.6 128L330.6 172" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M440.8 128L440.8 172" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="290.0" y="203" font-size="16" fill="#000000" text-anchor="middle">Matching lines at longer wavelength</text><text class="diagram-label" x="290.0" y="231" font-size="16" fill="#000000" text-anchor="middle">Wavelength increases left to right</text></g></svg>