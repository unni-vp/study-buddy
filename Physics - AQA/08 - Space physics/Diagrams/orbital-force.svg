<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" font-family="Segoe UI, Arial, sans-serif"><title>Distinguishes an inward gravitational force from a tangent velocity in circular orbital motion.</title><rect width="100%" height="100%" fill="white"/><g class="concept-illustration"><title>Distinguishes an inward gravitational force from a tangent velocity in circular orbital motion.</title><circle cx="290.0" cy="92" r="65" fill="none" stroke="#9eb3c3" stroke-width="2"/><circle cx="290.0" cy="92" r="19" fill="#edf2fa" stroke="#2366a0"/><circle cx="355.0" cy="92" r="6" fill="#b95619"/><path d="M345.0 92L315.0 92" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M319.38791280945185 89.60287230697898L315.0 92L319.38791280945185 94.39712769302102" stroke="#b95619" stroke-width="2" fill="none"/><path d="M355.0 82L355.0 26" stroke="#468133" stroke-width="2.3" fill="none"/><path d="M357.397127693021 30.387912809451862L355.0 26L352.602872306979 30.387912809451862" stroke="#468133" stroke-width="2" fill="none"/><text class="diagram-label" x="290.0" y="98" font-size="16" fill="#000000" text-anchor="middle">Earth</text><text class="diagram-label" x="290.0" y="181" font-size="16" fill="#000000" text-anchor="middle">Gravity acts towards the centre</text><text class="diagram-label" x="290.0" y="205" font-size="16" fill="#000000" text-anchor="middle">Velocity is tangent to the orbit</text><text class="diagram-label" x="290.0" y="230" font-size="16" fill="#000000" text-anchor="middle">Speed constant, direction changes</text></g></svg>