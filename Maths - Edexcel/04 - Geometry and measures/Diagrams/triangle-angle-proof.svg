<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title"><title id="title">Alternate angles in a triangle proof</title><rect width="600" height="380" fill="white"/><g font-family="Arial, sans-serif" fill="#161e2d"><path d="M80,90 L520,90" fill="none" stroke="#274d85" stroke-width="2"/><polygon points="300,90 150,285 460,285" fill="none" stroke="#274d85" stroke-width="2"/><text x="300" y="65" text-anchor="middle" font-size="16">A</text><text x="140" y="311" text-anchor="middle" font-size="16">B</text><text x="470" y="311" text-anchor="middle" font-size="16">C</text><text x="195" y="269" text-anchor="middle" font-size="16">β</text><text x="420" y="269" text-anchor="middle" font-size="16">γ</text><text x="252" y="123" text-anchor="middle" font-size="16">β</text><text x="350" y="123" text-anchor="middle" font-size="16">γ</text><text x="303" y="147" text-anchor="middle" font-size="16">α</text><text x="304" y="348" text-anchor="middle" font-size="16">The line through A is parallel to BC.</text></g></svg>