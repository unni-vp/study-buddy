<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc"><title id="title">A temperature decision flowchart</title><desc id="desc">Start, input temperature, test whether temperature is below zero. Yes leads to output Freezing; No leads to output Not freezing. Both branches join and stop.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6Z" fill="#243b64"/></marker></defs><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#182c3b"><path d="M350 105V140" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M350 210V260" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M200 300H150V420" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 300H550V420" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M150 490V560H350" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M550 490V560H350V610" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="290" y="55" width="120" height="50" rx="25.0" fill="#e8eef6" stroke="#243b64" stroke-width="2"/><text x="350.0" y="88.0" text-anchor="middle" font-size="23" font-weight="400">Start</text><path d="M240 140H480L460 210H220Z" fill="#e8eef6" stroke="#243b64" stroke-width="2"/><text x="350.0" y="183.0" text-anchor="middle" font-size="23" font-weight="400">Input temperature</text><path d="M350.0 260L500 300.0L350.0 340L200 300.0Z" fill="#e8eef6" stroke="#243b64" stroke-width="2"/><text x="350.0" y="308.0" text-anchor="middle" font-size="23" font-weight="400">temperature &lt; 0?</text><path d="M50 420H270L250 490H30Z" fill="#e8eef6" stroke="#243b64" stroke-width="2"/><text x="150.0" y="449.0" text-anchor="middle" font-size="23" font-weight="400">Output</text><text x="150.0" y="477.0" text-anchor="middle" font-size="23" font-weight="400">Freezing</text><path d="M450 420H670L650 490H430Z" fill="#e8eef6" stroke="#243b64" stroke-width="2"/><text x="550.0" y="449.0" text-anchor="middle" font-size="23" font-weight="400">Output</text><text x="550.0" y="477.0" text-anchor="middle" font-size="23" font-weight="400">Not freezing</text><rect x="290" y="610" width="120" height="50" rx="25.0" fill="#e8eef6" stroke="#243b64" stroke-width="2"/><text x="350.0" y="643.0" text-anchor="middle" font-size="23" font-weight="400">Stop</text><text x="155" y="280" text-anchor="middle" font-size="22" font-weight="700">Yes</text><text x="545" y="280" text-anchor="middle" font-size="22" font-weight="700">No</text></g></svg>