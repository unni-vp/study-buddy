<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Communication between two devices through the four TCP/IP layers</title><desc id="desc">Two devices each show application, transport, internet and link layers. A web request passes down the sender stack, across a network path that may include routers, and up the receiver stack. HTTPS is application, TCP is transport, IP is internet, and NIC/drivers are link.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6Z" fill="#243b64"/></marker></defs><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#182c3b"><text x="220" y="36" text-anchor="middle" font-size="27" font-weight="700">Sending device</text><text x="780" y="36" text-anchor="middle" font-size="27" font-weight="700">Receiving device</text><text x="220" y="68" text-anchor="middle" font-size="20" font-weight="400">Data moves down the layers</text><text x="780" y="68" text-anchor="middle" font-size="20" font-weight="400">Data moves up the layers</text><rect x="60" y="100" width="320" height="80" rx="10" fill="#eaf1fa" stroke="#243b64" stroke-width="2"/><text x="220" y="130" text-anchor="middle" font-size="24" font-weight="700">Application · HTTPS</text><text x="220" y="161" text-anchor="middle" font-size="19" font-weight="400">Browser prepares a request.</text><rect x="620" y="100" width="320" height="80" rx="10" fill="#eaf1fa" stroke="#243b64" stroke-width="2"/><text x="780" y="130" text-anchor="middle" font-size="24" font-weight="700">Application · HTTPS</text><text x="780" y="161" text-anchor="middle" font-size="19" font-weight="400">Service reads the request.</text><path d="M220 180V225" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 225V180" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="225" width="320" height="80" rx="10" fill="#eaf6f0" stroke="#243b64" stroke-width="2"/><text x="220" y="255" text-anchor="middle" font-size="24" font-weight="700">Transport · TCP</text><text x="220" y="286" text-anchor="middle" font-size="19" font-weight="400">Manages reliable delivery.</text><rect x="620" y="225" width="320" height="80" rx="10" fill="#eaf6f0" stroke="#243b64" stroke-width="2"/><text x="780" y="255" text-anchor="middle" font-size="24" font-weight="700">Transport · TCP</text><text x="780" y="286" text-anchor="middle" font-size="19" font-weight="400">Checks and reassembles data.</text><path d="M220 305V350" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 350V305" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="350" width="320" height="80" rx="10" fill="#fff4dd" stroke="#243b64" stroke-width="2"/><text x="220" y="380" text-anchor="middle" font-size="24" font-weight="700">Internet · IP</text><text x="220" y="411" text-anchor="middle" font-size="19" font-weight="400">Adds IP addresses.</text><rect x="620" y="350" width="320" height="80" rx="10" fill="#fff4dd" stroke="#243b64" stroke-width="2"/><text x="780" y="380" text-anchor="middle" font-size="24" font-weight="700">Internet · IP</text><text x="780" y="411" text-anchor="middle" font-size="19" font-weight="400">Processes IP addresses.</text><path d="M220 430V475" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 475V430" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="475" width="320" height="80" rx="10" fill="#f1eafb" stroke="#243b64" stroke-width="2"/><text x="220" y="505" text-anchor="middle" font-size="24" font-weight="700">Link · NIC and drivers</text><text x="220" y="536" text-anchor="middle" font-size="19" font-weight="400">Sends on the local connection.</text><rect x="620" y="475" width="320" height="80" rx="10" fill="#f1eafb" stroke="#243b64" stroke-width="2"/><text x="780" y="505" text-anchor="middle" font-size="24" font-weight="700">Link · NIC and drivers</text><text x="780" y="536" text-anchor="middle" font-size="19" font-weight="400">Receives on the local connection.</text><path d="M220 555V655H350" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M650 655H780V555" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="615" width="300" height="80" rx="8" fill="#e8eef6" stroke="#243b64" stroke-width="2"/><text x="500.0" y="649.0" text-anchor="middle" font-size="23" font-weight="400">Network path</text><text x="500.0" y="677.0" text-anchor="middle" font-size="23" font-weight="400">may include routers</text></g></svg>