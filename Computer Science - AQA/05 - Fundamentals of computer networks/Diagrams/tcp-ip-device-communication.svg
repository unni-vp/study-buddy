<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">Communication between two devices through the four TCP/IP layers</title><desc id="desc">Two devices each show application, transport, internet and link layers. A web request passes down the sender stack, across a network path that may include routers, and up the receiver stack. HTTPS is application, TCP is transport, IP is internet, and NIC/drivers are link.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6Z" fill="#243b64"/></marker></defs><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#182c3b"><text x="220" y="38" text-anchor="middle" font-size="27" font-weight="700">Sending device</text><text x="780" y="38" text-anchor="middle" font-size="27" font-weight="700">Receiving device</text><rect x="40" y="65" width="360" height="90" rx="10" fill="#eaf1fa" stroke="#243b64" stroke-width="2"/><text x="220" y="97" text-anchor="middle" font-size="24" font-weight="700">Application · HTTPS</text><text x="220" y="130" text-anchor="middle" font-size="19" font-weight="400">Browser prepares a web request.</text><rect x="600" y="65" width="360" height="90" rx="10" fill="#eaf1fa" stroke="#243b64" stroke-width="2"/><text x="780" y="97" text-anchor="middle" font-size="24" font-weight="700">Application · HTTPS</text><text x="780" y="130" text-anchor="middle" font-size="19" font-weight="400">Web service reads the request.</text><path d="M220 155V180" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 180V155" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="180" width="360" height="90" rx="10" fill="#eaf6f0" stroke="#243b64" stroke-width="2"/><text x="220" y="212" text-anchor="middle" font-size="24" font-weight="700">Transport · TCP</text><text x="220" y="245" text-anchor="middle" font-size="19" font-weight="400">Manages reliable delivery.</text><rect x="600" y="180" width="360" height="90" rx="10" fill="#eaf6f0" stroke="#243b64" stroke-width="2"/><text x="780" y="212" text-anchor="middle" font-size="24" font-weight="700">Transport · TCP</text><text x="780" y="245" text-anchor="middle" font-size="19" font-weight="400">Checks and reassembles data.</text><path d="M220 270V295" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 295V270" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="295" width="360" height="90" rx="10" fill="#fff4dd" stroke="#243b64" stroke-width="2"/><text x="220" y="327" text-anchor="middle" font-size="24" font-weight="700">Internet · IP</text><text x="220" y="360" text-anchor="middle" font-size="19" font-weight="400">Addresses data for its destination.</text><rect x="600" y="295" width="360" height="90" rx="10" fill="#fff4dd" stroke="#243b64" stroke-width="2"/><text x="780" y="327" text-anchor="middle" font-size="24" font-weight="700">Internet · IP</text><text x="780" y="360" text-anchor="middle" font-size="19" font-weight="400">Processes the IP addressing.</text><path d="M220 385V410" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 410V385" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="410" width="360" height="90" rx="10" fill="#f1eafb" stroke="#243b64" stroke-width="2"/><text x="220" y="442" text-anchor="middle" font-size="24" font-weight="700">Link · NIC and drivers</text><text x="220" y="475" text-anchor="middle" font-size="19" font-weight="400">Sends using local network hardware.</text><rect x="600" y="410" width="360" height="90" rx="10" fill="#f1eafb" stroke="#243b64" stroke-width="2"/><text x="780" y="442" text-anchor="middle" font-size="24" font-weight="700">Link · NIC and drivers</text><text x="780" y="475" text-anchor="middle" font-size="19" font-weight="400">Receives using network hardware.</text><path d="M220 500V610H345" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M655 610H780V500" fill="none" stroke="#243b64" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="345" y="565" width="310" height="90" rx="8" fill="#e8eef6" stroke="#243b64" stroke-width="2"/><text x="500.0" y="604.0" text-anchor="middle" font-size="23" font-weight="400">Network path</text><text x="500.0" y="632.0" text-anchor="middle" font-size="23" font-weight="400">may include routers</text><text x="500" y="110" text-anchor="middle" font-size="22" font-weight="700">Data passes down</text><text x="500" y="140" text-anchor="middle" font-size="20" font-weight="400">the sender’s layers.</text><text x="500" y="270" text-anchor="middle" font-size="22" font-weight="700">Data passes up</text><text x="500" y="300" text-anchor="middle" font-size="20" font-weight="400">the receiver’s layers.</text><text x="500" y="450" text-anchor="middle" font-size="20" font-weight="400">Arrows follow one</text><text x="500" y="480" text-anchor="middle" font-size="20" font-weight="400">web request.</text></g></svg>