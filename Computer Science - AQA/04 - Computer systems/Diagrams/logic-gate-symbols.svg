<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 225" role="img" aria-labelledby="title desc"><title id="title">Logic gate symbols: AND, OR, XOR and NOT</title><desc id="desc">The standard AND, OR, XOR and NOT gate symbols. NOT has one input and an inversion circle; the other gates have two inputs. XOR has an extra curved line before the OR shape.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6Z" fill="#243b64"/></marker></defs><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#182c3b"><path d="M45 65H95C162 65 162 135 95 135H45Z" fill="#e8eef6" stroke="#243b64" stroke-width="2.5"/><text x="95" y="35" text-anchor="middle" font-size="23" font-weight="700">AND</text><path d="M20 85H45" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M20 115H45" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M145 100H180" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M280 65Q312 100 280 135Q345 140 380 100Q345 60 280 65Z" fill="#e8eef6" stroke="#243b64" stroke-width="2.5"/><text x="330" y="35" text-anchor="middle" font-size="23" font-weight="700">OR</text><path d="M255 85H293" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M255 115H293" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M380 100H415" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M515 65Q547 100 515 135Q580 140 615 100Q580 60 515 65Z" fill="#e8eef6" stroke="#243b64" stroke-width="2.5"/><path d="M503 65Q535 100 503 135" fill="none" stroke="#243b64" stroke-width="2.5"/><text x="565" y="35" text-anchor="middle" font-size="23" font-weight="700">XOR</text><path d="M490 85H528" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M490 115H528" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M615 100H650" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M750 65L830 100L750 135Z" fill="#e8eef6" stroke="#243b64" stroke-width="2.5"/><circle cx="837" cy="100" r="7" fill="#fffefa" stroke="#243b64" stroke-width="2.5"/><text x="800" y="35" text-anchor="middle" font-size="23" font-weight="700">NOT</text><path d="M725 100H750" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M844 100H885" fill="none" stroke="#243b64" stroke-width="2.5"/><text x="470" y="193" text-anchor="middle" font-size="22" font-weight="400">Inputs enter from the left. Each gate produces one output on the right.</text></g></svg>