<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" role="img" aria-labelledby="title desc"><title id="title">A combined circuit for (A AND B) OR (NOT C)</title><desc id="desc">A and B enter an AND gate to produce X. C enters a NOT gate to produce Y. X and Y enter an OR gate to produce Q. Therefore Q is (A AND B) OR (NOT C).</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6Z" fill="#243b64"/></marker></defs><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#182c3b"><path d="M240 35H290C357 35 357 105 290 105H240Z" fill="#e8eef6" stroke="#243b64" stroke-width="2.5"/><path d="M240 180L320 215L240 250Z" fill="#e8eef6" stroke="#243b64" stroke-width="2.5"/><circle cx="327" cy="215" r="7" fill="#fffefa" stroke="#243b64" stroke-width="2.5"/><path d="M560 100Q592 135 560 170Q625 175 660 135Q625 95 560 100Z" fill="#e8eef6" stroke="#243b64" stroke-width="2.5"/><text x="65" y="62" text-anchor="middle" font-size="24" font-weight="700">A</text><path d="M90 55H240" fill="none" stroke="#243b64" stroke-width="2.5"/><text x="65" y="92" text-anchor="middle" font-size="24" font-weight="700">B</text><path d="M90 85H240" fill="none" stroke="#243b64" stroke-width="2.5"/><text x="65" y="222" text-anchor="middle" font-size="24" font-weight="700">C</text><path d="M90 215H240" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M340 70H470V120H573" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M334 215H470V150H573" fill="none" stroke="#243b64" stroke-width="2.5"/><path d="M660 135H750" fill="none" stroke="#243b64" stroke-width="2.5"/><text x="780" y="143" text-anchor="middle" font-size="24" font-weight="700">Q</text><text x="400" y="50" text-anchor="middle" font-size="23" font-weight="700">X</text><text x="400" y="245" text-anchor="middle" font-size="23" font-weight="700">Y</text><text x="200" y="298" text-anchor="middle" font-size="23" font-weight="700">X = A AND B</text><text x="425" y="298" text-anchor="middle" font-size="23" font-weight="700">Y = NOT C</text><text x="650" y="298" text-anchor="middle" font-size="23" font-weight="700">Q = X OR Y</text></g></svg>