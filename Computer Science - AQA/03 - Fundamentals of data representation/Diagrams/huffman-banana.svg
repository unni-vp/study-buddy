<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Huffman coding worked example: BANANA</title><desc id="desc">Root frequency 6. Left branch 0 reaches A, frequency 3. Right branch 1 reaches the combined B and N node, frequency 3. Its left branch 0 reaches B, frequency 1; its right branch 1 reaches N, frequency 2. Codes: A 0, B 10, N 11.</desc><rect width="800" height="450" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#182c3b"><text x="400" y="38" text-anchor="middle" font-size="28" font-weight="700">Huffman tree for BANANA</text><path d="M400 103L185 207" fill="none" stroke="#243b64" stroke-width="3"/><circle cx="292.5" cy="155.0" r="18" fill="#fffefa"/><text x="292.5" y="163.0" text-anchor="middle" font-size="24" font-weight="700">0</text><path d="M400 103L570 210" fill="none" stroke="#243b64" stroke-width="3"/><circle cx="485.0" cy="156.5" r="18" fill="#fffefa"/><text x="485.0" y="164.5" text-anchor="middle" font-size="24" font-weight="700">1</text><path d="M570 238L455 338" fill="none" stroke="#243b64" stroke-width="3"/><circle cx="512.5" cy="288.0" r="18" fill="#fffefa"/><text x="512.5" y="296.0" text-anchor="middle" font-size="24" font-weight="700">0</text><path d="M570 238L690 338" fill="none" stroke="#243b64" stroke-width="3"/><circle cx="630.0" cy="288.0" r="18" fill="#fffefa"/><text x="630.0" y="296.0" text-anchor="middle" font-size="24" font-weight="700">1</text><circle cx="400" cy="90" r="28" fill="#e4ebf4" stroke="#243b64" stroke-width="2"/><text x="400" y="98" text-anchor="middle" font-size="25" font-weight="700">6</text><circle cx="570" cy="224" r="28" fill="#e4ebf4" stroke="#243b64" stroke-width="2"/><text x="570" y="232" text-anchor="middle" font-size="25" font-weight="700">3</text><rect x="120" y="207" width="130" height="92" rx="10" fill="#e4f0e8" stroke="#477557" stroke-width="2"/><text x="185" y="245" text-anchor="middle" font-size="24" font-weight="700">A: 3</text><text x="185" y="281" text-anchor="middle" font-size="22" font-weight="400">code 0</text><rect x="390" y="338" width="130" height="92" rx="10" fill="#e4f0e8" stroke="#477557" stroke-width="2"/><text x="455" y="376" text-anchor="middle" font-size="24" font-weight="700">B: 1</text><text x="455" y="412" text-anchor="middle" font-size="22" font-weight="400">code 10</text><rect x="625" y="338" width="130" height="92" rx="10" fill="#e4f0e8" stroke="#477557" stroke-width="2"/><text x="690" y="376" text-anchor="middle" font-size="24" font-weight="700">N: 2</text><text x="690" y="412" text-anchor="middle" font-size="22" font-weight="400">code 11</text><text x="155" y="365" text-anchor="middle" font-size="22" font-weight="400">0 = left branch</text><text x="155" y="400" text-anchor="middle" font-size="22" font-weight="400">1 = right branch</text></g></svg>