<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">People of the UK: population and urban change</title><desc id="map-description">Explain uneven development: Location, industry and infrastructure: influence investment and jobs. Government policy can alter opportunities. Compare income, health, education, employment and access. One average can hide inequality. Read population change: Natural change: births minus deaths. Net migration: arrivals minus departures. Pyramid: age and sex structure. DTM: birth and death rates, not a fixed national timetable. Ageing and migration: Ageing: lower birth rates and longer lives increase demand for pensions and care, but older people also contribute. Migration can bring skills and culture. Services and housing must keep pace with local growth. Salford Quays: change: 1982 dock closure → regeneration → Lowry 2000 and MediaCity 2011. Public infrastructure and anchor firms attract activity. Higher values do not guarantee benefits for every resident. Leeds: character and challenges: 2021 population: about 812,000. Universities and migration shape work, culture and housing demand. Housing, transport and waste need joined-up responses. Carnival is a named cultural example. Evaluate sustainable responses: Connecting Leeds: alternatives to car journeys. PIPES: useful heat from waste recovery. Assess who benefits, affordability and access. More investment can coexist with inequality.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path