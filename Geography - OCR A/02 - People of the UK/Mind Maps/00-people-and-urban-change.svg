ass="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">influence investment and jobs.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Government policy can alter opportunities.</text><path class="section-divider" d="M18 131H328" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare income, health, education,</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">employment and access. One average can</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hide inequality.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,346,207" transform="translate(18 259)"><rect width="346" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Read population change</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Natural</tspan> <tspan font-weight="700">change:</tspan> births minus deaths. <tspan font-weight="700">Net</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">migration:</tspan> arrivals minus departures.</text><path class="section-divider" d="M18 109H328" stroke="#b95619" stroke-opacity=".2