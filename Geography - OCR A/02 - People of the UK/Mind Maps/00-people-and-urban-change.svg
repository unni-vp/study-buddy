font-weight="400" text-anchor="start">guarantee benefits for every resident.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,372,229" transform="translate(730 18)"><rect width="372" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="354" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Leeds: character and challenges</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2021</tspan> <tspan font-weight="700">population:</tspan> about 812,000. Universities</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and migration shape work, culture and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">housing demand.</text><path class="section-divider" d="M18 131H354" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Housing, transport and waste need joined-up</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">responses. Carnival is a named cultural</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">example.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,372,207" transform="translate(730 259)"><rect width="372" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8