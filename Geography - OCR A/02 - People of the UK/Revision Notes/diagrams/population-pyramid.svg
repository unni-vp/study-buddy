<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Reading a population pyramid</title><desc id="desc">An illustrative pyramid uses horizontal bars by age, males left and females right. The example is not a real UK population dataset.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="650" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Reading a population pyramid</text><text x="315" y="92" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">Male</text><text x="840" y="92" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">Female</text><rect x="368" y="120" width="152" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="120" width="209" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="142" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">70+</text><rect x="292" y="156" width="228" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="156" width="266" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="178" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">60–69</text><rect x="254" y="192" width="266" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="192" width="304" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="214" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">50–59</text><rect x="235" y="228" width="285" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="228" width="304" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="250" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">40–49</text><rect x="273" y="264" width="247" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="264" width="266" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="286" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">30–39</text><rect x="311" y="300" width="209" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="300" width="228" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="322" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">20–29</text><rect x="330" y="336" width="190" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="336" width="190" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="358" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">10–19</text><rect x="349" y="372" width="171" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="372" width="152" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="394" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">0–9</text><text x="598" y="90" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">Age</text><text x="320" y="445" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Younger ages at the bottom</text><text x="840" y="445" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Older ages at the top</text><text x="600" y="492" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Bar length: share within each sex (illustrative values, not UK data)</text><text x="35" y="545" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Read age, sex and bar length together. A bulge is a large cohort; a broad upper section suggests a larger</text><text x="35" y="574" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">older population. The shape alone does not prove its causes.</text></svg>