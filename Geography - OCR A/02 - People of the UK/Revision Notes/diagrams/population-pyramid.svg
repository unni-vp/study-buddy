<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Reading a population pyramid</title><desc id="desc">An illustrative pyramid uses percentage bars by age, males left and females right. Each side totals 100 percent within its sex. The example is not a real UK population dataset.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="700" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Reading a population pyramid</text><text x="315" y="92" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">Male</text><text x="840" y="92" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">Female</text><rect x="354.7826086956522" y="120" width="165.2173913043478" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="120" width="206.93069306930695" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="142" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">70+</text><rect x="272.17391304347825" y="156" width="247.82608695652172" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="156" width="263.3663366336634" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="178" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">60–69</text><rect x="230.86956521739125" y="192" width="289.13043478260875" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="192" width="300.990099009901" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="214" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">50–59</text><rect x="210.2173913043478" y="228" width="309.7826086956522" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="228" width="300.990099009901" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="250" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">40–49</text><rect x="251.5217391304348" y="264" width="268.4782608695652" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="264" width="263.3663366336634" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="286" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">30–39</text><rect x="292.82608695652175" y="300" width="227.17391304347828" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="300" width="225.74257425742573" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="322" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">20–29</text><rect x="313.47826086956525" y="336" width="206.52173913043478" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="336" width="188.11881188118812" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="358" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">10–19</text><rect x="334.1304347826087" y="372" width="185.8695652173913" height="28" rx="0" fill="#7eafe0" stroke="white" stroke-width="2"/><rect x="675" y="372" width="150.4950495049505" height="28" rx="0" fill="#d1a0d9" stroke="white" stroke-width="2"/><text x="598" y="394" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">0–9</text><text x="598" y="90" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">Age</text><path d="M140,423L520,423" stroke="#687d8c" fill="none" stroke-width="2"/><path d="M675,423L1055,423" stroke="#687d8c" fill="none" stroke-width="2"/><path d="M520,423L520,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="520" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">0%</text><path d="M675,423L675,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="675" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">0%</text><path d="M425,423L425,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="425" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">5%</text><path d="M770,423L770,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="770" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">5%</text><path d="M330,423L330,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="330" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">10%</text><path d="M865,423L865,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="865" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">10%</text><path d="M235,423L235,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="235" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">15%</text><path d="M960,423L960,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="960" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">15%</text><path d="M140,423L140,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="140" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">20%</text><path d="M1055,423L1055,430" stroke="#687d8c" fill="none" stroke-width="2"/><text x="1055" y="452" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3d">20%</text><text x="320" y="497" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Younger ages at the bottom</text><text x="840" y="497" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Older ages at the top</text><text x="600" y="542" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Bar length: share within each sex (illustrative values, not UK data)</text><text x="35" y="595" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Read age, sex and bar length together. A bulge is a large cohort; a broad upper section suggests a larger</text><text x="35" y="624" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">older population. The shape alone does not prove its causes.</text></svg>