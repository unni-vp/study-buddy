<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Demographic Transition Model</title><desc id="desc">Five stages show death rates falling before birth rates. The birth-death gap indicates natural population change. Migration is not included. Curves are a schematic model, not a dataset.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="530" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Demographic Transition Model</text><rect x="80" y="85" width="210" height="310" rx="0" fill="#f8f5eb" stroke="#d7d2c5" stroke-width="2"/><text x="185" y="120" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3d">Stage 1</text><rect x="290" y="85" width="210" height="310" rx="0" fill="#f8f5eb" stroke="#d7d2c5" stroke-width="2"/><text x="395" y="120" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3d">Stage 2</text><rect x="500" y="85" width="210" height="310" rx="0" fill="#f8f5eb" stroke="#d7d2c5" stroke-width="2"/><text x="605" y="120" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3d">Stage 3</text><rect x="710" y="85" width="210" height="310" rx="0" fill="#f8f5eb" stroke="#d7d2c5" stroke-width="2"/><text x="815" y="120" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3d">Stage 4</text><rect x="920" y="85" width="210" height="310" rx="0" fill="#f8f5eb" stroke="#d7d2c5" stroke-width="2"/><text x="1025" y="120" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3d">Stage 5</text><path d="M80,395L1135,395" stroke="#687d8c" fill="none" stroke-width="2"/><path d="M80,395L80,150" stroke="#687d8c" fill="none" stroke-width="2"/><path d="M80 180C160 170 220 190 290 180S430 180 500 190S650 285 710 310S850 330 920 330S1050 345 1130 353" fill="none" stroke="#b65c1a" stroke-width="5"/><path d="M80 185C160 195 220 175 290 190S400 300 500 322S650 333 710 332S860 333 920 332S1060 325 1130 325" fill="none" stroke="#147db3" stroke-width="5"/><text x="85" y="65" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Birth / death rates: schematic, not measured country data</text><text x="80" y="435" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Earlier development</text><text x="1130" y="435" font-size="20" font-weight="400" text-anchor="end" fill="#172b3d">Later development</text><path d="M360,475L415,475" stroke="#b65c1a" fill="none" stroke-width="2"/><text x="425" y="482" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Birth rate</text><path d="M620,475L675,475" stroke="#147db3" fill="none" stroke-width="2"/><text x="685" y="482" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Death rate</text><text x="300" y="155" font-size="19" font-weight="400" text-anchor="start" fill="#147db3">Deaths fall first</text><text x="530" y="265" font-size="19" font-weight="400" text-anchor="start" fill="#b65c1a">Births fall later</text></svg>