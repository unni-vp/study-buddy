<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">UK environmental challenges and energy</title><desc id="map-description">Climate creates hazards: Air masses, Atlantic influence and continentality: explain contrasting UK weather. Relief lifts moist air. A succession of storms can saturate a catchment. Somerset: causes and effects: 2013–14: prolonged rain, saturated land, slow lowland drainage and high tides combined. Flooding damaged homes, isolated Muchelney and disrupted farms, roads and businesses. Manage at several scales: Immediate: rescue, supplies, warnings and pumping. Longer term: dredging, raised roads and storage. The Flood Action Plan combines organisations. Maintenance and exceptional rainfall limit every scheme. Compare the resources: Finite: coal, oil, gas and uranium. Renewable: wind, solar, water and sustainably replenished biomass. Low carbon is different from renewable. Reliability, costs and impacts must also be compared. Hinkley Point C: Under construction: intended large, dependable low-carbon electricity output. Jobs and energy security come with high cost, delay, disruption and long-term waste responsibilities. Dryholme and future choices: About 1 MW: organic feedstock produces biogas, heat, electricity and useful digestate. Prevent leakage and pollution. Use demand reduction and a diverse supply mix at local and national scales.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-wi