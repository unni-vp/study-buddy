<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">UK electricity generation mix: 2024</title><desc id="desc">A zero-based bar chart shows renewables 50.4%, fossil fuels 31.8%, nuclear 14.2% and other fuels 3.6%, the remainder to 100 using published rounded shares. Source DUKES 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="510" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">UK electricity generation mix: 2024</text><text x="35" y="80" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Share of UK electricity generated, 2024 (%) — DUKES 2025 publication</text><path d="M250,115L250,395" stroke="#dce3e9" fill="none" stroke-width="2"/><text x="250" y="430" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">0</text><path d="M380,115L380,395" stroke="#dce3e9" fill="none" stroke-width="2"/><text x="380" y="430" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">10</text><path d="M510,115L510,395" stroke="#dce3e9" fill="none" stroke-width="2"/><text x="510" y="430" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">20</text><path d="M640,115L640,395" stroke="#dce3e9" fill="none" stroke-width="2"/><text x="640" y="430" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">30</text><path d="M770,115L770,395" stroke="#dce3e9" fill="none" stroke-width="2"/><text x="770" y="430" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">40</text><path d="M900,115L900,395" stroke="#dce3e9" fill="none" stroke-width="2"/><text x="900" y="430" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">50</text><path d="M1030,115L1030,395" stroke="#dce3e9" fill="none" stroke-width="2"/><text x="1030" y="430" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">60</text><text x="220" y="156" font-size="23" font-weight="700" text-anchor="end" fill="#172b3d">Renewables</text><rect x="250" y="125" width="655.1999999999999" height="44" rx="0" fill="#367c40" stroke="#367c40" stroke-width="2"/><text x="915.1999999999999" y="156" font-size="22" font-weight="700" text-anchor="start" fill="#172b3d">50.4%</text><text x="220" y="224" font-size="23" font-weight="700" text-anchor="end" fill="#172b3d">Fossil fuels</text><rect x="250" y="193" width="413.40000000000003" height="44" rx="0" fill="#b65c1a" stroke="#b65c1a" stroke-width="2"/><text x="673.4000000000001" y="224" font-size="22" font-weight="700" text-anchor="start" fill="#172b3d">31.8%</text><text x="220" y="292" font-size="23" font-weight="700" text-anchor="end" fill="#172b3d">Nuclear</text><rect x="250" y="261" width="184.6" height="44" rx="0" fill="#8155a4" stroke="#8155a4" stroke-width="2"/><text x="444.6" y="292" font-size="22" font-weight="700" text-anchor="start" fill="#172b3d">14.2%</text><text x="220" y="360" font-size="23" font-weight="700" text-anchor="end" fill="#172b3d">Other fuels</text><rect x="250" y="329" width="46.800000000000004" height="44" rx="0" fill="#73818a" stroke="#73818a" stroke-width="2"/><text x="306.8" y="360" font-size="22" font-weight="700" text-anchor="start" fill="#172b3d">3.6%</text><text x="250" y="470" font-size="22" font-weight="700" text-anchor="start" fill="#172b3d">Electricity generation is not the same as total energy consumption.</text></svg>