<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Anaerobic digestion: energy and nutrient recovery</title><desc id="desc">Feedstock enters an oxygen-free digester. Microbes produce methane-rich gas, used to generate heat and electricity. Digestate is returned to fields; it is not the material burned in the engine.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="510" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Anaerobic digestion: energy and nutrient recovery</text><rect x="25" y="100" width="265" height="170" rx="10" fill="#eff5e8" stroke="#81939f" stroke-width="2"/><text x="42" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#172b3d">Crops and slurry</text><text x="42" y="217" font-size="19" font-weight="400" text-anchor="start" fill="#172b3d">Organic feedstock</text><rect x="320" y="100" width="265" height="170" rx="10" fill="#eff5e8" stroke="#81939f" stroke-width="2"/><text x="337" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#172b3d">Sealed digester</text><text x="337" y="217" font-size="19" font-weight="400" text-anchor="start" fill="#172b3d">No oxygen: microbes</text><text x="337" y="246" font-size="19" font-weight="400" text-anchor="start" fill="#172b3d">act</text><rect x="615" y="100" width="265" height="170" rx="10" fill="#eff5e8" stroke="#81939f" stroke-width="2"/><text x="632" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#172b3d">Methane-rich</text><text x="632" y="171" font-size="23" font-weight="400" text-anchor="start" fill="#172b3d">biogas</text><text x="632" y="217" font-size="19" font-weight="400" text-anchor="start" fill="#172b3d">Fuel for an engine</text><rect x="910" y="100" width="265" height="170" rx="10" fill="#eff5e8" stroke="#81939f" stroke-width="2"/><text x="927" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#172b3d">Heat and</text><text x="927" y="171" font-size="23" font-weight="400" text-anchor="start" fill="#172b3d">electricity</text><text x="927" y="217" font-size="19" font-weight="400" text-anchor="start" fill="#172b3d">Local use / grid</text><text x="927" y="246" font-size="19" font-weight="400" text-anchor="start" fill="#172b3d">export</text><path d="M292,185L315,185" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M587,185L610,185" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M882,185L905,185" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="345" width="530" height="100" rx="10" fill="#f7f0df" stroke="#81939f" stroke-width="2"/><text x="585" y="385" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3d">Digestate: nutrients returned to fields</text><text x="585" y="420" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">Manage storage and spreading to avoid pollution</text><path d="M450,275L450,335" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/></svg>