<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Coral reefs and Andros</title><desc id="map-description">Conditions and distribution: Warm-water reefs: generally clear, sunlit tropical seas. Light supports photosynthetic partners. Major examples include Andros, Florida, Mesoamerica, Red Sea, New Caledonia and Great Barrier reefs. The living partnership: Coral animals: shelter algae and supply nutrients. Algae: photosynthesise and pass food to coral. Nutrients circulate through organisms, waste and decomposition. Corals also capture food. Andros: linked habitats: The Bahamas: the barrier reef, seagrass and mangroves provide feeding and nursery habitats. Fish populations, coastal protection, fishing and tourism connect ecology to livelihoods. Threats reinforce one another: Heat stress: bleaching may recover, but prolonged stress can kill coral. Pollution, sediment, anchors, fishing pressure and habitat loss weaken the ecosystem. Named protected areas: North and South Marine Parks: reef-related protection. West Side: mangrove creeks and tidal flats. Crab Replenishment Reserve: land-crab habitat and stocks. These protect different parts of Andros. Evaluate the management: Rules and monitoring: need enforcement, cooperation and protection beyond boundaries. Local action improves resilience. It cannot stop global warming on its own.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,358,229" transform="translate(18 18)"><rect width="358" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="340" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Conditions and distribution</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Warm-water</tspan> <tspan font-weight="700">reefs:</tspan> generally clear, sunlit</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">tropical seas. Light supports photosynthetic</