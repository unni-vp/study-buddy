<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Tropical rainforest nutrient cycle</title><desc id="desc">Nutrients move from biomass to litter through death, to soil through decomposition and back to vegetation through root uptake. The living biomass is the largest store.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="540" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Tropical rainforest nutrient cycle</text><rect x="65" y="110" width="320" height="110" rx="10" fill="#e8f3df" stroke="#81939f" stroke-width="2"/><text x="225" y="155" font-size="25" font-weight="700" text-anchor="middle" fill="#172b3d">BIOMASS</text><text x="225" y="190" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Largest nutrient store</text><rect x="815" y="110" width="320" height="110" rx="10" fill="#f6ebd5" stroke="#81939f" stroke-width="2"/><text x="975" y="155" font-size="25" font-weight="700" text-anchor="middle" fill="#172b3d">LITTER</text><text x="975" y="190" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">Dead leaves and organisms</text><rect x="440" y="340" width="320" height="110" rx="10" fill="#f3e3cf" stroke="#81939f" stroke-width="2"/><text x="600" y="383" font-size="25" font-weight="700" text-anchor="middle" fill="#172b3d">SOIL</text><text x="600" y="420" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">Small store: rapid uptake</text><path d="M400,165L800,165" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="140" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Leaf fall and death</text><path d="M950,230L770,368" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="1000" y="300" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Rapid decay</text><path d="M425,365L245,230" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="195" y="310" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Root uptake</text><text x="600" y="495" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Warmth and moisture speed decomposition. Heavy rain can leach exposed soil.</text></svg>