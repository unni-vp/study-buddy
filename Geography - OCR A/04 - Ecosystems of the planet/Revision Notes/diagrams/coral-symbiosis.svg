<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Coral and algae: a two-way partnership</title><desc id="desc">Coral polyps house photosynthetic algae and supply nutrients. Algae provide food. Heat stress can break the partnership and cause bleaching, which is not always immediate death.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="520" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Coral and algae: a two-way partnership</text><rect x="35" y="100" width="475" height="220" rx="10" fill="#f7efdf" stroke="#81939f" stroke-width="2"/><text x="272" y="145" font-size="25" font-weight="700" text-anchor="middle" fill="#172b3d">CORAL ANIMAL</text><text x="65" y="192" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Provides a protected home and</text><text x="65" y="221" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">nutrients from its wastes.</text><rect x="690" y="100" width="475" height="220" rx="10" fill="#e9f4dc" stroke="#81939f" stroke-width="2"/><text x="927" y="145" font-size="25" font-weight="700" text-anchor="middle" fill="#172b3d">ALGAE IN CORAL TISSUE</text><text x="720" y="192" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Use sunlight to photosynthesise</text><text x="720" y="221" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">and pass food to the coral.</text><path d="M520,190L680,190" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="170" font-size="19" font-weight="400" text-anchor="middle" fill="#172b3d">Shelter</text><path d="M680,275L520,275" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="252" font-size="19" font-weight="400" text-anchor="middle" fill="#172b3d">Food</text><rect x="120" y="375" width="960" height="105" rx="10" fill="#eaf5fb" stroke="#81939f" stroke-width="2"/><text x="600" y="415" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">Heat stress can cause algae to be expelled: coral becomes pale.</text><text x="600" y="453" font-size="22" font-weight="400" text-anchor="middle" fill="#172b3d">Bleached coral may recover, but prolonged stress can kill it.</text></svg>