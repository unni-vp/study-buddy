<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Pacific Ocean: neutral conditions and El Niño</title><desc id="desc">Two schematic equatorial Pacific panels compare strong westward trade winds and a western warm pool with weaker winds and warm water extending east. Rainfall shifts east and drought risk can rise in parts of Australia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="630" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Pacific Ocean: neutral conditions and El Niño</text><rect x="25" y="80" width="1150" height="215" rx="10" fill="#eef7fc" stroke="#81939f" stroke-width="2"/><text x="45" y="115" font-size="24" font-weight="700" text-anchor="start" fill="#172b3d">Neutral conditions</text><text x="65" y="160" font-size="21" font-weight="700" text-anchor="start" fill="#172b3d">Australia / Indonesia (west)</text><text x="815" y="160" font-size="21" font-weight="700" text-anchor="start" fill="#172b3d">South America (east)</text><rect x="70" y="185" width="1050" height="35" rx="0" fill="#70c7e9" stroke="#70c7e9" stroke-width="2"/><rect x="70" y="185" width="480" height="35" rx="0" fill="#f0a46a" stroke="#f0a46a" stroke-width="2"/><path d="M1040,170L210,170" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="145" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">Easterly trade winds</text><text x="75" y="260" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Warm pool / wetter west</text><text x="780" y="260" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Cooler water / upwelling</text><rect x="25" y="315" width="1150" height="215" rx="10" fill="#eef7fc" stroke="#81939f" stroke-width="2"/><text x="45" y="350" font-size="24" font-weight="700" text-anchor="start" fill="#172b3d">El Niño tendency</text><text x="65" y="395" font-size="21" font-weight="700" text-anchor="start" fill="#172b3d">Australia / Indonesia (west)</text><text x="815" y="395" font-size="21" font-weight="700" text-anchor="start" fill="#172b3d">South America (east)</text><rect x="70" y="420" width="1050" height="35" rx="0" fill="#70c7e9" stroke="#70c7e9" stroke-width="2"/><rect x="70" y="420" width="900" height="35" rx="0" fill="#f0a46a" stroke="#f0a46a" stroke-width="2"/><path d="M1040,405L650,405" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="380" font-size="20" font-weight="400" text-anchor="middle" fill="#172b3d">Trade winds weaken</text><text x="75" y="495" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Less rain in parts of Australia</text><text x="780" y="495" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Warming spreads east</text><text x="600" y="595" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3d">Patterns change probabilities. Not every drought is caused by El Niño.</text></svg>