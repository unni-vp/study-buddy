<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Global atmospheric circulation: a cross-section</title><desc id="desc">Six schematic circulation cells show rising air and low pressure at the Equator and 60 degrees, sinking air and high pressure at 30 degrees and the poles. Surface winds also turn because of Earth’s rotation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="550" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Global atmospheric circulation: a cross-section</text><path d="M65,370L1140,370" stroke="#687d8c" fill="none" stroke-width="2"/><text x="80" y="410" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">90°S</text><path d="M80,150L80,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="450" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">HIGH</text><text x="245" y="410" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">60°S</text><path d="M245,350L245,150" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="450" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">LOW</text><text x="410" y="410" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">30°S</text><path d="M410,150L410,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="410" y="450" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">HIGH</text><text x="600" y="410" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">0°</text><path d="M600,350L600,150" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="450" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">LOW</text><text x="790" y="410" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">30°N</text><path d="M790,150L790,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="450" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">HIGH</text><text x="955" y="410" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">60°N</text><path d="M955,350L955,150" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="955" y="450" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">LOW</text><text x="1120" y="410" font-size="23" font-weight="700" text-anchor="middle" fill="#172b3d">90°N</text><path d="M1120,150L1120,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="1120" y="450" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">HIGH</text><path d="M233,145L92,145" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M92,350L233,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M257,145L398,145" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M398,350L257,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M588,145L422,145" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M422,350L588,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M612,145L778,145" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M778,350L612,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M943,145L802,145" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M802,350L943,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M967,145L1108,145" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M1108,350L967,350" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="160" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">Polar</text><text x="330" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">Ferrel</text><text x="500" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">Hadley</text><text x="700" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">Hadley</text><text x="870" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">Ferrel</text><text x="1040" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#172b3d">Polar</text><text x="600" y="505" font-size="21" font-weight="400" text-anchor="middle" fill="#172b3d">Rising air: cooling, clouds and rain. Sinking air: warming and generally drier skies.</text></svg>