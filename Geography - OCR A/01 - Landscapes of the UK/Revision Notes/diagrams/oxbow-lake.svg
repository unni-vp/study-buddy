<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Meander cut-off and an oxbow lake</title><desc id="desc">Three plan views show a meander with a narrowing neck, a flood cut-through, then a straighter channel and cut-off lake closed by sediment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="540" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Meander cut-off and an oxbow lake</text><rect x="25" y="75" width="370" height="335" rx="10" fill="#eef4df" stroke="#81939f" stroke-width="2"/><text x="45" y="110" font-size="23" font-weight="700" text-anchor="start" fill="#172b3d">1. Neck narrows</text><path d="M90 145C90 210 310 120 310 240S90 275 90 355" stroke="#54acd0" stroke-width="32" fill="none"/><text x="160" y="245" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Neck</text><path d="M158,240L125,240" stroke="#687d8c" fill="none" stroke-width="2"/><path d="M90,310L90,345" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><rect x="415" y="75" width="370" height="335" rx="10" fill="#eef4df" stroke="#81939f" stroke-width="2"/><text x="435" y="110" font-size="23" font-weight="700" text-anchor="start" fill="#172b3d">2. Flood cuts through</text><path d="M480 145C480 210 700 120 700 240S480 275 480 355" stroke="#54acd0" stroke-width="32" fill="none"/><path d="M480 145V355" stroke="#54acd0" stroke-width="32"/><path d="M480,310L480,345" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><rect x="805" y="75" width="370" height="335" rx="10" fill="#eef4df" stroke="#81939f" stroke-width="2"/><text x="825" y="110" font-size="23" font-weight="700" text-anchor="start" fill="#172b3d">3. Old bend is isolated</text><path d="M870 145V355" stroke="#54acd0" stroke-width="32"/><path d="M955 175C1145 175 1145 305 955 305" stroke="#54acd0" stroke-width="32" stroke-linecap="round" fill="none"/><rect x="905" y="160" width="30" height="30" rx="0" fill="#ddbf78" stroke="#ddbf78" stroke-width="2"/><rect x="905" y="290" width="30" height="30" rx="0" fill="#ddbf78" stroke="#ddbf78" stroke-width="2"/><text x="955" y="250" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Oxbow lake</text><path d="M870,310L870,345" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="455" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Outer-bank erosion and inner-bank deposition enlarge bends. High flow can cut a shorter route.</text><text x="35" y="484" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Deposition closes the entrances to the old bend.</text></svg>