<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Longshore drift: movement along a beach</title><desc id="desc">A plan view shows swash travelling diagonally up the beach and gravity returning backwash at right angles to the shoreline. Repeated zigzags move sediment along the coast.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="510" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Longshore drift: movement along a beach</text><rect x="25" y="75" width="1150" height="330" rx="10" fill="#bfe7f4" stroke="#81939f" stroke-width="2"/><path d="M26 76H1174V240H26Z" fill="#f4d797"/><path d="M25,240L1175,240" stroke="#687d8c" fill="none" stroke-width="2"/><text x="50" y="115" font-size="23" font-weight="700" text-anchor="start" fill="#172b3d">LAND / BEACH</text><text x="50" y="370" font-size="23" font-weight="700" text-anchor="start" fill="#172b3d">SEA</text><text x="1030" y="230" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Shoreline</text><path d="M180,300L330,180" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M330,180L330,300" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M330,300L480,180" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M480,180L480,300" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M480,300L630,180" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M630,180L630,300" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M630,300L780,180" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M780,180L780,300" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="90" y="445" font-size="22" font-weight="700" text-anchor="start" fill="#172b3d">Swash: obliquely up the beach</text><text x="620" y="445" font-size="22" font-weight="700" text-anchor="start" fill="#172b3d">Backwash: straight downhill</text><path d="M650,130L1030,130" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="715" y="112" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">Net sediment movement</text><path d="M65,340L150,275" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="397" font-size="18" font-weight="400" text-anchor="start" fill="#172b3d">Waves approach</text></svg>