<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Waterfall retreat and gorge formation</title><desc id="desc">A side view shows water crossing resistant rock, undercutting softer rock, an overhang and collapsed blocks in a plunge pool. The waterfall retreats upstream.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="510" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Waterfall retreat and gorge formation</text><rect x="25" y="70" width="710" height="370" rx="10" fill="#eef8ff" stroke="#81939f" stroke-width="2"/><path d="M45 180H350V230Q310 300 400 340C430 395 490 395 530 340H710V420H45Z" fill="#d5ac75" stroke="#92724c" stroke-width="2"/><path d="M45 160H410V215H350V180H45Z" fill="#959da4" stroke="#57636e" stroke-width="2"/><path d="M400 337C430 390 490 390 530 337Z" fill="#2998cb"/><path d="M45 150H395Q422 150 422 180V297Q422 337 470 337H710" stroke="#2998cb" stroke-width="12" fill="none"/><path d="M410 360l18 19 21-13-9-18zM455 372l15-17 18 25z" fill="#727d85"/><text x="60" y="130" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">River flow</text><path d="M190,144L285,144" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="475" y="120" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Resistant rock</text><path d="M480,128L375,190" stroke="#687d8c" fill="none" stroke-width="2"/><text x="65" y="300" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Less resistant rock</text><text x="475" y="206" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Overhang</text><path d="M465,211L405,211" stroke="#687d8c" fill="none" stroke-width="2"/><text x="515" y="305" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Plunge pool</text><path d="M530,312L455,337" stroke="#687d8c" fill="none" stroke-width="2"/><text x="64" y="390" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Retreat upstream</text><path d="M285,375L170,375" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="765" y="105" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">1. Softer rock erodes faster.</text><text x="765" y="175" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">2. Undercutting leaves an</text><text x="765" y="204" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">unsupported overhang.</text><text x="765" y="275" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">3. Collapse adds rock to the</text><text x="765" y="304" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">plunge pool.</text><text x="765" y="375" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">4. Repetition leaves a gorge as</text><text x="765" y="404" font-size="21" font-weight="400" text-anchor="start" fill="#172b3d">the waterfall retreats.</text></svg>