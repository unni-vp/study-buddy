<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Development: Ethiopia and Rosario</title><desc id="map-description">Measure more than wealth: Development: economic, social and environmental improvement. GNI: income average. HDI: health, education and income. Internet use: digital access. Each hides some inequalities. Explain Ethiopia’s connections: Landlocked location: trade depends on transport and neighbouring countries. Drought affects farming and export income. Investment can create jobs and infrastructure. Conflict, unequal access and dependence limit gains. Technology and Rostow: Phones and payments: need affordable access, power, skills and markets. Rostow: five proposed stages. Ethiopia has mixed features; sectors and regions do not follow one timetable. Aid: the goat-sharing project: Kanbi: seven goats to initial households; milk, sales and passing offspring spread benefits. Water, pasture and animal health matter. Local aid complements wider development and emergency support. Rosario: character and needs: Paraná port: links an agricultural region to world trade. Migration shapes communities and urban culture. Housing, transport and waste pressures vary between neighbourhoods. Two sustainable approaches: Hábitat: infrastructure, housing, tenure and social support. Gardens: food, skills, income and green space. Evaluate who benefits, secure land and long-term funding. Neither strategy solves every citywide problem.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-star