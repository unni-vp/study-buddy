<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif"><title id="title">Rostow’s five-stage model</title><desc id="desc">Steps represent traditional society, preconditions, take-off, maturity and high mass consumption. Arrows show the sequence proposed by the model, not an inevitable path or measured country trend.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#147db3" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="540" fill="white"/><text x="30" y="40" font-size="28" font-weight="700" text-anchor="start" fill="#172b3d">Rostow’s five-stage model</text><rect x="25" y="330" width="215" height="100" rx="10" fill="#eef2f8" stroke="#81939f" stroke-width="2"/><text x="40" y="362" font-size="24" font-weight="700" text-anchor="start" fill="#172b3d">1</text><text x="40" y="393" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Traditional society</text><rect x="257" y="278" width="215" height="100" rx="10" fill="#eef2f8" stroke="#81939f" stroke-width="2"/><text x="272" y="310" font-size="24" font-weight="700" text-anchor="start" fill="#172b3d">2</text><text x="272" y="341" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Preconditions</text><rect x="489" y="226" width="215" height="100" rx="10" fill="#eef2f8" stroke="#81939f" stroke-width="2"/><text x="504" y="258" font-size="24" font-weight="700" text-anchor="start" fill="#172b3d">3</text><text x="504" y="289" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Take-off</text><rect x="721" y="174" width="215" height="100" rx="10" fill="#eef2f8" stroke="#81939f" stroke-width="2"/><text x="736" y="206" font-size="24" font-weight="700" text-anchor="start" fill="#172b3d">4</text><text x="736" y="237" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">Drive to maturity</text><rect x="953" y="122" width="215" height="100" rx="10" fill="#eef2f8" stroke="#81939f" stroke-width="2"/><text x="968" y="154" font-size="24" font-weight="700" text-anchor="start" fill="#172b3d">5</text><text x="968" y="185" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">High mass</text><text x="968" y="214" font-size="20" font-weight="400" text-anchor="start" fill="#172b3d">consumption</text><path d="M210,315L260,265" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M442,263L492,213" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M674,211L724,161" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><path d="M906,159L956,109" fill="none" stroke="#147db3" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="500" font-size="22" font-weight="700" text-anchor="start" fill="#172b3d">A model of development, not a measured graph or a guaranteed path for every country.</text></svg>