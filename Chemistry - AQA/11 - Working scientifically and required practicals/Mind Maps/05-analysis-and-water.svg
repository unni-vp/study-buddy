<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Chromatography, ion tests and water</title><desc id="map-description">Chromatography sequence: Pencil baseline, small dry spots. Solvent below starting samples. Remove then promptly mark front. Same solvent/paper for references. Rf and limits: Spot-centre/front distance from baseline. Same units, no unit on Rf. One spot may hide overlapping compounds. Different solvent can resolve overlap. Cations: Clean loop: Li crimson, Na yellow, K lilac. Ca orange-red, Cu green flame. NaOH: Al/Ca/Mg white Al dissolves in excess. Cu blue, Fe²⁺ green, Fe³⁺ brown precipitates. Anions: Carbonate +acid: CO₂, limewater milky. Nitric acid/AgNO₃: Cl white, Br cream, I yellow. HCl/BaCl₂: sulfate white. Fresh portions prevent cross-contamination. Water measurements: pH indicator or calibrated probe. Known volume, weighed basin, evaporate/cool. Residue mass =final basin−empty mass. Distil water and compare samples. Safety and conclusions: Open receiver never distil dry. Cooling jacket water separate from vapour. No tasting normal pH alone not proof of potable water. Small masses/contamination limit accuracy.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,330,185" transform="translate(18 18)"><rect width="330" height="185" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Chromatography sequence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Pencil baseline, small dry spots.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Solvent below starting samples.</text><path class="section-divider" d="M18 109H312" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Remove then promptly mark front.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same solvent/paper for references.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,330,229" transform="translate(18 215)"><rect width="330" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Rf and limits</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Spot-centre/front distance from</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">baseline.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same units, no unit on Rf.</text><path class="section-divider" d="M18 131H312" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One spot may hide overlapping</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">compounds.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Different solvent can resolve overlap.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,207" transform="translate(360 18)"><rect width="354" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#4