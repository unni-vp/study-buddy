<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Electrolysis and temperature investigations</title><desc id="map-description">Aqueous cell: Separate inert electrodes in solution. Low-voltage DC supply. Cathode negative, anode positive. Ions in liquid, electrons in wires. Predict products: Less-reactive-than-H metal deposited at cathode otherwise H₂. Halide may form halogen at anode otherwise O₂. Use supplied concentration/context. CuSO₄/inert: cathode Cu, anode O₂. Identify and control: H₂ burning splint pop O₂ glowing splint relights. Cl₂ damp litmus bleaches white. Compare voltage, concentration, time and immersion. Small quantities, ventilation, no inhalation/short circuit. Temperature setup: Insulated supported cup with suitable lid. Measured reagents at controlled starting temperature. Mix and record regular temperatures. Change one chosen variable, repeat. Interpret changes: ΔT =final−initial. Rise usually exothermic, fall endothermic. Equal ΔT is not equal energy for different masses. Use supplied Q=mcΔT where appropriate. Improve specifically: Insulation reduces heat exchange. Consistent stirring and response timing. Consider limiting reagent and incomplete reaction. Eye protection and safe gas-producing setup.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,185" transform="translate(18 18)"><rect width="354" height="185" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Aqueous cell</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Separate inert electrodes in solution.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Low-voltage DC supply.</text><path class="section-divider" d="M18 109H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-ancho