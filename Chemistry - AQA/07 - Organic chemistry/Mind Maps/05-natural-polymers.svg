<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Amino acids and natural polymers</title><desc id="map-description">Amino-acid groups: –NH₂ and –COOH in same molecule. Glycine: H₂NCH₂COOH. Two different joining groups. Recognise them in given structures. Condensation joining: Amino and carboxyl groups link. Water eliminated per joining step. Repeated joining forms polypeptide. Different amino acids can share a chain. Proteins: Monomers: amino acids. Sequence influences folding and function. Different sequences yield different proteins. Not made from nucleotide monomers. Starch and cellulose: Both use glucose monomers. Different arrangements give different structures. Starch stores energy cellulose supports plant walls. Do not infer identical properties from shared monomer. DNA: Four types of nucleotide monomer. Most DNA has two polymer chains. Chains form double helix. Encodes genetic instructions. Key comparisons: Addition: same atoms, no by-product. Condensation: joining groups, small by-product. Polyester has ester links. Polypeptide joins amino-acid groups.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" vi