<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Addition and condensation polymers</title><desc id="map-description">Monomers and chains: Monomer: small joining molecule. Polymer: long repeating chain. Keep side groups and atom counts. Functional groups determine joining. Addition unit: Ethene double bond opens. Other addition units: Poly(propene): –CH₂–CH(CH₃)–. Single backbone bonds, outward links, brackets, n. Restore C=C to find monomer. No small molecule eliminated. Condensation: Monomers have two reactive functional groups. Groups join and eliminate a small molecule. Usually water by-product. Some monomer atoms leave the polymer. Polyesters: Diol: two –OH groups. Diacid: two –COOH groups. Ester links repeatedly connect them. Two joining sites allow extended chains. Avoid drawing errors: Do not keep C=C in addition backbone. Do not remove methyl or halogen side groups. Chain bonds pass through both brackets. One alcohol +one acid forms a small ester.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,386,185" transform="translate(18 18)"><rect width="386" height="185" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="368" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Monomers and chains</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Monomer: small joining molecule.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Polymer: long repeating chain.</text><path class="section-divider" d="M18 109H368" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep side groups and atom counts.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Functional groups determine joining.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,386,455" transform="translate(18 215)"><rect width="386" height="455" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="368" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Addition unit</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ethene double bond opens.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Changes ethene C=C into a single-bond repeating unit with two external chain bonds, brackets and n, preserving all atoms.</title><text class="diagram-label" x="149.0" y="50" font-size="16" fill="#000000" text-anchor="middle">C</text><path d="M160.0 45L190.0 45" fill="none" stroke="#566b77"/><path d="M160.0 50L190.0 50" fill="none" stroke="#566b77"/><path d="M149.0 34L149.0 24" fill="none" stroke="#566b77"/><text class="diagram-label" x="149.0" y="18" font-size="16" fill="#000000" text-anchor="middle">H</text><path d="M138.0 45L124.0 45" fill="none" stroke="#566b77"/><text class="diagram-label" x="115.0" y="50" font-size="16" fill="#000000" text-anchor="middle">H</text><text class="diagram-label" x="201.0" y="50" font-size="16" fill="#000000" text-anchor="middle">C</text><path d="M201.0 34L201.0 24" fill="none" stroke="#566b77"/><text class="diagram-label" x="201.0" y="18" font-size="16" fill="#000000" text-anchor="middle">H</text><path d="M212.0 45L226.0 45" fill="none" stroke="#566b77"/><text class="diagram-label" x="235.0" y="50" font-size="16" fill="#000000" text-anchor="middle">H</text><text class="diagram-label" x="175.0" y="102" font-size="16" fill="#000000" text-anchor="middle">Ethene monomer</text><path d="M175.0 115L175.0 151" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M172.60287230697898 146.61208719054812L175.0 151L177.39712769302102 146.61208719054812" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="149.0" y="212" font-size="16" fill="#000000" text-anchor="middle">C</text><text class="diagram-label" x="201.0" y="212" font-size="16" fill="#000000" text-anchor="middle">C</text><path d="M74.0 207H137.0M161.0 207H189.0M213.0 207H276.0" fill="none" stroke="#566b77"/><path d="M149.0 196V186" stroke="#566b77"/><text class="diagram-label" x="149.0" y="180" font-size="16" fill="#000000" text-anchor="middle">H</text><path d="M149.0 218V228" stroke="#566b77"/><text class="diagram-label" x="149.0" y="244" font-size="16" fill="#000000" text-anchor="middle">H</text><path d="M201.0 196V186" stroke="#566b77"/><text class="diagram-label" x="201.0" y="180" font-size="16" fill="#000000" text-anchor="middle">H</text><path d="M201.0 218V228" stroke="#566b77"/><text class="diagram-label" x="201.0" y="244" font-size="16" fill="#000000" text-anchor="middle">H</text><path d="M101.0 165H89.0V250H101.0M249.0 165H261.0V250H249.0" fill="none" stroke="#2366a0" stroke-width="2"/><text class="diagram-label" x="267.0" y="258" font-size="16" fill="#000000" text-anchor="start">n</text><text class="diagram-label" x="175.0" y="291" font-size="16" fill="#000000" text-anchor="middle">Poly(ethene) repeating unit</text><text class="diagram-label" x="175.0" y="319" font-size="16" fill="#000000" text-anchor="middle">Same atoms, no small by-product</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,322,207" transform="translate(416 18)"><rect width="322" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Other addition units</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Poly(propene): –CH₂–CH(CH₃)–.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Single backbone bonds, outward links,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">brackets, n.</text><path class="section-divider" d="M18 131H304" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Restore C=C to find monomer.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No small molecule eliminated.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,322,251" transform="translate(416 237)"><rect width="322" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Condensation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Monomers have two reactive functional</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">groups.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Groups join and eliminate a small</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">molecule.</text><path class="section-divider" d="M18 153H304" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Usually water by-product.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Some monomer atoms leave the</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">polymer.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,185" transform="translate(750 18)"><rect width="352" height="185" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Polyesters</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Diol: two –OH groups.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Diacid: two –COOH groups.</text><path class="section-divider" d="M18 109H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ester links repeatedly connect them.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Two joining sites allow extended chains.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,207" transform="translate(750 215)"><rect width="352" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Avoid drawing errors</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not keep C=C in addition backbone.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not remove methyl or halogen side</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">groups.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chain bonds pass through both brackets.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One alcohol +one acid forms a small ester.</text></g></g></svg>