<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Crude oil, hydrocarbons and cracking</title><desc id="map-description">Alkane family: CₙH₂ₙ₊₂, saturated single C–C bonds. Methane CH₄, ethane C₂H₆. Propane C₃H₈, butane C₄H₁₀. Hydrocarbon contains no oxygen. Column process: Heat mixture to vaporise hydrocarbons. Hot bottom, cooler top. High-boiling long chains condense lower. Short chains rise further before condensing. Fractions and materials: Fraction: similar boiling-range mixture. Fuels: petrol, diesel, kerosene, LPG. Feedstocks: solvents, lubricants, polymers, detergents. Distillation does not break molecules. Size trends: Longer molecules: boiling point increases. Viscosity increases, flammability decreases. Stronger intermolecular attractions. Boiling does not break covalent bonds. Combustion: Enough oxygen: carbon dioxide and water. Balance C, then H, then O. C₃H₈+5O₂ →3CO₂+4H₂O. Insufficient oxygen can produce CO and soot. Cracking: Vapour over hot catalyst, or high heat with steam. Large molecules become smaller alkanes/alkenes. C₁₀H₂₂ →C₈H₁₈+C₂H₄. Supplies demanded fuels and reactive feedstocks.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,322,185" transform="translate(18 18)"><rect width="322" height="185" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Alkane family</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">CₙH₂ₙ₊₂, saturated single C–C bonds.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Methane CH₄, ethane C₂H₆.</text><path class="section-divider" d="M18 109H304" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Propane C₃H₈, butane C₄H₁₀.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Hydrocarbon contains no oxygen.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,322,229" transform="translate(18 215)"><rect width="322" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Column process</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heat mixture to vaporise hydrocarbons.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Hot bottom, cooler top.</text><path class="section-divider" d="M18 109H304" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">High-boiling long chains condense</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">lower.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Short chains rise further before</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">condensing.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,346,207" transform="translate(352 18)"><rect width="346" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r=