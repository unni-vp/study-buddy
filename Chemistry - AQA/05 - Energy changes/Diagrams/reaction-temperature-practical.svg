<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Temperature changes: an insulated reaction cup</title><desc id="desc">A supported insulated cup has a loose lid, thermometer bulb in the liquid and a stirrer.</desc><rect width="1000" height="560" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Temperature changes: an insulated reaction cup</text><path d="M260 225V470H620V225" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M260 225h-10m370 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 215L325 455H555L580 215Z" fill="#eee9db" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M315 320L328 450H552L565 320Z" fill="#d8effa" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="285" y="200" width="310" height="18" rx="5" fill="#dfded7" stroke="#182c3b" stroke-width="2"/><rect x="405" y="90" width="22" height="280" rx="5" fill="white" stroke="#182c3b" stroke-width="2"/><circle cx="416" cy="367" r="12" fill="#c24e43" stroke="#182c3b" stroke-width="2"/><path d="M515 125L505 385" fill="none" stroke="#147a70" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="680" y="150" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Thermometer</text><path d="M668 144L428 230" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="680" y="250" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Lid with loose openings</text><path d="M668 244L590 210" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="680" y="350" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Insulated cup</text><path d="M668 344L560 390" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="400" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Supporting beaker</text><path d="M234 394L260 400" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="512" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Measure starting temperature, add reactant, stir, then record the maximum / minimum.</text></g></svg>