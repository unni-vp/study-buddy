<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" width="1000" height="585" role="img" aria-labelledby="title"><title id="title">Acidic fuel cell: hydrogen oxidised; electrons pass through load while protons cross electrolyte; oxygen reduced to water</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="585" fill="white"/><text x="500" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">Hydrogen fuel cell with an acidic electrolyte</text><rect x="420" y="215" width="160" height="255" fill="#eadff5" stroke="#7750a1"/><rect x="285" y="210" width="35" height="260" fill="#526573"/><rect x="680" y="210" width="35" height="260" fill="#526573"/><path d="M302 210V95H410M590 95H697V210" fill="none" stroke="#2166ad" stroke-width="3"/><rect x="410" y="70" width="180" height="50" rx="8" fill="#fff1cc" stroke="#aa7e22"/><text x="500" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Electrical load</text><path d="M332 95H396" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 95H660" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Electrons through the external circuit →</text><text x="150" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Hydrogen electrode (−)</text><text x="850" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Oxygen electrode (+)</text><text x="117" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#18344a">H₂ in</text><path d="M170 277H276" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="881" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#18344a">O₂ in</text><path d="M830 277H725" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="399" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="26" text-anchor="middle" fill="#18344a">H⁺</text><path d="M425 337H660" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">H⁺ crosses</text><text x="500" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">electrolyte</text><path d="M725 409H828" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="884" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">H₂O out</text><text x="220" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">H₂ loses electrons</text><text x="780" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">O₂ gains electrons</text><text x="500" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="26" text-anchor="middle" fill="#18344a">Overall: 2H₂ + O₂ → 2H₂O</text></svg>