<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Profiles &amp; bond energies</title><desc id="map-description">Energy is conserved: Exothermic pays energy out to surroundings → surroundings warm products have less energy. Endothermic takes energy from surroundings → surroundings cool products have more energy. A starting spark does not make an overall reaction endothermic. Examples &amp; applications: Exothermic: combustion, many oxidation reactions, neutralisation → hand warmers/self-heating cans. Endothermic: thermal decomposition citric acid + sodium hydrogencarbonate → cooling applications. Judge temperature, duration, safety, cost and disposal. Profile axes &amp; peak: Energy vertically reaction progress horizontally. Reactants and products at flat levels joined by curved peak. Activation energy: minimum collision energy measure reactant level to peak. Overall change is between reactant and product levels. Products decide the sign: Products lower → energy transferred out, negative overall change. Products higher → energy taken in, positive. Activation energy is not measured from the baseline it is not the overall change. Both exothermic and endothermic reactions need activation energy. Count bonds correctly: Overall = broken − formed. Breaking takes in energy making releases it. Include equation coefficients. H₂ + Cl₂ → 2HCl. Given 436, 243, 431 kJ/mol: break 436 + 243 = 679 form 2 × 431 = 862. 679 − 862 = −183 kJ for molar quantities in equation: exothermic. Unknown bond energy: If H–Cl energy is x and overall change is −183: 679 − 2x = −183. 2x = 862 → x = 431 kJ/mol. Use the data supplied. CH₄ has four C–H bonds 2H₂O contains four O–H bonds. Do not confuse bonds with molecules.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,286" transform="translate(18 18)"><rect width="290" height="286" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Energy is conserved</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Exothermic pays energy out to</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">surroundings → surroundings warm</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">products have less energy.</text><path class="section-divider" d="M18 131H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Endothermic takes energy from</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">surroundings → surroundings cool</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">products have more energy.</text><path class="section-divider" d="M18 210H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A starting spark does not make an</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">overall reaction endothermic.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,358" transform="translate(18 316)"><rect width="290" height="358" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="64" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Examples &amp;</text><text class="panel-title" x="50" y="62" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">applications</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Exothermic:</tspan> combustion, many</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oxidation reactions, neutralisation →</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hand warmers/self-heating cans.</text><path class="section-divider" d="M18 159H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Endothermic:</tspan> thermal</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">decomposition</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">citric acid + sodium</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hydrogencarbonate → cooling</text><text class="body-text" x="18" y="270" font-size="16" fill="#000000" font-weight="400" text-anchor="start">applications.</text><path class="section-divider" d="M18 282H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="305" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Judge temperature, duration, safety,</text><text class="body-text" x="18" y="327" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cost and disposal.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,446,229" transform="translate(320 18)"><rect width="446" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="428" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Profile axes &amp; peak</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Energy vertically</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reaction progress horizontally.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Reactants and products at flat levels joined by curved peak.</text><path class="section-divider" d="M18 131H428" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Activation</tspan> <tspan font-weight="700">energy:</tspan> minimum collision energy</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">measure reactant level to peak.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Overall change is between reactant and product levels.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,446,467" transform="translate(320 259)"><rect width="446" height="467" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="428" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Products decide the sign</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Products lower → energy transferred out, negative overall</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">change.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Products higher → energy taken in, positive.</text><path class="section-divider" d="M18 131H428" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Activation energy is not measured from the baseline</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">it is not the overall change.</text><path class="section-divider" d="M18 188H428" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Both exothermic and endothermic reactions need</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">activation energy.</text><g transform="translate(18 251)"><g class="concept-illustration"><title>Compares the energy levels in exothermic and endothermic profiles.</title><g transform="translate(0.0 0)"><text class="diagram-label" x="99.5" y="18" font-size="16" fill="#000000" text-anchor="middle">Exothermic</text><path d="M20 32V127H197.0" stroke="#607583" fill="none"/><text class="diagram-label" x="0" y="51" font-size="16" fill="#000000" text-anchor="start">E</text><path d="M27 88H43C57 88 59 46 103.48 46S141.29 111 161.0 111H194.0" stroke="#2366a0" stroke-width="2.5" fill="none"/><text class="diagram-label" x="28" y="80" font-size="16" fill="#000000" text-anchor="start">R</text><text class="diagram-label" x="175.0" y="103" font-size="16" fill="#000000" text-anchor="start">P</text><path d="M60 88L60 46" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M62.39712769302101 50.38791280945186L60 46L57.60287230697899 50.38791280945186" stroke="#b95619" stroke-width="2" fill="none"/><text class="diagram-label" x="45" y="42" font-size="16" fill="#000000" text-anchor="start">Eₐ</text><text class="diagram-label" x="99.5" y="150" font-size="16" fill="#000000" text-anchor="middle">Progress</text></g><g transform="translate(211.0 0)"><text class="diagram-label" x="99.5" y="18" font-size="16" fill="#000000" text-anchor="middle">Endothermic</text><path d="M20 32V127H197.0" stroke="#607583" fill="none"/><text class="diagram-label" x="0" y="51" font-size="16" fill="#000000" text-anchor="start">E</text><path d="M27 111H43C57 111 59 46 103.48 46S141.29 88 161.0 88H194.0" stroke="#2366a0" stroke-width="2.5" fill="none"/><text class="diagram-label" x="28" y="103" font-size="16" fill="#000000" text-anchor="start">R</text><text class="diagram-label" x="175.0" y="80" font-size="16" fill="#000000" text-anchor="start">P</text><path d="M60 111L60 46" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M62.39712769302101 50.38791280945186L60 46L57.60287230697899 50.38791280945186" stroke="#b95619" stroke-width="2" fill="none"/><text class="diagram-label" x="45" y="42" font-size="16" fill="#000000" text-anchor="start">Eₐ</text><text class="diagram-label" x="99.5" y="150" font-size="16" fill="#000000" text-anchor="middle">Progress</text></g><text class="diagram-label" x="205.0" y="175" font-size="16" fill="#000000" text-anchor="middle">E: energy    R: reactants    P: products</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,324,330" transform="translate(778 18)"><rect width="324" height="330" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="306" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Count bonds correctly</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Overall</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">broken</tspan> <tspan font-weight="700">−</tspan> <tspan font-weight="700">formed.</tspan> Breaking</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">takes in energy</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">making releases it.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Include equation coefficients.</text><path class="section-divider" d="M18 153H306" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">H₂ + Cl₂ → 2HCl.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Given</tspan> <tspan font-weight="700">436,</tspan> <tspan font-weight="700">243,</tspan> <tspan font-weight="700">431</tspan> <tspan font-weight="700">kJ/mol:</tspan> break 436</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">+ 243 = 679</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">form 2 × 431 = 862.</text><path class="section-divider" d="M18 254H306" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">679 − 862 = <tspan font-weight="700">−183</tspan> <tspan font-weight="700">kJ</tspan> for molar</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">quantities in equation: exothermic.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,324,264" transform="translate(778 360)"><rect width="324" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="306" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Unknown bond energy</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">If H–Cl energy is x and overall change is</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">−183: <tspan font-weight="700">679</tspan> <tspan font-weight="700">−</tspan> <tspan font-weight="700">2x</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">−183.</tspan></text><path class="section-divider" d="M18 109H306" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">2x = 862 → x = <tspan font-weight="700">431</tspan> <tspan font-weight="700">kJ/mol.</tspan></text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use the data supplied.</text><path class="section-divider" d="M18 166H306" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">CH₄ has four C–H bonds</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">2H₂O contains four O–H bonds.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not confuse bonds with molecules.</text></g></g></svg>