<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Energy changes</title><desc id="map-description">Exothermic vs endothermic: Exothermic: energy to surroundings temperature rises products lower in energy. Combustion, many oxidations, neutralisation. Endothermic: energy from surroundings temperature falls products higher. Thermal decomposition is an example. Reaction profiles: Vertical axis: energy. Horizontal: reaction progress, not time. Activation energy = minimum energy for a successful collision. Draw a curved peak. Activation energy: reactant level → peak. Overall change: reactant → product level. Bonds: break minus make: Breaking bonds takes energy forming bonds releases energy. Overall = total broken − total formed. Negative → exothermic positive → endothermic. Count every bond and equation coefficient use supplied values. Temperature practical: Insulated cup/lid, measured volumes, same starting temperature. Mix/stir record maximum/minimum. Change = extreme − initial. Vary one factor control others, repeat and average. Heat loss can reduce measured rise use time-graph extrapolation when requested. Cells &amp; batteries: Different electrodes + electrolyte → electricity. Voltage depends on both compare under controlled conditions. Non-rechargeable stops when a reactant runs out. External current reverses reactions in rechargeable cells. Series cell voltages add. Hydrogen fuel cells: Continuous H₂ and O₂ supply hydrogen oxidised, oxygen reduced. Overall: 2H₂ + O₂ → 2H₂O. Electrons go through external load ions through electrolyte. Compare refuelling/recharging, storage, cost, lifetime and whole-process emissions, not only water at the outlet.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,271" transform="translate(18 18)"><rect width="354" height="271" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Exothermic vs endothermic</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Exothermic:</tspan> energy to surroundings</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">temperature rises</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">products lower in energy.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Combustion, many oxidations, neutralisation.</text><path class="section-divider" d="M18 153H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Endothermic:</tspan> energy from surroundings</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">temperature falls</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">products higher.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Thermal decomposition is an example.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,449" transform="translate(18 301)"><rect width="354" height="449" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Reaction profiles</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Vertical</tspan> <tspan font-weight="700">axis:</tspan> energy.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Horizontal:</tspan> reaction progress, not time.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Activation energy = minimum energy for a</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">successful collision.</text><path class="section-divider" d="M18 153H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Draw a curved peak.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Activation</tspan> <tspan font-weight="700">energy:</tspan> reactant level → peak.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Overall</tspan> <tspan font-weight="700">change:</tspan> reactant → product level.</text><g transform="translate(18 238)"><g class="concept-illustration"><title>Shows reactant/product energy levels and the starting point of activation energy.</title><text class="diagram-label" x="159.0" y="16" font-size="16" fill="#000000" text-anchor="middle">Exothermic</text><path d="M28 30V124H306" stroke="#607583" fill="none"/><text class="diagram-label" x="0" y="43" font-size="16" fill="#000000" text-anchor="start">E</text><path d="M37 76H70C94 76 107 35 144 35S190 105 249 105H298" fill="none" stroke="#2366a0" stroke-width="2.5"/><text class="diagram-label" x="48" y="67" font-size="16" fill="#000000" text-anchor="start">R</text><text class="diagram-label" x="276" y="96" font-size="16" fill="#000000" text-anchor="start">P</text><path d="M111 76L111 35" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M113.39712769302102 39.38791280945186L111 35L108.60287230697898 39.38791280945186" stroke="#b95619" stroke-width="2" fill="none"/><text class="diagram-label" x="89" y="54" font-size="16" fill="#000000" text-anchor="start">Eₐ</text><text class="diagram-label" x="159.0" y="148" font-size="16" fill="#000000" text-anchor="middle">Reaction progress</text><text class="diagram-label" x="159.0" y="172" font-size="16" fill="#000000" text-anchor="middle">E: energy    R: reactants    P: products</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,251" transform="translate(384 18)"><rect width="354" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Bonds: break minus make</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Breaking bonds takes energy</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">forming bonds releases energy.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Overall = total broken − total formed.</text><path class="section-divider" d="M18 131H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Negative → exothermic</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">positive → endothermic.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Count every bond and equation coefficient</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">use supplied values.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,317" transform="translate(384 281)"><rect width="354" height="317" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Temperature practical</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Insulated cup/lid, measured volumes, same</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">starting temperature.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mix/stir</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">record maximum/minimum.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Change = extreme − initial.</text><path class="section-divider" d="M18 175H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Vary one factor</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">control others, repeat and average.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heat loss can reduce measured rise</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">use time-graph extrapolation when</text><text class="body-text" x="18" y="286" font-size="16" fill="#000000" font-weight="400" text-anchor="start">requested.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,295" transform="translate(750 18)"><rect width="352" height="295" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Cells &amp; batteries</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Different electrodes + electrolyte →</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electricity.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Voltage depends on both</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">compare under controlled conditions.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Non-rechargeable stops when a reactant runs</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">out.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">External current reverses reactions in</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">rechargeable cells.</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Series cell voltages add.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,286" transform="translate(750 325)"><rect width="352" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Hydrogen fuel cells</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Continuous H₂ and O₂ supply</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hydrogen oxidised, oxygen reduced.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Overall:</tspan> <tspan font-weight="700">2H₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">O₂</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">2H₂O.</tspan></text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electrons go through external load</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ions through electrolyte.</text><path class="section-divider" d="M18 188H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare refuelling/recharging, storage, cost,</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">lifetime and whole-process emissions, not</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">only water at the outlet.</text></g></g></svg>