29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Continuous fuel supply</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">External hydrogen and oxygen/air feed the</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cell.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2H₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">O₂</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">2H₂O.</tspan></text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Hydrogen oxidised</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oxygen reduced.</text><path class="section-divider" d="M18 175H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electrons travel through external circuit/load</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ions through electrolyte.</text><path class="section-divider" d="M18 232H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Continues while supplied with reactants</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">refill fuel rather than reverse reaction to</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">recharge.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,242" transform="translate(388 360)"><rect width="350" height="242" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Acidic half-equations</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Hydrogen:</tspan> <tspan font-weight="700">2H₂</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">4H⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">4e⁻.</tspan></text><path class="section-divider" d="M18 87H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Oxygen:</tspan> <tspan font-weight="700">O₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">4H⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">4e⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">2H₂O.</tspan></text><path class="section-divider" d="M18 122H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="145" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Add and cancel H⁺/electrons.</text><text class="body-text" x="18" y="167" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balance atoms and charge.</text><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fuel cell generates current</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electrolysis requires a power supply.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,220" transform="translate(750 18)"><rect width="352" height="220" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">If electrolyte is alkaline</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Hydrogen:</tspan> <tspan font-weight="700">2H₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">4OH⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">4H₂O</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">4e⁻.</tspan></text><path class="section-divider" d="M18 87H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Oxygen:</tspan> <tspan font-weight="700">O₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2H₂O</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">4e⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">4OH⁻.</tspan></text><path class="section-divider" d="M18 122H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="145" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sum gives same overall reaction.</text><text class="body-text" x="18" y="167" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use the electrolyte specified</text><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">do not mix acidic and alkaline half-equations.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,330" transform="translate(750 250)"><rect width="352" height="330" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Fuel cell vs rechargeable</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fuel:</tspan> water during use, quick refuelling</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">possible</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hydrogen storage, flammability and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">infrastructure matter.</text><path class="section-divider" d="M18 153H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Battery:</tspan> recharge from grid, no exhaust</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mass, charge time, finite life and materials</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">matter.</text><path class="section-divider" d="M18 232H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Check hydrogen production/electricity</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sources, efficiency and manufacture.</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Neither is automatically zero-carbon overall.</text></g></g></svg>