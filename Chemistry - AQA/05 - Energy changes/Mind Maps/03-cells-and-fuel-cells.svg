<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Cells &amp; fuel cells</title><desc id="map-description">Simple cells: Two different metals in electrolyte, connected externally. Chemical reaction supplies electrical energy. Voltage depends on electrodes and electrolyte. Keep electrolyte/concentration and temperature fixed when comparing metals. Use lead polarity and reference convention to interpret reactivity data. Batteries &amp; recharge: Series voltages add: 3 × 1.5 V = 4.5 V. Battery = two or more cells. Non-rechargeable, e.g. alkaline: stops when reactant is used up. Rechargeable: external current reverses chemical reactions. Compare mass, capacity, lifetime cost and recharge time. Continuous fuel supply: External hydrogen and oxygen/air feed the cell. 2H₂ + O₂ → 2H₂O. Hydrogen oxidised oxygen reduced. Electrons travel through external circuit/load ions through electrolyte. Continues while supplied with reactants refill fuel rather than reverse reaction to recharge. Acidic half-equations: Hydrogen: 2H₂ → 4H⁺ + 4e⁻. Oxygen: O₂ + 4H⁺ + 4e⁻ → 2H₂O. Add and cancel H⁺/electrons. Balance atoms and charge. Fuel cell generates current electrolysis requires a power supply. If electrolyte is alkaline: Hydrogen: 2H₂ + 4OH⁻ → 4H₂O + 4e⁻. Oxygen: O₂ + 2H₂O + 4e⁻ → 4OH⁻. Sum gives same overall reaction. Use the electrolyte specified do not mix acidic and alkaline half-equations. Fuel cell vs rechargeable: Fuel: water during use, quick refuelling possible hydrogen storage, flammability and infrastructure matter. Battery: recharge from grid, no exhaust mass, charge time, finite life and materials matter. Check hydrogen production/electricity sources, efficiency and manufacture. Neither is automatically zero-carbon overall.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,358,286" transform="translate(18 18)"><rect width="358" height="286" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="340" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Simple cells</text></g><g class="section