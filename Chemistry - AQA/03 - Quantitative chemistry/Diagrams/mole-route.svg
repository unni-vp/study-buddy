<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" width="1000" height="415" role="img" aria-labelledby="title"><title id="title">Magnesium mass divided by molar mass, mole ratio, then product moles multiplied by molar mass</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="415" fill="white"/><text x="500" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">Reacting masses: use moles to cross the equation</text><rect x="25" y="85" width="280" height="105" rx="15" fill="#edf5ff" stroke="#2166ad"/><text x="165" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Mass of Mg</text><text x="165" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">6.0 g</text><rect x="350" y="85" width="280" height="105" rx="15" fill="#edf5ff" stroke="#2166ad"/><text x="490" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Moles of Mg</text><text x="490" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">0.25 mol</text><rect x="675" y="85" width="280" height="105" rx="15" fill="#edf5ff" stroke="#2166ad"/><text x="815" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Moles of MgO</text><text x="815" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">0.25 mol</text><path d="M308 139H344" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M633 139H669" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="165" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">÷ 24 g/mol</text><text x="490" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Mg : MgO = 2 : 2</text><path d="M815 198V277" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="end" fill="#18344a">× 40 g/mol</text><rect x="675" y="285" width="280" height="100" rx="15" fill="#e4f4eb" stroke="#18837b"/><text x="815" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Mass of MgO</text><text x="815" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">10 g</text><text x="340" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#18344a">2Mg + O₂ → 2MgO</text><text x="340" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Oxygen is in excess.</text></svg>