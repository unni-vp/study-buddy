<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Moles &amp; reacting masses</title><desc id="map-description">Mᵣ &amp; composition: Ca(OH)₂: 40 + 2 × (16 + 1) = 74. Brackets multiply every atom inside. Oxygen percentage = 32/74 × 100 = 43.2%. Mᵣ has no unit molar mass is 74 g/mol. Moles &amp; particles: n = mass / molar mass. 11 g CO₂ / 44 g/mol = 0.25 mol. Particles = n × 6.02 × 10²³. This is 1.505 × 10²³ CO₂ molecules each has three atoms. State whether counting atoms, molecules, ions or electrons. Reacting masses: 2Mg + O₂ → 2MgO. 6.0 g Mg / 24 = 0.25 mol Mg. Mg : MgO = 2 : 2 → 0.25 mol MgO. Mass = 0.25 × 40 = 10 g MgO oxygen in excess. Coefficients are mole ratios, not mass ratios. Find equation coefficients: Divide each mass by its molar mass divide all moles by smallest multiply to whole numbers. 2.4 g Mg, 1.6 g O₂, 4.0 g MgO → 0.10 : 0.05 : 0.10 mol → 2 : 1 : 2. Check atoms and total mass on both sides. Limiting vs excess: 0.30 mol Mg + 0.10 mol O₂: oxygen needs only 0.20 mol Mg. O₂ is limiting. MgO formed = 0.20 mol Mg left = 0.10 mol. Use limiting amount for theoretical yield extra excess reactant cannot increase it. Mass &amp; uncertainty: An open vessel gains mass if oxygen enters loses mass if gas escapes. Count all substances to conserve mass. Readings 24.2, 24.4, 24.6 → mean 24.4 range 0.4 half-range uncertainty ±0.2. Percentage uncertainty = 0.2/24.4 × 100 = 0.82%.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,326,229" transform="translate(18 18)"><rect width="326" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Mᵣ &amp; composition</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ca(OH)₂:</tspan> 40 + 2 × (16 + 1) = <tspan font-weight="700">74.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Brackets multiply every atom inside.</text><path class="section-divider" d="M18 109H308" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxygen percentage = 32/74 × 100 =</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">43.2%.</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mᵣ has no unit</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">molar mass is 74 g/mol.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,326,264" transform="translate(18 259)"><rect width="326" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Moles &amp; particles</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">n = mass / molar mass.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">11 g CO₂ / 44 g/mol = <tspan font-weight="700">0.25</tspan> <tspan font-weight="700">mol.</tspan></text><path class="section-divider" d="M18 109H308" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Particles = n × 6.02 × 10²³.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">This is 1.505 × 10²³ CO₂ molecules</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">each has three atoms.</text><path class="section-divider" d="M18 188H308" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">State whether counting atoms, molecules,</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ions or electrons.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,242" transform="translate(356 18)"><rect width="350" height="242" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Reacting masses</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2Mg</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">O₂</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">2MgO.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">6.0 g Mg / 24 = 0.25 mol Mg.</text><path class="section-divider" d="M18 109H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Mg:</tspan> MgO = 2: 2 → 0.25 mol MgO.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mass = 0.25 × 40 = <tspan font-weight="700">10</tspan> <tspan font-weight="700">g</tspan> <tspan font-weight="700">MgO</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oxygen in excess.</text><path class="section-divider" d="M18 188H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Coefficients are mole ratios, not mass ratios.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,242" transform="translate(356 272)"><rect width="350" height="242" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Find equation coefficients</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Divide each mass by its molar mass</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">divide all moles by smallest</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">multiply to whole numbers.</text><path class="section-divider" d="M18 131H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">2.4 g Mg, 1.6 g O₂, 4.0 g MgO → 0.10: 0.05:</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.10 mol → <tspan font-weight="700">2:</tspan> <tspan font-weight="700">1:</tspan> <tspan font-weight="700">2.</tspan></text><path class="section-divider" d="M18 188H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Check atoms and total mass on both sides.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,384,426" transform="translate(718 18)"><rect width="384" height="426" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="366" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Limiting vs excess</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.30 mol Mg + 0.10 mol O₂: oxygen needs only</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.20 mol Mg.</text><path class="section-divider" d="M18 109H366" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">O₂ is limiting.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">MgO formed = <tspan font-weight="700">0.20</tspan> <tspan font-weight="700">mol</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mg left = <tspan font-weight="700">0.10</tspan> <tspan font-weight="700">mol.</tspan></text><path class="section-divider" d="M18 188H366" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use limiting amount for theoretical yield</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">extra excess reactant cannot increase it.</text><g transform="translate(18 251)"><g class="concept-illustration"><title>Makes the limiting reactant and leftover excess visible in a particle model.</title><text class="diagram-label" x="0" y="18" font-size="16" fill="#000000" text-anchor="start">Before:</text><text class="diagram-label" x="0" y="83" font-size="16" fill="#000000" text-anchor="start">After:</text><circle cx="100" cy="13" r="9" fill="#bdc8d5" stroke="#2366a0"/><circle cx="137" cy="13" r="9" fill="#bdc8d5" stroke="#2366a0"/><circle cx="174" cy="13" r="9" fill="#bdc8d5" stroke="#2366a0"/><circle cx="313" cy="13" r="7" fill="#e7a9a8" stroke="#b74650"/><circle cx="330" cy="13" r="7" fill="#e7a9a8" stroke="#b74650"/><path d="M174.0 34L174.0 55" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M171.60287230697898 50.61208719054814L174.0 55L176.39712769302102 50.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><circle cx="100" cy="78" r="9" fill="#bdc8d5" stroke="#2366a0"/><circle cx="116" cy="78" r="7" fill="#e7a9a8" stroke="#b74650"/><circle cx="155" cy="78" r="9" fill="#bdc8d5" stroke="#2366a0"/><circle cx="171" cy="78" r="7" fill="#e7a9a8" stroke="#b74650"/><circle cx="323" cy="78" r="9" fill="#bdc8d5" stroke="#2366a0"/><text class="diagram-label" x="174.0" y="110" font-size="16" fill="#000000" text-anchor="middle">Grey: Mg    Red: O</text><text class="diagram-label" x="174.0" y="134" font-size="16" fill="#000000" text-anchor="middle">O₂ runs out; one Mg atom remains</text></g></g></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,384,264" transform="translate(718 456)"><rect width="384" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="366" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Mass &amp; uncertainty</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">An open vessel gains mass if oxygen enters</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">loses mass if gas escapes.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Count all substances to conserve mass.</text><path class="section-divider" d="M18 131H366" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Readings 24.2, 24.4, 24.6 → mean 24.4</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">range 0.4</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">half-range uncertainty <tspan font-weight="700">±0.2.</tspan></text><path class="section-divider" d="M18 210H366" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Percentage uncertainty = 0.2/24.4 × 100 = 0.82%.</text></g></g></svg>