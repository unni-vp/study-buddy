<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Quantitative chemistry</title><desc id="map-description">Mass &amp; formulae: Atoms are rearranged, not created/destroyed. Closed system: reactant mass = product mass. Gas entering/leaving explains apparent mass change. Mᵣ = sum of Aᵣ values in formula no unit. Balance coefficients, never change formula subscripts. Moles are a counting unit: One mole contains 6.02 × 10²³ stated particles. Molar mass in g/mol is numerically equal to Mᵣ. n = mass / molar mass. Particles = n × Avogadro constant. Ratios &amp; limiting reactants: Mass → moles → equation ratio → required moles → mass. Limiting reactant runs out and limits product excess remains. Compare moles divided by each coefficient. From masses: convert to moles, divide by smallest, obtain whole-number ratio. Solutions &amp; gases: 1 dm³ = 1,000 cm³. Mass concentration = g / dm³ molar concentration = mol / dm³. Titration: known cV → ratio → unknown n/V. At RTP gas volume = n × 24 dm³ gas ratios follow equation coefficients. Yield &amp; atom economy: Yield = actual / theoretical × 100%. Losses, side reactions and incomplete reactions lower yield. Atom economy = desired-product mass / total reactant mass from equation × 100% include coefficients. Compare rate, yield, waste, equilibrium and useful by-products. Reliable measurements: Repeat, calculate mean and show spread. Half-range can estimate uncertainty when requested. Percentage uncertainty = absolute uncertainty / reading × 100. Repeats reduce random effects, not systematic errors. Keep units consistent and round only the final answer.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,318,330" transform="translate(18 18)"><rect width="318" height="330" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="300" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Mass &amp; formulae</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Atoms are rearranged, not</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">created/destroyed.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Closed</tspan> <tspan font-weight="700">system:</tspan> reactant mass =</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">product mass.</text><path class="section-divider" d="M18 153H300" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gas entering/leaving explains apparent</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mass change.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mᵣ = sum of Aᵣ values in formula</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">no unit.</text><path class="section-divider" d="M18 254H300" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balance coefficients, never change</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">formula subscripts.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,318,229" transform="translate(18 360)"><rect width="318" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="300" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Moles are a counting unit</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One mole contains <tspan font-weight="700">6.02</tspan> <tspan font-weight="700">×</tspan> <tspan font-weight="700">10²³</tspan> stated</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">particles.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Molar mass in g/mol is numerically</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">equal to Mᵣ.</text><path class="section-divider" d="M18 153H300" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">n</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">mass</tspan> <tspan font-weight="700">/</tspan> <tspan font-weight="700">molar</tspan> <tspan font-weight="700">mass.</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Particles = n × Avogadro constant.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,338,286" transform="translate(348 18)"><rect width="338" height="286" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="320" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Ratios &amp; limiting reactants</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mass → moles → equation ratio → required</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">moles → mass.</text><path class="section-divider" d="M18 109H320" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Limiting reactant runs out and limits</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">product</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">excess remains.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare moles divided by each coefficient.</text><path class="section-divider" d="M18 210H320" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">From</tspan> <tspan font-weight="700">masses:</tspan> convert to moles, divide by</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">smallest, obtain whole-number ratio.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,338,286" transform="translate(348 316)"><rect width="338" height="286" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="320" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Solutions &amp; gases</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">1</tspan> <tspan font-weight="700">dm³</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">1,000</tspan> <tspan font-weight="700">cm³.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mass concentration = g / dm³</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">molar concentration = mol / dm³.</text><path class="section-divider" d="M18 131H320" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Titration:</tspan> known cV → ratio → unknown</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">n/V.</text><path class="section-divider" d="M18 188H320" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">At RTP</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gas volume = <tspan font-weight="700">n</tspan> <tspan font-weight="700">×</tspan> <tspan font-weight="700">24</tspan> <tspan font-weight="700">dm³</tspan></text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gas ratios follow equation coefficients.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,404,286" transform="translate(698 18)"><rect width="404" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="386" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Yield &amp; atom economy</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Yield = actual / theoretical × 100%.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Losses, side reactions and incomplete reactions</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">lower yield.</text><path class="section-divider" d="M18 131H386" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Atom economy = desired-product mass / total</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reactant mass from equation × 100%</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">include coefficients.</text><path class="section-divider" d="M18 210H386" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare rate, yield, waste, equilibrium and useful</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">by-products.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,404,286" transform="translate(698 316)"><rect width="404" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="386" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Reliable measurements</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat, calculate mean and show spread.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Half-range can estimate uncertainty when requested.</text><path class="section-divider" d="M18 109H386" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Percentage uncertainty = absolute uncertainty /</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reading × 100.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeats reduce random effects, not systematic</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">errors.</text><path class="section-divider" d="M18 210H386" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep units consistent and round only the final</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">answer.</text></g></g></svg>