<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Yield &amp; atom economy</title><desc id="map-description">Theoretical maximum: Use mass → moles → equation ratio → product mass. Check limiting reactant first. Example: CaCO₃ → CaO + CO₂. 25.0 g CaCO₃ / 100 = 0.250 mol → 0.250 × 56 = 14.0 g CaO. Percentage yield: Yield = actual / theoretical × 100%. If actual CaO is 11.2 g: 11.2/14.0 × 100 = 80.0%. Actual = theoretical × yield/100. Theoretical = actual / (yield/100). Why yield is lower: Reversible reaction may not finish side reactions consume reactants product is lost in transfer/separation. Atoms are still conserved. Apparent yield above 100% suggests wet/impure product or measurement error. Atom economy: Desired-product coefficient × Mᵣ divided by sum of all reactant coefficient × Mᵣ then × 100%. CaCO₃ → CaO + CO₂: for desired CaO, 56/100 × 100 = 56%. Other 44% becomes CO₂, even if every atom reacts correctly. Keep the ideas separate: Yield: proportion of the expected product actually collected. Atom economy: proportion of starting mass directed into desired product. A process can have high yield but low atom economy. Addition reactions with one product have 100% atom economy. Evidence &amp; decision: Higher atom economy reduces waste and resource/disposal costs. But compare yield, rate, energy, equilibrium and useful by-products too. Support a choice using the supplied data and acknowledge a trade-off. Repeats/uncertainty help judge measured yield.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,302,229" transform="translate(18 18)"><rect width="302" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Theoretical maximum</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use mass → moles → equation ratio</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">→ product mass.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Check limiting reactant first.</text><path class="section-divider" d="M18 131H284" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Example:</tspan> CaCO₃ → CaO + CO₂.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">25.0 g CaCO₃ / 100 = 0.250 mol →</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.250 × 56 = <tspan font-weight="700">14.0</tspan> <tspan font-weight="700">g</tspan> <tspan font-weight="700">CaO.</tspan></text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,302,229" transform="translate(18 259)"><rect width="302" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Percentage yield</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Yield</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">actual</tspan> <tspan font-weight="700">/</tspan> <tspan font-weight="700">theoretical</tspan> <tspan font-weight="700">×</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">100%.</tspan></text><text class="body-text" x="18"