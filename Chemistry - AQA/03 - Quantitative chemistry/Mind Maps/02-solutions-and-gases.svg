<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Solutions &amp; gases</title><desc id="map-description">Mass concentration: c in g/dm³ = mass in g / solution volume in dm³. Mass = cV. 250 cm³ = 0.250 dm³. 5.0 g in 0.250 dm³ → 20 g/dm³. Same solute, double final volume → half concentration. Molar concentration: n = cV with: c in mol/dm³ and V in dm³. Rearrange: c = n/V. 0.200 mol/dm³ × 0.150 dm³ = 0.0300 mol. For NaOH mass = 0.0300 × 40 = 1.20 g. mol/dm³ × molar mass → g/dm³. Titration route: Take mean of concordant titres, excluding rough trial. Convert both volumes to dm³. Known moles = known c × V. Use balanced equation ratio. Unknown concentration = unknown moles / its volume. A 1 : 2 example: H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O. 20.0 cm³ acid at 0.100 mol/dm³ → 0.00200 mol acid → 0.00400 mol NaOH. If NaOH volume is 25.0 cm³ c = 0.00400/0.0250 = 0.160 mol/dm³. Gas volume at RTP: One mole occupies 24 dm³ at 20 °C and 1 atmosphere. Equal moles → equal gas volumes at same conditions. V = 24n n = V/24, with V in dm³. 1 dm³ = 1,000 cm³. 4.4 g CO₂ / 44 = 0.10 mol → 2.4 dm³. Gas equation ratios: 2H₂ + O₂ → 2H₂O: 60 cm³ H₂ needs 30 cm³ O₂ at the same conditions. For mass to gas: mass → moles → equation ratio → gas moles → volume. Do not apply the gas-volume rule to a solid or liquid identify limiting gas if both amounts are given.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,350,264" transform="translate(18 18)"><rect width="350" height="264" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Mass concentration</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">c in g/dm³ = mass in g / solution volume in</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">dm³.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mass = cV.</text><path class="section-divider" d="M18 131H332" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">250 cm³ = <tspan font-weight="700">0.250</tspan> <tspan font-weight="700">dm³.</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">5.0 g in 0.250 dm³ → <tspan font-weight="700">20</tspan> <tspan font-weight="700">g/dm³.</tspan></text><path class="section-divider" d="M18 188H332" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same solute, double final volume → half</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">concentration.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,350,286" transform="translate(18 294)"><rect width="350" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Molar concentration</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">n</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">cV</tspan> with:</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">c</tspan> in mol/dm³</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and <tspan font-weight="700">V</tspan> in dm³.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rearrange:</tspan> c = n/V.</text><path class="section-divider" d="M18 153H332" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.200 mol/dm³ × 0.150 dm³ = 0.0300 mol.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">For NaOH</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mass = 0.0300 × 40 = <tspan font-weight="700">1.20</tspan> <tspan font-weight="700">g.</tspan></text><path class="section-divider" d="M18 232H332" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mol/dm³ × molar mass → g/dm³.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,251" transform="translate(380 18)"><rect width="350" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Titration route</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Take mean of concordant titres, excluding</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">rough trial.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Convert both volumes to dm³.</text><path class="section-divider" d="M18 131H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Known moles = known c × V.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use balanced equation ratio.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Unknown concentration = unknown moles /</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">its volume.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,220" transform="translate(380 281)"><rect width="350" height="220" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">A 1: 2 example</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">H₂SO₄</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2NaOH</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">Na₂SO₄</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2H₂O.</tspan></text><path class="section-divider" d="M18 87H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start">20.0 cm³ acid at 0.100 mol/dm³ → 0.00200</text><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mol acid → 0.00400 mol NaOH.</text><path class="section-divider" d="M18 144H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="167" font-size="16" fill="#000000" font-weight="400" text-anchor="start">If NaOH volume is 25.0 cm³</text><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">c = 0.00400/0.0250 = <tspan font-weight="700">0.160</tspan> <tspan font-weight="700">mol/dm³.</tspan></text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,360,286" transform="translate(742 18)"><rect width="360" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="342" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Gas volume at RTP</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One mole occupies <tspan font-weight="700">24</tspan> <tspan font-weight="700">dm³</tspan> at 20 °C and 1</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">atmosphere.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Equal moles → equal gas volumes at same</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conditions.</text><path class="section-divider" d="M18 153H342" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">V = 24n</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">n = V/24, with V in dm³.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1 dm³ = 1,000 cm³.</text><path class="section-divider" d="M18 232H342" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">4.4 g CO₂ / 44 = 0.10 mol → <tspan font-weight="700">2.4</tspan> <tspan font-weight="700">dm³.</tspan></text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,360,264" transform="translate(742 316)"><rect width="360" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="342" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Gas equation ratios</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2H₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">O₂</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">2H₂O:</tspan> 60 cm³ H₂ needs 30 cm³ O₂</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">at the same conditions.</text><path class="section-divider" d="M18 109H342" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">For</tspan> <tspan font-weight="700">mass</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">gas:</tspan> mass → moles → equation</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ratio → gas moles → volume.</text><path class="section-divider" d="M18 166H342" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not apply the gas-volume rule to a solid or</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">liquid</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">identify limiting gas if both amounts are given.</text></g></g></svg>