<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 435" width="1000" height="435" role="img" aria-labelledby="title"><title id="title">Schematic alpha paths showing straight, deflected and backward scattering</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="435" fill="white"/><text x="500" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">Alpha-particle scattering: evidence for the nucleus</text><circle cx="480" cy="228" r="17" fill="#f6c39b" stroke="#ac6a21"/><text x="480" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">+</text><path d="M55 95H925" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M55 135H925" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M55 335H925" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M55 195H360Q440 195 445 150L490 100" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M55 229H388Q433 229 397 258L290 300" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="725" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Most pass straight through</text><text x="650" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="start" fill="#18344a">Small positive nucleus</text><text x="570" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="start" fill="#18344a">Some deflect</text><text x="160" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Very few return</text><text x="500" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Most of the atom is empty space; mass is concentrated in the nucleus.</text></svg>