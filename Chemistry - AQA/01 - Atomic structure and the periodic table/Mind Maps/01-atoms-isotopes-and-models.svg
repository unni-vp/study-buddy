<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Atoms, isotopes &amp; models</title><desc id="map-description">Nucleus &amp; charge: Protons +1 and neutrons 0 each have relative mass 1. Electrons −1 have tiny mass. Atomic number = protons. Neutrons = mass number − atomic number. Na-23: 11p, 12n, 11e. Na⁺: 11p, 12n, 10e. Size &amp; isotope averages: Atom radius ≈ 10⁻¹⁰ m nucleus ≈ 10⁻¹⁴ m or less. Almost all mass is nuclear. 1 nm = 10⁻⁹ m. Isotopes: same protons, different neutrons. Aᵣ weights each isotope by abundance. 75% mass 35 + 25% mass 37 → 35.5. Shells &amp; position: Lowest shells fill first: 2,8,8,2 for first 20 elements. O: 2,6 Na: 2,8,1 Ca: 2,8,8,2. Period = occupied shells. Same main group = same outer electrons → similar reactions. Metals generally lose electrons non-metals gain/share. Atoms → ions: Losing negative electrons produces a positive ion gaining them produces a negative ion. The number of protons stays unchanged: it remains the same element. Full outer shells help explain the stability of noble gases. Scattering conclusions: Most alpha particles pass → atom mostly empty space. Some deflect → nucleus is positive and repels positive alpha particles. Very few return → tiny, dense nucleus holds most mass contradicts spread-out positive charge. Changing models: Indivisible spheres → discovery of electron → plum pudding. Scattering → nuclear model. Bohr: specific electron shells. Later work: protons. Chadwick: neutrons. New experimental evidence can replace a scientific model.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,286" transform="translate(18 18)"><rect width="290" height="286" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Nucleus &amp; charge</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Protons +1 and neutrons 0 each</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">have relative mass 1.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electrons −1 have tiny mass.</text><path class="section-divider" d="M18 131H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Atomic number = protons.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Neutrons = mass number − atomic</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">number.</text><path class="section-divider" d="M18 210H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Na-23:</tspan> 11p, 12n, 11e.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Na⁺:</tspan> 11p, 12n, 10e.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,358" transform="translate(18 316)"><rect width="290" height="358" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="64" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Size &amp; isotope</text><text class="panel-title" x="50" y="62" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">averages</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Atom radius ≈ 10⁻¹⁰ m</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">nucleus ≈ 10⁻¹⁴ m or less.</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Almost all mass is nuclear.</text><text class="body-text" x="18" y="169" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">1</tspan> <tspan font-weight="700">nm</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">10⁻⁹</tspan> <tspan font-weight="700">m.</tspan></text><path class="section-divider" d="M18 181H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Isotopes:</tspan> same protons, different</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">neutrons.</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Aᵣ weights each isotope by</text><text class="body-text" x="18" y="270" font-size="16" fill="#000000" font-weight="400" text-anchor="start">abundance.</text><path class="section-divider" d="M18 282H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="305" font-size="16" fill="#000000" font-weight="400" text-anchor="start">75% mass 35 + 25% mass 37 →</text><text class="body-text" x="18" y="327" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">35.5.</tspan></text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,426,308" transform="translate(320 18)"><rect width="426" height="308" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="408" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Shells &amp; position</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Lowest</tspan> <tspan font-weight="700">shells</tspan> <tspan font-weight="700">fill</tspan> <tspan font-weight="700">first:</tspan> <tspan font-weight="700">2,8,8,2</tspan> for first 20 elements.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">O:</tspan> 2,6</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Na:</tspan> 2,8,1</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ca:</tspan> 2,8,8,2.</text><path class="section-divider" d="M18 153H408" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Period = occupied shells.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same main group = same outer electrons → similar</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reactions.</text><path class="section-divider" d="M18 232H408" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metals generally lose electrons</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">non-metals gain/share.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,426,358" transform="translate(320 338)"><rect width="426" height="358" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="408" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Atoms → ions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Losing negative electrons produces a <tspan font-weight="700">positive</tspan> <tspan font-weight="700">ion</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gaining them produces a negative ion.</text><path class="section-divider" d="M18 109H408" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">The</tspan> <tspan font-weight="700">number</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">protons</tspan> <tspan font-weight="700">stays</tspan> <tspan font-weight="700">unchanged:</tspan> it remains</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the same element.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Shows electron loss while proton number stays unchanged.</title><text class="diagram-label" x="85.8" y="28" font-size="16" fill="#000000" text-anchor="middle">Na</text><text class="diagram-label" x="300.3" y="28" font-size="16" fill="#000000" text-anchor="middle">Na⁺</text><path d="M152.1 21L230.1 21" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M225.71208719054812 23.397127693021016L230.1 21L225.71208719054812 18.602872306978984" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="85.8" y="56" font-size="16" fill="#000000" text-anchor="middle">2,8,1</text><text class="diagram-label" x="300.3" y="56" font-size="16" fill="#000000" text-anchor="middle">2,8</text><text class="diagram-label" x="85.8" y="80" font-size="16" fill="#000000" text-anchor="middle">11 electrons</text><text class="diagram-label" x="300.3" y="80" font-size="16" fill="#000000" text-anchor="middle">10 electrons</text><text class="diagram-label" x="195.0" y="110" font-size="16" fill="#000000" text-anchor="middle">One electron lost; 11 protons remain</text></g></g><path class="section-divider" d="M18 304H408" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="327" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Full outer shells help explain the stability of noble gases.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,344,264" transform="translate(758 18)"><rect width="344" height="264" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="326" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Scattering conclusions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Most alpha particles pass → atom mostly</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">empty space.</text><path class="section-divider" d="M18 109H326" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Some deflect → nucleus is positive and</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">repels positive alpha particles.</text><path class="section-divider" d="M18 166H326" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Very few return → tiny, dense nucleus holds</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">most mass</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">contradicts spread-out positive charge.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,344,286" transform="translate(758 294)"><rect width="344" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="326" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Changing models</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Indivisible spheres → discovery of electron</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">→ plum pudding.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Scattering → nuclear model.</text><path class="section-divider" d="M18 131H326" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Bohr:</tspan> specific electron shells.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Later</tspan> <tspan font-weight="700">work:</tspan> protons.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Chadwick:</tspan> neutrons.</text><path class="section-divider" d="M18 210H326" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">New experimental evidence can replace a</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">scientific model.</text></g></g></svg>