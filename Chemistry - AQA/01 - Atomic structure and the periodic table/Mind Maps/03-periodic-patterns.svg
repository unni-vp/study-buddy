<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Periodic patterns</title><desc id="map-description">Modern &amp; historical tables: Modern order: atomic number. Groups link outer electrons and reactions periods link occupied shells. Mendeleev used mass/properties, left gaps and predicted missing elements. Discoveries supported predictions isotopes explain mass-order anomalies. Group 0: Full outer shell: 8 electrons except helium has 2. Very unreactive, monatomic gases. Boiling point increases with atomic mass down the group. Use the trend to predict values. Group 1: One outer electron → +1 ions. Li, Na K: water → hydroxide + H₂ oxygen → oxides chlorine → chlorides. 2Na + 2H₂O → 2NaOH + H₂. Alkaline solution reactions get more vigorous Li → Na → K. Down group: more distance/shielding → outer electron lost more easily → reactivity rises. Group 7: Seven outer electrons gain one → −1 ions. Diatomic Cl₂, Br₂, I₂. Metal halides ionic non-metal compounds covalent. Cl₂ green gas Br₂ red-brown liquid I₂ grey-black solid. Melting/boiling points rise down group. More distance/shielding → weaker attraction for incoming electron → reactivity falls. Halogen displacement: More reactive halogen displaces less reactive halogen from its aqueous salt. Cl₂ + 2KBr → 2KCl + Br₂. Ionic: Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂. Iodine cannot displace chlorine from chloride. Use group position to predict. Transition metals: Cr, Mn, Fe, Co, Ni, Cu: generally stronger/harder/denser, higher melting and less reactive than Group 1. Many have variable ion charges, coloured compounds and catalytic uses. Fe²⁺/Fe³⁺ blue copper sulfate iron/nickel catalysts. Trends have exceptions.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,342,251" transform="translate(18 18)"><rect width="342" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Modern &amp; historical tables</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Modern</tspan> <tspan font-weight="700">order:</tspan> <tspan font-weight="700">atomic</tspan> <tspan font-weight="700">number.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Groups link outer electrons and reactions</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">periods link occupied shells.</text><path class="section-divider" d="M18 131H324" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mendeleev used mass/properties, left gaps</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and predicted missing elements.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Discoveries supported predictions</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">isotopes explain mass-order anomalies.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,342,229" transform="translate(18 281)"><rect width="342" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Group 0</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Full</tspan> <tspan font-weight="700">outer</tspan> <tspan font-weight="700">shell:</tspan> 8 electrons except <tspan font-weight="700">helium</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">has</tspan> <tspan font-weight="700">2.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Very unreactive, monatomic gases.</text><path class="section-divider" d="M18 131H324" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Boiling point increases with atomic mass</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">down the group.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use the trend to predict values.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,366,330" transform="translate(372 18)"><rect width="366" height="330" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Group 1</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One outer electron → <tspan font-weight="700">+1</tspan> <tspan font-weight="700">ions.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Li,</tspan> <tspan font-weight="700">Na</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">K:</tspan> water → hydroxide + H₂</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oxygen → oxides</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">chlorine → chlorides.</text><path class="section-divider" d="M18 175H348" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2Na</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2H₂O</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">2NaOH</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">H₂.</tspan></text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Alkaline solution</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reactions get more vigorous Li → Na → K.</text><path class="section-divider" d="M18 254H348" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Down</tspan> <tspan font-weight="700">group:</tspan> more distance/shielding → outer</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electron lost more easily → reactivity rises.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,366,352" transform="translate(372 360)"><rect width="366" height="352" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Group 7</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Seven outer electrons</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gain one → <tspan font-weight="700">−1</tspan> <tspan font-weight="700">ions.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Diatomic Cl₂, Br₂, I₂.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metal halides ionic</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">non-metal compounds covalent.</text><path class="section-divider" d="M18 175H348" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cl₂ green gas</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Br₂ red-brown liquid</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">I₂ grey-black solid.</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Melting/boiling points rise down group.</text><path class="section-divider" d="M18 276H348" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More distance/shielding → weaker attraction</text><text class="body-text" x="18" y="321" font-size="16" fill="#000000" font-weight="400" text-anchor="start">for incoming electron → reactivity falls.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,242" transform="translate(750 18)"><rect width="352" height="242" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Halogen displacement</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More reactive halogen displaces less reactive</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">halogen from its aqueous salt.</text><path class="section-divider" d="M18 109H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cl₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2KBr</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">2KCl</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">Br₂.</tspan></text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ionic: Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂.</text><path class="section-divider" d="M18 166H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Iodine cannot displace chlorine from chloride.</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use group position to predict.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,308" transform="translate(750 272)"><rect width="352" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Transition metals</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cr,</tspan> <tspan font-weight="700">Mn,</tspan> <tspan font-weight="700">Fe,</tspan> <tspan font-weight="700">Co,</tspan> <tspan font-weight="700">Ni,</tspan> <tspan font-weight="700">Cu:</tspan> generally</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stronger/harder/denser, higher melting and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">less reactive than Group 1.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many have variable ion charges, coloured</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">compounds and catalytic uses.</text><path class="section-divider" d="M18 188H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fe²⁺/Fe³⁺</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">blue copper sulfate</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">iron/nickel catalysts.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Trends have exceptions.</text></g></g></svg>