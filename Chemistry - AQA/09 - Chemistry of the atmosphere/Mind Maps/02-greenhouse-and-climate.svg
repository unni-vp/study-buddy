nel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Evaluate evidence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Long records and broad coverage.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Reliable measurements and independent</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">studies.</text><path class="section-divider" d="M18 131H356" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Peer review checks methods/reasoning.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One local weather event is not a global trend.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,290,229" transform="translate(404 18)"><rect width="290" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Potential effects</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sea-level rise from warming</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">water/land ice.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rainfall/extreme-weather changes.</text><path class="section-divider" d="M18 131H272" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Habitat and species-range shifts.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Food production and water</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">availability affected.</text></g></g><g class="map-section" id="section-5" data-source-panel="5" data-bounds="0,0,290,301" transform="translate(404 259)"><rect width="290" height="301" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="64" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Uncertainty and</text><text class="panel-title" x="50" y="62" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">communication</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Models involve interacting</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">complex systems.</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Future emissions and local</text><text class="body-text" x="18" y="169" font-size="16" fill="#000000" font-weight="400" text-anchor="start">outcomes uncertain.</text><path class="section-divider" d="M18 181H272" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use all relevant data, not selected</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fragments.</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Uncertainty does not erase</text><text class="body-text" x="18" y="270" font-size="16" fill="#000000" font-weight="400" text-anchor="start">evidence for overall process.</text></g></g><g class="map-section" id="section-6" data-source-panel="0" data-bounds="0,0,396,475" transform="translate(706 18)"><rect width="396" height="475" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="378" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Essential radiation routes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Some infrared escapes, some is absorbed.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Distinguishes incoming short-wavelength radiation, outgoing infrared escape and absorption/re-emission by greenhouse gases, without depicting a reflecting solid blanket or implying all radiation is trapped.</title><text class="diagram-label" x="40" y="18" font-size="16" fill="#000000" text-anchor="middle">Sun</text><text class="diagram-label" x="180.0" y="18" font-size="16" fill="#000000" text-anchor="middle">Space</text><circle cx="40" cy="51" r="17" fill="#ffe1a0" stroke="#b95619"/><rect x="15" y="76" width="330" height="97" rx="10" fill="#dcecf5" fill-opacity=".6" stroke="#adc4d1" stroke-dasharray="5 4"/><path d="M15 227H345" stroke="#468133" stroke-width="5"/><path d="M57 65L100.80000000000001 223" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M97.31780040287863 219.41192447601674L100.80000000000001 223L101.93782097291353 218.13118459647544" stroke="#b95619" stroke-width="2" fill="none"/><path d="M180.0 220L180.0 36" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M182.39712769302102 40.38791280945186L180.0 36L177.60287230697898 40.38791280945186" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M270.0 220l-5 -13l10 -13l-10 -13l10 -13l-5 -13V141" fill="none" stroke="#b94b57" stroke-width="2"/><path d="M270.0 150L270.0 140" stroke="#b94b57" stroke-width="2.3" fill="none"/><path d="M272.397127693021 144.38791280945188L270.0 140L267.602872306979 144.38791280945188" stroke="#b94b57" stroke-width="2" fill="none"/><circle cx="270.0" cy="129" r="7" fill="#b94b57"/><path d="M280.8 142L334.8 222" stroke="#b94b57" stroke-width="2.3" fill="none"/><path d="M330.35822578304976 219.70421216014284L334.8 222L334.3319380029507 217.02195641170968" stroke="#b94b57" stroke-width="2" fill="none"/><path d="M280.8 118L331.2 88" stroke="#b94b57" stroke-width="2.3" fill="none"/><path d="M328.6555898702102 92.30418134973691L331.2 88L326.2034056206454 88.18451181046808" stroke="#b94b57" stroke-width="2" fill="none"/><text class="diagram-label" x="280.8" y="64" font-size="16" fill="#000000" text-anchor="middle">Re-emission</text><text class="diagram-label" x="20" y="201" font-size="16" fill="#000000" text-anchor="start">Surface</text><text class="diagram-label" x="180.0" y="258" font-size="16" fill="#000000" text-anchor="middle">Orange: incoming short-wave radiation</text><text class="diagram-label" x="180.0" y="285" font-size="16" fill="#000000" text-anchor="middle">Blue/red: outgoing long-wave infrared</text><text class="diagram-label" x="180.0" y="312" font-size="16" fill="#000000" text-anchor="middle">Some escapes, some is absorbed by gases</text><text class="diagram-label" x="180.0" y="339" font-size="16" fill="#000000" text-anchor="middle">Re-emission towards surface warms it</text></g></g></g></g></svg>