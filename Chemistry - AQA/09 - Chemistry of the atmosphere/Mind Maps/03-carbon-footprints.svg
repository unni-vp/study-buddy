"16" fill="#000000" font-weight="400" text-anchor="start">energy.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare complete systems.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,185" transform="translate(750 259)"><rect width="352" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Worked calculation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">40+10+80+5 = 135 kg CO₂e.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">25% of 80 use-stage kg =20 kg saved.</text><path class="section-divider" d="M18 109H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">New total =115 kg CO₂e.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Whole reduction =20/135 ×100 ≈14.8%.</text></g></g></svg>