<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Chemistry of the atmosphere</title><desc id="map-description">Current and early air: Today: mainly nitrogen, then oxygen. Early model: volcanic carbon dioxide, little oxygen. Cooling condenses water into oceans. Nitrogen accumulates over time. Changing carbon and oxygen: Photosynthesis removes CO₂ and releases O₂. Carbonates/limestone store carbon. Coal from vegetation oil/gas from marine biomass. Burning returns stored carbon rapidly. Greenhouse mechanism: Short-wave sunlight warms surface. Surface emits long-wave infrared. Gases absorb/re-emit some infrared. Natural effect supports life increased gases enhance it. Activities and climate: Fossil fuels/deforestation: CO₂. Cattle/rice/landfill: methane. Sea level, weather, habitats, food/water affected. Evaluate broad long-term peer-reviewed evidence. Full-life-cycle footprint: All greenhouse gases, not just use-stage CO₂. Materials, manufacture, transport, use, disposal. Efficiency, low-carbon energy, forests, methane capture. Compare cost, access and equivalent services. Combustion pollutants: CO/soot: incomplete burning. Sulfur impurities: SO₂. High-temperature air: NOx. Acid rain/respiratory harm from SO₂ and NOx. Particulates cause dimming and health problems.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,350,207" transform="translate(18 18)"><rect width="350" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Current and early air</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Today: mainly nitrogen, then oxygen.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Early model: volcanic carbon dioxide, little</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oxygen.</text><path class="secti