<svg xmlns="http://www.w3.org/2000/svg" width="650" height="351" viewBox="0 0 650 351" role="img" font-family="Segoe UI, Arial, sans-serif"><title>Distinguishes incoming short-wavelength radiation, outgoing infrared escape and absorption/re-emission by greenhouse gases, without depicting a reflecting solid blanket or implying all radiation is trapped.</title><rect width="100%" height="100%" fill="white"/><g class="concept-illustration"><title>Distinguishes incoming short-wavelength radiation, outgoing infrared escape and absorption/re-emission by greenhouse gases, without depicting a reflecting solid blanket or implying all radiation is trapped.</title><text class="diagram-label" x="40" y="18" font-size="16" fill="#000000" text-anchor="middle">Sun</text><text class="diagram-label" x="325.0" y="18" font-size="16" fill="#000000" text-anchor="middle">Space</text><circle cx="40" cy="51" r="17" fill="#ffe1a0" stroke="#b95619"/><rect x="15" y="76" width="620" height="97" rx="10" fill="#dcecf5" fill-opacity=".6" stroke="#adc4d1" stroke-dasharray="5 4"/><path d="M15 227H635" stroke="#468133" stroke-width="5"/><path d="M57 65L182.00000000000003 223" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M177.39758506640146 221.04608680361974L182.00000000000003 223L181.15746586040203 218.0714975678598" stroke="#b95619" stroke-width="2" fill="none"/><path d="M325.0 220L325.0 36" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M327.397127693021 40.38791280945186L325.0 36L322.602872306979 40.38791280945186" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M487.5 220l-5 -13l10 -13l-10 -13l10 -13l-5 -13V141" fill="none" stroke="#b94b57" stroke-width="2"/><path d="M487.5 150L487.5 140" stroke="#b94b57" stroke-width="2.3" fill="none"/><path d="M489.897127693021 144.38791280945188L487.5 140L485.102872306979 144.38791280945188" stroke="#b94b57" stroke-width="2" fill="none"/><circle cx="487.5" cy="129" r="7" fill="#b94b57"/><path d="M507.0 142L604.5 222" stroke="#b94b57" stroke-width="2.3" fill="none"/><path d="M599.5872835390167 221.06982959949082L604.5 222L602.62835937101 217.36351842924898" stroke="#b94b57" stroke-width="2" fill="none"/><path d="M507.0 118L598.0 88" stroke="#b94b57" stroke-width="2.3" fill="none"/><path d="M594.5832325460077 91.65043835249128L598.0 88L593.0821747105414 87.0972295849101" stroke="#b94b57" stroke-width="2" fill="none"/><text class="diagram-label" x="507.0" y="64" font-size="16" fill="#000000" text-anchor="middle">Re-emission</text><text class="diagram-label" x="20" y="201" font-size="16" fill="#000000" text-anchor="start">Surface</text><text class="diagram-label" x="325.0" y="258" font-size="16" fill="#000000" text-anchor="middle">Orange: incoming short-wave radiation</text><text class="diagram-label" x="325.0" y="285" font-size="16" fill="#000000" text-anchor="middle">Blue/red: outgoing long-wave infrared</text><text class="diagram-label" x="325.0" y="312" font-size="16" fill="#000000" text-anchor="middle">Some escapes, some is absorbed by gases</text><text class="diagram-label" x="325.0" y="339" font-size="16" fill="#000000" text-anchor="middle">Re-emission towards surface warms it</text></g></svg>