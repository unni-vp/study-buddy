<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Ionic &amp; covalent bonds</title><desc id="map-description">Electron transfer: Metal atoms lose electrons → positive ions. Non-metals gain → negative ions. Protons stay unchanged. Group 1/2: +1/+2 ions Group 7/6: −1/−2 ions. Electron arrangements match a noble gas. Charge &amp; formula: Balance total charges: Mg²⁺ + 2Cl⁻ → MgCl₂ 2Na⁺ + O²⁻ → Na₂O. Dot-and-cross ionic diagrams: brackets, ion charge and full outer shells distinguish electron origins. Ionic lattice: A giant, repeating 3D arrangement of opposite ions, with strong electrostatic attractions in all directions. Many attractions need much energy to overcome → high melting/boiling. Not separate molecules. Conductivity follows movement: Solid: ions held in fixed positions → cannot carry charge through it. Molten/dissolved: ions free to move → conducts. Electrons do not carry current through the ionic liquid. Covalent pairs: A single bond shares one pair double shares two triple shares three. H₂, Cl₂, HCl: one single bond. O₂: double. N₂: triple. H₂O: two single NH₃: three CH₄: four. Show lone pairs too: O has two in H₂O N has one in NH₃ Cl has three. Molecules &amp; models: Strong bonds inside a molecule weaker intermolecular forces between molecules. Boiling overcomes those forces. Bigger molecules generally have stronger intermolecular forces. No mobile ions/electrons → no conduction. 2D formulae omit 3D shape ball-and-stick bonds are not literal rods.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,330,251" transform="translate(18 18)"><rect width="330" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Electron transfer</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metal atoms lose electrons → positive</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ions.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Non-metals gain → negative ions.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Protons stay unchanged.</text><path class="section-divider" d="M18 153H312" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Group</tspan> <tspan font-weight="700">1/2:</tspan> +1/+2 ions</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Group</tspan> <tspan font-weight="700">7/6:</tspan> −1/−2 ions.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electron arrangements match a noble gas.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,330,229" transform="translate(18 281)"><rect width="330" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Charge &amp; formula</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Balance</tspan> <tspan font-weight="700">total</tspan> <tspan font-weight="700">charges:</tspan> Mg²⁺ + 2Cl⁻ →</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">MgCl₂</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">2Na⁺ + O²⁻ → Na₂O.</text><path class="section-divider" d="M18 131H312" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Dot-and-cross</tspan> <tspan font-weight="700">ionic</tspan> <tspan font-weight="700">diagrams:</tspan> brackets,</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ion charge and full outer shells</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">distinguish electron origins.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,380" transform="translate(360 18)"><rect width="350" height="380" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Ionic lattice</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A giant, repeating 3D arrangement of</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">opposite ions, with strong electrostatic</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">attractions in all directions.</text><path class="section-divider" d="M18 131H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many attractions need much energy to</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">overcome → high melting/boiling.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Not separate molecules.</text><g transform="translate(18 216)"><g class="concept-illustration"><title>Shows the repeating alternation of oppositely charged ions, rather than separate molecules.</title><circle cx="72.0" cy="18" r="14" fill="#e4eefb" stroke="#5c7287"/><text class="diagram-label" x="72.0" y="23" font-size="16" fill="#000000" text-anchor="middle">+</text><circle cx="106.0" cy="18" r="14" fill="#fff0dc" stroke="#5c7287"/><text class="diagram-label" x="106.0" y="23" font-size="16" fill="#000000" text-anchor="middle">−</text><circle cx="140.0" cy="18" r="14" fill="#e4eefb" stroke="#5c7287"/><text class="diagram-label" x="140.0" y="23" font-size="16" fill="#000000" text-anchor="middle">+</text><circle cx="174.0" cy="18" r="14" fill="#fff0dc" stroke="#5c7287"/><text class="diagram-label" x="174.0" y="23" font-size="16" fill="#000000" text-anchor="middle">−</text><circle cx="208.0" cy="18" r="14" fill="#e4eefb" stroke="#5c7287"/><text class="diagram-label" x="208.0" y="23" font-size="16" fill="#000000" text-anchor="middle">+</text><circle cx="242.0" cy="18" r="14" fill="#fff0dc" stroke="#5c7287"/><text class="diagram-label" x="242.0" y="23" font-size="16" fill="#000000" text-anchor="middle">−</text><circle cx="72.0" cy="52" r="14" fill="#fff0dc" stroke="#5c7287"/><text class="diagram-label" x="72.0" y="57" font-size="16" fill="#000000" text-anchor="middle">−</text><circle cx="106.0" cy="52" r="14" fill="#e4eefb" stroke="#5c7287"/><text class="diagram-label" x="106.0" y="57" font-size="16" fill="#000000" text-anchor="middle">+</text><circle cx="140.0" cy="52" r="14" fill="#fff0dc" stroke="#5c7287"/><text class="diagram-label" x="140.0" y="57" font-size="16" fill="#000000" text-anchor="middle">−</text><circle cx="174.0" cy="52" r="14" fill="#e4eefb" stroke="#5c7287"/><text class="diagram-label" x="174.0" y="57" font-size="16" fill="#000000" text-anchor="middle">+</text><circle cx="208.0" cy="52" r="14" fill="#fff0dc" stroke="#5c7287"/><text class="diagram-label" x="208.0" y="57" font-size="16" fill="#000000" text-anchor="middle">−</text><circle cx="242.0" cy="52" r="14" fill="#e4eefb" stroke="#5c7287"/><text class="diagram-label" x="242.0" y="57" font-size="16" fill="#000000" text-anchor="middle">+</text><circle cx="72.0" cy="86" r="14" fill="#e4eefb" stroke="#5c7287"/><text class="diagram-label" x="72.0" y="91" font-size="16" fill="#000000" text-anchor="middle">+</text><circle cx="106.0" cy="86" r="14" fill="#fff0dc" stroke="#5c7287"/><text class="diagram-label" x="106.0" y="91" font-size="16" fill="#000000" text-anchor="middle">−</text><circle cx="140.0" cy="86" r="14" fill="#e4eefb" stroke="#5c7287"/><text class="diagram-label" x="140.0" y="91" font-size="16" fill="#000000" text-anchor="middle">+</text><circle cx="174.0" cy="86" r="14" fill="#fff0dc" stroke="#5c7287"/><text class="diagram-label" x="174.0" y="91" font-size="16" fill="#000000" text-anchor="middle">−</text><circle cx="208.0" cy="86" r="14" fill="#e4eefb" stroke="#5c7287"/><text class="diagram-label" x="208.0" y="91" font-size="16" fill="#000000" text-anchor="middle">+</text><circle cx="242.0" cy="86" r="14" fill="#fff0dc" stroke="#5c7287"/><text class="diagram-label" x="242.0" y="91" font-size="16" fill="#000000" text-anchor="middle">−</text><text class="diagram-label" x="157.0" y="123" font-size="16" fill="#000000" text-anchor="middle">2D slice of a repeating 3D lattice</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,257" transform="translate(360 410)"><rect width="350" height="257" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="64" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Conductivity follows</text><text class="panel-title" x="50" y="62" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">movement</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Solid:</tspan> ions held in fixed positions → cannot</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">carry charge through it.</text><path class="section-divider" d="M18 137H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="160" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Molten/dissolved:</tspan> ions free to move →</text><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conducts.</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electrons do not carry current through the</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ionic liquid.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,380,374" transform="translate(722 18)"><rect width="380" height="374" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="362" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Covalent pairs</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A single bond shares one pair</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">double shares two</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">triple shares three.</text><path class="section-divider" d="M18 131H362" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">H₂,</tspan> <tspan font-weight="700">Cl₂,</tspan> <tspan font-weight="700">HCl:</tspan> one single bond.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">O₂:</tspan> double.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">N₂:</tspan> triple.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">H₂O:</tspan> two single</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">NH₃:</tspan> three</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">CH₄:</tspan> four.</text><path class="section-divider" d="M18 276H362" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Show</tspan> <tspan font-weight="700">lone</tspan> <tspan font-weight="700">pairs</tspan> <tspan font-weight="700">too:</tspan> O has two in H₂O</text><text class="body-text" x="18" y="321" font-size="16" fill="#000000" font-weight="400" text-anchor="start">N has one in NH₃</text><text class="body-text" x="18" y="343" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cl has three.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,380,286" transform="translate(722 404)"><rect width="380" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="362" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Molecules &amp; models</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Strong bonds inside a molecule</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">weaker intermolecular forces between molecules.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Boiling overcomes those forces.</text><path class="section-divider" d="M18 131H362" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bigger molecules generally have stronger</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">intermolecular forces.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No mobile ions/electrons → no conduction.</text><path class="section-divider" d="M18 210H362" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">2D formulae omit 3D shape</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ball-and-stick bonds are not literal rods.</text></g></g></svg>