<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Carbon &amp; nanoparticles</title><desc id="map-description">Diamond: Each carbon bonds to four others in a rigid giant covalent network. Many strong bonds → very hard, high melting. No delocalised electrons or moving ions → does not conduct electricity. Useful for cutting. Graphite &amp; graphene: Graphite: each carbon bonds to three others in hexagonal layers. One electron per carbon is delocalised → conducts. Weak forces between layers → slide → lubricant. Strong bonds within layers → high melting. Graphene: a single layer very strong and conducting useful in composites/electronics. Fullerenes &amp; nanotubes: Fullerenes are hollow carbon cages/tubes, based on hexagonal rings some also have five- or seven-sided rings. C₆₀ is a cage. Large surface area: catalysts. Hollow cages: drug delivery. Cylindrical nanotubes: high tensile strength and conductivity → composites/electronics. Size classes: Nanoparticles: 1–100 nm. Fine particles: 100–2,500 nm. Coarse particles: 2,500–10,000 nm. 1 nm = 10⁻⁹ m. Smaller size increases surface area compared with volume properties may differ from bulk material. Calculate the ratio: Cube of side x: area = 6x² volume = x³ SA/V = 6/x. Use the same length units. Side 10 nm → SA/V 0.6 nm⁻¹ side 5 nm → 1.2 nm⁻¹. Halving size doubles the ratio. More exposed surface per amount → less catalyst/coating may be needed. Benefits &amp; risks: Uses: catalysts, medicine, electronics, sunscreen and antibacterial coatings. Link each use to a useful property. Small particles may enter the body effects depend on material, dose and exposure route. Compare benefit with toxicity/environmental evidence and uncertainties do not assume all nanoparticles are safe or harmful.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,390,223" transform="translate(18 18)"><rect width="390" height="223" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="372" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Diamond</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Each carbon bonds to four others in a rigid giant</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">covalent network.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many strong bonds → very hard, high melting.</text><path class="section-divider" d="M18 131H372" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No delocalised electrons or moving ions → does</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">not conduct electricity.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Useful for cutting.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,390,496" transform="translate(18 253)"><rect width="390" height="496" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="372" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Graphite &amp; graphene</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Graphite:</tspan> each carbon bonds to three others in</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hexagonal layers.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One electron per carbon is delocalised → conducts.</text><path class="section-divider" d="M18 131H372" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Weak forces between layers → slide → lubricant.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Strong bonds within layers → high melting.</text><path class="section-divider" d="M18 188H372" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Graphene:</tspan> a single layer</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">very strong and conducting</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">useful in composites/electronics.</text><g transform="translate(18 273)"><g class="concept-illustration"><title>Distinguishes bonds within carbon sheets from weak forces between them.</title><polygon points="156.21539030917347,39.0 135.43078061834694,51.0 114.64617092752042,39.00000000000001 114.64617092752042,15.000000000000007 135.43078061834694,3.0 156.21539030917347,14.99999999999999" fill="none" stroke="#468133" stroke-width="2"/><polygon points="197.78460969082653,39.0 177.0,51.0 156.21539030917347,39.00000000000001 156.21539030917347,15.000000000000007 177.0,3.0 197.78460969082653,14.99999999999999" fill="none" stroke="#468133" stroke-width="2"/><polygon points="239.35382907247958,39.0 218.56921938165306,51.0 197.78460969082653,39.00000000000001 197.78460969082653,15.000000000000007 218.56921938165306,3.0 239.35382907247958,14.99999999999999" fill="none" stroke="#468133" stroke-width="2"/><polygon points="156.21539030917347,104.0 135.43078061834694,116.0 114.64617092752042,104.0 114.64617092752042,80.0 135.43078061834694,68.0 156.21539030917347,79.99999999999999" fill="none" stroke="#468133" stroke-width="2"/><polygon points="197.78460969082653,104.0 177.0,116.0 156.21539030917347,104.0 156.21539030917347,80.0 177.0,68.0 197.78460969082653,79.99999999999999" fill="none" stroke="#468133" stroke-width="2"/><polygon points="239.35382907247958,104.0 218.56921938165306,116.0 197.78460969082653,104.0 197.78460969082653,80.0 218.56921938165306,68.0 239.35382907247958,79.99999999999999" fill="none" stroke="#468133" stroke-width="2"/><path d="M177.0 51V68M135.0 51V68M219.0 51V68" stroke="#468133" stroke-dasharray="3 4" fill="none"/><path d="M322 53L345 53" stroke="#468133" stroke-width="2.3" fill="none"/><path d="M340.61208719054815 55.39712769302101L345 53L340.61208719054815 50.60287230697899" stroke="#468133" stroke-width="2" fill="none"/><text class="diagram-label" x="177.0" y="140" font-size="16" fill="#000000" text-anchor="middle">Strong bonds within each layer</text><text class="diagram-label" x="177.0" y="164" font-size="16" fill="#000000" text-anchor="middle">Dashed: weak forces between layers</text><text class="diagram-label" x="177.0" y="188" font-size="16" fill="#000000" text-anchor="middle">Fragment: network continues</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,318,317" transform="translate(420 18)"><rect width="318" height="317" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="300" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Fullerenes &amp; nanotubes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fullerenes are hollow carbon</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cages/tubes, based on hexagonal rings</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">some also have five- or seven-sided</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">rings.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">C₆₀ is a cage.</text><path class="section-divider" d="M18 175H300" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Large</tspan> <tspan font-weight="700">surface</tspan> <tspan font-weight="700">area:</tspan> catalysts.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Hollow</tspan> <tspan font-weight="700">cages:</tspan> drug delivery.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cylindrical</tspan> <tspan font-weight="700">nanotubes:</tspan> high tensile</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">strength and conductivity →</text><text class="body-text" x="18" y="286" font-size="16" fill="#000000" font-weight="400" text-anchor="start">composites/electronics.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,318,251" transform="translate(420 347)"><rect width="318" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="300" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Size classes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Nanoparticles:</tspan> <tspan font-weight="700">1–100</tspan> <tspan font-weight="700">nm.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fine</tspan> <tspan font-weight="700">particles:</tspan> 100–2,500 nm.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Coarse</tspan> <tspan font-weight="700">particles:</tspan> 2,500–10,000 nm.</text><path class="section-divider" d="M18 131H300" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1 nm = 10⁻⁹ m.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Smaller size increases surface area</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">compared with volume</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">properties may differ from bulk material.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,308" transform="translate(750 18)"><rect width="352" height="308" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Calculate the ratio</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cube</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">side</tspan> <tspan font-weight="700">x:</tspan> area = 6x²</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">volume = x³</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">SA/V</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">6/x.</tspan></text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use the same length units.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Side 10 nm → SA/V 0.6 nm⁻¹</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">side 5 nm → 1.2 nm⁻¹.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Halving size doubles the ratio.</text><path class="section-divider" d="M18 232H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More exposed surface per amount → less</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">catalyst/coating may be needed.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,330" transform="translate(750 338)"><rect width="352" height="330" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Benefits &amp; risks</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Uses:</tspan> catalysts, medicine, electronics,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sunscreen and antibacterial coatings.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Link each use to a useful property.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Small particles may enter the body</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">effects depend on material, dose and</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">exposure route.</text><path class="section-divider" d="M18 210H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare benefit with toxicity/environmental</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">evidence and uncertainties</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">do not assume all nanoparticles are safe or</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">harmful.</text></g></g></svg>