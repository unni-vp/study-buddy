<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Structures &amp; states</title><desc id="map-description">Solid → liquid → gas: Solid: fixed arrangement, vibration. Liquid: close particles move past one another. Gas: widely spaced, rapid random motion. Melting/freezing boiling/condensing. Heating transfers energy changes of state are physical. Read melting &amp; boiling data: Below melting point → solid. Between melting and boiling → liquid. Above boiling → gas. State symbols: (s), (l), (g), (aq). Aqueous means dissolved in water. Particles are not hard identical spheres: models omit forces, size differences and continuous movement. Metals conduct &amp; bend: Strong attraction between positive ions and delocalised electrons → giant metallic structure. Electrons move and carry charge and transfer energy. Metal layers slide while metallic bonding remains. Alloys resist bending: An alloy mixes a metal with other elements. Different-sized atoms distort regular layers. Layers slide less easily → alloy is harder. Use a labelled particle drawing to explain, not just “stronger”. Polymer chains: Many atoms joined by strong covalent bonds in long molecules. Forces act between chains. Intermolecular forces are usually sufficient for polymers to be solid at room temperature. A repeating unit in brackets with n represents many linked units. Recognise giant structures: Diamond, graphite and silicon dioxide are giant covalent. Many strong bonds need much energy to break → high melting. Contrast small molecules: melting/boiling does not break their internal covalent bonds. Use diagrams, formulae and melting/conductivity data together to identify structure.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,338,273" transform="translate(18 18)"><rect width="338" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="320" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Solid → liquid → gas</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Solid:</tspan> fixed arrangement, vibration.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Liquid:</tspan> close particles move past one</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">another.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gas:</tspan> widely spaced, rapid random motion.</text><path class="section-divider" d="M18 153H320" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Melting/freezing</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">boiling/condensing.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heating transfers energy</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">changes of state are physical.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,338,314" transform="translate(18 303)"><rect width="338" height="314" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="320" height="64" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Read melting &amp; boiling</text><text class="panel-title" x="50" y="62" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">data</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Below melting point → solid.</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Between melting and boiling → liquid.</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Above boiling → gas.</text><path class="section-divider" d="M18 159H320" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">State</tspan> <tspan font-weight="700">symbols:</tspan> (s), (l), (g), (aq).</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Aqueous means dissolved in water.</text><path class="section-divider" d="M18 216H320" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="239" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Particles</tspan> <tspan font-weight="700">are</tspan> <tspan font-weight="700">not</tspan> <tspan font-weight="700">hard</tspan> <tspan font-weight="700">identical</tspan> <tspan font-weight="700">spheres:</tspan></text><text class="body-text" x="18" y="261" font-size="16" fill="#000000" font-weight="400" text-anchor="start">models omit forces, size differences and</text><text class="body-text" x="18" y="283" font-size="16" fill="#000000" font-weight="400" text-anchor="start">continuous movement.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,366,229" transform="translate(368 18)"><rect width="366" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Metals conduct &amp; bend</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Strong attraction between positive ions and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">delocalised electrons → giant metallic structure.</text><path class="section-divider" d="M18 109H348" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electrons move and carry charge and transfer</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">energy.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metal layers slide while metallic bonding</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">remains.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,366,363" transform="translate(368 259)"><rect width="366" height="363" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Alloys resist bending</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">An alloy mixes a metal with other elements.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Different-sized atoms distort regular layers.</text><path class="section-divider" d="M18 109H348" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Layers slide less easily → alloy is harder.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use a labelled particle drawing to explain, not</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">just “stronger”.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Compares regular metal layers with layers distorted by different-sized atoms.</title><text class="diagram-label" x="82.5" y="16" font-size="16" fill="#000000" text-anchor="middle">Pure metal</text><text class="diagram-label" x="247.5" y="16" font-size="16" fill="#000000" text-anchor="middle">Alloy</text><circle cx="42.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="69.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="96.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="123.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="42.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="69.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="96.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="123.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="207.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="234.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="261.0" cy="39" r="13" fill="#edccb0" stroke="#b95619"/><circle cx="288.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="213.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="240.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="267.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="294.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><text class="diagram-label" x="165.0" y="104" font-size="16" fill="#000000" text-anchor="middle">Different-sized atoms disrupt layers</text><text class="diagram-label" x="165.0" y="128" font-size="16" fill="#000000" text-anchor="middle">Layers slide less easily in an alloy</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,356,264" transform="translate(746 18)"><rect width="356" height="264" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="338" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Polymer chains</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many atoms joined by strong covalent bonds</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">in long molecules.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Forces act between chains.</text><path class="section-divider" d="M18 131H338" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Intermolecular forces are usually sufficient for</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">polymers to be solid at room temperature.</text><path class="section-divider" d="M18 188H338" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A repeating unit in brackets with n represents</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">many linked units.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,356,308" transform="translate(746 294)"><rect width="356" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="338" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Recognise giant structures</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Diamond, graphite and silicon dioxide are</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">giant covalent.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many strong bonds need much energy to</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">break → high melting.</text><path class="section-divider" d="M18 153H338" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Contrast</tspan> <tspan font-weight="700">small</tspan> <tspan font-weight="700">molecules:</tspan> melting/boiling</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">does not break their internal covalent bonds.</text><path class="section-divider" d="M18 210H338" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use diagrams, formulae and</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">melting/conductivity data together to identify</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">structure.</text></g></g></svg>