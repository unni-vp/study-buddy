<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Bonding &amp; properties</title><desc id="map-description">Three strong bonds: Ionic: attraction between opposite ions after electron transfer. Covalent: shared electron pairs attract both nuclei. Metallic: positive ions attract delocalised electrons. Identify the charged particles in explanations. Structure decides properties: Ionic lattices: high melting conduct only molten or dissolved, when ions move. Small molecules: low melting/boiling weak forces between molecules. No mobile charged particles. Giant covalent: many strong bonds → high melting. States &amp; models: Solid: particles vibrate in fixed positions. Liquid: close particles move past each other. Gas: particles far apart, moving randomly. At a change of state, energy changes attractions/spacing, not particle identity. Model drawings simplify size, forces and movement. Metals &amp; polymers: Metals conduct through mobile delocalised electrons layers can slide. Different-sized alloy atoms hinder sliding. Polymers: long molecules, strong bonds along each chain, forces between chains most are solid at room temperature. Carbon structures: Diamond: four bonds per carbon, rigid and hard, no free electrons. Graphite: three bonds weak forces between layers let them slide. Graphene: one strong, conducting layer. Fullerenes: hollow cages nanotubes: strong conducting cylinders. Nanoparticles: 1–100 nm: large surface area : volume ratio. Small amounts can be effective catalysts or coatings. Uses include medicine, electronics, sunscreen and antibacterial surfaces. Properties differ from bulk material assess exposure and uncertain risks.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,406,337" transform="translate(18 18)"><rect width="406" height="337" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="388" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Three strong bonds</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ionic:</tspan> attraction between opposite ions after electron</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">transfer.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Covalent:</tspan> shared electron pairs attract both nuclei.</text><path class="section-divider" d="M18 131H388" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Metallic:</tspan> positive ions attract delocalised electrons.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Identify the charged particles in explanations.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Shows the shared pair and the origins of electrons in a covalent bond.</title><text class="diagram-label" x="130.0" y="34" font-size="16" fill="#000000" text-anchor="middle">H</text><text class="diagram-label" x="240.0" y="34" font-size="16" fill="#000000" text-anchor="middle">H</text><ellipse cx="159.0" cy="28" rx="46" ry="26" fill="none" stroke="#2366a0"/><ellipse cx="211.0" cy="28" rx="46" ry="26" fill="none" stroke="#b95619"/><circle cx="178.0" cy="28" r="4" fill="#2366a0"/><path d="M188.0 24l8 8m0-8-8 8" stroke="#b95619" stroke-width="2"/><text class="diagram-label" x="185.0" y="78" font-size="16" fill="#000000" text-anchor="middle">H₂: one shared electron pair</text><text class="diagram-label" x="185.0" y="102" font-size="16" fill="#000000" text-anchor="middle">Dot and cross: electron origins</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,406,242" transform="translate(18 367)"><rect width="406" height="242" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="388" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Structure decides properties</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ionic</tspan> <tspan font-weight="700">lattices:</tspan> high melting</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conduct only molten or dissolved, when ions move.</text><path class="section-divider" d="M18 109H388" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Small</tspan> <tspan font-weight="700">molecules:</tspan> low melting/boiling</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">weak forces between molecules.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No mobile charged particles.</text><path class="section-divider" d="M18 188H388" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Giant</tspan> <tspan font-weight="700">covalent:</tspan> many strong bonds → high melting.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,322,295" transform="translate(436 18)"><rect width="322" height="295" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">States &amp; models</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Solid:</tspan> particles vibrate in fixed positions.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Liquid:</tspan> close particles move past each</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">other.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gas:</tspan> particles far apart, moving</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">randomly.</text><path class="section-divider" d="M18 175H304" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">At a change of state, energy changes</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">attractions/spacing, not particle identity.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Model drawings simplify size, forces and</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">movement.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,322,273" transform="translate(436 325)"><rect width="322" height="273" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Metals &amp; polymers</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metals conduct through mobile</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">delocalised electrons</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">layers can slide.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Different-sized alloy atoms hinder</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sliding.</text><path class="section-divider" d="M18 175H304" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Polymers:</tspan> long molecules, strong bonds</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">along each chain, forces between chains</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">most are solid at room temperature.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,332,251" transform="translate(770 18)"><rect width="332" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="314" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Carbon structures</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Diamond:</tspan> four bonds per carbon, rigid</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and hard, no free electrons.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Graphite:</tspan> three bonds</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">weak forces between layers let them slide.</text><path class="section-divider" d="M18 153H314" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Graphene:</tspan> one strong, conducting layer.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fullerenes:</tspan> hollow cages</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">nanotubes:</tspan> strong conducting cylinders.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,332,273" transform="translate(770 281)"><rect width="332" height="273" rx="16" fill="white" 