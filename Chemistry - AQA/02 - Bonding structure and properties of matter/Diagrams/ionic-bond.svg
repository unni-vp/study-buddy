<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="title"><title id="title">Na plus and Cl minus, showing seven original and one transferred chloride outer electrons</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="420" fill="white"/><text x="500" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="26" text-anchor="middle" fill="#18344a">Sodium chloride: opposite ions attract</text><text x="250" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="40" text-anchor="middle" fill="#18344a">[ Na ]⁺</text><text x="700" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="34" text-anchor="middle" fill="#18344a">Cl</text><path d="M625 65H610V250H625M775 65H790V250H775" fill="none" stroke="#2166ad" stroke-width="3"/><text x="806" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="28" text-anchor="start" fill="#18344a">−</text><circle cx="680" cy="90" r="6" fill="#2166ad"/><circle cx="720" cy="90" r="6" fill="#2166ad"/><circle cx="650" cy="140" r="6" fill="#2166ad"/><circle cx="650" cy="170" r="6" fill="#2166ad"/><circle cx="680" cy="225" r="6" fill="#2166ad"/><circle cx="720" cy="225" r="6" fill="#2166ad"/><circle cx="750" cy="140" r="6" fill="#2166ad"/><path d="M744 164L756 176M756 164L744 176" stroke="#b46f27" stroke-width="3"/><text x="250" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">2,8 electrons</text><text x="700" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">2,8,8 electrons</text><text x="500" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">● chlorine electron     × electron transferred from sodium</text><text x="500" y="387" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Only the chloride outer shell is drawn; ions form a giant lattice.</text></svg>