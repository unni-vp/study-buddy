<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Using resources</title><desc id="map-description">Sustainable use: Meet present needs without limiting future needs. Finite ores/fuels versus managed renewable resources. Agricultural/synthetic products supplement natural ones. Read data scale, resource and energy impacts. Water: Potable safe, not chemically pure. Freshwater: filter and sterilise. Saltwater: distillation/reverse osmosis. Wastewater: screening, settling, biological treatment. Recovery and LCA: Plants/bacteria recover metal compounds. Copper recovered by displacement/electrolysis. LCA includes all stages and transport. Reduce, reuse, recycle with realistic comparisons. Materials and protection: Iron rust needs water and oxygen. Barriers and more-reactive sacrificial metal. Alloy composition changes properties. Ceramics/polymers/composites selected by use. Haber conditions: N₂+3H₂ ⇌2NH₃, exothermic forward. Air/natural gas supply nitrogen/hydrogen. Iron, about 450°C and 200 atm. Cool/remove ammonia, recycle unused gases. Fertiliser supply: NPK supplies compounds of N, P and K. Ammonia makes salts/nitric acid. Mined potassium salts and treated phosphate rock. Industrial integrated manufacture differs from lab scale.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerH