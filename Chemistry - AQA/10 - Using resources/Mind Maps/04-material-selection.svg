<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Glass, ceramics, polymers and composites</title><desc id="map-description">Glass and clay: Soda-lime: sand, sodium carbonate, limestone. Borosilicate: sand/boron trioxide, heat-resistant. Clay ceramics: shape wet clay, furnace heat. Hard/durable but often brittle. LDPE and HDPE: Both use ethene monomers. Different conditions/catalysts change branching. LDPE branches pack less closely. HDPE closer packing gives higher density/rigidity. Heating and chain structure: Covalent cross-links versus separate chains. Thermal behaviour: Thermosoftening: chains move when attractions overcome. Thermosetting: cross-links prevent melting. Very strong heat can decompose material. Do not confuse weak attractions with backbone bonds. Composites: Matrix/binder holds reinforcement. Fibres/fragments supply useful properties. Fibreglass, carbon-fibre, reinforced concrete. Combined functions suit specialised uses. Select from data: Compare strength, density and temperature limits. Consider corrosion, cost and lifetime. Use equivalent functions, not arbitrary sample masses. Link each needed property to the application.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,251" transform="translate(18 18)"><rect width="290" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Glass and clay</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Soda-lime: sand, sodium</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">carbonate, limestone.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Borosilicate: sand/boron trioxide,</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">heat-resistant.</text><path class="section-divider" d="M18 153H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Clay ceramics: shape wet clay,</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">furnace heat.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Hard/durable but often brittle.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,229" transform="translate(18 281)"><rect width="290" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">LDPE and HDPE</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Both use ethene monomers.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Different conditions/catalysts</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">change branching.</text><path class="section-divider" d="M18 131H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">LDPE branches pack less closely.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">HDPE closer packing gives higher</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">density/rigidity.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,426,338" transform="translate(320 18)"><rect width="426" height="338" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="408" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Heating and chain structure</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Covalent cross-links versus separate chains.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Compares separate polymer chains with covalent cross-links, explaining why heating permits thermosoftening movement but not thermosetting melting.</title><text class="diagram-label" x="91.5" y="16" font-size="16" fill="#000000" text-anchor="middle">Thermosoftening</text><path d="M12.0 57Q54.9 47 91.5 57T171.0 57" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M12.0 94Q54.9 84 91.5 94T171.0 94" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M12.0 131Q54.9 121 91.5 131T171.0 131" fill="none" stroke="#2366a0" stroke-width="3"/><text class="diagram-label" x="298.5" y="16" font-size="16" fill="#000000" text-anchor="middle">Thermosetting</text><path d="M219.0 57Q261.9 47 298.5 57T378.0 57" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M219.0 94Q261.9 84 298.5 94T378.0 94" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M219.0 131Q261.9 121 298.5 131T378.0 131" fill="none" stroke="#2366a0" stroke-width="3"/><path d="M261.9 57V131" stroke="#b95619" stroke-width="3"/><path d="M335.1 57V131" stroke="#b95619" stroke-width="3"/><text class="diagram-label" x="195.0" y="174" font-size="16" fill="#000000" text-anchor="middle">Right: covalent links join the chains</text><text class="diagram-label" x="195.0" y="202" font-size="16" fill="#000000" text-anchor="middle">Left: separate chains can move on heating</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,426,207" transform="translate(320 368)"><rect width="426" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="408" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Thermal behaviour</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Thermosoftening: chains move when attractions</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">overcome.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Thermosetting: cross-links prevent melting.</text><path class="section-divider" d="M18 131H408" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Very strong heat can decompose material.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not confuse weak attractions with backbone bonds.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,344,207" transform="translate(758 18)"><rect width="344" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="326" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Composites</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Matrix/binder holds reinforcement.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fibres/fragments supply useful properties.</text><path class="section-divider" d="M18 109H326" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fibreglass, carbon-fibre, reinforced</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">concrete.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Combined functions suit specialised uses.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,344,251" transform="translate(758 237)"><rect width="344" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="326" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Select from data</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare strength, density and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">temperature limits.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Consider corrosion, cost and lifetime.</text><path class="section-divider" d="M18 131H326" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use equivalent functions, not arbitrary</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sample masses.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Link each needed property to the</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">application.</text></g></g></svg>