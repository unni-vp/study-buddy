<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Corrosion, protection and alloys</title><desc id="map-description">Rust conditions: Iron needs oxygen and water. Compare wet air, dry air, boiled water under oil. Same clean nails, time and temperature. Excluded factor must remain excluded. Barrier protection: Paint, grease and electroplating block access. Scratches can expose underlying metal. Aluminium oxide forms protective layer. Less-reactive coatings do not sacrifice themselves. Sacrificial metal: More-reactive metal oxidises preferentially. Zinc galvanises iron. Barrier plus sacrificial action protects some scratches. Enough connected zinc must remain. Alloy layers: Different-sized atoms disrupt sliding. Named compositions: Bronze: copper/tin. Brass: copper/zinc. Gold jewellery often alloyed for hardness. 18 carat =18/24 =75% gold. Steels: iron with carbon/other elements. Uses and properties: High-carbon steel: hard/strong, brittle tools. Low-carbon: easier shaping, car panels. Stainless: corrosion-resistant cutlery. Aluminium alloy: low-density aircraft structures.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,207" transform="translate(18 18)"><rect width="354" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Rust conditions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Iron needs oxygen and water.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare wet air, dry air, boiled water under</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oil.</text><path class="section-divider" d="M18 131H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same clean nails, time and temperature.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Excluded factor must remain excluded.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,229" transform="translate(18 237)"><rect width="354" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Barrier protection</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Paint, grease and electroplating block</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">access.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Scratches can expose underlying metal.</text><path class="section-divider" d="M18 131H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Aluminium oxide forms protective layer.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Less-reactive coatings do not sacrifice</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">themselves.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,207" transform="translate(384 18)"><rect width="354" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Sacrificial metal</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More-reactive metal oxidises preferentially.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Zinc galvanises iron.</text><path class="section-divider" d="M18 109H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Barrier plus sacrificial action protects some</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">scratches.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Enough connected zinc must remain.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,262" transform="translate(384 237)"><rect width="354" height="262" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Alloy layers</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Different-sized atoms disrupt sliding.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Compares regular metal layers with layers distorted by different-sized atoms.</title><text class="diagram-label" x="79.5" y="16" font-size="16" fill="#000000" text-anchor="middle">Pure metal</text><text class="diagram-label" x="238.5" y="16" font-size="16" fill="#000000" text-anchor="middle">Alloy</text><circle cx="39.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="66.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="93.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="120.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="39.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="66.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="93.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="120.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="198.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="225.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="252.0" cy="39" r="13" fill="#edccb0" stroke="#b95619"/><circle cx="279.0" cy="39" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="204.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="231.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="258.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><circle cx="285.0" cy="67" r="9" fill="#dceaf7" stroke="#2366a0"/><text class="diagram-label" x="159.0" y="104" font-size="16" fill="#000000" text-anchor="middle">Different-sized atoms disrupt layers</text><text class="diagram-label" x="159.0" y="128" font-size="16" fill="#000000" text-anchor="middle">Layers slide less easily in an alloy</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,207" transform="translate(750 18)"><rect width="352" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Named compositions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bronze: copper/tin.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Brass: copper/zinc.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gold jewellery often alloyed for hardness.</text><path class="section-divider" d="M18 131H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">18 carat =18/24 =75% gold.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Steels: iron with carbon/other elements.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,207" transform="translate(750 237)"><rect width="352" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Uses and properties</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">High-carbon steel: hard/strong, brittle tools.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Low-carbon: easier shaping, car panels.</text><path class="section-divider" d="M18 109H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Stainless: corrosion-resistant cutlery.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Aluminium alloy: low-density aircraft</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">structures.</text></g></g></svg>