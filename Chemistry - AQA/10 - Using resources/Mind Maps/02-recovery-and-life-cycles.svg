xt" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mass.</text><path class="section-divider" d="M18 131H370" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Durability and actual reuse count affect outcome.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Avoid universal “best” claims without evidence.</text></g></g></svg>