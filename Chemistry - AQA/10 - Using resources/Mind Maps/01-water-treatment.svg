<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Potable water, wastewater and analysis</title><desc id="map-description">Potable versus pure: Safe levels of microbes and dissolved substances. Potable water usually contains dissolved salts. Source quality determines treatment. Clear water or normal pH alone is not proof of safety. Freshwater: Suitable source, then filter beds. Filtration removes suspended solids. Chlorine/ozone/UV kills microorganisms. Filtering alone does not remove all dissolved salts. Desalination: Distillation: evaporate then condense water. Reverse osmosis: pressure drives membrane separation. Salt retained or concentrated separately. Compare high energy demand and local resources. Wastewater: Screening and grit removal. Sedimentation: sludge and effluent. Sludge anaerobic digestion effluent aerobic treatment. Industrial chemicals may need extra removal. Water practical: pH indicator or calibrated probe. Known volume evaporated in weighed basin. Cool/reweigh: residue mass by subtraction. Distil another portion and compare samples. Reliability and safety: Same volumes or compare concentration. Small masses limited by balance resolution. Safe heating/eye protection open receiver. Do not distil dry or taste samples.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4"