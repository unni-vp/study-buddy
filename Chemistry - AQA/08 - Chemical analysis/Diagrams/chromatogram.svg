<svg xmlns="http://www.w3.org/2000/svg" width="580" height="333" viewBox="0 0 580 333" role="img" font-family="Segoe UI, Arial, sans-serif"><title>Shows separated reference/sample spots with a distinct common baseline and solvent front; the dimensionless Rf is calculated from two distances measured from that baseline.</title><rect width="100%" height="100%" fill="white"/><g class="concept-illustration"><title>Shows separated reference/sample spots with a distinct common baseline and solvent front; the dimensionless Rf is calculated from two distances measured from that baseline.</title><text class="diagram-label" x="290.0" y="16" font-size="16" fill="#000000" text-anchor="middle">Solvent front: dashed line</text><rect x="22" y="34" width="536" height="180" fill="#f7f9f6" stroke="#a7b8ae"/><path d="M22 55H558" stroke="#2366a0" stroke-dasharray="5 4"/><path d="M22 185H558" stroke="#666"/><circle cx="116.0" cy="107" r="7" fill="#2366a0"/><circle cx="290.0" cy="143" r="7" fill="#b95619"/><circle cx="464.0" cy="107" r="7" fill="#2366a0"/><circle cx="464.0" cy="143" r="7" fill="#b95619"/><text class="diagram-label" x="116.0" y="236" font-size="16" fill="#000000" text-anchor="middle">A</text><text class="diagram-label" x="290.0" y="236" font-size="16" fill="#000000" text-anchor="middle">B</text><text class="diagram-label" x="464.0" y="236" font-size="16" fill="#000000" text-anchor="middle">C</text><text class="diagram-label" x="290.0" y="265" font-size="16" fill="#000000" text-anchor="middle">Baseline: solid starting line</text><text class="diagram-label" x="290.0" y="293" font-size="16" fill="#000000" text-anchor="middle">A’s Rf = 78 / 130 = 0.60</text><text class="diagram-label" x="290.0" y="321" font-size="16" fill="#000000" text-anchor="middle">C contains spots matching A and B</text></g></svg>