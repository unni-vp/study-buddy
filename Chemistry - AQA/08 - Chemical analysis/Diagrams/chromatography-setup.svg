<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Paper chromatography: spots start above the solvent</title><desc id="desc">Paper hangs in a covered vessel. The pencil baseline and sample spots are above the solvent; the solvent front is marked higher up the paper.</desc><rect width="1000" height="560" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Paper chromatography: spots start above the solvent</text><path d="M260 125V465H660V125" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M260 125h-10m410 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="245" y="110" width="430" height="18" rx="5" fill="#d7e1e5" stroke="#182c3b" stroke-width="2"/><rect x="365" y="130" width="190" height="310" rx="5" fill="#fcfbf3" stroke="#182c3b" stroke-width="2"/><rect x="263" y="395" width="394" height="66" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M365 350H555" fill="none" stroke="#596b75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><circle cx="400" cy="350" r="6" fill="#873c6a" stroke="#182c3b" stroke-width="2"/><circle cx="460" cy="350" r="6" fill="#873c6a" stroke="#182c3b" stroke-width="2"/><circle cx="520" cy="350" r="6" fill="#873c6a" stroke="#182c3b" stroke-width="2"/><path d="M365 230H555" fill="none" stroke="#17658c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><circle cx="400" cy="280" r="6" fill="#b14049" stroke="#182c3b" stroke-width="2"/><circle cx="460" cy="255" r="6" fill="#4562a0" stroke="#182c3b" stroke-width="2"/><circle cx="520" cy="305" r="6" fill="#568846" stroke="#182c3b" stroke-width="2"/><text x="710" y="180" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Covered vessel</text><path d="M698 174L650 120" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="710" y="270" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Solvent front</text><path d="M698 264L555 230" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="710" y="350" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Pencil baseline</text><path d="M698 344L555 350" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="710" y="435" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Solvent</text><path d="M698 429L655 425" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="515" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Keep the spots above the solvent. Mark the solvent front as soon as paper is removed.</text></g></svg>