<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Flame tests: place a clean sample loop in the blue flame</title><desc id="desc">A clean wire loop holds a sample in the blue non-luminous flame of a Bunsen burner.</desc><rect width="1000" height="530" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Flame tests: place a clean sample loop in the blue flame</text><rect x="180" y="405" width="200" height="28" rx="5" fill="#b4c5ce" stroke="#182c3b" stroke-width="2"/><rect x="255" y="290" width="50" height="115" rx="5" fill="#c0cbd1" stroke="#182c3b" stroke-width="2"/><path d="M258 290Q220 220 280 135Q340 220 302 290Z" fill="#9bd5ef" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M270 290Q255 255 280 218Q305 255 290 290Z" fill="#f8fcff" stroke="#17658c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M800 185L320 235" fill="none" stroke="#182c3b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="308" cy="237" r="13" fill="none" stroke="#182c3b" stroke-width="2"/><text x="500" y="110" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Clean wire loop + sample</text><path d="M488 104L316 230" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="425" y="350" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Blue non-luminous flame</text><text x="35" y="490" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Clean the loop between samples. Compare the flame colour with known ions.</text></g></svg>