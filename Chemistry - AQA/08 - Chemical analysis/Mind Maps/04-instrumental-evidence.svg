<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Instrumental analysis and reliable conclusions</title><desc id="map-description">Advantages: Rapid results. Sensitive to small quantities. Accurate when appropriately calibrated. Can measure concentrations and resolve mixtures. Flame emission: Sample enters flame. Emitted light passes through spectroscope. Read line spectrum. Compare with reference spectra. Identify ions: Match line positions/patterns. Mixtures can contain several line sets. Overall colour alone can mask components. Use reference evidence rather than guesses. Concentration: Compare suitable signal with calibration. Read supplied axes and units. No universal signal-to-concentration conversion. Measurement resolution and calibration matter. Chemical versus instrumental: Simple tests cheap and accessible. Instruments can detect smaller samples quickly. Equipment/calibration require resources. Select method for the stated task. Justified conclusions: Name test, observation and inferred ion. Use an extra test for ambiguous white precipitate. One chromatography spot need not prove purity. Repeat uncertain results with clean samples.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#46813