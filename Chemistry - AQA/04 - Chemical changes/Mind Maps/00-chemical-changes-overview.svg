<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Chemical changes</title><desc id="map-description">Reactivity &amp; displacement: More reactive metals form positive ions more readily and displace less reactive metals. Mg &gt; Zn &gt; Fe &gt; H &gt; Cu: Mg/Zn/Fe react with dilute HCl or H₂SO₄ Cu does not. Zn + Cu²⁺ → Zn²⁺ + Cu. Redox &amp; extraction: Oxidation: gain oxygen or lose electrons. Reduction: lose oxygen or gain electrons. Below carbon: oxide can be reduced using carbon. More reactive metals need electrolysis. Gold may occur as the element. Acids &amp; salts: H⁺ + OH⁻ → H₂O. Metal + acid → salt + H₂ oxide/hydroxide + acid → salt + water. Carbonate + acid also gives CO₂. HCl: chlorides H₂SO₄: sulfates HNO₃: nitrates. Strong = fully ionised concentrated = much solute per volume. Three practical routes: Insoluble base + acid: add excess, filter, concentrate, cool, filter/dry crystals. Titration: pipette alkali, burette acid, indicator swirl, dropwise endpoint, concordant titres. Electrolysis: inert electrodes, DC predict and test separate electrode products. Electrode rules: Molten/dissolved ions can move. Positive ions → negative cathode → reduction. Negative ions → positive anode → oxidation. Molten binary compound: metal at cathode, non-metal at anode. Aqueous: H₂ instead of metals above H halogen at anode if halide, otherwise O₂. Aluminium &amp; half-equations: Cryolite lowers melting/operating temperature. Al³⁺ + 3e⁻ → Al. 2O²⁻ → O₂ + 4e⁻. Oxygen reacts with carbon anodes, so replace them. Balance atoms AND charge. Electrons travel in wires ions carry current through electrolyte.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,314,292" transform="translate(18 18)"><rect width="314" height="292" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="64" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Reactivity &amp;</text><text class="panel-title" x="50" y="62" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">displacement</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More reactive metals form positive ions</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">more readily and displace less reactive</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">metals.</text><path class="section-divider" d="M18 159H296" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mg &gt; Zn &gt; Fe &gt; H &gt; Cu: Mg/Zn/Fe react</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">with dilute HCl or H₂SO₄</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cu does not.</text><path class="section-divider" d="M18 238H296" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="261" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Zn + Cu²⁺ → Zn²⁺ + Cu.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,314,273" transform="translate(18 322)"><rect width="314" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Redox &amp; extraction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Oxidation:</tspan> gain oxygen or lose</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electrons.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Reduction:</tspan> lose oxygen or gain</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electrons.</text><path class="section-divider" d="M18 153H296" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Below</tspan> <tspan font-weight="700">carbon:</tspan> oxide can be reduced</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">using carbon.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More reactive metals need electrolysis.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gold may occur as the element.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,308" transform="translate(344 18)"><rect width="350" height="308" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Acids &amp; salts</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">H⁺ + OH⁻ → H₂O.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metal + acid → salt + H₂</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oxide/hydroxide + acid → salt + water.</text><path class="section-divider" d="M18 131H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Carbonate + acid also gives CO₂.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">HCl:</tspan> chlorides</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">H₂SO₄:</tspan> sulfates</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">HNO₃:</tspan> nitrates.</text><path class="section-divider" d="M18 232H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Strong = fully ionised</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">concentrated = much solute per volume.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,264" transform="translate(344 338)"><rect width="350" height="264" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Three practical routes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Insoluble</tspan> <tspan font-weight="700">base</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">acid:</tspan> add excess, filter,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">concentrate, cool, filter/dry crystals.</text><path class="section-divider" d="M18 109H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Titration:</tspan> pipette alkali, burette acid,</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">indicator</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">swirl, dropwise endpoint, concordant titres.</text><path class="section-divider" d="M18 188H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Electrolysis:</tspan> inert electrodes, DC</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">predict and test separate electrode products.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,396,434" transform="translate(706 18)"><rect width="396" height="434" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="378" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Electrode rules</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Molten/dissolved ions can move.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Positive ions → negative cathode → reduction.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Negative ions → positive anode → oxidation.</text><path class="section-divider" d="M18 131H378" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Molten</tspan> <tspan font-weight="700">binary</tspan> <tspan font-weight="700">compound:</tspan> metal at cathode,</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">non-metal at anode.</text><path class="section-divider" d="M18 188H378" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Aqueous:</tspan> H₂ instead of metals above H</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">halogen at anode if halide, otherwise O₂.</text><g transform="translate(18 251)"><g class="concept-illustration"><title>Shows positive and negative ions moving to oppositely charged electrodes.</title><text class="diagram-label" x="39" y="17" font-size="16" fill="#000000" text-anchor="middle">Cathode −</text><text class="diagram-label" x="321" y="17" font-size="16" fill="#000000" text-anchor="middle">Anode +</text><path d="M3 42V117H357V42" fill="#edf6fa" stroke="#7f9cb1"/><rect x="34" y="30" width="10" height="66" fill="#7d8792"/><rect x="316" y="30" width="10" height="66" fill="#7d8792"/><text class="diagram-label" x="133.2" y="60" font-size="16" fill="#000000" text-anchor="middle">Pb²⁺</text><text class="diagram-label" x="226.8" y="92" font-size="16" fill="#000000" text-anchor="middle">Br⁻</text><path d="M114.19999999999999 63L47 63" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M51.38791280945186 60.60287230697899L47 63L51.38791280945186 65.39712769302102" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M242.8 93L313 93" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M308.61208719054815 95.39712769302102L313 93L308.61208719054815 90.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="180.0" y="142" font-size="16" fill="#000000" text-anchor="middle">Molten lead bromide: ions move</text></g></g></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,396,264" transform="translate(706 464)"><rect width="396" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="378" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Aluminium &amp; half-equations</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cryolite lowers melting/operating temperature.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Al³⁺ + 3e⁻ → Al.</text><path class="section-divider" d="M18 109H378" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">2O²⁻ → O₂ + 4e⁻.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxygen reacts with carbon anodes, so replace them.</text><path class="section-divider" d="M18 166H378" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balance atoms AND charge.</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electrons travel in wires</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ions carry current through electrolyte.</text></g></g></svg>