<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Reactivity &amp; redox</title><desc id="map-description">Reactivity order: K &gt; Na &gt; Li &gt; Ca &gt; Mg &gt; Al &gt; C &gt; Zn &gt; Fe &gt; H &gt; Cu &gt; Ag &gt; Au. C and H are comparison points. More reactive → greater tendency to lose electrons and form positive ions. Aluminium has a protective oxide layer. Water &amp; acid evidence: Cold water: K/Na/Li react readily Ca reacts Mg very slow Zn/Fe/Cu no significant reaction. Water products: hydroxide + H₂. Dilute HCl/H₂SO₄: Mg rapid, Zn slower, Fe slower still Cu no reaction. Compare under controlled concentration, temperature and surface area. Displacement: A more reactive metal displaces a less reactive one. Zn + CuSO₄ → ZnSO₄ + Cu. Ionic: Zn + Cu²⁺ → Zn²⁺ + Cu. Sulfate spectator ions cancel. Copper deposit blue solution fades. Use several results to deduce an unknown order. OIL RIG: Oxidation Is Loss Reduction Is Gain of electrons. Zn → Zn²⁺ + 2e⁻: oxidation. Cu²⁺ + 2e⁻ → Cu: reduction. Atoms and total charges balance. Metal + acid: metal oxidised 2H⁺ + 2e⁻ → H₂ is reduction. Oxygen definitions: Oxidation gains oxygen reduction loses oxygen. 2CuO + C → 2Cu + CO₂: CuO reduced carbon oxidised. Redox changes happen together. Copper oxide loses oxygen do not say the copper ions lose electrons. Choose extraction: Unreactive gold may be found as metal. Most metals occur in compounds. Metal below carbon: carbon can reduce its oxide. More reactive metal, or one that reacts with carbon: electrolysis may be used. Melting and electrical current require energy evaluate cost using supplied data.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,334,229" transform="translate(18 18)"><rect width="334" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="316" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Reactivity order</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">K &gt; Na &gt; Li &gt; Ca &gt; Mg &gt; Al &gt; C &gt; Zn &gt; Fe</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">&gt; H &gt; Cu &gt; Ag &gt; Au.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">C and H are comparison points.</text><path class="section-divider" d="M18 131H316" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More reactive → greater tendency to lose</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">electrons and form positive ions.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Aluminium has a protective oxide layer.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,334,330" transform="translate(18 259)"><rect width="334" height="330" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="316" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Water &amp; acid evidence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cold</tspan> <tspan font-weight="700">water:</tspan> K/Na/Li react readily</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ca reacts</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mg very slow</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Zn/Fe/Cu no significant reaction.</text><path class="section-divider" d="M18 153H316" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Water</tspan> <tspan font-weight="700">products:</tspan> hydroxide + H₂.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Dilute</tspan> <tspan font-weight="700">HCl/H₂SO₄:</tspan> Mg rapid, Zn slower,</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fe slower still</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cu no reaction.</text><path class="section-divider" d="M18 254H316" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare under controlled concentration,</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">temperature and surface area.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,374,286" transform="translate(364 18)"><rect width="374" height="286" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="356" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Displacement</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A more reactive metal displaces a less reactive</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">one.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Zn + CuSO₄ → ZnSO₄ + Cu.</text><path class="section-divider" d="M18 131H356" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ionic:</tspan> <tspan font-weight="700">Zn</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">Cu²⁺</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">Zn²⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">Cu.</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sulfate spectator ions cancel.</text><path class="section-divider" d="M18 188H356" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Copper deposit</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">blue solution fades.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use several results to deduce an unknown order.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,374,264" transform="translate(364 316)"><rect width="374" height="264" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="356" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">OIL RIG</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxidation Is Loss</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Reduction Is Gain of electrons.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Zn</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">Zn²⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2e⁻:</tspan> oxidation.</text><path class="section-divider" d="M18 131H356" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cu²⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2e⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">Cu:</tspan> reduction.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Atoms and total charges balance.</text><path class="section-divider" d="M18 188H356" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Metal</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">acid:</tspan> metal oxidised</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">2H⁺ + 2e⁻ → H₂ is reduction.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,264" transform="translate(750 18)"><rect width="352" height="264" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Oxygen definitions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxidation gains oxygen</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reduction loses oxygen.</text><path class="section-divider" d="M18 109H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2CuO</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">C</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">2Cu</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">CO₂:</tspan> CuO reduced</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">carbon oxidised.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Redox changes happen together.</text><path class="section-divider" d="M18 188H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Copper oxide loses oxygen</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">do not say the copper ions lose electrons.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,286" transform="translate(750 294)"><rect width="352" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Choose extraction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Unreactive gold may be found as metal.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Most metals occur in compounds.</text><path class="section-divider" d="M18 109H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Metal</tspan> <tspan font-weight="700">below</tspan> <tspan font-weight="700">carbon:</tspan> carbon can reduce its</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oxide.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More reactive metal, or one that reacts with</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">carbon: electrolysis may be used.</text><path class="section-divider" d="M18 210H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Melting and electrical current require energy</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">evaluate cost using supplied data.</text></g></g></svg>