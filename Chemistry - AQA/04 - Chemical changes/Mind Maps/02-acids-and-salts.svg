<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Acids &amp; salts</title><desc id="map-description">pH &amp; neutralisation: Acid: H⁺ in water alkali: OH⁻. Below pH 7 acidic 7 neutral above 7 alkaline. H⁺ + OH⁻ → H₂O. Universal indicator estimates pH a calibrated probe gives a numerical reading. Equal volumes need not contain equal reacting amounts. Strength vs concentration: Strong acids fully ionise: HCl, HNO₃, H₂SO₄. Weak acids partly ionise: ethanoic, citric, carbonic. Concentrated/dilute describes amount per volume, not ionisation. pH falls by 1 → H⁺ concentration ×10. pH 2 has 100× the H⁺ of pH 4. Acid reaction patterns: Metal + acid → salt + H₂. Metal oxide/hydroxide + acid → salt + water. Carbonate + acid → salt + water + CO₂. H₂ gives squeaky pop CO₂ turns limewater cloudy. Name &amp; formulate salts: HCl → chloride H₂SO₄ → sulfate HNO₃ → nitrate. Metal supplies positive ion/name. Balance charges: Mg²⁺ + 2NO₃⁻ → Mg(NO₃)₂. 2Na⁺ + SO₄²⁻ → Na₂SO₄. CuO + H₂SO₄ → CuSO₄ + H₂O. Salt practical: react &amp; filter: Warm dilute acid gently remove burner. Add insoluble oxide/carbonate in small portions, stirring, until excess remains. Excess solid ensures all acid reacts. Filter off solid salt solution is filtrate. Goggles avoid boiling/splashing acid. Concentrate &amp; crystallise: Gently evaporate some water using water bath/electric heater. Cool to form crystals. Filter, rinse with a little cold distilled water and dry between filter papers. Do not strongly heat to dryness. Soluble alkali cannot be filtered off: find exact volumes by titration instead.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,330" transform="translate(18 18)"><rect width="354" height="330" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">pH &amp; neutralisation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Acid:</tspan> H⁺ in water</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">alkali:</tspan> OH⁻.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Below pH 7 acidic</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">7 neutral</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">above 7 alkaline.</text><path class="section-divider" d="M18 175H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">H⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">OH⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">H₂O.</tspan> Universal indicator</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">estimates pH</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a calibrated probe gives a numerical reading.</text><path class="section-divider" d="M18 254H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Equal volumes need not contain equal</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reacting amounts.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,264" transform="translate(18 360)"><rect width="354" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Strength vs concentration</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Strong</tspan> <tspan font-weight="700">acids</tspan> <tspan font-weight="700">fully</tspan> <tspan font-weight="700">ionise:</tspan> HCl, HNO₃, H₂SO₄.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Weak</tspan> <tspan font-weight="700">acids</tspan> <tspan font-weight="700">partly</tspan> <tspan font-weight="700">ionise:</tspan> ethanoic, citric,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">carbonic.</text><path class="section-divider" d="M18 131H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Concentrated/dilute describes amount per</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">volume, not ionisation.</text><path class="section-divider" d="M18 188H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pH falls by 1 → H⁺ concentration ×10. pH 2</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">has 100× the H⁺ of pH 4.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,207" transform="translate(384 18)"><rect width="354" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Acid reaction patterns</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metal + acid → salt + H₂.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metal oxide/hydroxide + acid → salt + water.</text><path class="section-divider" d="M18 109H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Carbonate + acid → salt + water + CO₂.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">H₂ gives squeaky pop</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">CO₂ turns limewater cloudy.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,264" transform="translate(384 237)"><rect width="354" height="264" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Name &amp; formulate salts</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">HCl → chloride</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">H₂SO₄ → sulfate</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">HNO₃ → nitrate.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metal supplies positive ion/name.</text><path class="section-divider" d="M18 153H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Balance</tspan> <tspan font-weight="700">charges:</tspan> Mg²⁺ + 2NO₃⁻ →</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mg(NO₃)₂. 2Na⁺ + SO₄²⁻ → Na₂SO₄.</text><path class="section-divider" d="M18 210H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">CuO + H₂SO₄ → CuSO₄ + H₂O.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,308" transform="translate(750 18)"><rect width="352" height="308" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Salt practical: react &amp; filter</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Warm dilute acid gently</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">remove burner.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Add insoluble oxide/carbonate in small</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">portions, stirring, until excess remains.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Excess solid ensures all acid reacts.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Filter off solid</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">salt solution is <tspan font-weight="700">filtrate.</tspan></text><path class="section-divider" d="M18 232H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Goggles</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">avoid boiling/splashing acid.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,286" transform="translate(750 338)"><rect width="352" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Concentrate &amp; crystallise</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gently evaporate some water using water</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">bath/electric heater.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cool to form crystals.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Filter, rinse with a little cold distilled water</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and dry between filter papers.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not strongly heat to dryness.</text><path class="section-divider" d="M18 210H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Soluble</tspan> <tspan font-weight="700">alkali</tspan> <tspan font-weight="700">cannot</tspan> <tspan font-weight="700">be</tspan> <tspan font-weight="700">filtered</tspan> <tspan font-weight="700">off:</tspan> find</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">exact volumes by titration instead.</text></g></g></svg>