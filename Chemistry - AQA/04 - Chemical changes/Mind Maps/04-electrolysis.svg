<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Electrolysis</title><desc id="map-description">Electrolyte &amp; electrodes: Ions move only when molten/dissolved. Positive ions go to negative cathode negative ions to positive anode. Cathode: gain electrons, reduction. Anode: lose electrons, oxidation. Electrons move in wires, ions in liquid. Molten binary compounds: Metal at cathode non-metal at anode. No competing water ions. Molten PbBr₂: Pb²⁺ + 2e⁻ → Pb 2Br⁻ → Br₂ + 2e⁻. Balance atoms and total charge halogens are diatomic. Aqueous product rules: Water adds H⁺ and OH⁻. At cathode: H₂ if metal is above hydrogen, otherwise metal. At anode with inert electrodes: halogen if halide present, otherwise O₂. NaCl(aq): H₂/Cl₂ CuCl₂(aq): Cu/Cl₂ CuSO₄(aq): Cu/O₂. Useful half-equations: 2H⁺ + 2e⁻ → H₂. Cu²⁺ + 2e⁻ → Cu. 2Cl⁻ → Cl₂ + 2e⁻. 4OH⁻ → O₂ + 2H₂O + 4e⁻. Oxidation puts electrons on product side reduction uses them on reactant side. Aluminium extraction: Molten Al₂O₃/cryolite mixture needs lower temperature than pure Al₂O₃. Al³⁺ + 3e⁻ → Al. 2O²⁻ → O₂ + 4e⁻. Oxygen reacts with carbon anodes → CO₂ replace anodes. Energy needed for heat and current carbon cannot reduce aluminium oxide. Aqueous practical: Hypothesis: changing dissolved compound changes products. Use inert electrodes/DC compare solutions at same voltage, time, concentration and electrode setup. Test H₂: pop O₂: relights glowing splint Cl₂: bleaches damp litmus. Record metal deposits too. Repeat goggles, ventilation for chlorine switch off before adjusting electrodes.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,399" transform="translate(18 18)"><rect width="354" height="399" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Electrolyte &amp; electrodes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ions move only when molten/dissolved.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Positive ions go to negative cathode</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">negative ions to positive anode.</text><path class="section-divider" d="M18 131H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cathode:</tspan> gain electrons, reduction.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Anode:</tspan> lose electrons, oxidation.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electrons move in wires, ions in liquid.</text><g transform="translate(18 216)"><g class="concept-illustration"><title>Shows positive and negative ions moving to oppositely charged electrodes.</title><text class="diagram-label" x="39" y="17" font-size="16" fill="#000000" text-anchor="middle">Cathode −</text><text class="diagram-label" x="279" y="17" font-size="16" fill="#000000" text-anchor="middle">Anode +</text><path d="M3 42V117H315V42" fill="#edf6fa" stroke="#7f9cb1"/><rect x="34" y="30" width="10" height="66" fill="#7d8792"/><rect x="274" y="30" width="10" height="66" fill="#7d8792"/><text class="diagram-label" x="117.66" y="60" font-size="16" fill="#000000" text-anchor="middle">Pb²⁺</text><text class="diagram-label" x="200.34" y="92" font-size="16" fill="#000000" text-anchor="middle">Br⁻</text><path d="M98.66 63L47 63" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M51.38791280945186 60.60287230697899L47 63L51.38791280945186 65.39712769302102" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M216.34 93L271 93" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M266.61208719054815 95.39712769302102L271 93L266.61208719054815 90.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="159.0" y="142" font-size="16" fill="#000000" text-anchor="middle">Molten lead bromide: ions move</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,264" transform="translate(18 429)"><rect width="354" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Molten binary compounds</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Metal at cathode</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">non-metal at anode.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No competing water ions.</text><path class="section-divider" d="M18 131H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Molten</tspan> <tspan font-weight="700">PbBr₂:</tspan> <tspan font-weight="700">Pb²⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2e⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">Pb</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2Br⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">Br₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2e⁻.</tspan></text><path class="section-divider" d="M18 188H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balance atoms and total charge</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">halogens are diatomic.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,286" transform="translate(384 18)"><rect width="354" height="286" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Aqueous product rules</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water adds H⁺ and OH⁻.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">At</tspan> <tspan font-weight="700">cathode:</tspan> H₂ if metal is above hydrogen,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">otherwise metal.</text><path class="section-divider" d="M18 131H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">At</tspan> <tspan font-weight="700">anode</tspan> <tspan font-weight="700">with</tspan> <tspan font-weight="700">inert</tspan> <tspan font-weight="700">electrodes:</tspan> halogen if</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">halide present, otherwise O₂.</text><path class="section-divider" d="M18 188H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">NaCl(aq):</tspan> H₂/Cl₂</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">CuCl₂(aq):</tspan> Cu/Cl₂</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">CuSO₄(aq):</tspan> Cu/O₂.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,198" transform="translate(384 316)"><rect width="354" height="198" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Useful half-equations</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2H⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2e⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">H₂.</tspan> <tspan font-weight="700">Cu²⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2e⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">Cu.</tspan></text><path class="section-divider" d="M18 87H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2Cl⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">Cl₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2e⁻.</tspan> <tspan font-weight="700">4OH⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">O₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">2H₂O</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">4e⁻.</tspan></text><path class="section-divider" d="M18 122H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="145" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxidation puts electrons on product side</text><text class="body-text" x="18" y="167" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reduction uses them on reactant side.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,286" transform="translate(750 18)"><rect width="352" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Aluminium extraction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Molten Al₂O₃/cryolite mixture needs lower</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">temperature than pure Al₂O₃.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Al³⁺</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">3e⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">Al.</tspan></text><path class="section-divider" d="M18 131H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">2O²⁻</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">O₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">4e⁻.</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxygen reacts with carbon anodes → CO₂</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">replace anodes.</text><path class="section-divider" d="M18 210H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Energy needed for heat and current</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">carbon cannot reduce aluminium oxide.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,374" transform="translate(750 316)"><rect width="352" height="374" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Aqueous practical</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Hypothesis:</tspan> changing dissolved compound</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">changes products.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use inert electrodes/DC</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">compare solutions at same voltage, time,</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">concentration and electrode setup.</text><path class="section-divider" d="M18 175H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Test</tspan> <tspan font-weight="700">H₂:</tspan> pop</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">O₂:</tspan> relights glowing splint</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cl₂:</tspan> bleaches damp litmus.</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Record metal deposits too.</text><path class="section-divider" d="M18 276H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat</text><text class="body-text" x="18" y="321" font-size="16" fill="#000000" font-weight="400" text-anchor="start">goggles, ventilation for chlorine</text><text class="body-text" x="18" y="343" font-size="16" fill="#000000" font-weight="400" text-anchor="start">switch off before adjusting electrodes.</text></g></g></svg>