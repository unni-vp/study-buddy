<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Titration</title><desc id="map-description">Pipette &amp; flask: Rinse volumetric pipette with alkali use filler to transfer a fixed volume into conical flask. Add a few drops of indicator use a white tile. Goggles never mouth-pipette. Flask may contain distilled water: it changes volume but not moles of alkali. Burette preparation: Rinse burette with acid, fill, remove jet air bubble and filling funnel. Read bottom of meniscus at eye level. Record initial value starting at zero is unnecessary. Water left in the burette dilutes the acid. This changes its concentration. Endpoint technique: Add acid while swirling near endpoint add drop by drop to first permanent colour change. Acid into alkali: phenolphthalein pink → colourless methyl orange yellow → orange at endpoint. Universal indicator lacks a sharp single change. Repeat &amp; average: Titre = final − initial reading. Rough trial locates endpoint exclude it from mean. Repeat accurately to concordant titres use tolerance specified. Mean only the concordant accurate titres. Rinse flask splashes down with distilled water without changing reacting moles. Moles from a titre: Known moles = cV convert cm³ to dm³. Use balanced equation ratio, then unknown c = n/V. 20.0 cm³ 0.100 mol/dm³ HCl → 0.00200 mol HCl. With 25.0 cm³ NaOH and 1:1 ratio: c = 0.00200/0.0250 = 0.0800 mol/dm³. Mass concentration &amp; crystals: For NaOH, multiply by 40 g/mol: 0.0800 mol/dm³ → 3.20 g/dm³. To make pure salt: repeat exact reacting volumes without indicator concentrate and crystallise. Check acid formula: H₂SO₄ needs two NaOH per acid molecule do not assume 1:1.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,314,308" transform="translate(18 18)"><rect width="314" height="308" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Pipette &amp; flask</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rinse volumetric pipette with alkali</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">use filler to transfer a fixed volume into</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conical flask.</text><path class="section-divider" d="M18 131H296" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Add a few drops of indicator</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">use a white tile.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Goggles</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">never mouth-pipette.</text><path class="section-divider" d="M18 232H296" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Flask</tspan> <tspan font-weight="700">may</tspan> <tspan font-weight="700">contain</tspan> <tspan font-weight="700">distilled</tspan> <tspan font-weight="700">water:</tspan> it</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">changes volume but not moles of alkali.</text></g></g><g class="map-section" id="section-2" data-source-panel="3" data-bounds="0,0,314,308" transform="translate(18 338)"><rect width="314" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Repeat &amp; average</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Titre = final − initial reading.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rough trial locates endpoint</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">exclude it from mean.</text><path class="section-divider" d="M18 131H296" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat accurately to concordant titres</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">use tolerance specified.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mean only the concordant accurate</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">titres.</text><path class="section-divider" d="M18 232H296" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rinse flask splashes down with distilled</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">water without changing reacting moles.</text></g></g><g class="map-section" id="section-3" data-source-panel="1" data-bounds="0,0,394,478" transform="translate(344 18)"><rect width="394" height="478" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="376" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Burette preparation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rinse burette with acid, fill, remove jet air bubble</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and filling funnel.</text><path class="section-divider" d="M18 109H376" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Read bottom of meniscus at eye level.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Record initial value</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">starting at zero is unnecessary.</text><path class="section-divider" d="M18 188H376" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water left in the burette dilutes the acid.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">This changes its concentration.</text><g transform="translate(18 251)"><g class="concept-illustration"><title>Shows the apparatus, meniscus and placement of reagents.</title><path d="M35 5V108H53V5M39 9H49" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M35 39Q44 46 53 39" fill="none" stroke="#2366a0"/><path d="M29 99H59M44 109V120" stroke="#4f6775" stroke-width="2"/><path d="M32 124V138L10 176Q44 192 78 176L56 138V124" fill="#f7f1f8" stroke="#7651a5" stroke-width="2"/><path d="M24 156H64L74 176Q44 186 14 176Z" fill="#edc4d9"/><text class="diagram-label" x="90" y="23" font-size="16" fill="#000000" text-anchor="start">Burette: acid</text><path d="M83 18H57" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="90" y="67" font-size="16" fill="#000000" text-anchor="start">Read bottom of</text><text class="diagram-label" x="90" y="89" font-size="16" fill="#000000" text-anchor="start">meniscus at eye level</text><path d="M82 66L52 42" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="90" y="140" font-size="16" fill="#000000" text-anchor="start">Flask: alkali</text><text class="diagram-label" x="90" y="162" font-size="16" fill="#000000" text-anchor="start">and indicator</text><path d="M83 143H62" stroke="#64747d" stroke-width="1.1" fill="none"/></g></g></g></g><g class="map-section" id="section-4" data-source-panel="4" data-bounds="0,0,394,241" transform="translate(344 508)"><rect width="394" height="241" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="376" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Moles from a titre</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Known moles = <tspan font-weight="700">cV</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">convert cm³ to dm³.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use balanced equation ratio, then unknown c = n/V.</text><path class="section-divider" d="M18 131H376" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">20.0 cm³ 0.100 mol/dm³ HCl → 0.00200 mol HCl.</text><path class="section-divider" d="M18 166H376" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">With 25.0 cm³ NaOH and 1:1 ratio: c =</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.00200/0.0250 = <tspan font-weight="700">0.0800</tspan> <tspan font-weight="700">mol/dm³.</tspan></text></g></g><g class="map-section" id="section-5" data-source-panel="2" data-bounds="0,0,352,286" transform="translate(750 18)"><rect width="352" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Endpoint technique</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Add acid while swirling</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">near endpoint add drop by drop to first</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">permanent colour change.</text><path class="section-divider" d="M18 131H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Acid</tspan> <tspan font-weight="700">into</tspan> <tspan font-weight="700">alkali:</tspan> phenolphthalein pink →</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">colourless</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">methyl orange yellow → orange at endpoint.</text><path class="section-divider" d="M18 210H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Universal indicator lacks a sharp single</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">change.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,314" transform="translate(750 316)"><rect width="352" height="314" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="64" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Mass concentration &amp;</text><text class="panel-title" x="50" y="62" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">crystals</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">For</tspan> <tspan font-weight="700">NaOH,</tspan> <tspan font-weight="700">multiply</tspan> <tspan font-weight="700">by</tspan> <tspan font-weight="700">40</tspan> <tspan font-weight="700">g/mol:</tspan> 0.0800</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mol/dm³ → <tspan font-weight="700">3.20</tspan> <tspan font-weight="700">g/dm³.</tspan></text><path class="section-divider" d="M18 137H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="160" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">To</tspan> <tspan font-weight="700">make</tspan> <tspan font-weight="700">pure</tspan> <tspan font-weight="700">salt:</tspan> repeat exact reacting</text><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start">volumes without indicator</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">concentrate and crystallise.</text><path class="section-divider" d="M18 216H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="239" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Check</tspan> <tspan font-weight="700">acid</tspan> <tspan font-weight="700">formula:</tspan> H₂SO₄ needs two</text><text class="body-text" x="18" y="261" font-size="16" fill="#000000" font-weight="400" text-anchor="start">NaOH per acid molecule</text><text class="body-text" x="18" y="283" font-size="16" fill="#000000" font-weight="400" text-anchor="start">do not assume 1:1.</text></g></g></svg>