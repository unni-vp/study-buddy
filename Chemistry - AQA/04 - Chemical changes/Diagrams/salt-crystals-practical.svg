<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">Soluble salt crystals: remove solid, then remove some water</title><desc id="desc">Filter excess insoluble solid, collect the salt solution, then concentrate it in an evaporating basin over a water bath and cool to crystallise.</desc><rect width="1000" height="610" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Soluble salt crystals: remove solid, then remove some water</text><text x="30" y="95" font-size="24" fill="#182c3b" font-weight="700" text-anchor="start">1  Filter excess solid</text><path d="M75 160H285L195 280V345H165V280Z" fill="#f5f2e7" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M105 175H255L180 265Z" fill="#e0d0b7" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="145" cy="195" r="6" fill="#3f403c" stroke="#182c3b" stroke-width="2"/><circle cx="180" cy="220" r="6" fill="#3f403c" stroke="#182c3b" stroke-width="2"/><circle cx="205" cy="190" r="6" fill="#3f403c" stroke="#182c3b" stroke-width="2"/><rect x="88" y="420" width="184" height="67" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M85 355V490H275V355" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M85 355h-10m200 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="320" y="220" font-size="22" fill="#182c3b" font-weight="700" text-anchor="start">Residue:</text><text x="320" y="252" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">excess solid</text><path d="M310 260L202 218" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="320" y="395" font-size="22" fill="#182c3b" font-weight="700" text-anchor="start">Filtrate:</text><text x="320" y="427" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">salt solution</text><path d="M310 438L250 450" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="550" y="95" font-size="24" fill="#182c3b" font-weight="700" text-anchor="start">2  Concentrate, then cool</text><rect x="623" y="350" width="224" height="132" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M620 285V485H850V285" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M620 285h-10m240 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M600 260Q735 360 870 260Z" fill="#b8deec" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="595" y="485" width="285" height="25" rx="5" fill="#e3b697" stroke="#182c3b" stroke-width="2"/><text x="640" y="553" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Warm water bath</text><path d="M685 225q-20-25 0-45m50 45q-20-25 0-45" fill="none" stroke="#ad4c10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="590" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Cool to crystallise. Separate, rinse with a little cold water, then dry.</text></g></svg>