<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" width="1000" height="555" role="img" aria-labelledby="title"><title id="title">Positive ions move to negative cathode and gain electrons; negative ions move to positive anode and lose electrons</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="555" fill="white"/><text x="500" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">Electrolysis: ions carry charge in the liquid</text><rect x="355" y="65" width="290" height="65" rx="10" fill="#edf5ff" stroke="#2166ad"/><text x="500" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">DC power supply</text><path d="M355 95H205V175M645 95H795V175" fill="none" stroke="#425968" stroke-width="3"/><path d="M95 205V430H905V205" fill="none" stroke="#738893" stroke-width="3"/><rect x="97" y="250" width="806" height="178" fill="#e5f3f8"/><rect x="190" y="175" width="30" height="190" fill="#526573"/><rect x="780" y="175" width="30" height="190" fill="#526573"/><text x="105" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">− cathode</text><text x="895" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">+ anode</text><circle cx="375" cy="300" r="26" fill="#dae7fb" stroke="#2166ad"/><circle cx="625" cy="300" r="26" fill="#ffe3ce" stroke="#b96821"/><text x="375" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#18344a">+</text><text x="625" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#18344a">−</text><path d="M340 300H232" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M660 300H768" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="375" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Positive ions</text><text x="625" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Negative ions</text><text x="245" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Gain electrons → reduction</text><text x="755" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Lose electrons → oxidation</text><text x="500" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Electrolyte: molten ionic compound or aqueous solution</text></svg>