<svg xmlns="http://www.w3.org/2000/svg" width="580" height="281" viewBox="0 0 580 281" role="img" font-family="Segoe UI, Arial, sans-serif"><title>Shows the atomic number and relative atomic mass in the same positions as the official AQA periodic-table key, preventing their roles being exchanged.</title><rect width="100%" height="100%" fill="white"/><g class="concept-illustration"><title>Shows the atomic number and relative atomic mass in the same positions as the official AQA periodic-table key, preventing their roles being exchanged.</title><rect x="230.0" y="24" width="120" height="149" rx="8" fill="#edf5ee" stroke="#468133"/><text class="diagram-label" x="290.0" y="58" font-size="16" fill="#000000" text-anchor="middle">23</text><text class="diagram-label" x="290.0" y="103" font-size="30" fill="#000" text-anchor="middle">Na</text><text class="diagram-label" x="290.0" y="147" font-size="16" fill="#000000" text-anchor="middle">11</text><text class="diagram-label" x="290.0" y="213" font-size="16" fill="#000000" text-anchor="middle">Top: relative atomic mass (Ar)</text><text class="diagram-label" x="290.0" y="241" font-size="16" fill="#000000" text-anchor="middle">Centre: sodium’s chemical symbol</text><text class="diagram-label" x="290.0" y="269" font-size="16" fill="#000000" text-anchor="middle">Bottom: atomic number, 11 protons</text></g></svg>