<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Periodic table, charges and relative masses</title><desc id="map-description">Read the key: AQA tile positions shown below. Atomic and isotope numbers: Protons =atomic number. Neutral electrons =protons. Neutrons =isotope mass number−atomic number. Electron gain/loss changes charge, not element. Groups, periods, symbols: Main groups link to outer electrons. Period links to occupied shells in simple model. Mg 2,8,2 forms Mg²⁺ Cl 2,8,7 forms Cl⁻. Co cobalt differs from CO carbon monoxide. Neutral formulas: Balance ionic charges. MgCl₂, Al₂O₃, Ca(NO₃)₂. Keep polyatomic groups together. Use supplied transition-ion charges. Relative masses: Ar: weighted isotope average, no unit. 75% of 35 and 25% of 37: mean 35.5. Mr: sum Ar for every atom. Mg(OH)₂ =24+2×17 =58. Element proportions: Element contribution/Mr ×100. CO₂ carbon:12/44 ×100 ≈27.3%. Count repeated atoms and brackets. Use actual supplied periodic-table precision.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,398,405" transform="translate(18 18)"><rect width="398" height="405" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Read the key</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">AQA tile positions shown below.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Shows the atomic number and relative atomic mass in the same positions as the official AQA periodic-table key, preventing their roles being exchanged.</title><rect x="121.0" y="24" width="120" height="149" rx="8" fill="#edf5ee" stroke="#468133"/><text class="diagram-label" x="181.0" y="58" font-size="16" fill="#000000" text-anchor="middle">23</text><text class="diagram-label" x="181.0" y="103" font-size="30" fill="#000" text-anchor="middle">Na</text><text class="diagram-label" x="181.0" y="147" font-size="16" fill="#000000" text-anchor="middle">11</text><text class="diagram-label" x="181.0" y="213" font-size="16" fill="#000000" text-anchor="middle">Top: relative atomic mass (Ar)</text><text class="diagram-label" x="181.0" y="241" font-size="16" fill="#000000" text-anchor="middle">Centre: sodium’s chemical symbol</text><text class="diagram-label" x="181.0" y="269" font-size="16" fill="#000000" text-anchor="middle">Bottom: atomic number, 11 protons</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,398,185" transform="translate(18 435)"><rect width="398" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Atomic and isotope numbers</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Protons =atomic number.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Neutral electrons =protons.</text><path class="section-divider" d="M18 109H380" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Neutrons =isotope mass number−atomic number.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Electron gain/loss changes charge, not element.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,310,251" transform="translate(428 18)"><rect width="310" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="292" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Groups, periods, symbols</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Main groups link to outer electrons.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Period links to occupied shells in</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">simple model.</text><path class="section-divider" d="M18 131H292" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mg 2,8,2 forms Mg²⁺</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cl 2,8,7 forms Cl⁻.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Co cobalt differs from CO carbon</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">monoxide.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,310,185" transform="translate(428 281)"><rect width="310" height="185" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="292" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Neutral formulas</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Balance ionic charges.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">MgCl₂, Al₂O₃, Ca(NO₃)₂.</text><path class="section-divider" d="M18 109H292" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep polyatomic groups together.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use supplied transition-ion charges.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,185" transform="translate(750 18)"><rect width="352" height="185" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Relative masses</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ar: weighted isotope average, no unit.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">75% of 35 and 25% of 37: mean 35.5.</text><path class="section-divider" d="M18 109H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mr: sum Ar for every atom.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mg(OH)₂ =24+2×17 =58.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,185" transform="translate(750 215)"><rect width="352" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Element proportions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Element contribution/Mr ×100.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">CO₂ carbon:12/44 ×100 ≈27.3%.</text><path class="section-divider" d="M18 109H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Count repeated atoms and brackets.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use actual supplied periodic-table precision.</text></g></g></svg>