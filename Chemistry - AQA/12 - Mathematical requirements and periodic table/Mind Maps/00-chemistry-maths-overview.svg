<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Chemistry maths and periodic-table skills</title><desc id="map-description">Numbers and units: Convert before substituting. 1000 cm³ =1 dm³ 1000 mg =1 g. Standard form and order-of-magnitude checks. Round final result to suitable significant figures. Periodic-table information: Atomic number counts protons. Ar is a weighted isotope mean. Mr sums all atoms, including brackets. Ion charge balances compound formulas. Moles and equations: n =m/Mr. Particle count =n×Avogadro constant. Balanced coefficients give mole ratios. Compare moles/coefficient for limiting reactant. Empirical formula from simplest mole ratio. Solutions and gases: c=n/V with volume in dm³. Mass concentration =c×Mr. Room conditions:24 dm³ gas per mole. Titration uses equation ratio, not always 1:1. Percentages and energy: Yield =actual/theoretical ×100. Atom economy includes balanced mass contributions. Bond energy =broken−formed. Rate =change/time. Rf =spot/front distance. Graphs and geometry: Best-fit slope/tangent gives rate. y=mx+c, gradient and intercept. Cube surface 6a², volume a³. Preserve molecular connectivity in representations.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" st