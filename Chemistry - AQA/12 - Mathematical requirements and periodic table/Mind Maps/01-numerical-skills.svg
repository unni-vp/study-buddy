<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Units, proportions and precision</title><desc id="map-description">Unit conversions: kg/g/mg: factors of 1000. dm³/cm³: factors of 1000. kJ/J: factors of 1000. Minutes to seconds: ×60. Small scales: mm/µm/nm: factors of 1000. Prefixes kilo, milli, micro, nano and larger powers. Area: square factor. Volume: cube factor. 1 cm² =100 mm² 1 cm³ =1000 mm³. Standard form: a×10ⁿ, 1≤a&lt;10. Multiply coefficients and add powers. Divide coefficients and subtract powers. Negative exponent is small fraction, not negative amount. Ratios and percentages: Part/whole ×100. 2:3 gives first fraction 2/5. (New−original)/original ×100. Percentage-point difference is not relative change. Precision: 0.00340 has three significant figures. Round only at the end. Use requested precision and actual supplied values. Decimal places differ from significant figures. Estimate and check: 0.048/24 is about 0.002. Tenfold scale change: one order of magnitude. Check units and plausible magnitude. Small percentages may act on very different totals.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" vi