<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Solutions, gases, yield and energy</title><desc id="map-description">Concentrations: Mass/volume: g dm⁻³. c=n/V n=cV. Convert cm³ first. Mass concentration=c×Mr. Titration: known moles, equation ratio, unknown volume. Gas quantities: 24 dm³ =24 000 cm³ per mole at room conditions. n=V/24 or V/24 000 with matching units. Volume ratios equal mole ratios at same T/P. Not valid unchanged for every condition. Yield versus atom economy: Yield:actual/theoretical ×100. Atom economy:desired/total balanced product mass ×100. CaCO₃ →CaO+CO₂:56% for CaO. Recovery losses differ from reaction by-product formation. Bond energy: Breaking absorbs, forming releases. Change=broken−formed. Count all bonds and coefficients. Negative exothermic, positive endothermic. Rates and other ratios: Mean rate=quantity/time. Fixed endpoint proxy=1/time. Rf=baseline-to-spot/front distance, no unit. Gold %=carats/24 ×100. Temperature and interpretation: ΔT=final−initial. Use supplied Q=mcΔT where applicable. Matching mass/heat-capacity units. Check direction of energy transfer and conditions.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,398,251" transform="translate(18 18)"><rect width="398" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Concentrations</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mass/volume: g dm⁻³.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">c=n/V</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">n=cV.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Convert cm³ first.</text><path class="section-divider" d="M18 153H380" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="n