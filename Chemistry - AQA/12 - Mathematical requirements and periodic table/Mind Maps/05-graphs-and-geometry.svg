<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Data, algebra, graphs and geometry</title><desc id="map-description">Means and frequency: Mean=total/count. Frequency mean=Σ(value×frequency)/Σfrequency. Grouped midpoints give estimated mean. Average suitable concordant titres, not rough overshoots. Present data: Bars for categories, histogram for numerical intervals. Scatter/line/curve for appropriate paired data. Axes: quantity, unit, suitable scale. Best fit, not forced point-to-point joining. Gradient and rate: y=mx+c. m=Δy/Δx. c at x=0. Large triangle on best fit. Tangent at specified curve point: instantaneous rate. Chord: interval mean, not one instant. Algebra and graph meaning: Same operation both sides when rearranging. c=n/V gives V=n/c. Correlation alone not proof of causation. Rate-time area gives total change where appropriate. Area and volume: Rectangle lw. Triangle: ½bh. Cube surface: 6a². Volume: a³. 2 cm cube: 24 cm² and8 cm³. Eight 1 cm cubes: 48 cm², same 8 cm³. Represent and check: Real molecules are 3D drawings/model keys simplify. Keep atoms, valency and connectivity. Projected crossing lines need not be bonds. Convert, calculate, round, attach unit and check scale.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><p