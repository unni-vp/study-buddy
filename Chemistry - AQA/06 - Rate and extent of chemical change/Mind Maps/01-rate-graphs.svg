ext><text class="diagram-label" x="161.0" y="244" font-size="16" fill="#000000" text-anchor="middle">Orange: slower reaction</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,366,185" transform="translate(388 18)"><rect width="366" height="185" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Slopes and plateaus</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Steep slope: faster reaction.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Slope decreases as reactants are used.</text><path class="section-divider" d="M18 109H348" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Horizontal: no further measured change.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Plateau height: final yield.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,366,384" transform="translate(388 215)"><rect width="366" height="384" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x=