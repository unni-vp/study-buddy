.9 103.24773173512787L259.52 37.903235245061296" stroke="#b95619" stroke-width="2"/><path d="M67.9 103.24773173512787H259.52V37.903235245061296" fill="none" stroke="#468133"/><circle cx="139.4" cy="78.86545692540153" r="4" fill="#b95619"/><text class="diagram-label" x="165.0" y="192" font-size="16" fill="#000000" text-anchor="middle">Time (s)</text><text class="diagram-label" x="165.0" y="220" font-size="16" fill="#000000" text-anchor="middle">Tangent at the marked instant</text><text class="diagram-label" x="165.0" y="248" font-size="16" fill="#000000" text-anchor="middle">Gradient = volume change / time change</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,336,279" transform="translate(766 18)"><rect width="336" height="279" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="318" height="64" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Interpret consumed</text><text class="panel-title" x="50" y="62" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">reactant</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Remaining-amount curve slopes down.</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Consumption rate usually quoted</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">positive.</text><path class="section-divider" d="M18 159H318" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use amount used, not total amount</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">remaining.</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rates need a stated time interval or</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">instant.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,336,207" transform="translate(766 309)"><rect width="336" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="318" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Reliable graph reading</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use actual scales and units.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Large triangle on tangent or best-fit line.</text><path class="section-divider" d="M18 109H318" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chord: average rate over an interval.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Change rate does not always change final</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">yield.</text></g></g></svg>