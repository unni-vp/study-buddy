<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Measuring rates and reading curves</title><desc id="map-description">Mean rates: Amount changed/time, with correct unit. 48 cm³/60 s: 0.80 cm³ s⁻¹. 0.015 mol/30 s: 5.0 ×10⁻⁴ mol s⁻¹. Do not confuse time with rate. Two reaction curves: Same starting limiting amount in this model. Slopes and plateaus: Steep slope: faster reaction. Slope decreases as reactants are used. Horizontal: no further measured change. Plateau height: final yield. Tangent method: Rate at the marked instant. Interpret consumed reactant: Remaining-amount curve slopes down. Consumption rate usually quoted positive. Use amount used, not total amount remaining. Rates need a stated time interval or instant. Reliable graph reading: Use actual scales and units. Large triangle on tangent or best-fit line. Chord: average rate over an interval. Change rate does not always change final yield.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,358,185" transform="translate(18 18)"><rect width="358" height="185" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="340" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Mean rates</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Amount changed/time, with correct unit.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">48 cm³/60 s: 0.80 cm³ s⁻¹.</text><path class="section-divider" d="M18 109H340" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">0.015 mol/30 s: 5.0 ×10⁻⁴ mol s⁻¹.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not confuse time with rate.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,358,380" transform="translate(18 215)"><rect