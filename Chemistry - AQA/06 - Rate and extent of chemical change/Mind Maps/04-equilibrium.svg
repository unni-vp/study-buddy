<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Reversible reactions and dynamic equilibrium</title><desc id="map-description">Reversible and energy: Products reform reactants: ⇌. Exothermic forward, endothermic reverse. Equal energy magnitude for matching amounts. Copper sulfate hydration reverses dehydration. Equal ongoing rates: Closed system prevents escape. Concentration changes: Add reactant: use some, favour products. Remove product: replace some, favour products. Add product/remove reactant: favour reactants. New equilibrium opposes, not completely cancels change. Temperature changes: Heating favours endothermic direction. Cooling favours exothermic direction. Cooling exothermic reaction improves yield but slows rate. Distinguish equilibrium position from speed. Gas-pressure changes: Higher pressure: fewer gas moles favoured. Lower pressure: more gas moles favoured. Count coefficients of gases, not atoms. Equal gas totals: no position shift. Catalyst and industry: Both directions faster, same equilibrium yield. N₂+3H₂ ⇌2NH₃: four gas moles become two. High pressure increases ammonia yield. Choose practical rate/yield/cost/safety compromise.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,378,185" transform="translate(18 18)"><rect width="378" height="185" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="360" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Reversible and energy</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Products reform reactants: ⇌.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Exothermic forward, endothermic reverse.</text><path class="section-divider" d="M18 109H360" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Equal energy magnitude for matching amounts.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Copper sulfate hydration reverses dehydration.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,378,385" transform="translate(18 215)"><rect width="378" height="385" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="360" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Equal ongoing rates</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Closed system prevents escape.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Distinguishes initially unequal forward/reverse rates from equal nonzero rates at dynamic equilibrium.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Reaction rate</text><path d="M23 29V166H339" fill="none" stroke="#596d77"/><polyline points="23.00,35.00 26.00,38.79 29.00,42.35 32.00,45.71 35.00,48.87 38.00,51.85 41.00,54.65 44.00,57.29 47.00,59.78 50.00,62.12 53.00,64.33 56.00,66.40 59.00,68.36 62.00,70.20 65.00,71.94 68.00,73.57 71.00,75.11 74.00,76.56 77.00,77.93 80.00,79.21 83.00,80.42 86.00,81.56 89.00,82.64 92.00,83.65 95.00,84.60 98.00,85.50 101.00,86.34 104.00,87.14 107.00,87.89 110.00,88.59 113.00,89.26 116.00,89.88 119.00,90.47 122.00,91.03 125.00,91.55 128.00,92.04 131.00,92.50 134.00,92.94 137.00,93.35 140.00,93.74 143.00,94.10 146.00,94.45 149.00,94.77 152.00,95.07 155.00,95.36 158.00,95.63 161.00,95.89 164.00,96.13 167.00,96.35 170.00,96.56 173.00,96.76 176.00,96.95 179.00,97.13 182.00,97.30 185