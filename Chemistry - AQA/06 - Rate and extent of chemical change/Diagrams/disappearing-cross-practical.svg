<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" role="img" aria-labelledby="title desc"><title id="title">Disappearing cross: keep the viewing depth constant</title><desc id="desc">Viewed from above, a cross under the flask becomes hidden as sulfur makes the liquid cloudy. Keep the viewing depth constant.</desc><rect width="1000" height="585" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Disappearing cross: keep the viewing depth constant</text><text x="240" y="100" font-size="24" fill="#182c3b" font-weight="700" text-anchor="middle">At the start</text><path d="M210 145V205L130 380Q240 415 350 380L270 205V145Z" fill="white" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M176 280H304L350 380Q240 415 130 380Z" fill="#d8effa" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="100" y="410" width="285" height="65" rx="5" fill="white" stroke="#182c3b" stroke-width="2"/><path d="M225 425l30 35m-30 0 30-35" fill="none" stroke="#182c3b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M240 125L240 250" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M234.78041359066523 239.19463477176788L240 250L245.21958640933477 239.19463477176788" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="515" font-size="21" fill="#182c3b" font-weight="400" text-anchor="middle">Look down from above</text><text x="725" y="100" font-size="24" fill="#182c3b" font-weight="700" text-anchor="middle">At the endpoint</text><path d="M695 145V205L615 380Q725 415 835 380L755 205V145Z" fill="white" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M661 280H789L835 380Q725 415 615 380Z" fill="#eee4b2" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="585" y="410" width="285" height="65" rx="5" fill="white" stroke="#182c3b" stroke-width="2"/><path d="M710 425l30 35m-30 0 30-35" fill="none" stroke="#a7a184" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M725 125L725 250" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M719.7804135906653 239.19463477176788L725 250L730.2195864093347 239.19463477176788" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="725" y="515" font-size="21" fill="#182c3b" font-weight="400" text-anchor="middle">Look down from above</text><text x="35" y="551" font-size="20" fill="#182c3b" font-weight="400" text-anchor="start">Time until sulfur cloudiness hides the cross. Use the same flask, depth and endpoint.</text></g></svg>