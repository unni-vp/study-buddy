<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Milk decay and practical evaluation</title><desc id="map-description">Milk mechanism: Lipase produces fatty acids from fat. Falling pH gives a timed endpoint. Milk/indicator/carbonate give consistent start. Models an enzyme component of decay. Temperature method: Equilibrate enzyme and mixture in water bath. Add equal enzyme and start timing. Compare same endpoint at several temperatures. Repeat and use a no-enzyme control. Controls: Same milk, volumes/concentrations. Same starting pH, indicator and mixing. Same endpoint judgement. A probe needs calibration and common pH interval. Rates and results: Relative rate = 1/time, units s⁻¹. Half the endpoint time: double rate. Warmer increases activity up to optimum. Very high temperature can denature enzyme. Specific improvements: Shorter sampling reduces endpoint uncertainty. Gas volume avoids variable bubble sizes. Calibration corrects a systematic offset. More representative samples reduce sampling bias. Safe, evidence-led decisions: Eye protection and safe hot-water handling. Never taste experimental mixtures. Use data, spread and limits in conclusions. Avoid vague “better equipment” or unsupported causation.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,207" transform="translate(18 18)"><rect width="354" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Milk mechanism</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lipase produces fatty acids from fat.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Falling pH gives a timed endpoint.</text><path class="section-divider" d="M18 109H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Milk/indicator/carbonate give consistent</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">start.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Models an enzyme component of decay.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,229" transform="translate(18 237)"><rect width="354" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Temperature method</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Equilibrate enzyme and mixture in water</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">bath.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Add equal enzyme and start timing.</text><path class="section-divider" d="M18 131H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare same endpoint at several</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">temperatures.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat and use a no-enzyme control.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bou