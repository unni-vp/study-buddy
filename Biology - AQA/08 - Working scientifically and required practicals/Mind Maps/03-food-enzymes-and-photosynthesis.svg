<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Food tests, enzymes and photosynthesis</title><desc id="map-description">Food reagents: Benedict’s + heat: reducing sugar precipitate. Iodine: starch blue-black. Biuret: protein lilac/purple. Sudan III: red oil layer. Ethanol test: milky emulsion. Food-test safety: Clean separate samples and comparison controls. Warm Benedict’s in water bath. Eye protection for reagents. Ethanol flammable: keep away from flames. Amylase method: Buffers change pH. Same enzyme/starch amounts. Water bath controls temperature. Sample onto fresh iodine every 30 s. Orange-brown endpoint: no starch detected. Amylase interpretation: Repeat comparable endpoints. Rate proxy = 1/time. Extreme pH changes active-site shape. Shorter sampling intervals improve timing precision. Do not contaminate main reaction with iodine. Pondweed method: Measured light intensity or lamp distance. Collect oxygen volume per fixed time. Same plant and carbon dioxide supply. Equilibrate and control lamp heating. Light and limitations: Intensity ∝ 1/distance² in suitable model. Double distance gives quarter intensity. Bubbles vary in size: volume is better. Plateau suggests another limiting factor.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-rev