<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Designing investigations and evaluating evidence</title><desc id="map-description">Testable question: Define a hypothesis with a biological reason. Choose range, intervals and repeats. Measure a named dependent quantity. Models simplify and can be tested. Control the comparison: Keep other influential factors consistent. Explain how each could affect results. Use control experiment where appropriate. Representative sampling limits selection bias. Measurement quality: Suitable range/resolution and correct units. Check zero, calibrate, read at eye level. Precise does not automatically mean accurate. Resolution and spread limit uncertainty. Random versus systematic: Random: unpredictable variation. Mean reduces effect. Systematic: consistent bias. Recalibrate/correct cause. Investigate anomalies before discarding. Repeats cannot remove a constant offset. Conclusions and graphs: Use suitable bars, scatter or line graph. Best fit reflects pattern, not every point. Support trends with data and units. Compare hypothesis, spread and alternatives. Scientific judgement: Peer review checks reasoning/methods. Replication tests reproducibility. Risk combines likelihood and consequence. Evaluate ethical, social, economic and environmental issues.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBo