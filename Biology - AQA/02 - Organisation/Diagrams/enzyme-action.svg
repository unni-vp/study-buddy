<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="title"><title id="title">Enzyme action: binding and product release</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="430" fill="white"/><text x="170" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#18344a">Substrate approaches</text><path d="M50 145Q50 125 70 125H140L170 165L200 125H270Q290 125 290 145V240Q290 260 270 260H70Q50 260 50 240Z" fill="#e1effb" stroke="#2166ad" stroke-width="3"/><path d="M140 65H200L170 105Z" fill="#f5cb87" stroke="#ac6a21" stroke-width="2"/><text x="170" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Enzyme</text><path d="M308 192H338" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="495" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#18344a">Substrate binds</text><path d="M375 145Q375 125 395 125H465L495 165L525 125H595Q615 125 615 145V240Q615 260 595 260H395Q375 260 375 240Z" fill="#e1effb" stroke="#2166ad" stroke-width="3"/><path d="M465 125H525L495 165Z" fill="#f5cb87" stroke="#ac6a21" stroke-width="2"/><text x="495" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Enzyme</text><path d="M633 192H663" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="820" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#18344a">Products leave</text><path d="M700 145Q700 125 720 125H790L820 165L850 125H920Q940 125 940 145V240Q940 260 920 260H720Q700 260 700 240Z" fill="#e1effb" stroke="#2166ad" stroke-width="3"/><path d="M770 65H800V105Z M835 65H865L835 105Z" fill="#f5cb87" stroke="#ac6a21" stroke-width="2"/><text x="820" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Enzyme</text><text x="500" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#18344a">A complementary active site gives specificity.</text><text x="500" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#18344a">The enzyme is unchanged and can be used again.</text></svg>