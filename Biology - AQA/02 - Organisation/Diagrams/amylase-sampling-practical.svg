<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Amylase and pH: test fresh samples every 30 seconds</title><desc id="desc">Starch, amylase and buffer react in a controlled water bath. Fresh samples go into separate iodine wells every thirty seconds until starch is no longer detected.</desc><rect width="1000" height="590" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Amylase and pH: test fresh samples every 30 seconds</text><rect x="63" y="265" width="244" height="172" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M60 200V440H310V200" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 200h-10m260 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M125 125V345Q147 385 169 345V125" fill="white" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M130 295V345Q147 373 164 345V295Z" fill="#f7e8cf" stroke="#f7e8cf" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="490" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Constant-temperature water bath</text><text x="355" y="125" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Starch + amylase + pH buffer</text><text x="355" y="155" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Start timing when they are mixed.</text><path d="M190 200L460 250" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M448.4248481860611 253.1647844293519L460 250L450.3257094415279 242.90013364983125" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="300" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Fresh drop</text><rect x="495" y="215" width="450" height="185" rx="5" fill="#eef2ed" stroke="#182c3b" stroke-width="2"/><circle cx="550" cy="285" r="28" fill="#253046" stroke="#182c3b" stroke-width="2"/><text x="550" y="365" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">0 s</text><circle cx="660" cy="285" r="28" fill="#253046" stroke="#182c3b" stroke-width="2"/><text x="660" y="365" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">30 s</text><circle cx="770" cy="285" r="28" fill="#253046" stroke="#182c3b" stroke-width="2"/><text x="770" y="365" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">60 s</text><circle cx="880" cy="285" r="28" fill="#b87d33" stroke="#182c3b" stroke-width="2"/><text x="880" y="365" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">90 s</text><text x="355" y="450" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Iodine stays blue-black while starch remains.</text><text x="355" y="480" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">First orange-brown sample: starch no longer detected.</text><text x="355" y="510" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Illustrative endpoint only; actual times vary.</text><text x="35" y="555" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Never add iodine to the reaction tube. Repeat with a range of buffer pH values.</text></g></svg>