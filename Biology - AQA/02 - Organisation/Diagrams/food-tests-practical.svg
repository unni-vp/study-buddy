<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Food tests: use separate samples and compare positive results</title><desc id="desc">Positive food-test results: reducing sugar gives a coloured Benedict’s precipitate after warming, starch blue-black iodine, protein purple Biuret and lipid a Sudan-stained oil layer.</desc><rect width="1000" height="600" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Food tests: use separate samples and compare positive results</text><text x="140" y="100" font-size="22" fill="#182c3b" font-weight="700" text-anchor="middle">Reducing sugar</text><path d="M115 170V330Q137 370 159 330V170" fill="white" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 230V330Q137 358 154 330V230Z" fill="#c76b2f" stroke="#c76b2f" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="410" font-size="18" fill="#182c3b" font-weight="400" text-anchor="middle">Brick-red precipitate</text><circle cx="128" cy="315" r="3" fill="#9d3b21" stroke="#9d3b21" stroke-width="2"/><circle cx="142" cy="330" r="3" fill="#9d3b21" stroke="#9d3b21" stroke-width="2"/><circle cx="134" cy="340" r="3" fill="#9d3b21" stroke="#9d3b21" stroke-width="2"/><circle cx="150" cy="312" r="3" fill="#9d3b21" stroke="#9d3b21" stroke-width="2"/><circle cx="145" cy="343" r="3" fill="#9d3b21" stroke="#9d3b21" stroke-width="2"/><text x="40" y="455" font-size="20" fill="#182c3b" font-weight="400" text-anchor="start">Benedict’s solution</text><text x="40" y="485" font-size="20" fill="#182c3b" font-weight="400" text-anchor="start">Warm in water bath</text><text x="385" y="100" font-size="22" fill="#182c3b" font-weight="700" text-anchor="middle">Starch</text><path d="M360 170V330Q382 370 404 330V170" fill="white" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M365 230V330Q382 358 399 330V230Z" fill="#283047" stroke="#283047" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="385" y="410" font-size="18" fill="#182c3b" font-weight="400" text-anchor="middle">Blue-black</text><text x="385" y="455" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">Iodine</text><text x="630" y="100" font-size="22" fill="#182c3b" font-weight="700" text-anchor="middle">Protein</text><path d="M605 170V330Q627 370 649 330V170" fill="white" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M610 230V330Q627 358 644 330V230Z" fill="#a478b8" stroke="#a478b8" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="630" y="410" font-size="18" fill="#182c3b" font-weight="400" text-anchor="middle">Lilac / purple</text><text x="630" y="455" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">Biuret reagent</text><text x="875" y="100" font-size="22" fill="#182c3b" font-weight="700" text-anchor="middle">Lipid</text><path d="M850 170V330Q872 370 894 330V170" fill="white" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M855 230V330Q872 358 889 330V230Z" fill="#efe1b0" stroke="#efe1b0" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="855" y="230" width="34" height="35" rx="5" fill="#b53c38" stroke="none" stroke-width="2"/><text x="875" y="410" font-size="18" fill="#182c3b" font-weight="400" text-anchor="middle">Red-stained oil layer</text><text x="875" y="455" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">Sudan III</text><text x="35" y="550" font-size="20" fill="#182c3b" font-weight="400" text-anchor="start">These show positive results. Include known positive and negative samples.</text><text x="35" y="580" font-size="20" fill="#182c3b" font-weight="400" text-anchor="start">Use clean equipment; colours identify substances, not exact concentrations.</text></g></svg>