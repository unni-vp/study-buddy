<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" width="1000" height="465" role="img" aria-labelledby="title"><title id="title">Blood flow through the four heart chambers, lungs and body</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="465" fill="white"/><rect x="365" y="20" width="270" height="52" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="500.0" y="53.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Body</text><rect x="45" y="150" width="260" height="52" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="175.0" y="183.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Right atrium</text><rect x="45" y="255" width="260" height="52" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="175.0" y="288.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Right ventricle</text><rect x="365" y="390" width="270" height="52" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="500.0" y="423.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Lungs</text><rect x="695" y="255" width="260" height="52" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="825.0" y="288.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Left atrium</text><rect x="695" y="150" width="260" height="52" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="825.0" y="183.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Left ventricle</text><path d="M365 46H175V145" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="start" fill="#18344a">Vena cava</text><path d="M175 205V250" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" fill="#18344a">Valve</text><path d="M175 310V415H360" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="10" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" fill="#18344a">Pulmonary artery</text><path d="M640 415H825V312" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="838" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" fill="#18344a">Pulmonary vein</text><path d="M825 250V207" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="842" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" fill="#18344a">Valve</text><path d="M825 145V46H640" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="736" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="start" fill="#18344a">Aorta</text><text x="500" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="26" text-anchor="middle" fill="#18344a">Two linked circuits</text><text x="500" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Right heart → lungs</text><text x="500" y="263" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Left heart → body</text><text x="500" y="303" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#18344a">Valves prevent backflow</text></svg>