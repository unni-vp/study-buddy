<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 595" role="img" aria-labelledby="title desc"><title id="title">Potometer: follow an air bubble in a water-filled capillary</title><desc id="desc">A leafy shoot is sealed into water-filled tubing. An air bubble moves along a capillary towards the shoot, and a reservoir allows it to be reset.</desc><rect width="1000" height="595" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Potometer: follow an air bubble in a water-filled capillary</text><rect x="53" y="325" width="149" height="152" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M50 260V480H205V260" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M50 260h-10m165 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="105" y="329" width="610" height="24" rx="5" fill="#d8effa" stroke="#182c3b" stroke-width="2"/><rect x="690" y="185" width="25" height="155" rx="5" fill="#d8effa" stroke="#182c3b" stroke-width="2"/><rect x="680" y="180" width="45" height="30" rx="5" fill="#998975" stroke="#182c3b" stroke-width="2"/><path d="M702 205V105" fill="none" stroke="#147a70" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M702 145Q625 95 620 155Q655 185 702 145M702 125Q775 75 790 130Q755 165 702 125" fill="#b2d2a0" stroke="#147a70" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="388" y="175" width="104" height="42" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M385 110V220H495V110" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M385 110h-10m120 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="432" y="218" width="18" height="112" rx="5" fill="#d8effa" stroke="#182c3b" s