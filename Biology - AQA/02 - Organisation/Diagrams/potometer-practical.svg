" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M613 390v10" fill="none" stroke="#182c3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M280 465L395 465" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M384.1946347717679 470.21958640933474L395 465L384.1946347717679 459.78041359066526" fill="none" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="474" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Bubble moves towards the shoot</text><text x="45" y="155" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Air bubble</text><path d="M167 149L300 340" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="520" y="85" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Reservoir resets bubble</text><path d="M508 79L470 180" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="775" y="240" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Airtight seal</text><path d="M763 234L725 194" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="760" y="330" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Leafy shoot</text><path d="M748 324L704 160" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="545" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Measure bubble distance per unit time. Keep joins airtight and cut the shoot under water.</text><text x="35" y="578" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Water uptake estimates transpiration; some absorbed water has other uses.</text></g></svg>