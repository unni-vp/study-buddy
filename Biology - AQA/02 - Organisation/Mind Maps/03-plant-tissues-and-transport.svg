d</tspan> <tspan font-weight="700">waxy</tspan> <tspan font-weight="700">cuticle:</tspan> protect and limit</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">evaporation.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Palisade</tspan> <tspan font-weight="700">cells:</tspan> chloroplasts absorb light.</text><g transform="translate(18 137)"><g class="explanatory-diagram" data-diagram="leaf"><title>A leaf cross-section locates the tissues, air spaces, vascular bundle and guard cells around a stoma.</title><rect x="2" y="12" width="116" height="5" fill="#67994c"/><rect x="2" y="17" width="116" height="20" fill="#eaf2d7" stroke="#468133"/><rect x="6" y="40" width="18" height="43" rx="5" fill="#c2df8e" stroke="#468133"/><ellipse cx="15" cy="48" rx="3" ry="4" fill="#468133"/><ellipse cx="15" cy="60" rx="3" ry="4" fill="#468133"/><ellipse cx="15" cy="73" rx="3" ry="4" fill="#468133"/><rect x="30" y="40" width="18" height="43" rx="5" fill="#c2df8e" stroke="#468133"/><ellipse cx="39" cy="48" rx="3" ry="4" fill="#468133"/><ellipse cx="39" cy="60" rx="3" ry="4" fill="#468133"/><ellipse cx="39" cy="73" rx="3" ry="4" fill="#468133"/><rect x="54" y="40" width="18" height="43" rx="5" fill="#c2df8e" stroke="#468133"/><ellipse cx="63" cy="48" rx="3" ry="4" fill="#468133"/><ellipse cx="63" cy="60" rx="3" ry="4" fill="#468133"/><ellipse cx="63" cy="73" rx="3" ry="4" fill="#468133"/><rect x="78" y="40" width="18" height="43" rx="5" fill="#c2df8e" stroke="#468133"/><ellipse cx="87" cy="48" rx="3" ry="4" fill="#468133"/><ellipse cx="87" cy="60" rx="3" ry="4" fill="#468133"/><ellipse cx="87" cy="73" rx="3" ry="4" fill="#468133"/><rect x="102" y="40" width="18" height="43" rx="5" fill="#c2df8e" stroke="#468133"/><ellipse cx="111" cy="48" rx="3" ry="4" fill="#468133"/><ellipse cx="111" cy="60" rx="3" ry="4" fill="#468133"/><ellipse cx="111" cy="73" rx="3" ry="4" fill="#468133"/><ellipse cx="14" cy="101" rx="13" ry="8" fill="#ddeac2" stroke="#468133"/><ellipse cx="49" cy="106" rx="13" ry="8" fill="#ddeac2" stroke="#468133"/><ellipse cx="20" cy="130" rx="13" ry="8" fill="#ddeac2" stroke="#468133"/><ellipse cx="50" cy="141" rx="13" ry="8" fill="#ddeac2" stroke="#468133"/><ellipse cx="90" cy="116" rx="22" ry="29" fill="#f5f6e3" stroke="#468133"/><circle cx="90" cy="102" r="8" fill="#c5dff6" stroke="#2366a0"/><circle cx="90" cy="130" r="8" fill="#f6d9a7" stroke="#b95619"/><path d="M2 156H43V170H2Z M76 156H118V170H76Z" fill="#eaf2d7" stroke="#468133"/><ellipse cx="45" cy="163" rx="6" ry="11" fill="#badf90" stroke="#468133"/><ellipse cx="73" cy="163" rx="6" ry="11" fill="#badf90" stroke="#468133"/><path d="M116 14L135 12H142" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="145" y="17" font-size="16" fill="#000000" text-anchor="start">Cuticle</text><path d="M116 27L135 36H142" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="145" y="41" font-size="16" fill="#000000" text-anchor="start">Epidermis</text><path d="M116 61L135 60H142" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="145" y="65" font-size="16" fill="#000000" text-anchor="start">Palisade cells</text><path d="M49 106L135 84H142" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="145" y="89" font-size="16" fill="#000000" text-anchor="start">Spongy cells</text><path d="M98 102L135 108H142" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="145" y="113" font-size="16" fill="#000000" text-anchor="start">Xylem</text><path d="M98 130L135 132H142" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="145" y="137" font-size="16" fill="#000000" text-anchor="start">Phloem</text><path d="M77 163L135 156H142" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="145" y="161" font-size="16" fill="#000000" text-anchor="start">Guard cells</text><path d="M59 166V180" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="59" y="198" font-size="16" fill="#000000" text-anchor="middle">Stoma</text><text class="diagram-label" x="145" y="193" font-size="16" fill="#000000" text-anchor="start">Air spaces</text><path d="M40 120L135 187H142" stroke="#64747d" stroke-width="1.1" fill="none"/></g></g><path class="section-divider" d="M18 356H432" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="379" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Spongy</tspan> <tspan font-weight="700">mesophyll:</tspan> air spaces shorten gas diffusion paths.</text><text class="body-text" x="18" y="401" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Guard</tspan> <tspan font-weight="700">cells:</tspan> open or close stomata.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,450,207" transform="translate(18 462)"><rect width="450" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="432" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Roots &amp; growing tips</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Root</tspan> <tspan font-weight="700">hairs:</tspan> large area for absorption.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water enters by <tspan font-weight="700">osmosis,</tspan> mineral ions by <tspan font-weight="700">active</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">transport.</tspan></text><path class="section-divider" d="M18 131H432" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Meristems:</tspan> dividing cells at root and shoot tips.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cells differentiate to form specialised tissues.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,290,295" transform="translate(480 18)"><rect width="290" height="295" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Xylem &amp; phloem</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Xylem:</tspan> dead hollow tubes.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lignin strengthens the walls.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water and minerals move from</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">roots to leaves.</text><path class="section-divider" d="M18 153H272" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Phloem:</tspan> living elongated cells with</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pores in end walls.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dissolved sugars move by</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">translocation</tspan> to growing or</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">storage tissues.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,290,273" transform="translate(480 325)"><rect width="290" height="273" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Transpiration</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water <tspan font-weight="700">evaporates</tspan> from mesophyll</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cells.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water vapour <tspan font-weight="700">diffuses</tspan> out through</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stomata.</text><path class="section-divider" d="M18 153H272" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water loss pulls a continuous</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stream up xylem.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Guard cells balance gas exchange</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">against water loss.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,320,251" transform="translate(782 18)"><rect width="320" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="302" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Changing the rate</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Heat:</tspan> faster evaporation and diffusion.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Wind:</tspan> removes humid air, maintaining a</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">steep gradient.</text><path class="section-divider" d="M18 131H302" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">High</tspan> <tspan font-weight="700">humidity:</tspan> smaller gradient and</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">slower loss.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Light:</tspan> usually opens stomata, increasing</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">loss when water is available.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,320,374" transform="translate(782 281)"><rect width="320" height="374" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="302" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Potometers &amp; sampling</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cut the shoot under water.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Seal an airtight setup.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dry leaves, allow acclimatisation, vary</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">one factor and repeat.</text><path class="section-divider" d="M18 153H302" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A potometer measures <tspan font-weight="700">water</tspan> <tspan font-weight="700">uptake,</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">not exact water loss.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rate</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">distance/time.</tspan></text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Volume</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">πr²</tspan> <tspan font-weight="700">×</tspan> <tspan font-weight="700">distance.</tspan></text><path class="section-divider" d="M18 254H302" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sample stomata in several random</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">measured areas.</text><text class="body-text" x="18" y="321" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Calculate the mean number per unit</text><text class="body-text" x="18" y="343" font-size="16" fill="#000000" font-weight="400" text-anchor="start">area.</text></g></g></svg>