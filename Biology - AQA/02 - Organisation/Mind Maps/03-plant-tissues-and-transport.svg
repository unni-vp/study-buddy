<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Plant tissues &amp; transport</title><desc id="map-description">Leaf tissues: Epidermis and waxy cuticle: protect and limit evaporation. Palisade cells: chloroplasts absorb light. Spongy mesophyll: air spaces shorten gas diffusion paths. Guard cells: open or close stomata. Roots &amp; growing tips: Root hairs: large area for absorption. Water enters by osmosis, mineral ions by active transport. Meristems: dividing cells at root and shoot tips. Cells differentiate to form specialised tissues. Xylem &amp; phloem: Xylem: dead hollow tubes. Lignin strengthens the walls. Water and minerals move from roots to leaves. Phloem: living elongated cells with pores in end walls. Dissolved sugars move by translocation to growing or storage tissues. Transpiration: Water evaporates from mesophyll cells. Water vapour diffuses out through stomata. Water loss pulls a continuous stream up xylem. Guard cells balance gas exchange against water loss. Changing the rate: Heat: faster evaporation and diffusion. Wind: removes humid air, maintaining a steep gradient. High humidity: smaller gradient and slower loss. Light: usually opens stomata, increasing loss when water is available. Potometers &amp; sampling: Cut the shoot under water. Seal an airtight setup. Dry leaves, allow acclimatisation, vary one factor and repeat. A potometer measures water uptake, not exact water loss. Rate = distance/time.  Volume = πr² × distance. Sample stomata in several random measured areas. Calculate the mean number per unit area.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><