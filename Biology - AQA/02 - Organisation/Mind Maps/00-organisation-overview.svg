<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Organisation overview</title><desc id="map-description">Organisation &amp; digestion: Cells form tissues. Tissues form organs. Organs work together in organ systems. Tissue: similar cells with a shared function. An organism contains cooperating systems. Digestion: large insoluble molecules become small soluble molecules for absorption into blood. Enzymes &amp; tests: Amylase: starch to sugars. Protease: proteins to amino acids. Lipase: lipids to glycerol and fatty acids. Enzymes: protein catalysts with specific active sites. Bile neutralises acid and emulsifies fat. Food tests identify nutrients. The amylase pH investigation uses iodine. Relative rate = 1/time. Heart, blood &amp; lungs: Right ventricle: pumps blood to lungs. Left ventricle: pumps blood to the body. Valves prevent backflow. Arteries: away from heart. Veins: towards heart. Capillaries: exchange with tissues. Red cells: carry oxygen. White cells: defend. Platelets: clot. Plasma: carries dissolved substances. Alveoli have large area and thin walls. Blood flow and ventilation maintain gradients. Health &amp; disease: Fatty deposits narrow coronary arteries, reducing oxygen supply. Stents keep them open. Statins lower cholesterol. Risk factors raise disease probability. Diet, smoking and exercise affect cardiovascular risk. Correlation alone is not causation. Benign tumours: stay local. Malignant tumours: invade and spread. Leaf structure: Palisade cells: chloroplasts absorb light. Spongy mesophyll: air spaces allow gas diffusion. Epidermis and cuticle: protect and limit water loss. Guard cells: control stomata. Meristems: dividing cells at root and shoot tips. Transport in plants: Root hairs: water by osmosis, mineral ions by active transport. Xylem: water and minerals. Phloem: dissolved sugars by translocation. Transpiration is water loss through leaves. Heat, wind and usually light increase it. High humidity lowers it. A potometer measures water uptake, which estimates water loss.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,314,330" transform="translate(18 18)"><rect width="314" height="330" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Organisation &amp; digestion</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cells form tissues.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Tissues form organs.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Organs work together in organ systems.</text><path class="section-divider" d="M18 131H296" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Tissue:</tspan> similar cells with a shared</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">function.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">An organism contains cooperating</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">systems.</text><path class="section-divider" d="M18 232H296" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Digestion:</tspan> large insoluble molecules</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">become small soluble molecules for</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">absorption into blood.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,314,330" transform="translate(18 360)"><rect width="314" height="330" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Enzymes &amp; tests</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Amylase:</tspan> starch to sugars.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Protease:</tspan> proteins to amino acids.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Lipase:</tspan> lipids to glycerol and fatty acids.</text><path class="section-divider" d="M18 131H296" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Enzymes:</tspan> protein catalysts with specific</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">active sites.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bile neutralises acid and emulsifies fat.</text><path class="section-divider" d="M18 210H296" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Food tests identify nutrients.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The amylase pH investigation uses</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">iodine.</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Relative</tspan> <tspan font-weight="700">rate</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">1/time.</tspan></text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,398,387" transform="translate(344 18)"><rect width="398" height="387" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Heart, blood &amp; lungs</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Right</tspan> <tspan font-weight="700">ventricle:</tspan> pumps blood to lungs.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Left</tspan> <tspan font-weight="700">ventricle:</tspan> pumps blood to the body.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Valves prevent backflow.</text><path class="section-divider" d="M18 131H380" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Arteries:</tspan> away from heart.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Veins:</tspan> towards heart.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Capillaries:</tspan> exchange with tissues.</text><path class="section-divider" d="M18 210H380" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Red</tspan> <tspan font-weight="700">cells:</tspan> carry oxygen.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">White</tspan> <tspan font-weight="700">cells:</tspan> defend.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Platelets:</tspan> clot.</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Plasma:</tspan> carries dissolved substances.</text><path class="section-divider" d="M18 311H380" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="334" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Alveoli have large area and thin walls.</text><text class="body-text" x="18" y="356" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blood flow and ventilation maintain gradients.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,398,308" transform="translate(344 417)"><rect width="398" height="308" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Health &amp; disease</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fatty deposits narrow coronary arteries, reducing</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oxygen supply.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Stents</tspan> keep them open.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Statins</tspan> lower cholesterol.</text><path class="section-divider" d="M18 153H380" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Risk factors raise disease probability.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Diet, smoking and exercise affect cardiovascular risk.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Correlation alone is not causation.</text><path class="section-divider" d="M18 232H380" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Benign</tspan> <tspan font-weight="700">tumours:</tspan> stay local.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Malignant</tspan> <tspan font-weight="700">tumours:</tspan> invade and spread.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,348,286" transform="translate(754 18)"><rect width="348" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="330" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Leaf structure</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Palisade</tspan> <tspan font-weight="700">cells:</tspan> chloroplasts absorb light.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Spongy</tspan> <tspan font-weight="700">mesophyll:</tspan> air spaces allow gas</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">diffusion.</text><path class="section-divider" d="M18 131H330" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Epidermis</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">cuticle:</tspan> protect and limit</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">water loss.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Guard</tspan> <tspan font-weight="700">cells:</tspan> control stomata.</text><path class="section-divider" d="M18 210H330" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Meristems:</tspan> dividing cells at root and shoot</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">tips.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,348,321" transform="translate(754 316)"><rect width="348" height="321" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="330" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Transport in plants</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Root</tspan> <tspan font-weight="700">hairs:</tspan> water by osmosis, mineral ions</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">by active transport.</text><path class="section-divider" d="M18 109H330" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Xylem:</tspan> water and minerals.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Phloem:</tspan> dissolved sugars by translocation.</text><path class="section-divider" d="M18 166H330" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Transpiration is water loss through leaves.</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heat, wind and usually light increase it.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">High humidity lowers it.</text><path class="section-divider" d="M18 245H330" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="268" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A <tspan font-weight="700">potometer</tspan> measures water uptake, which</text><text class="body-text" x="18" y="290" font-size="16" fill="#000000" font-weight="400" text-anchor="start">estimates water loss.</text></g></g></svg>