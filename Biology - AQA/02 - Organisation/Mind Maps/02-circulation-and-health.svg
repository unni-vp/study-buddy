<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Circulation &amp; health</title><desc id="map-description">Double circulation: Body → vena cava → right atrium → right ventricle → pulmonary artery → lungs Lungs → pulmonary vein → left atrium → left ventricle → aorta → body The left ventricle has a thicker muscular wall for higher pressure. Valves stop backflow. Coronary arteries supply heart muscle. Heart rate &amp; flow: Pacemaker cells in the right atrium set the rhythm. Artificial pacemakers correct irregularities. Cardiac output = heart rate × stroke volume 70 beats/min × 75 cm³/beat = 5,250 cm³/min = 5.25 dm³/min. Vessels &amp; lungs: Arteries: thick muscle and elastic walls withstand high pressure. Veins: wide lumen and valves help return blood. Capillaries: one-cell-thick walls give a short exchange path. Alveoli: large area, thin walls, blood flow and ventilation. Oxygen moves to blood. Carbon dioxide moves to air. Blood components: Red cells: haemoglobin binds oxygen. Biconcave shape gives a large area. No nucleus leaves space for haemoglobin. White cells: phagocytosis, antibodies and antitoxins. Platelets: clotting. Plasma: transports cells, nutrients, hormones, carbon dioxide and urea. Distributes heat. Disease &amp; treatment: Fatty deposits narrow coronary arteries, reducing oxygen for heart-muscle respiration. Stents: keep arteries open. Statins: lower cholesterol. Faulty valves leak or restrict flow. Biological or mechanical replacements restore flow. Compare donor or artificial hearts: benefit, surgery, blood-clot risk and possible rejection of donor tissue. Health &amp; cancer: Health: physical and mental well-being. Diseases can interact. Lifestyle, environment and genes affect risk. Smoking damages lungs and raises cancer risk. Obesity raises Type 2 diabetes risk. Alcohol can damage the liver and brain. Cancer: uncontrolled division. Benign: local. Malignant: invades and forms secondary tumours. Correlation alone is not causation. Compare representative rates and social/financial costs.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,352" transform="translate(18 18)"><rect width="290" height="352" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Double circulation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Body</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">vena</tspan> <tspan font-weight="700">cava</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">right</tspan> <tspan font-weight="700">atrium</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">→</tspan> <tspan font-weight="700">right</tspan> <tspan font-weight="700">ventricle</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">pulmonary</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">artery</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">lungs</tspan></text><path class="section-divider" d="M18 131H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Lungs</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">pulmonary</tspan> <tspan font-weight="700">vein</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">left</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">atrium</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">left</tspan> <tspan font-weight="700">ventricle</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">aorta</tspan> <tspan font-weight="700">→</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">body</tspan></text><path class="section-divider" d="M18 210H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The left ventricle has a thicker</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">muscular wall for higher pressure.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Valves stop backflow.</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Coronary arteries supply heart</text><text class="body-text" x="18" y="321" font-size="16" fill="#000000" font-weight="400" text-anchor="start">muscle.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,286" transform="translate(18 382)"><rect width="290" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Heart rate &amp; flow</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Pacemaker cells in the <tspan font-weight="700">right</tspan> <tspan font-weight="700">atrium</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">set the rhythm.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Artificial pacemakers correct</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">irregularities.</text><path class="section-divider" d="M18 153H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cardiac</tspan> <tspan font-weight="700">output</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">heart</tspan> <tspan font-weight="700">rate</tspan> <tspan font-weight="700">×</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">stroke</tspan> <tspan font-weight="700">volume</tspan></text><path class="section-divider" d="M18 210H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">70 beats/min × 75 cm³/beat =</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">5,250</tspan> <tspan font-weight="700">cm³/min</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">5.25</tspan> <tspan font-weight="700">dm³/min.</tspan></text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,330" transform="translate(320 18)"><rect width="350" height="330" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Vessels &amp; lungs</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Arteries:</tspan> thick muscle and elastic walls</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">withstand high pressure.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Veins:</tspan> wide lumen and valves help return</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">blood.</text><path class="section-divider" d="M18 153H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Capillaries:</tspan> one-cell-thick walls give a short</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">exchange path.</text><path class="section-divider" d="M18 210H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Alveoli:</tspan> large area, thin walls, blood flow</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and ventilation.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxygen moves to blood.</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Carbon dioxide moves to air.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,308" transform="translate(320 360)"><rect width="350" height="308" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Blood components</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Red</tspan> <tspan font-weight="700">cells:</tspan> haemoglobin binds oxygen.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Biconcave shape gives a large area.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No nucleus leaves space for haemoglobin.</text><path class="section-divider" d="M18 131H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">White</tspan> <tspan font-weight="700">cells:</tspan> phagocytosis, antibodies and</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">antitoxins.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Platelets:</tspan> clotting.</text><path class="section-divider" d="M18 210H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Plasma:</tspan> transports cells, nutrients,</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hormones, carbon dioxide and urea.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Distributes heat.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,420,286" transform="translate(682 18)"><rect width="420" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="402" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Disease &amp; treatment</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fatty deposits narrow coronary arteries, reducing</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">oxygen for heart-muscle respiration.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Stents:</tspan> keep arteries open.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Statins:</tspan> lower cholesterol.</text><path class="section-divider" d="M18 153H402" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Faulty valves leak or restrict flow.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Biological or mechanical replacements restore flow.</text><path class="section-divider" d="M18 210H402" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare donor or artificial hearts: benefit, surgery,</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">blood-clot risk and possible rejection of donor tissue.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,420,365" transform="translate(682 316)"><rect width="420" height="365" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="402" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Health &amp; cancer</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Health:</tspan> physical and mental well-being.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Diseases can interact.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lifestyle, environment and genes affect risk.</text><path class="section-divider" d="M18 131H402" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Smoking damages lungs and raises cancer risk.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Obesity raises Type 2 diabetes risk.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Alcohol can damage the liver and brain.</text><path class="section-divider" d="M18 210H402" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cancer:</tspan> uncontrolled division.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Benign:</tspan> local.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Malignant:</tspan> invades and forms secondary tumours.</text><path class="section-divider" d="M18 289H402" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="312" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Correlation alone is not causation.</text><text class="body-text" x="18" y="334" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare representative rates and social/financial costs.</text></g></g></svg>