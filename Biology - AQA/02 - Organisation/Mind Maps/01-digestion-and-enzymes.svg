<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Digestion &amp; enzymes</title><desc id="map-description">The digestive route: Mouth: chewing and amylase. Oesophagus: moves food to the stomach. Stomach: acid, protease and mixing. Pancreas: supplies digestive enzymes. Small intestine: digestion and absorption. Large intestine: absorbs water. Egestion: undigested food leaves. Excretion: metabolic waste leaves. Enzyme products: Amylase: starch → sugars. Made in salivary glands, pancreas and small intestine. Protease: protein → amino acids. Made in stomach, pancreas and small intestine. Lipase: lipid → glycerol + fatty acids. Made in pancreas and small intestine. Specific active sites: Enzymes are reusable protein catalysts. Substrate fits a complementary active site, like a lock and key. Warming increases collisions up to an optimum. Cold slows the reaction. Excess heat or extreme pH can denature the enzyme: the active site changes shape, so substrate cannot fit. Bile &amp; absorbed products: Liver: makes bile. Gall bladder: stores it. Alkaline bile neutralises stomach acid. Emulsification: smaller fat droplets give more surface area for lipase. Bile is not an enzyme. Absorbed products build new molecules. Glucose can be used in respiration. Food tests: Benedict’s: reducing sugar gives a coloured precipitate after heating in a water bath. Iodine: starch turns blue-black. Biuret: protein turns purple. Sudan III: lipid forms a red oil layer. Use separate samples and positive/negative controls. Wear goggles and heat safely. Amylase &amp; pH practical: Vary buffer pH. Control temperature, enzyme/starch concentrations and volumes. Test samples on fresh iodine every 30 seconds. When starch is digested, iodine stays orange-brown. Repeat. For the same starch quantity, relative rate = 1/time. Shorter sampling intervals improve endpoint resolution.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,330,321" transform="translate(18 18)"><rect width="330" height="321" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">The digestive route</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Mouth:</tspan> chewing and amylase.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Oesophagus:</tspan> moves food to the stomach.</text><path class="section-divider" d="M18 109H312" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Stomach:</tspan> acid, protease and mixing.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Pancreas:</tspan> supplies digestive enzymes.</text><path class="section-divider" d="M18 166H312" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Small</tspan> <tspan font-weight="700">intestine:</tspan> digestion and</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">absorption.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Large</tspan> <tspan font-weight="700">intestine:</tspan> absorbs water.</text><path class="section-divider" d="M18 245H312" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="268" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Egestion:</tspan> undigested food leaves.</text><text class="body-text" x="18" y="290" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Excretion:</tspan> metabolic waste leaves.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,330,286" transform="translate(18 351)"><rect width="330" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Enzyme products</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Amylase:</tspan> starch → sugars.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Made in salivary glands, pancreas and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">small intestine.</text><path class="section-divider" d="M18 131H312" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Protease:</tspan> protein → amino acids.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Made in stomach, pancreas and small</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">intestine.</text><path class="section-divider" d="M18 210H312" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Lipase:</tspan> lipid → glycerol + fatty acids.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Made in pancreas and small intestine.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,322,308" transform="translate(360 18)"><rect width="322" height="308" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Specific active sites</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Enzymes are reusable <tspan font-weight="700">protein</tspan> <tspan font-weight="700">catalysts.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Substrate fits a <tspan font-weight="700">complementary</tspan> <tspan font-weight="700">active</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">site,</tspan> like a lock and key.</text><path class="section-divider" d="M18 131H304" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Warming increases collisions up to an</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">optimum.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cold slows the reaction.</text><path class="section-divider" d="M18 210H304" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Excess heat or extreme pH can <tspan font-weight="700">denature</tspan></text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the enzyme: the active site changes</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">shape, so substrate cannot fit.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,322,286" transform="translate(360 338)"><rect width="322" height="286" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Bile &amp; absorbed products</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Liver:</tspan> makes bile.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gall</tspan> <tspan font-weight="700">bladder:</tspan> stores it.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Alkaline bile neutralises stomach acid.</text><path class="section-divider" d="M18 131H304" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Emulsification:</tspan> smaller fat droplets give</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">more surface area for lipase.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bile is not an enzyme.</text><path class="section-divider" d="M18 210H304" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Absorbed products build new molecules.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Glucose can be used in respiration.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,408,264" transform="translate(694 18)"><rect width="408" height="264" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="390" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Food tests</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Benedict’s:</tspan> reducing sugar gives a coloured</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">precipitate after heating in a water bath.</text><path class="section-divider" d="M18 109H390" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Iodine:</tspan> starch turns blue-black.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Biuret:</tspan> protein turns purple.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Sudan</tspan> <tspan font-weight="700">III:</tspan> lipid forms a red oil layer.</text><path class="section-divider" d="M18 188H390" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use separate samples and positive/negative controls.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Wear goggles and heat safely.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,408,308" transform="translate(694 294)"><rect width="408" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="390" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Amylase &amp; pH practical</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Vary buffer pH.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Control temperature, enzyme/starch concentrations</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and volumes.</text><path class="section-divider" d="M18 131H390" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Test samples on fresh iodine every <tspan font-weight="700">30</tspan> <tspan font-weight="700">seconds.</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">When starch is digested, iodine stays <tspan font-weight="700">orange-brown.</tspan></text><path class="section-divider" d="M18 188H390" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">For the same starch quantity, <tspan font-weight="700">relative</tspan> <tspan font-weight="700">rate</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">1/time.</tspan></text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Shorter sampling intervals improve endpoint</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">resolution.</text></g></g></svg>