<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Hormones and blood glucose</title><desc id="map-description">Endocrine messages: Glands secrete hormones directly into blood. Target cells have suitable receptors. Generally slower and longer lasting than nervous signals. Pituitary can stimulate other glands. It does not make every hormone. Gland locations: Pituitary: base of brain. Thyroid: neck. Adrenals: above kidneys. Pancreas: abdomen. Ovaries: pelvis. Testes: scrotum. Hormone source must match its role. Insulin response: Pancreas monitors high glucose. Insulin supports cell uptake and liver/muscle glycogen storage. Glucagon and feedback: Low glucose stimulates pancreas to release glucagon. Liver glycogen breaks down glucose enters blood. Levels return towards normal and response reduces. Glucose is sugar, glycogen storage, glucagon hormone. Diabetes comparison: Type 1: insufficient insulin insulin replacement usually needed. Type 2: insulin resistance diet/exercise and sometimes medicines. Obesity increases risk, not certainty. Use glucose and insulin reference data in comparisons. Stress and metabolism: Adrenaline: fight/flight, faster heart rate and greater glucose/oxygen delivery. Thyroxine: basal metabolic rate, growth and development. Low thyroxine increases pituitary stimulation high level reduces it. Explain how the hormone opposes a deviation.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,295" transform="translate(18 18)"><rect width="290" height="295" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Endocrine messages</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Glands secrete hormones directly</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">into blood.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Target cells have suitable</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">receptors.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Generally slower and longer</text><text class="body-text" x="18" y="185" font-size="16" fill="#000000" font-weight="400" text-anchor="start">lasting than nervous signals.</text><path class="section-divider" d="M18 197H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Pituitary can stimulate other</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">glands.</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">It does not make every hormone.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,273" transform="translate(18 325)"><rect width="290" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Gland locations</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Pituitary:</tspan> base of brain.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Thyroid:</tspan> neck.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Adrenals:</tspan> above kidneys.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Pancreas:</tspan> abdomen.</text><path class="section-divider" d="M18 153H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ovaries:</tspan> pelvis.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Testes:</tspan> scrotum.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Hormone source must match its</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">role.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,430,395" transform="translate(320 18)"><rect width="430" height="395" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="412" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Insulin response</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Pancreas monitors high glucose.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Insulin supports cell uptake and liver/muscle glycogen</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">storage.</text><g transform="translate(18 137)"><g class="concept-illustration"><title>Connects high glucose, insulin release, cellular uptake/storage and reduced hormone release in negative feedback.</title><text class="diagram-label" x="197.0" y="16" font-size="16" fill="#000000" text-anchor="middle">High blood glucose</text><text class="diagram-label" x="197.0" y="43" font-size="16" fill="#000000" text-anchor="middle">Pancreas releases insulin</text><path d="M197.0 55L197.0 78" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M194.60287230697898 73.61208719054814L197.0 78L199.39712769302102 73.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="197.0" y="101" font-size="16" fill="#000000" text-anchor="middle">Cells take up glucose</text><text class="diagram-label" x="197.0" y="127" font-size="16" fill="#000000" text-anchor="middle">Glucose stored as glycogen</text><path d="M197.0 139L197.0 163" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M194.60287230697898 158.61208719054812L197.0 163L199.39712769302102 158.61208719054812" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="197.0" y="188" font-size="16" fill="#000000" text-anchor="middle">Blood glucose falls</text><text class="diagram-label" x="197.0" y="215" font-size="16" fill="#000000" text-anchor="middle">Insulin release reduces</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,430,207" transform="translate(320 425)"><rect width="430" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="412" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Glucagon and feedback</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Low glucose stimulates pancreas to release glucagon.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Liver glycogen breaks down</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">glucose enters blood.</text><path class="section-divider" d="M18 131H412" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Levels return towards normal and response reduces.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Glucose is sugar, glycogen storage, glucagon hormone.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,340,251" transform="translate(762 18)"><rect width="340" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="322" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Diabetes comparison</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Type</tspan> <tspan font-weight="700">1:</tspan> insufficient insulin</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">insulin replacement usually needed.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Type</tspan> <tspan font-weight="700">2:</tspan> insulin resistance</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">diet/exercise and sometimes medicines.</text><path class="section-divider" d="M18 153H322" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Obesity increases risk, not certainty.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use glucose and insulin reference data in</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">comparisons.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,340,295" transform="translate(762 281)"><rect width="340" height="295" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="322" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Stress and metabolism</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Adrenaline:</tspan> fight/flight, faster heart rate</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and greater glucose/oxygen delivery.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Thyroxine:</tspan> basal metabolic rate, growth</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and development.</text><path class="section-divider" d="M18 153H322" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Low thyroxine increases pituitary</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stimulation</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">high level reduces it.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Explain how the hormone opposes a</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">deviation.</text></g></g></svg>