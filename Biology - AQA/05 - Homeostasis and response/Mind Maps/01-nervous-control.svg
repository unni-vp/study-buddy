<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Nervous control</title><desc id="map-description">Control system: Stimulus is a change. Receptors detect it. Coordination centres receive/process signals. Effectors are muscles or glands. CNS is brain and spinal cord. Reflex route: Withdrawal is rapid and automatic, without a conscious decision. Sensory, relay and motor neurones connect receptor to muscle. Synapses: Impulse travels electrically along a neurone. Chemical transmitter is released and diffuses across the gap. It binds to the next cell’s receptors, starting a new impulse. Do not say electricity jumps the synaptic gap. Brain regions: Cerebral cortex: conscious thought, memory and language. Cerebellum: balance and movement coordination. Medulla: breathing and heart rate. Functions are interconnected, not completely isolated. Investigating brain: Study damage, electrical stimulation and MRI scans. Link observations with function, using several kinds of evidence. Delicate tissue and complex connections make treatment difficult. Evaluate benefit against damage risk. Reaction-time practical: Ruler zero at fingers. Drop unpredictably record catch distance. Convert using a suitable table. Repeat, compare mean times. Match ruler, posture, hand and release method. Control anticipation, practice and unsafe distractions.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,366,207" transform="translate(18 18)"><rect width="366" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Control system</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Stimulus is a change.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Receptors detect it.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Coordination centres receive/process signals.</text><path class="section-divider" d="M18 131H348" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Effectors are muscles or glands.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">CNS is brain and spinal cord.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,366,452" transform="translate(18 237)"><rect width="366" height="452" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="348" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Reflex route</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Withdrawal is rapid and automatic, without a</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conscious decision.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sensory, relay and motor neurones connect</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">receptor to muscle.</text><g transform="translate(18 159)"><g class="concept-illustration"><title>Shows sensory, relay and motor routing through the spinal cord rather than a conscious decision path.</title><rect x="259" y="45" width="46" height="136" rx="12" fill="#ede6f5" stroke="#7651a5"/><text class="diagram-label" x="35" y="22" font-size="16" fill="#000000" text-anchor="start">Receptor</text><text class="diagram-label" x="165.0" y="52" font-size="16" fill="#000000" text-anchor="middle">Sensory neurone</text><path d="M35 70L275 70" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M270.61208719054815 72.39712769302102L275 70L270.61208719054815 67.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M282 82L282 156" stroke="#7651a5" stroke-width="2.3" fill="none"/><path d="M279.602872306979 151.61208719054812L282 156L284.397127693021 151.61208719054812" stroke="#7651a5" stroke-width="2" fill="none"/><text class="diagram-label" x="165.0" y="122" font-size="16" fill="#000000" text-anchor="middle">Relay in spinal cord</text><path d="M275 171L35 171" stroke="#468133" stroke-width="2.3" fill="none"/><path d="M39.38791280945186 168.60287230697898L35 171L39.38791280945186 173.39712769302102" stroke="#468133" stroke-width="2" fill="none"/><text class="diagram-label" x="165.0" y="195" font-size="16" fill="#000000" text-anchor="middle">Motor neurone</text><text class="diagram-label" x="35" y="222" font-size="16" fill="#000000" text-anchor="start">Muscle contracts</text><text class="diagram-label" x="165.0" y="250" font-size="16" fill="#000000" text-anchor="middle">Synapses use chemical signals</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,342,273" transform="translate(396 18)"><rect width="342" height="273" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Synapses</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Impulse travels electrically along a</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">neurone.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chemical transmitter is released and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">diffuses across the gap.</text><path class="section-divider" d="M18 153H324" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">It binds to the next cell’s receptors,</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">starting a new impulse.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not say electricity jumps the synaptic</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gap.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,342,251" transform="translate(396 303)"><rect width="342" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Brain regions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cerebral</tspan> <tspan font-weight="700">cortex:</tspan> conscious thought,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">memory and language.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cerebellum:</tspan> balance and movement</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">coordination.</text><path class="section-divider" d="M18 153H324" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Medulla:</tspan> breathing and heart rate.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Functions are interconnected, not</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">completely isolated.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,251" transform="translate(750 18)"><rect width="352" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Investigating brain</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Study damage, electrical stimulation and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">MRI scans.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Link observations with function, using</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">several kinds of evidence.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Delicate tissue and complex connections</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">make treatment difficult.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Evaluate benefit against damage risk.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,295" transform="translate(750 281)"><rect width="352" height="295" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Reaction-time practical</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ruler zero at fingers.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Drop unpredictably</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">record catch distance.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Convert using a suitable table.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat, compare mean times.</text><path class="section-divider" d="M18 175H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Match ruler, posture, hand and release</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">method.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Control anticipation, practice and unsafe</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">distractions.</text></g></g></svg>