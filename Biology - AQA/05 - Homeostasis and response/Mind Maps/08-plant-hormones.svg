<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Plant hormones and responses</title><desc id="map-description">Growth responses: Phototropism: growth response to light. Shoots positive. Gravitropism: response to gravity. Roots positive, shoots negative. Auxin distribution changes growth rates. Plants bend through unequal growth, not locomotion. Shoot towards light: More auxin on shaded side promotes greater cell elongation. Unequal elongation curves the shoot towards light. Gravity and auxin: Horizontal shoot: more lower-side auxin stimulates elongation, bending upwards. Root: more lower-side auxin inhibits elongation. Upper root side grows more, bending down. Do not apply the shoot response unchanged to roots. Seedling practical: Same species, age, starting size, water, temperature and medium. Light: one-sided versus appropriate all-round control. Gravity: horizontal seedlings in darkness and suitable control. Measure lengths and make labelled drawings of growth direction. Use several seedlings and repeat. Auxin applications: Rooting powders: help cuttings establish roots. Selective weedkillers: control unwanted plants, with biodiversity effects. Tissue culture: promotes growth. Link hormone effect to the practical benefit. Gibberellins and ethene: Gibberellins: initiate germination, end dormancy, promote flowering and larger fruit. Ethene: regulates cell division and fruit ripening. Control ripening during storage and transport. Do not confuse a hormone’s role with every plant response.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,422,229" transform="translate(18 18)"><rect width="422" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="404" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Growth responses</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Phototropism:</tspan> growth response to light.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Shoots positive.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gravitropism:</tspan> response to gravity.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Roots positive, shoots negative.</text><path class="section-divider" d="M18 153H404" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Auxin distribution changes growth rates.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Plants bend through unequal growth, not locomotion.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,422,440" transform="translate(18 259)"><rect width="422" height="440" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="404" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Shoot towards light</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More auxin on shaded side promotes greater cell</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">elongation.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Unequal elongation curves the shoot towards light.</text><g transform="translate(18 137)"><g class="concept-illustration"><title>Shows asymmetric shoot elongation bending towards one-sided light, with shaded-side auxin explicitly identified.</title><path d="M18 31L102 31" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M97.61208719054814 33.39712769302101L102 31L97.61208719054814 28.602872306978984" stroke="#b95619" stroke-width="2" fill="none"/><text class="diagram-label" x="10" y="60" font-size="16" fill="#000000" text-anchor="start">Light</text><defs><clipPath id="shoot-cell-marks"><path d="M209.01999999999998 173Q205.01999999999998 104 180.01999999999998 77L200.01999999999998 61Q238.01999999999998 107 231.01999999999998 173Z"/></clipPath></defs><path d="M209.01999999999998 173Q205.01999999999998 104 180.01999999999998 77L200.01999999999998 61Q238.01999999999998 107 231.01999999999998 173Z" fill="#e0ecd6" stroke="#468133" stroke-width="2"/><g clip-path="url(#shoot-cell-marks)"><path d="M221.01999999999998 107L230.01999999999998 107" fill="none" stroke="#468133" stroke-width="1"/><path d="M221.01999999999998 134L230.01999999999998 134" fill="none" stroke="#468133" stroke-width="1"/><path d="M221.01999999999998 158L230.01999999999998 158" fill="none" stroke="#468133" stroke-width="1"/><path d="M209.01999999999998 120L220.01999999999998 120" fill="none" stroke="#468133" stroke-width="1"/><path d="M209.01999999999998 143L220.01999999999998 143" fill="none" stroke="#468133" stroke-width="1"/><path d="M209.01999999999998 162L220.01999999999998 162" fill="none" stroke="#468133" stroke-width="1"/></g><text class="diagram-label" x="193.0" y="205" font-size="16" fill="#000000" text-anchor="middle">Shaded side: more auxin</text><text class="diagram-label" x="193.0" y="232" font-size="16" fill="#000000" text-anchor="middle">More cell elongation on shaded side</text><text class="diagram-label" x="193.0" y="259" font-size="16" fill="#000000" text-anchor="middle">Shoot bends towards light</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,290,295" transform="translate(452 18)"><rect width="290" height="295" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Gravity and auxin</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Horizontal shoot: more lower-side</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">auxin stimulates elongation,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">bending upwards.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Root: more lower-side auxin</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">inhibits elongation.</text><path class="section-divider" d="M18 175H272" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Upper root side grows more,</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">bending down.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not apply the shoot response</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">unchanged to roots.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,290,317" transform="translate(452 325)"><rect width="290" height="317" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Seedling practical</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Same species, age, starting size,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">water, temperature and medium.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Light: one-sided versus</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">appropriate all-round control.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gravity: horizontal seedlings in</text><text class="body-text" x="18" y="185" font-size="16" fill="#000000" font-weight="400" text-anchor="start">darkness and suitable control.</text><path class="section-divider" d="M18 197H272" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Measure lengths and make</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">labelled drawings of growth</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">direction.</text><text class="body-text" x="18" y="286" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use several seedlings and repeat.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,348,229" transform="translate(754 18)"><rect width="348" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="330" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Auxin applications</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rooting</tspan> <tspan font-weight="700">powders:</tspan> help cuttings establish</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">roots.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Selective</tspan> <tspan font-weight="700">weedkillers:</tspan> control unwanted</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">plants, with biodiversity effects.</text><path class="section-divider" d="M18 153H330" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Tissue</tspan> <tspan font-weight="700">culture:</tspan> promotes growth.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Link hormone effect to the practical benefit.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,348,295" transform="translate(754 259)"><rect width="348" height="295" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="330" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Gibberellins and ethene</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gibberellins:</tspan> initiate germination, end</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">dormancy, promote flowering and larger</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fruit.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ethene:</tspan> regulates cell division and fruit</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ripening.</text><path class="section-divider" d="M18 175H330" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Control ripening during storage and</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">transport.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not confuse a hormone’s role with</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">every plant response.</text></g></g></svg>