<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Kidneys and water balance</title><desc id="map-description">Water and losses: Too-concentrated fluids draw water from cells by osmosis. Water leaves lungs sweat loses water, ions and urea. Kidneys regulate urine composition. Water gain/loss must keep cells functioning efficiently. Urea production: Protein digestion yields amino acids. Excess is deaminated in liver, producing toxic ammonia. Ammonia is converted into urea. Blood carries urea to kidneys for excretion in urine. Filter and reabsorb: Small water, ions, glucose and urea enter filtrate. Cells and large proteins remain in blood. Normally all glucose and suitable water/ions are reabsorbed. Filtration alone does not select only harmful substances. ADH response: More-concentrated blood stimulates increased ADH release. Less ADH gives larger, more dilute urine. Dialysis: Blood and suitable fluid separated by partially permeable membrane. Urea diffuses down its concentration gradient. Matched glucose/ion levels limit unwanted loss. Cells/proteins cannot cross. Repeated sessions burden time and daily life. Transplant: Donor kidney can restore more normal regulation. Requires donor availability, surgery and immune suppression. Rejection and increased infection risk are limitations. Compare suitability and likely outcome with dialysis.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,273" transform="translate(18 18)"><rect width="290" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Water and losses</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Too-concentrated fluids draw</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">water from cells by osmosis.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water leaves lungs</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sweat loses water, ions and urea.</text><path class="section-divider" d="M18 153H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Kidneys regulate urine</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">composition.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water gain/loss must keep cells</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">functioning efficiently.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,251" transform="translate(18 303)"><rect width="290" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Urea production</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Protein digestion yields amino</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">acids.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Excess is deaminated in liver,</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">producing toxic ammonia.</text><path class="section-divider" d="M18 153H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ammonia is converted into urea.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blood carries urea to kidneys for</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">excretion in urine.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,438,207" transform="translate(320 18)"><rect width="438" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="420" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Filter and reabsorb</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Small water, ions, glucose and urea enter filtrate.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cells and large proteins remain in blood.</text><path class="section-divider" d="M18 109H420" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Normally all glucose and suitable water/ions are</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reabsorbed.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Filtration alone does not select only harmful substances.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,438,420" transform="translate(320 237)"><rect width="438" height="420" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="420" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">ADH response</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More-concentrated blood stimulates increased ADH</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">release.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Less ADH gives larger, more dilute urine.</text><g transform="translate(18 137)"><g class="concept-illustration"><title>Connects concentrated blood to increased ADH, water permeability/reabsorption and the resulting urine changes.</title><text class="diagram-label" x="201.0" y="16" font-size="16" fill="#000000" text-anchor="middle">Concentrated blood</text><path d="M201.0 28L201.0 50" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M198.60287230697898 45.61208719054814L201.0 50L203.39712769302102 45.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="201.0" y="75" font-size="16" fill="#000000" text-anchor="middle">Pituitary releases more ADH</text><text class="diagram-label" x="201.0" y="102" font-size="16" fill="#000000" text-anchor="middle">Tubules become more permeable</text><text class="diagram-label" x="201.0" y="129" font-size="16" fill="#000000" text-anchor="middle">More water is reabsorbed</text><path d="M201.0 142L201.0 162" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M198.60287230697898 157.61208719054812L201.0 162L203.39712769302102 157.61208719054812" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="201.0" y="186" font-size="16" fill="#000000" text-anchor="middle">Small, concentrated urine volume</text><text class="diagram-label" x="201.0" y="213" font-size="16" fill="#000000" text-anchor="middle">Blood becomes less concentrated</text><text class="diagram-label" x="201.0" y="240" font-size="16" fill="#000000" text-anchor="middle">ADH release then reduces</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,332,295" transform="translate(770 18)"><rect width="332" height="295" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="314" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Dialysis</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blood and suitable fluid separated by</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">partially permeable membrane.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Urea diffuses down its concentration</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gradient.</text><path class="section-divider" d="M18 153H314" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Matched glucose/ion levels limit</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">unwanted loss.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cells/proteins cannot cross.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeated sessions burden time and daily</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">life.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,332,273" transform="translate(770 325)"><rect width="332" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="314" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Transplant</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Donor kidney can restore more normal</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">regulation.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Requires donor availability, surgery and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">immune suppression.</text><path class="section-divider" d="M18 153H314" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rejection and increased infection risk are</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">limitations.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare suitability and likely outcome</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">with dialysis.</text></g></g></svg>