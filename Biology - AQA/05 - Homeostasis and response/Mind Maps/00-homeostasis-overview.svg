ll="#000000" font-weight="400" text-anchor="start">Feedback opposes the original change.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,229" transform="translate(336 259)"><rect width="350" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Kidneys and water</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Liver makes urea.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Kidneys filter and selectively reabsorb.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">More</tspan> <tspan font-weight="700">ADH:</tspan> more water reabsorbed,</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">smaller concentrated urine volume.</text><path class="section-divider" d="M18 153H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dialysis removes waste</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">transplant has benefits and rejection risks.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,404,251" transform="translate(698 18)"><rect width="404" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.