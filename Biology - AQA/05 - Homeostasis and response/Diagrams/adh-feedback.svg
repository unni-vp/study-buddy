<svg xmlns="http://www.w3.org/2000/svg" width="580" height="252" viewBox="0 0 580 252" role="img" font-family="Segoe UI, Arial, sans-serif"><title>Connects concentrated blood to increased ADH, water permeability/reabsorption and the resulting urine changes.</title><rect width="100%" height="100%" fill="white"/><g class="concept-illustration"><title>Connects concentrated blood to increased ADH, water permeability/reabsorption and the resulting urine changes.</title><text class="diagram-label" x="290.0" y="16" font-size="16" fill="#000000" text-anchor="middle">Concentrated blood</text><path d="M290.0 28L290.0 50" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M287.602872306979 45.61208719054814L290.0 50L292.397127693021 45.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="290.0" y="75" font-size="16" fill="#000000" text-anchor="middle">Pituitary releases more ADH</text><text class="diagram-label" x="290.0" y="102" font-size="16" fill="#000000" text-anchor="middle">Tubules become more permeable</text><text class="diagram-label" x="290.0" y="129" font-size="16" fill="#000000" text-anchor="middle">More water is reabsorbed</text><path d="M290.0 142L290.0 162" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M287.602872306979 157.61208719054812L290.0 162L292.397127693021 157.61208719054812" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="290.0" y="186" font-size="16" fill="#000000" text-anchor="middle">Small, concentrated urine volume</text><text class="diagram-label" x="290.0" y="213" font-size="16" fill="#000000" text-anchor="middle">Blood becomes less concentrated</text><text class="diagram-label" x="290.0" y="240" font-size="16" fill="#000000" text-anchor="middle">ADH release then reduces</text></g></svg>