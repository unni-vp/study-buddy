roke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M720 360Q755 320 770 340Q760 370 720 360" fill="#a5cba3" stroke="#147a70" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M590 180L675 220" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M663.0006190334208 220.12188691027706L675 220L667.4455878813458 210.6763281084366" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M845 180L760 220" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M767.5544121186542 210.6763281084366L760 220L771.9993809665792 220.12188691027706" fill="none" stroke="#ad4c10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="520" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Keep species, age, water, temperature and time the same.</text><text x="35" y="550" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Record lengths and labelled drawings; compare several seedlings.</text></g></svg>