<svg xmlns="http://www.w3.org/2000/svg" width="580" height="227" viewBox="0 0 580 227" role="img" font-family="Segoe UI, Arial, sans-serif"><title>Shows the original egg nucleus, its removal and replacement by an adult donor nucleus before embryo development.</title><rect width="100%" height="100%" fill="white"/><g class="concept-illustration"><title>Shows the original egg nucleus, its removal and replacement by an adult donor nucleus before embryo development.</title><circle cx="87.0" cy="70" r="29" fill="#f7f9fb" stroke="#9fb1bc"/><circle cx="87.0" cy="70" r="10" fill="#aab9c3"/><circle cx="290.0" cy="70" r="29" fill="#f7f9fb" stroke="#9fb1bc"/><circle cx="493.0" cy="70" r="29" fill="#f7f9fb" stroke="#9fb1bc"/><circle cx="493.0" cy="70" r="10" fill="#b95619"/><path d="M123.0 70L254.0 70" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M249.61208719054812 72.39712769302102L254.0 70L249.61208719054812 67.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M326.0 70L457.0 70" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M452.61208719054815 72.39712769302102L457.0 70L452.61208719054815 67.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="87.0" y="121" font-size="16" fill="#000000" text-anchor="middle">Egg nucleus</text><text class="diagram-label" x="290.0" y="121" font-size="16" fill="#000000" text-anchor="middle">Removed</text><text class="diagram-label" x="493.0" y="121" font-size="16" fill="#000000" text-anchor="middle">Adult nucleus</text><text class="diagram-label" x="290.0" y="159" font-size="16" fill="#000000" text-anchor="middle">New cell has adult donor’s nuclear DNA</text><text class="diagram-label" x="290.0" y="187" font-size="16" fill="#000000" text-anchor="middle">Electric stimulus starts embryo division</text><text class="diagram-label" x="290.0" y="215" font-size="16" fill="#000000" text-anchor="middle">Embryo transferred to a host uterus</text></g></svg>