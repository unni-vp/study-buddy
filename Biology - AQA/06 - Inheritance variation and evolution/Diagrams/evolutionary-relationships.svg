ram-label" x="290.0" y="243" font-size="16" fill="#000000" text-anchor="middle">A and B share a more recent ancestor</text><text class="diagram-label" x="290.0" y="270" font-size="16" fill="#000000" text-anchor="middle">than A and C</text></g></svg>