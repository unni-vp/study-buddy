<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Evidence, inheritance discoveries and extinction</title><desc id="map-description">Darwin and Wallace: Both proposed natural selection. Darwin published Origin of Species in 1859. Wallace’s work prompted joint publication. Later evidence helped acceptance. Earlier explanations: Lamarck: acquired changes passed to offspring. This is generally unsupported genetically. Darwin challenged fixed-creation beliefs. Early evidence and inheritance knowledge were limited. Mendel to DNA: Pea crosses suggested inherited units. Later chromosome studies supported gene theory. DNA structure and function explained inheritance. New evidence develops scientific explanations. Fossil formation: Hard parts mineralised. Decay prevented: amber, ice, suitable conditions. Traces: footprints, burrows. Soft bodies and geological change leave gaps. Evidence and extinction: Fossils show life, change and extinction. DNA similarities support shared ancestors. Change, disease, predators or competition can cause extinction. No survivors remain in an extinct species. Resistance and responses: Selection increases resistant bacterial populations. Resistant strains can spread between people. Restrict unnecessary antibiotic use. New drug development is slower than bacterial reproduction.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,342,229" transform="translate(18 18)"><rect width="342" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Darwin and Wallace</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Both proposed natural selection.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Darwin published Origin of Species in</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1859.</tex