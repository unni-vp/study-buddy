<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Selective breeding and genetic engineering</title><desc id="map-description">Selective breeding: Choose parents with desired features. Breed, select best offspring, breed again. Repeat over many generations. Humans select, rather than environmental survival alone. Useful outcomes: Disease-resistant crops, higher yields. Animals producing more meat or milk. Dogs with gentle behaviour. Flowers with desirable colours or size. Inbreeding risk: Reduced diversity from related parents. Harmful recessive alleles more likely paired. Population may share disease vulnerability. Compare benefit with welfare and diversity. Gene transfer: Enzymes isolate gene and cut vector. Applications: Bacteria express human insulin gene. Crops resist pests, disease or herbicides. Modified animals may yield useful substances. Gene therapy seeks to address inherited disorders. Evaluate evidence: Possible yield and reduced pesticide benefits. Non-target species and gene transfer concerns. Consider cost, access and long-term resistance. Use trials and local alternatives, not blanket claims.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,330,207" transform="translate(18 18)"><rect width="330" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Selective breeding</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Choose parents with desired features.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Breed, select best offspring, breed again.</text><path class="section-divider" d="M18 109H312" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat over many generations.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Humans select, rather than</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">environmental survival alone.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,330,185" transform="translate(18 237)"><rect width="330" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Useful outcomes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Disease-resistant crops, higher yields.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Animals producing more meat or milk.</text><path class="section-divider" d="M18 109H312" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dogs with gentle behaviour.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Flowers with desirable colours or size.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,378,185" transform="translate(360 18)"><rect width="378" height="185" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="360" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Inbreeding risk</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Reduced diversity from related parents.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Harmful recessive alleles more likely paired.</text><path class="section-divider" d="M18 109H360" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Population may share disease vulnerability.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare benefit with welfare and diversity.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,378,335" transform="translate(360 215)"><rect width="378" height="335" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="360" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Gene transfer</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Enzymes isolate gene and cut vector.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Shows an actual gap in plasmid DNA being filled with a highlighted donor gene before transfer to target cells.</title><text class="diagram-label" x="171.0" y="16" font-size="16" fill="#000000" text-anchor="middle">Enzymes isolate the required gene</text><rect x="147.0" y="26" width="48" height="8" fill="#b95619"/><path d="M110.614 61.5A29 29 0 1 0 110.614 90.5" fill="none" stroke="#2366a0" stroke-width="4"/><path d="M281.614 61.5A29 29 0 1 0 281.614 90.5" fill="none" stroke="#2366a0" stroke-width="4"/><path d="M281.614 90.5A29 29 0 0 0 281.614 61.5" fill="none" stroke="#b95619" stroke-width="4"/><path d="M122.5 76L219.5 76" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M215.11208719054812 78.39712769302102L219.5 76L215.11208719054812 73.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="85.5" y="135" font-size="16" fill="#000000" text-anchor="middle">Cut plasmid</text><text class="diagram-label" x="256.5" y="135" font-size="16" fill="#000000" text-anchor="middle">Gene inserted</text><text class="diagram-label" x="171.0" y="172" font-size="16" fill="#000000" text-anchor="middle">Vector carries gene into target cells</text><text class="diagram-label" x="171.0" y="199" font-size="16" fill="#000000" text-anchor="middle">Cells can express the desired protein</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,229" transform="translate(750 18)"><rect width="352" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Applications</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bacteria express human insulin gene.</text><text class="body-text" x="18" y="97"