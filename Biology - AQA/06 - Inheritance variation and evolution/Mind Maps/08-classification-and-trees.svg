<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Classification and evolutionary relationships</title><desc id="map-description">Linnaean hierarchy: Kingdom, phylum, class, order. Family, genus, species. Groups become narrower down hierarchy. Use characteristics to identify relationships. Binomial names: Genus plus species identifies an organism. Genus capitalised, species lower case. Example: Homo sapiens. Scientific names avoid common-name ambiguity. New evidence: Microscopes reveal cell differences. Biochemical/genetic evidence compares organisms. Classification changes when evidence improves. Similar appearance alone can mislead. Three domains: Archaea: distinct prokaryotes, many extreme-habitat examples. Bacteria: bacterial prokaryotes. Eukaryota: protists, fungi, plants, animals. Domains are not simply three kingdoms. Read branching joins: Joins represent shared ancestors. Interpret carefully: More recent shared ancestor: closer relationship. Do not judge by tip spacing alone. Modern neighbouring species need not be ancestors. Trees use living-organism and fossil evidence.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,294,229" transform="translate(18 18)"><rect width="294" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="276" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Linnaean hierarchy</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Kingdom, phylum, class, order.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Family, genus, species.</text><path class="section-divider" d="M18 109H276" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Groups become narrower down</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hierarchy.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use characteristics to identify</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">relationships.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,294,251" transform="translate(18 259)"><rect width="294" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="276" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Binomial names</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Genus plus species identifies an</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">organism.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Genus capitalised, species lower</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">case.</text><path class="section-divider" d="M18 153H276" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Example: Homo sapiens.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Scientific names avoid</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">common-name ambiguity.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,229" transform="translate(324 18)"><rect width="350" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">New evidence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Microscopes reveal cell differences.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Biochemical/genetic evidence compares</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">organisms.</text><path class="section-divider" d="M18 131H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Classification changes when evidence</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">improves.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Similar appearance alone can mislead.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,207" transform="translate(324 259)"><rect width="350" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Three domains</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Archaea: distinct prokaryotes, many</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">extreme-habitat examples.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bacteria: bacterial prokaryotes.</text><path class="section-divider" d="M18 131H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Eukaryota: protists, fungi, plants, animals.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Domains are not simply three kingdoms.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,416,406" transform="translate(686 18)"><rect width="416" height="406" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="398" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Read branching joins</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Joins represent shared ancestors.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Locates shared ancestors at branching joins rather than judging relationships from adjacent tip positions.</title><text class="diagram-label" x="45.6" y="16" font-size="16" fill="#000000" text-anchor="middle">A</text><text class="diagram-label" x="140.6" y="16" font-size="16" fill="#000000" text-anchor="middle">B</text><text class="diagram-label" x="239.4" y="16" font-size="16" fill="#000000" text-anchor="middle">C</text><text class="diagram-label" x="334.4" y="16" font-size="16" fill="#000000" text-anchor="middle">D</text><path d="M45.6 33L45.6 73" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M45.6 73L93.1 112" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M140.6 33L140.6 73" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M140.6 73L93.1 112" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M93.1 112L93.1 143" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M93.1 143L190.0 183" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M239.4 33L239.4 73" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M239.4 73L286.9 112" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M334.4 33L334.4 73" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M334.4 73L286.9 112" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M286.9 112L286.9 143" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M286.9 143L190.0 183" fill="none" stroke="#2366a0" stroke-width="2"/><circle cx="190.0" cy="183" r="4" fill="#7651a5"/><text class="diagram-label" x="190.0" y="215" font-size="16" fill="#000000" text-anchor="middle">Joins represent shared ancestors</text><text class="diagram-label" x="190.0" y="243" font-size="16" fill="#000000" text-anchor="middle">A and B share a more recent ancestor</text><text class="diagram-label" x="190.0" y="270" font-size="16" fill="#000000" text-anchor="middle">than A and C</text></g></g></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,416,185" transform="translate(686 436)"><rect width="416" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="398" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Interpret carefully</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More recent shared ancestor: closer relationship.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not judge by tip spacing alone.</text><path class="section-divider" d="M18 109H398" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Modern neighbouring species need not be ancestors.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Trees use living-organism and fossil evidence.</text></g></g></svg>