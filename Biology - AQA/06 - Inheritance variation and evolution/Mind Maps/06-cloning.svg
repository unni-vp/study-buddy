<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Cloning methods and evaluation</title><desc id="map-description">Plant cuttings: Take part of a parent plant. Grow roots and shoots under suitable conditions. Rapid, low-cost copies of useful plants. Clones share genotype, not necessarily phenotype. Tissue culture: Small groups of plant cells. Nutrients, suitable hormones and sterile conditions. Grow many genetically identical plants. Useful for valuable or rare varieties. Embryo splitting: Split cells from an early animal embryo. Transfer resulting embryos into host mothers. Offspring identical to embryo source. Not the same as adult nucleus transfer. Adult nucleus transfer: Remove unfertilised egg nucleus. Uses and limits: Preserve valuable nuclear genetic information. Increase numbers of useful or threatened organisms. Success can be low. Consider welfare and costs. Cloning does not solve habitat loss. Diversity and accuracy: Little new genetic variation among clones. Shared disease/environmental vulnerability. Adult donor supplies nuclear DNA. Egg donor and host have different roles.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,330,229" transform="translate(18 18)"><rect width="330" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Plant cuttings</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Take part of a parent plant.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Grow roots and shoots under suitable</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conditions.</text><path class="section-divider" d="M18 131H312" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rapid, low-cost copies of useful plants.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Clones share genotype, not necessarily</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">phenotype.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,330,207" transform="translate(18 259)"><rect width="330" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Tissue culture</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Small groups of plant cells.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Nutrients, suitable hormones and sterile</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conditions.</text><path class="section-divider" d="M18 131H312" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Grow many genetically identical plants.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Useful for valuable or rare varieties.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,378,185" transform="translate(360 18)"><rect width="378" height="185" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="360" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Embryo splitting</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Split cells from an early animal embryo.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Transfer resulting embryos into host mothers.</text><path class="section-divider" d="M18 109H360" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Offspring identical to embryo source.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Not the same as adult nucleus transfer.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,378,351" transform="translate(360 215)"><rect width="378" height="351" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="360" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Adult nucleus transfer</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Remove unfertilised egg nucleus.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Shows the original egg nucleus, its removal and replacement by an adult donor nucleus before embryo development.</title><circle cx="51.3" cy="70" r="29" fill="#f7f9fb" stroke="#9fb1bc"/><circle cx="51.3" cy="70" r="10" fill="#aab9c3"/><circle cx="171.0" cy="70" r="29" fill="#f7f9fb" stroke="#9fb1bc"/><circle cx="290.7" cy="70" r="29" fill="#f7f9fb" stroke="#9fb1bc"/><circle cx="290.7" cy="70" r="10" fill="#b95619"/><path d="M87.3 70L135.0 70" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M130.61208719054812 72.39712769302102L135.0 70L130.61208719054812 67.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M207.0 70L254.7 70" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M250.3120871905481 72.39712769302102L254.7 70L250.3120871905481 67.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="51.3" y="121" font-size="16" fill="#000000" text-anchor="middle">Egg nucleus</text><text class="diagram-label" x="171.0" y="121" font-size="16" fill="#000000" text-anchor="middle">Removed</text><text class="diagram-label" x="290.7" y="121" font-size="16" fill="#000000" text-anchor="middle">Adult nucleus</text><text class="diagram-label" x="171.0" y="159" font-size="16" fill="#000000" text-anchor="middle">New cell has adult donor’s nuclear DNA</text><text class="diagram-label" x="171.0" y="187" font-size="16" fill="#000000" text-anchor="middle">Electric stimulus starts embryo division</text><text class="diagram-label" x="171.0" y="215" font-size="16" fill="#000000" text-anchor="middle">Embryo transferred to a host uterus</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,251" transform="translate(750 18)"><rect width="352" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Uses and limits</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Preserve valuable nuclear genetic</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">information.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Increase numbers of useful or threatened</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">organisms.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Success can be low.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Consider welfare and costs.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cloning does not solve habitat loss.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,185" transform="translate(750 281)"><rect width="352" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Diversity and accuracy</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Little new genetic variation among clones.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Shared disease/environmental vulnerability.</text><path class="section-divider" d="M18 109H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Adult donor supplies nuclear DNA.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Egg donor and host have different roles.</text></g></g></svg>