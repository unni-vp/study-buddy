<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">DNA, genes and proteins</title><desc id="map-description">Information packaging: DNA forms a double helix. Chromosomes contain many genes. Gene: codes for an amino-acid sequence. Genome includes coding and non-coding DNA. DNA building blocks: Unwound segment: paired bases and backbone. From code to chain: Three bases code for one amino acid. Template reaches ribosome. Carrier molecules bring amino acids. Amino acids join in specified order. Shape and function: Chain folds into a specific shape. Enzyme: active site fits substrate. Hormone: binds suitable receptors. Structural proteins provide support. Variants and expression: Coding variants can change amino-acid sequence. Shape and activity may change. Non-coding variants can affect expression. Most mutations have no or small effects. Genome research: Identify genes linked to disorders. Understand inherited disease and treatments. Trace historical human migration. DNA is the chemical, not another organelle.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,398,185" transform="translate(18 18)"><rect width="398" height="185" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Information packaging</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">DNA forms a double helix.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chromosomes contain many genes.</text><path class="section-divider" d="M18 109H380" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Gene: codes for an amino-acid sequence.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Genome includes coding and non-coding DNA.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,398,391" transform="translate(18 215)"><rect width="398" height="391" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">DNA building blocks</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Unwound segment: paired bases and backbone.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Distinguishes repeating sugar/phosphate backbone from paired bases, with the components of a nucleotide labelled.</title><path d="M115.84 32L115.84 168" fill="none" stroke="#87979e" stroke-width="2"/><rect x="110.84" y="45" width="10" height="10" fill="#468133"/><circle cx="115.84" cy="27" r="5" fill="#b95619"/><rect x="110.84" y="99" width="10" height="10" fill="#468133"/><circle cx="115.84" cy="81" r="5" fill="#b95619"/><rect x="110.84" y="153" width="10" height="10" fill="#468133"/><circle cx="115.84" cy="135" r="5" fill="#b95619"/><path d="M242.54000000000002 32L242.54000000000002 168" fill="none" stroke="#87979e" stroke-width="2"/><rect x="237.54000000000002" y="45" width="10" height="10" fill="#468133"/><circle cx="242.54000000000002" cy="27" r="5" fill="#b95619"/><rect x="237.54000000000002" y="99" width="10" height="10" fill="#468133"/><circle cx="242.54000000000002" cy="81" r="5" fill="#b95619"/><rect x="237.54000000000002" y="153" width="10" height="10" fill="#468133"/><circle cx="242.54000000000002" cy="135" r="5" fill="#b95619"/><path d="M122.84 50L235.54000000000002 50" fill="none" stroke="#7b9bb6" stroke-width="2"/><text class="diagram-label" x="145.84" y="44" font-size="16" fill="#000000" text-anchor="start">A</text><text class="diagram-label" x="211.54000000000002" y="44" font-size="16" fill="#000000" text-anchor="start">T</text><path d="M122.84 104L235.54000000000002 104" fill="none" stroke="#7b9bb6" stroke-width="2"/><text class="diagram-label" x="145.84" y="98" font-size="16" fill="#000000" text-anchor="start">C</text><text class="diagram-label" x="211.54000000000002" y="98" font-size="16" fill="#000000" text-anchor="start">G</text><path d="M122.84 158L235.54000000000002 158" fill="none" stroke="#7b9bb6" stroke-width="2"/><text class="diagram-label" x="145.84" y="152" font-size="16" fill="#000000" text-anchor="start">T</text><text class="diagram-label" x="211.54000000000002" y="152" font-size="16" fill="#000000" text-anchor="start">A</text><text class="diagram-label" x="181.0" y="197" font-size="16" fill="#000000" text-anchor="middle">Paired bases: A–T and C–G</text><rect x="5" y="215" width="10" height="10" fill="#468133"/><text class="diagram-label" x="22" y="225" font-size="16" fill="#000000" text-anchor="start">Sugar</text><circle cx="117" cy="220" r="5" fill="#b95619"/><text class="diagram-label" x="132" y="225" font-size="16" fill="#000000" text-anchor="start">Phosphate</text><text class="diagram-label" x="181.0" y="255" font-size="16" fill="#000000" text-anchor="middle">One nucleotide: sugar, phosphate, base</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,310,185" transform="translate(428 18)"><rect width="310" height="185" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="292" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="