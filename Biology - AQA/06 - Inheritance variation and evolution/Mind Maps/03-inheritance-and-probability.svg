<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Inheritance and probability</title><desc id="map-description">Essential terms: Allele: version of a gene. Genotype: allele combination. Phenotype: expressed characteristic. Homozygous: same alleles. Heterozygous: different. Dominant and recessive: Dominant expressed with one copy. Recessive expressed with two copies in simple model. Dominant does not mean common or stronger. Many characteristics involve several genes. Carrier cross: Aa × Aa: both parents produce A or a. Inherited conditions: CF: recessive. Two carriers can have affected child. Polydactyly: dominant allele. Family trees require linked parent/child reasoning. Skipped generations alone is weak evidence. Sex inheritance: Usual model: XX female, XY male. Eggs X. Sperm X or Y. XX/XY each probability 1/2. Chance does not guarantee equal family counts. Interpret and evaluate: Expected number: probability × sample size. 1/4 affected means affected:unaffected 1:3. Embryo screening can inform choices. Evaluate severity, uncertainty, cost and ethics.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,310,207" transform="translate(18 18)"><rect width="310" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="292" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Essential terms</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Allele: version of a gene.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Genotype: allele combination.</text><path class="section-divider" d="M18 109H292" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Phenotype: expressed characteristic.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Homozygous: same alleles.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heterozygous: different.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,310,251" transform="translate(18 237)"><rect width="310" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="292" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Dominant and recessive</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dominant expressed with one copy.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Recessive expressed with two copies</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">in simple model.</text><path class="section-divider" d="M18 131H292" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dominant does not mean common or</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stronger.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many characteristics involve several</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">genes.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,398,376" transform="translate(340 18)"><rect width="398" height="376" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Carrier cross</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Aa × Aa: both parents produce A or a.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Shows carrier-cross gametes, all four offspring combinations and correct denominator for disease and carrier probabilities.</title><text class="diagram-label" x="181.0" y="16" font-size="16" fill="#000000" text-anchor="middle">Two carriers: Aa × Aa</text><text class="diagram-label" x="181.0" y="55" font-size="16" fill="#000000" text-anchor="middle">A</text><text class="diagram-label" x="125.0" y="98.0" font-size="16" fill="#000000" text-anchor="middle">A</text><text class="diagram-label" x="237.0" y="55" font-size="16" fill="#000000" text-anchor="middle">a</text><text class="diagram-label" x="125.0" y="154.0" font-size="16" fill="#000000" text-anchor="middle">a</text><rect x="153.0" y="65" width="56" height="56" fill="#eef5fa" stroke="#9db0bd"/><text class="diagram-label" x="181.0" y="98.0" font-size="16" fill="#000000" text-anchor="middle">AA</text><rect x="209.0" y="65" width="56" height="56" fill="#eef5fa" stroke="#9db0bd"/><text class="diagram-label" x="237.0" y="98.0" font-size="16" fill="#000000" text-anchor="middle">Aa</text><rect x="153.0" y="121" width="56" height="56" fill="#eef5fa" stroke="#9db0bd"/><text class="diagram-label" x="181.0" y="154.0" font-size="16" fill="#000000" text-anchor="middle">Aa</text><rect x="209.0" y="121" width="56" height="56" fill="#f5dfd6" stroke="#9db0bd"/><text class="diagram-label" x="237.0" y="154.0" font-size="16" fill="#000000" text-anchor="middle">aa</text><text class="diagram-label" x="181.0" y="213" font-size="16" fill="#000000" text-anchor="middle">aa: 1 of 4, probability 25%</text><text class="diagram-label" x="181.0" y="240" font-size="16" fill="#000000" text-anchor="middle">Aa: 2 of 4, carriers 50%</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,398,207" transform="translate(340 406)"><rect width="398" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="380" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Inherited conditions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">CF: recessive.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Two carriers can have affected child.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Polydactyly: dominant allele.</text><path class="section-divider" d="M18 131H380" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Family trees require linked parent/child reasoning.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Skipped generations alone is weak evidence.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,229" transform="translate(750 18)"><rect width="352" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Sex inheritance</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Usual model: XX female, XY male.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Eggs X.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sperm X or Y.</text><path class="section-divider" d="M18 131H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">XX/XY each probability 1/2.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chance does not guarantee equal family</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">counts.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,207" transform="translate(750 259)"><rect width="352" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Interpret and evaluate</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Expected number: probability × sample size.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1/4 affected means affected:unaffected 1:3.</text><path class="section-divider" d="M18 109H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Embryo screening can inform choices.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Evaluate severity, uncertainty, cost and</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ethics.</text></g></g></svg>