<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Photosynthesis &amp; limiting factors</title><desc id="map-description">The reaction: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ Chlorophyll absorbs light. Energy transfers from the environment to chloroplasts. The reaction is endothermic. Carbon dioxide enters through stomata. Roots and xylem supply water. Light supplies energy, rather than material. Glucose pathways: Respiration: transfers energy. Starch and fats or oils: store resources. Cellulose: strengthens cell walls. Glucose and nitrogen from nitrate ions form amino acids. These are used to build proteins. Four interacting factors: More light or carbon dioxide raises the rate only while that factor is limiting. Warming towards the optimum increases enzyme activity. Excess heat can denature enzymes. Less chlorophyll means less light absorption. Magnesium deficiency or disease can reduce chlorophyll. Interpret the plateau: Rising rate with light: light is limiting. Plateau: another factor limits the rate. Keep other conditions the same when comparing curves. If adding carbon dioxide raises the rate, carbon dioxide was limiting. A plateau alone does not identify which other factor is limiting. Inverse-square law: Intensity ∝ 1/distance² I₂/I₁ = (d₁/d₂)² 20 cm to 40 cm: intensity becomes ¼. 30 cm to 15 cm: intensity becomes 4 times greater. Use consistent units. The photosynthesis rate need not change by the same factor. Greenhouse decisions: Heating, lighting and added carbon dioxide cost money. Improve the actual limiting factor. Extra profit = extra crop income − extra cost £240 − £170 = £70. The highest photosynthesis rate is not always the most profitable setting.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,330" transform="translate(18 18)"><rect width="290" height="330" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">The reaction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">6CO₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">6H₂O</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">C₆H₁₂O₆</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">6O₂</tspan></text><path class="section-divider" d="M18 87H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chlorophyll absorbs light.</text><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Energy transfers from the</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">environment to chloroplasts.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The reaction is <tspan font-weight="700">endothermic.</tspan></text><path class="section-divider" d="M18 188H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Carbon dioxide enters through</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stomata.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Roots and xylem supply water.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Light supplies energy, rather than</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">material.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,251" transform="translate(18 360)"><rect width="290" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Glucose pathways</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Respiration:</tspan> transfers energy.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Starch</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">fats</tspan> <tspan font-weight="700">or</tspan> <tspan font-weight="700">oils:</tspan> store</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">resources.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cellulose:</tspan> strengthens cell walls.</text><path class="section-divider" d="M18 153H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Glucose and nitrogen from <tspan font-weight="700">nitrate</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">ions</tspan> form amino acids.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">These are used to build proteins.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,438,242" transform="translate(320 18)"><rect width="438" height="242" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="420" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Four interacting factors</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More light or carbon dioxide raises the rate only while</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">that factor is limiting.</text><path class="section-divider" d="M18 109H420" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Warming towards the optimum increases enzyme activity.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Excess heat can <tspan font-weight="700">denature</tspan> <tspan font-weight="700">enzymes.</tspan></text><path class="section-divider" d="M18 166H420" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Less chlorophyll means less light absorption.</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Magnesium deficiency or disease can reduce chlorophyll.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,438,476" transform="translate(320 272)"><rect width="438" height="476" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="420" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Interpret the plateau</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rising</tspan> <tspan font-weight="700">rate</tspan> <tspan font-weight="700">with</tspan> <tspan font-weight="700">light:</tspan> light is limiting.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Plateau:</tspan> another factor limits the rate.</text><g transform="translate(18 115)"><g class="explanatory-diagram" data-diagram="limiting"><title>Two schematic curves show the effect of increased carbon dioxide at fixed temperature and chlorophyll.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Photosynthesis rate</text><path d="M15 135L15 29" stroke="#000000" stroke-width="2.3" fill="none"/><path d="M17.397127693021016 33.38791280945186L15 29L12.602872306978984 33.38791280945186" stroke="#000000" stroke-width="2" fill="none"/><path d="M15 135L399 135" stroke="#000000" stroke-width="2.3" fill="none"/><path d="M394.61208719054815 137.39712769302102L399 135L394.61208719054815 132.60287230697898" stroke="#000000" stroke-width="2" fill="none"/><path d="M19 132C55 115 70 93 120 93H387" stroke="#2366a0" stroke-width="2.5" fill="none"/><path d="M19 132C55 115 80 54 160 54H387" stroke="#468133" stroke-width="2.5" fill="none"/><text class="diagram-label" x="387" y="46" font-size="16" fill="#000000" text-anchor="end">Higher CO₂</text><text class="diagram-label" x="387" y="85" font-size="16" fill="#000000" text-anchor="end">Lower CO₂</text><text class="diagram-label" x="201.0" y="160" font-size="16" fill="#000000" text-anchor="middle">Light intensity</text><text class="diagram-label" x="201.0" y="184" font-size="16" fill="#000000" text-anchor="middle">Same temperature and chlorophyll</text></g></g><path class="section-divider" d="M18 321H420" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="344" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep other conditions the same when comparing curves.</text><text class="body-text" x="18" y="366" font-size="16" fill="#000000" font-weight="400" text-anchor="start">If adding carbon dioxide raises the rate, carbon dioxide</text><text class="body-text" x="18" y="388" font-size="16" fill="#000000" font-weight="400" text-anchor="start">was limiting.</text><path class="section-divider" d="M18 400H420" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="423" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A plateau alone does not identify which other factor is</text><text class="body-text" x="18" y="445" font-size="16" fill="#000000" font-weight="400" text-anchor="start">limiting.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,332,299" transform="translate(770 18)"><rect width="332" height="299" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="314" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Inverse-square law</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Intensity</tspan> <tspan font-weight="700">∝</tspan> <tspan font-weight="700">1/distance²</tspan></text><path class="section-divider" d="M18 87H314" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">I₂/I₁</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">(d₁/d₂)²</tspan></text><path class="section-divider" d="M18 122H314" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="145" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">20</tspan> <tspan font-weight="700">cm</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">40</tspan> <tspan font-weight="700">cm:</tspan> intensity becomes ¼.</text><text class="body-text" x="18" y="167" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">30</tspan> <tspan font-weight="700">cm</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">15</tspan> <tspan font-weight="700">cm:</tspan> intensity becomes 4</text><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">times greater.</text><path class="section-divider" d="M18 201H314" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="224" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use consistent units.</text><text class="body-text" x="18" y="246" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The photosynthesis rate need not change</text><text class="body-text" x="18" y="268" font-size="16" fill="#000000" font-weight="400" text-anchor="start">by the same factor.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,332,299" transform="translate(770 329)"><rect width="332" height="299" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="314" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Greenhouse decisions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heating, lighting and added carbon</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">dioxide cost money.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Improve the actual limiting factor.</text><path class="section-divider" d="M18 131H314" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Extra</tspan> <tspan font-weight="700">profit</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">extra</tspan> <tspan font-weight="700">crop</tspan> <tspan font-weight="700">income</tspan> <tspan font-weight="700">−</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">extra</tspan> <tspan font-weight="700">cost</tspan></text><path class="section-divider" d="M18 188H314" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">£240 − £170 = <tspan font-weight="700">£70.</tspan></text><path class="section-divider" d="M18 223H314" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="246" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The highest photosynthesis rate is not</text><text class="body-text" x="18" y="268" font-size="16" fill="#000000" font-weight="400" text-anchor="start">always the most profitable setting.</text></g></g></svg>