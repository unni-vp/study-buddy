<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Photosynthesis &amp; limiting factors</title><desc id="map-description">The reaction: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ Chlorophyll absorbs light. Energy transfers from the environment to chloroplasts. The reaction is endothermic. Carbon dioxide enters through stomata. Roots and xylem supply water. Light supplies energy, rather than material. Glucose pathways: Respiration: transfers energy. Starch and fats or oils: store resources. Cellulose: strengthens cell walls. Glucose and nitrogen from nitrate ions form amino acids. These are used to build proteins. Four interacting factors: More light or carbon dioxide raises the rate only while that factor is limiting. Warming towards the optimum increases enzyme activity. Excess heat can denature enzymes. Less chlorophyll means less light absorption. Magnesium deficiency or disease can reduce chlorophyll. Interpret the plateau: Rising rate with light: light is limiting. Plateau: another factor limits the rate. Keep other conditions the same when comparing curves. If adding carbon dioxide raises the rate, carbon dioxide was limiting. A plateau alone does not identify which other factor is limiting. Inverse-square law: Intensity ∝ 1/distance² I₂/I₁ = (d₁/d₂)² 20 cm to 40 cm: intensity becomes ¼. 30 cm to 15 cm: intensity becomes 4 times greater. Use consistent units. The photosynthesis rate need not change by the same factor. Greenhouse decisions: Heating, lighting and added carbon dioxide cost money. Improve the actual limiting factor. Extra profit = extra crop income − extra cost £240 − £170 = £70. The highest photosynthesis rate is not always the most profitable setting.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,314,308" transform="translate(18 18)"><rect width="314" height="308" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">The reaction</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">6CO₂</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">6H₂O</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">C₆H₁₂O₆</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">6O₂</tspan></text><path class="section-divider" d="M18 87H296" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chlorophyll absorbs light.</text><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Energy transfers from the environment</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">to chloroplasts.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The reaction is <tspan font-weight="700">endothermic.</tspan></text><path class="section-divider" d="M18 188H296" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Carbon dioxide enters through stomata.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Roots and xylem supply water.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Light supplies energy, rather than</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">material.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,314,251" transform="translate(18 338)"><rect width="314" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="296" height="36" rx="11" fi