t-weight="700">cm:</tspan> intensity becomes 4 times greater.</text><path class="section-divider" d="M18 179H378" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="202" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use consistent units.</text><text class="body-text" x="18" y="224" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The photosynthesis rate need not change by the</text><text class="body-text" x="18" y="246" font-size="16" fill="#000000" font-weight="400" text-anchor="start">same factor.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,396,277" transform="translate(706 307)"><rect width="396" height="277" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="378" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Greenhouse decisions</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heating, lighting and added carbon dioxide cost</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">money.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Improve the actual limiting factor.</text><path class="section-divider" d="M18 131H378" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Extra</tspan> <tspan font-weight="700">profit</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">extra</tspan> <tspan font-weight="700">crop</tspan> <tspan font-weight="700">income</tspan> <tspan font-weight="700">−</tspan> <tspan font-weight="700">extra</tspan> <tspan font-weight="700">cost</tspan></text><path class="section-divider" d="M18 166H378" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">£240 − £170 = <tspan font-weight="700">£70.</tspan></text><path class="section-divider" d="M18 201H378" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="224" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The highest photosynthesis rate is not always the</text><text class="body-text" x="18" y="246" font-size="16" fill="#000000" font-weight="400" text-anchor="start">most profitable setting.</text></g></g></svg>