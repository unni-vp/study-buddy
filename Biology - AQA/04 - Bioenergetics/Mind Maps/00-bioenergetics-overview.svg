<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Bioenergetics overview</title><desc id="map-description">Photosynthesis: Carbon dioxide + water → glucose + oxygen Chlorophyll absorbs light. Light transfers energy to chloroplasts. Endothermic: takes in energy. Plants respire all the time. Photosynthesis needs light. Use the glucose: Respiration: glucose supplies energy. Storage: starch and fats or oils. Cell walls: cellulose. Glucose and nitrogen from nitrate ions form amino acids. These build proteins. Limiting factors: Limiting factors: light, carbon dioxide, temperature and chlorophyll. A plateau means extra light alone will not help. Intensity ∝ 1/distance². Doubling distance quarters intensity. Greenhouses: balance extra crop income against heating, lighting and carbon dioxide costs. Pondweed practical: Change lamp distance. Measure oxygen volume per time. Control temperature, carbon dioxide supply, plant and background light. Allow acclimatisation, repeat and calculate a mean. Bubbles vary in size, so measuring volume is usually better. Rate = volume/time. Plot against intensity or 1/distance². Respiration pathways: Aerobic: glucose + oxygen → carbon dioxide + water. More energy transferred per glucose. Anaerobic: muscles form lactic acid. Yeast and plants form ethanol + carbon dioxide. Less energy transferred. Respiration is exothermic and continuous. Fermentation makes bread rise and produces alcohol. Exercise &amp; metabolism: Exercise increases heart rate, breathing rate and breath volume. Oxygen shortage increases anaerobic respiration and fatigue. Oxygen debt: extra oxygen needed after exercise to remove accumulated lactic acid. Blood carries lactic acid to the liver, where it becomes glucose. Metabolism: all reactions in cells or the body. Builds carbohydrates, lipids and proteins. Excess proteins are broken down to form urea.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,286" transform="translate(18 18)"><rect width="290" height="286" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Photosynthesis</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Carbon</tspan> <tspan font-weight="700">dioxide</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">water</tspan> <tspan font-weight="700">→</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">glucose</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">oxygen</tspan></text><path class="section-divider" d="M18 109H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chlorophyll absorbs light.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Light transfers energy to</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">chloroplasts.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Endothermic:</tspan> takes in energy.</text><path class="section-divider" d="M18 210H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Plants respire all the time.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Photosynthesis needs light.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,251" transform="translate(18 316)"><rect width="290" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Use the glucose</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Respiration:</tspan> glucose supplies</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">energy.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Storage:</tspan> starch and fats or oils.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cell</tspan> <tspan font-weight="700">walls:</tspan> cellulose.</text><path class="section-divider" d="M18 153H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Glucose and nitrogen from nitrate</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ions form amino acids.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">These build proteins.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,358,286" transform="translate(320 18)"><rect width="358" height="286" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="340" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Limiting factors</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Limiting</tspan> <tspan font-weight="700">factors:</tspan> light, carbon dioxide,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">temperature and chlorophyll.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A plateau means extra light alone will not help.</text><path class="section-divider" d="M18 131H340" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Intensity</tspan> <tspan font-weight="700">∝</tspan> <tspan font-weight="700">1/distance².</tspan> Doubling distance</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">quarters intensity.</text><path class="section-divider" d="M18 188H340" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Greenhouses:</tspan> balance extra crop income</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">against heating, lighting and carbon dioxide</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">costs.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,358,330" transform="translate(320 316)"><rect width="358" height="330" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="340" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Pondweed practical</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Change lamp distance.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Measure oxygen volume per time.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Control temperature, carbon dioxide supply,</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">plant and background light.</text><path class="section-divider" d="M18 153H340" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Allow acclimatisation, repeat and calculate a</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mean.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bubbles vary in size, so measuring volume is</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">usually better.</text><path class="section-divider" d="M18 254H340" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rate</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">volume/time.</tspan></text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Plot against intensity or 1/distance².</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,412,264" transform="translate(690 18)"><rect width="412" height="264" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="394" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Respiration pathways</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Aerobic:</tspan> glucose + oxygen → carbon dioxide + water.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More energy transferred per glucose.</text><path class="section-divider" d="M18 109H394" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Anaerobic:</tspan> muscles form lactic acid.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Yeast and plants form ethanol + carbon dioxide.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Less energy transferred.</text><path class="section-divider" d="M18 188H394" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Respiration is <tspan font-weight="700">exothermic</tspan> and continuous.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fermentation makes bread rise and produces alcohol.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,412,352" transform="translate(690 294)"><rect width="412" height="352" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="394" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Exercise &amp; metabolism</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Exercise increases heart rate, breathing rate and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">breath volume.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxygen shortage increases anaerobic respiration and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fatigue.</text><path class="section-divider" d="M18 153H394" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Oxygen</tspan> <tspan font-weight="700">debt:</tspan> extra oxygen needed after exercise to</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">remove accumulated lactic acid.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blood carries lactic acid to the liver, where it becomes</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">glucose.</text><path class="section-divider" d="M18 254H394" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Metabolism:</tspan> all reactions in cells or the body.</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Builds carbohydrates, lipids and proteins.</text><text class="body-text" x="18" y="321" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Excess proteins are broken down to form urea.</text></g></g></svg>