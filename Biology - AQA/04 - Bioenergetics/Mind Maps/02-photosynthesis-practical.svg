<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Photosynthesis practical</title><desc id="map-description">Choose the variables: Independent variable: lamp distance or light intensity. Dependent variable: oxygen production rate. Use pondweed in sodium hydrogencarbonate solution. Keep carbon dioxide supply, solution volume, plant and orientation constant. Control temperature: A lamp can heat the water. Use a water bath or heat shield, and check with a thermometer. Keep background light steady and use the same measurement period. Keep spills away from electrics. Avoid burns from a hot lamp. Collect the data: Measure source-to-plant distance. Allow the plant to acclimatise to each condition. Collect oxygen in an inverted water-filled tube over a set time. Counting bubbles gives an estimate. Use several distances. Repeat each condition, calculate a mean and investigate anomalies. Calculate rate: Rate = gas volume/time 3.6 cm³ in 4 min = 0.90 cm³/min. 48 bubbles in 2 min = 24 bubbles/min. Keep units consistent. More gas over a longer time does not necessarily mean a faster rate. Plot &amp; explain: Y-axis: oxygen production rate. X-axis: light intensity or 1/distance². Label units, choose a suitable scale and draw a best-fit curve. A closer lamp gives greater intensity. Rate rises while light is limiting. Another limiting factor may cause a plateau. Limits &amp; improvements: Bubble sizes vary, so counts are approximate. Measure gas volume instead. Some oxygen dissolves or is used in respiration. Check the collector for gas leaks. Repeats reduce random uncertainty. They do not fix heating, leaks or another uncontrolled variable.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,426,207" transform="translate(18 18)"><rect width="426" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="408" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Choose the variables</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Independent</tspan> <tspan font-weight="700">variable:</tspan> lamp distance or light intensity.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Dependent</tspan> <tspan font-weight="700">variable:</tspan> oxygen production rate.</text><path class="section-divider" d="M18 109H408" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use pondweed in sodium hydrogencarbonate solution.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep carbon dioxide supply, solution volume, plant and</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">orientation constant.</text></g></g><g class="map-section" id="section-2" data-source-panel="2" data-bounds="0,0,426,473" transform="translate(18 237)"><rect width="426" height="473" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="408" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Collect the data</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Measure source-to-plant distance.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Allow the plant to <tspan font-weight="700">acclimatise</tspan> to each condition.</text><g transform="translate(18 115)"><g class="explanatory-diagram" data-diagram="pondweed"><title>The lamp, submerged plant and funnel, inverted water-filled gas collector and thermometer clarify oxygen collection.</title><g transform="translate(0 -46)"><rect x="6" y="87" width="30" height="48" rx="8" fill="#ffe5a7" stroke="#ac771f"/><path d="M36 89L107 71M36 110H107M36 131L107 166" stroke="#dba63a" fill="none"/><text class="diagram-label" x="21" y="161" font-size="16" fill="#000000" text-anchor="middle">Lamp</text><path d="M105 54V179H214V54" stroke="#829caf" stroke-width="2" fill="none"/><path d="M106 95H213V177H106Z" fill="#e4f2fa"/><path d="M144 127V64Q156 59 168 64V127" stroke="#6c8d9e" stroke-width="1.7" fill="#eff8fb"/><path d="M145 64Q156 60 167 64V86H145Z" fill="#f5dd99"/><path d="M132 150L148 129V122M164 122V129L180 150Z" fill="none" stroke="#63828d" stroke-width="1.6"/><path d="M156 171V151M156 158L145 156M156 164L167 158" stroke="#468133" stroke-width="3" fill="none"/><circle cx="156" cy="119" r="2.5" fill="#9bc0d7"/><circle cx="156" cy="108" r="3" fill="#9bc0d7"/><path d="M195 92V158" stroke="#be4b55" stroke-width="3"/><circle cx="195" cy="160" r="5" fill="#be4b55"/><path d="M168 75H225" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="230" y="80" font-size="16" fill="#000000" text-anchor="start">Oxygen</text><path d="M195 96L225 113" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="230" y="118" font-size="16" fill="#000000" text-anchor="start">Thermometer</text><path d="M167 166L225 155" stroke="#64747d" stroke-width="1.1" fill="none"/><text class="diagram-label" x="230" y="160" font-size="16" fill="#000000" text-anchor="start">Pondweed</text><text class="diagram-label" x="195.0" y="205" font-size="16" fill="#000000" text-anchor="middle">Sodium hydrogencarbonate solution</text></g></g></g><path class="section-divider" d="M18 296H408" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="319" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Collect oxygen in an inverted water-filled tube over a set</text><text class="body-text" x="18" y="341" font-size="16" fill="#000000" font-weight="400" text-anchor="start">time.</text><text class="body-text" x="18" y="363" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Counting bubbles gives an estimate.</text><path class="section-divider" d="M18 375H408" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="398" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use several distances.</text><text class="body-text" x="18" y="420" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat each condition, calculate a mean and investigate</text><text class="body-text" x="18" y="442" font-size="16" fill="#000000" font-weight="400" text-anchor="start">anomalies.</text></g></g><g class="map-section" id="section-3" data-source-panel="1" data-bounds="0,0,290,264" transform="translate(456 18)"><rect width="290" height="264" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Control temperature</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A lamp can heat the water.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use a water bath or heat shield, and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">check with a thermometer.</text><path class="section-divider" d="M18 131H272" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep background light steady and</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">use the same measurement period.</text><path class="section-divider" d="M18 188H272" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep spills away from electrics.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Avoid burns from a hot lamp.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,290,277" transform="translate(456 294)"><rect width="290" height="277" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Calculate rate</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rate</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">gas</tspan> <tspan font-weight="700">volume/time</tspan></text><path class="section-divider" d="M18 87H272" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start">3.6 cm³ in 4 min = <tspan font-weight="700">0.90</tspan> <tspan font-weight="700">cm³/min.</tspan></text><path class="section-divider" d="M18 122H272" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="145" font-size="16" fill="#000000" font-weight="400" text-anchor="start">48 bubbles in 2 min = <tspan font-weight="700">24</tspan></text><text class="body-text" x="18" y="167" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">bubbles/min.</tspan></text><path class="section-divider" d="M18 179H272" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="202" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep units consistent.</text><text class="body-text" x="18" y="224" font-size="16" fill="#000000" font-weight="400" text-anchor="start">More gas over a longer time does</text><text class="body-text" x="18" y="246" font-size="16" fill="#000000" font-weight="400" text-anchor="start">not necessarily mean a faster rate.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,344,251" transform="translate(758 18)"><rect width="344" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="326" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Plot &amp; explain</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Y-axis:</tspan> oxygen production rate.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">X-axis:</tspan> light intensity or 1/distance².</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Label units, choose a suitable scale and draw</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a best-fit curve.</text><path class="section-divider" d="M18 153H326" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A closer lamp gives greater intensity.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rate rises while light is limiting.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Another limiting factor may cause a plateau.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,344,308" transform="translate(758 281)"><rect width="344" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="326" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Limits &amp; improvements</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bubble sizes vary, so counts are</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">approximate.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Measure <tspan font-weight="700">gas</tspan> <tspan font-weight="700">volume</tspan> instead.</text><path class="section-divider" d="M18 131H326" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Some oxygen dissolves or is used in</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">respiration.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Check the collector for gas leaks.</text><path class="section-divider" d="M18 210H326" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeats reduce random uncertainty.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">They do not fix heating, leaks or another</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">uncontrolled variable.</text></g></g></svg>