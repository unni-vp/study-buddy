<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Respiration, exercise &amp; metabolism</title><desc id="map-description">Aerobic respiration: Glucose + oxygen → carbon dioxide + water Most stages occur in mitochondria. Glucose is completely oxidised. Respiration is exothermic and continuous in living cells. Energy supports movement, keeping warm and building molecules. Respiration is not breathing. Energy is transferred, not created. Anaerobic &amp; fermentation: Muscles: glucose → lactic acid. Yeast and plants: glucose → ethanol + carbon dioxide. Oxygen is not required. Incomplete glucose breakdown transfers much less energy than aerobic respiration. Yeast fermentation: carbon dioxide raises bread dough. Ethanol is used in alcoholic drinks. During exercise: Heart rate, breathing rate and breath volume rise. Muscles receive more oxygenated blood. If oxygen supply cannot meet demand, anaerobic respiration increases and lactic acid builds up. Prolonged vigorous activity causes fatigue. Muscles stop contracting efficiently. Recovery &amp; investigation: Oxygen debt: extra oxygen needed after exercise to remove accumulated lactic acid. Blood carries it to the liver, where it becomes glucose. Compare resting and post-exercise pulse. Standardise time and pace, allow recovery, repeat and use safe activities. 15-second pulse count × 4 = beats/min Building molecules: Metabolism: all reactions in cells or the body. Enzymes control reactions. Respiration supplies energy. Glucose can form starch in plants, glycogen in animals and cellulose for plant walls. 1 glycerol + 3 fatty acids → lipid Protein &amp; waste: Plants use glucose and nitrogen from nitrate ions to form amino acids. These build proteins. Excess proteins and amino acids are broken down, forming urea for excretion. Digestion supplies small molecules. Cells rebuild their own materials. Respiration is one part of metabolism.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,422,308" transform="translate(18 18)"><rect width="422" height="308" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="404" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Aerobic respiration</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Glucose</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">oxygen</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">carbon</tspan> <tspan font-weight="700">dioxide</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">water</tspan></text><path class="section-divider" d="M18 87H404" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="110" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Most stages occur in mitochondria.</text><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Glucose is completely oxidised.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Respiration is <tspan font-weight="700">exothermic</tspan> and continuous in living</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cells.</text><path class="section-divider" d="M18 188H404" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Energy supports movement, keeping warm and</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">building molecules.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Respiration is not breathing.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Energy is transferred, not created.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,422,286" transform="translate(18 338)"><rect width="422" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="404" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Anaerobic &amp; fermentation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Muscles:</tspan> glucose → lactic acid.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Yeast</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">plants:</tspan> glucose → ethanol + carbon dioxide.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxygen is not required.</text><path class="section-divider" d="M18 131H404" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Incomplete glucose breakdown transfers much less</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">energy than aerobic respiration.</text><path class="section-divider" d="M18 188H404" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Yeast</tspan> <tspan font-weight="700">fermentation:</tspan> carbon dioxide raises bread</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">dough.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ethanol is used in alcoholic drinks.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,334,286" transform="translate(452 18)"><rect width="334" height="286" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="316" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">During exercise</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heart rate, breathing rate and breath</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">volume rise.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Muscles receive more oxygenated blood.</text><path class="section-divider" d="M18 131H316" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">If oxygen supply cannot meet demand,</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">anaerobic respiration increases and lactic</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">acid builds up.</text><path class="section-divider" d="M18 210H316" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Prolonged vigorous activity causes fatigue.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Muscles stop contracting efficiently.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,334,286" transform="translate(452 316)"><rect width="334" height="286" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="316" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Recovery &amp; investigation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Oxygen</tspan> <tspan font-weight="700">debt:</tspan> extra oxygen needed after</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">exercise to remove accumulated lactic acid.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blood carries it to the liver, where it</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">becomes glucose.</text><path class="section-divider" d="M18 153H316" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare resting and post-exercise pulse.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Standardise time and pace, allow recovery,</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">repeat and use safe activities.</text><path class="section-divider" d="M18 232H316" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">15-second</tspan> <tspan font-weight="700">pulse</tspan> <tspan font-weight="700">count</tspan> <tspan font-weight="700">×</tspan> <tspan font-weight="700">4</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">beats/min</tspan></text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,304,286" transform="translate(798 18)"><rect width="304" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="286" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Building molecules</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Metabolism:</tspan> all reactions in cells or</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the body.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Enzymes control reactions.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Respiration supplies energy.</text><path class="section-divider" d="M18 153H286" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Glucose can form <tspan font-weight="700">starch</tspan> in plants,</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">glycogen</tspan> in animals and <tspan font-weight="700">cellulose</tspan></text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">for plant walls.</text><path class="section-divider" d="M18 232H286" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">1</tspan> <tspan font-weight="700">glycerol</tspan> <tspan font-weight="700">+</tspan> <tspan font-weight="700">3</tspan> <tspan font-weight="700">fatty</tspan> <tspan font-weight="700">acids</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">lipid</tspan></text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,304,308" transform="translate(798 316)"><rect width="304" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="286" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Protein &amp; waste</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Plants use glucose and nitrogen from</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">nitrate ions to form amino acids.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">These build proteins.</text><path class="section-divider" d="M18 131H286" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Excess proteins and amino acids are</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">broken down, forming <tspan font-weight="700">urea</tspan> <tspan font-weight="700">for</tspan></text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">excretion.</tspan></text><path class="section-divider" d="M18 210H286" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Digestion supplies small molecules.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cells rebuild their own materials.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Respiration is one part of metabolism.</text></g></g></svg>