<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="title"><title id="title">Photosynthesis rate against light at lower and higher carbon dioxide</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="500" fill="white"/><text x="500" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">Changing carbon dioxide concentration</text><path d="M90 345V65" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M90 345H630" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="98" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="start" fill="#18344a">Photosynthesis rate</text><text x="350" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Light intensity</text><path d="M95 340C170 310 200 230 290 230H605" fill="none" stroke="#2166ad" stroke-width="5"/><path d="M95 340C170 310 240 130 390 130H605" fill="none" stroke="#20816c" stroke-width="5"/><text x="670" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="start" fill="#20816c">Higher CO₂</text><text x="670" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="start" fill="#18344a">Same temperature</text><text x="670" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="start" fill="#2166ad">Lower CO₂</text><text x="500" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">At high light: extra CO₂ raises the lower plateau.</text><text x="500" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Schematic curves; other conditions are unchanged.</text></svg>