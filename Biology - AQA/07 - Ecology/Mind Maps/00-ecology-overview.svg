<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Ecology</title><desc id="map-description">Community relationships: Population: one species. Community: many. Ecosystem includes abiotic surroundings. Competition for limited resources. Interdependence links species. Factors and adaptations: Abiotic: light, temperature, water, soil, gases. Biotic: food, predators, pathogens, competitors. Structural, behavioural, functional adaptations. Environmental changes alter distribution. Sampling: Random quadrats estimate abundance. Mean × habitat area/quadrat area. Transects investigate gradients systematically. Repeat and assess representativeness. Cycling material: Photosynthesis takes in carbon dioxide. Feeding, decay and respiration move carbon. Water evaporates, condenses and precipitates. Materials cycle. Energy transfers to surroundings. Biodiversity: Pollution and habitat loss reduce variety. Peat stores carbon and supports species. Deforestation and warming affect habitats. Protection, margins and recycling can help. Biomass and food: Biomass decreases along trophic levels. Transfer % = next/previous biomass ×100. Food security needs sustainable supply. Farming, fishing and biotechnology need evaluation.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-star