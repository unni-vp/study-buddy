<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Milk decay and pH: practical</title><desc id="map-description">Measured mechanism: Lipase breaks down fat to fatty acids. pH falls to a defined indicator endpoint. Models a component of decay. Not a direct census of microorganisms. Change temperature: Use controlled water baths. Equilibrate milk and enzyme before mixing. Test several suitable temperatures. Start timing when enzyme is added. Keep fair: Same milk, enzyme volume/concentration. Same carbonate, indicator and initial pH. Same mixing and endpoint rule. No-enzyme control checks cause of change. Repeat and compare: Repeat each temperature. Calculate comparable mean times. Rate proxy = 1/time. Use same endpoint for valid comparison. Interpret rates: 100 s: 0.010 s⁻¹. 50 s: 0.020 s⁻¹, twice as fast. Warmer speeds activity up to optimum. Excess heat reduces enzyme activity. Accuracy and safety: pH probe can give continuous readings. Calibrate and define a common pH interval. Eye protection for alkaline solutions. Handle hot water safely. Do not taste mixtures.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" 