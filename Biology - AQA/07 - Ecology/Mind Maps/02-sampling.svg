<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Sampling populations and distribution</title><desc id="map-description">Random quadrats: Known quadrat and habitat areas. Consistent observations: Identify species accurately. Use same quadrat size and boundary rule. Many well-spread samples reduce bias. Suitable for plants and slow-moving organisms. Population estimate: Mean = total count/number of quadrats. Density = mean/quadrat area. Estimate = density × habitat area. Keep area units consistent. Transects: Lay line across environmental gradient. Quadrats at regular intervals: systematic. Record abundance and factor at each position. Repeat along comparable parallel transects. Data and reliability: Mean, median, mode and range. Plot abundance against distance/factor. Consider patchiness and other influences. Estimate is not an exact census. Worked scaling: Mean 5 in 0.25 m². Density 20 plants m⁻². 100 m² habitat: 2000 plants estimated. Respect habitat, safe access and hand hygiene.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,382,375" transform="translate(18 18)"><rect width="382" height="375" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="364" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Random quadrats</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Known quadrat and habitat areas.</text><g transform="translate(18 93)"><g class="concept-illustration"><title>Shows quadrat positions chosen by coordinates, distinguishing random habitat sampling from convenient placements.</title><rect x="37" y="27" width="281" height="126" fill="#f4f8ec" stroke="#829580"/><text class="diagram-label" x="28" y="32" font-size="16" fill="#000000" text-anchor="end">10</text><text class="diagram-label" x="28" y="95" font-size="16" fill="#000000" text-anchor="end">5</text><text class="diagram-label" x="28" y="158" font-size="16" fill="#000000" text-anchor="end">0</text><text class="diagram-label" x="37" y="180" font-size="16" fill="#000000" text-anchor="start">0</text><text class="diagram-label" x="318" y="180" font-size="16" fill="#000000" text-anchor="end">10</text><rect x="93.2" y="52.2" width="21" height="21" fill="#c5dda9" stroke="#468133"/><rect x="219.65" y="115.19999999999999" width="21" height="21" fill="#c5dda9" stroke="#468133"/><rect x="267.41999999999996" y="45.9" width="21" height="21" fill="#c5dda9" stroke="#468133"/><rect x="135.35" y="127.80000000000001" width="21" height="21" fill="#c5dda9" stroke="#468133"/><text class="diagram-label" x="173.0" y="211" font-size="16" fill="#000000" text-anchor="middle">Random coordinates select quadrats</text><text class="diagram-label" x="173.0" y="239" font-size="16" fill="#000000" text-anchor="middle">Axes: metres across the habitat</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,382,185" transform="translate(18 405)"><rect width="382" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="364" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Consistent observations</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Identify species accurately.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use same quadrat size and boundary rule.</text><path class="section-divider" d="M18 109H364" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many well-spread samples reduce bias.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Suitable for plants and slow-moving organisms.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,326,207" transform="translate(412 18)"><rect width="326" height="207" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Population estimate</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mean = total count/number of</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">quadrats.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Density = mean/quadrat area.</text><path class="section-divider" d="M18 131H308" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Estimate = density × habitat area.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Keep area units consistent.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,326,251" transform="translate(412 237)"><rect width="326" height="251" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Transects</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lay line across environmental gradient.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Quadrats at regular intervals:</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">systematic.</text><path class="section-divider" d="M18 131H308" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Record abundance and factor at each</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">position.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeat along comparable parallel</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">transects.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,185" transform="translate(750 18)"><rect width="352" height="185" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Data and reliability</text></g><g class="section