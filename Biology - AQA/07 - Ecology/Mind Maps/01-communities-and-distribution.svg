<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Communities, adaptations and distribution</title><desc id="map-description">Levels and dependence: Individual, population, community, ecosystem. Food, shelter, pollination and seed dispersal link species. Stable communities fluctuate around balance. Removing one species can affect many others. Competition: Plants: light, space, water, mineral ions. Animals: food, mates, territory. Resources must be limited for competition. Explain effects on survival and reproduction. Abiotic conditions: Light, temperature, moisture. Soil pH and mineral content. Wind intensity and direction. Carbon dioxide for plants, oxygen for aquatic animals. Living influences: Food availability. New predators or pathogens. Competitors can prevent successful breeding. Use a context-linked biological mechanism. Adaptation types: Structural: fur or waxy leaves. Behavioural: nocturnal activity. Functional: concentrated urine. Extremophiles tolerate extreme conditions. Changing distribution: Temperature, water and atmospheric gases change. Seasonal, geographical or human causes. Predator peaks usually lag behind prey peaks. Correlation does not isolate a single cause.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d=