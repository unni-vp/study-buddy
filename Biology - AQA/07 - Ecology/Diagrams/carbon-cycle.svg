<svg xmlns="http://www.w3.org/2000/svg" width="700" height="395" viewBox="0 0 700 395" role="img" font-family="Segoe UI, Arial, sans-serif"><title>Shows carbon passing through photosynthesis, feeding, death and microbial respiration, with plant and animal respiration returning atmospheric carbon dioxide.</title><rect width="100%" height="100%" fill="white"/><g class="concept-illustration"><title>Shows carbon passing through photosynthesis, feeding, death and microbial respiration, with plant and animal respiration returning atmospheric carbon dioxide.</title><rect x="256.0" y="15" width="188" height="40" rx="9" fill="#eff6ee" stroke="#468133"/><text class="diagram-label" x="350.0" y="40" font-size="16" fill="#000000" text-anchor="middle">Atmospheric CO₂</text><rect x="60.0" y="150" width="188" height="40" rx="9" fill="#eff6ee" stroke="#468133"/><text class="diagram-label" x="154.0" y="175" font-size="16" fill="#000000" text-anchor="middle">Plants</text><rect x="452.0" y="150" width="188" height="40" rx="9" fill="#eff6ee" stroke="#468133"/><text class="diagram-label" x="546.0" y="175" font-size="16" fill="#000000" text-anchor="middle">Animals</text><rect x="256.0" y="280" width="188" height="40" rx="9" fill="#eff6ee" stroke="#468133"/><text class="diagram-label" x="350.0" y="305" font-size="16" fill="#000000" text-anchor="middle">Dead matter / waste</text><path d="M275.0 58L168.0 147" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M169.8405618401695 142.3510934497979L168.0 147L172.90637977941492 146.03696445540757" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="8" y="103" font-size="16" fill="#000000" text-anchor="start">Photosynthesis</text><path d="M252.0 170L448.0 170" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M443.61208719054815 172.39712769302102L448.0 170L443.61208719054815 167.60287230697898" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="350.0" y="156" font-size="16" fill="#000000" text-anchor="middle">Feeding</text><path d="M536.0 147L425.0 58" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M429.9229008958837 58.874669520051704L425.0 58L426.9238456831869 62.61506422352745" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="695" y="102" font-size="16" fill="#000000" text-anchor="end">Respiration</text><path d="M138.0 147L250.0 58" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M248.0559920590492 62.60660755062989L250.0 58L245.07332143462628 58.853134405288685" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="5" y="130" font-size="16" fill="#000000" text-anchor="start">Plant respiration</text><path d="M174.0 194L285.0 278" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M280.0545211704246 277.26363110724213L285.0 278L282.94757944212915 273.4406612482039" stroke="#2366a0" stroke-width="2" fill="none"/><path d="M526.0 194L415.0 278" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M417.05242055787085 273.4406612482039L415.0 278L419.9454788295754 277.26363110724213" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="6" y="249" font-size="16" fill="#000000" text-anchor="start">Death</text><text class="diagram-label" x="694" y="249" font-size="16" fill="#000000" text-anchor="end">Death / waste</text><path d="M448.0 300H680V35H449.0" fill="none" stroke="#2366a0" stroke-width="2"/><path d="M472.0 35L448.0 35" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M452.38791280945185 32.60287230697899L448.0 35L452.38791280945185 37.39712769302101" stroke="#2366a0" stroke-width="2" fill="none"/><text class="diagram-label" x="350.0" y="355" font-size="16" fill="#000000" text-anchor="middle">Microbial decay and respiration return CO₂</text><text class="diagram-label" x="350.0" y="383" font-size="16" fill="#000000" text-anchor="middle">Burning fuels and biomass also releases CO₂</text></g></svg>