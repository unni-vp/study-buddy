<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Milk decay: control temperature and measure pH change</title><desc id="desc">Milk, sodium carbonate and indicator equilibrate in a controlled water bath before lipase is added. Measure time to the same pH endpoint.</desc><rect width="1000" height="560" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Milk decay: control temperature and measure pH change</text><rect x="93" y="280" width="344" height="177" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M90 215V460H440V215" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M90 215h-10m360 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M180 130V390Q202 430 224 390V130" fill="white" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M185 320V390Q202 418 219 390V320Z" fill="#f7e8cf" stroke="#f7e8cf" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="300" y="105" width="20" height="250" rx="5" fill="white" stroke="#182c3b" stroke-width="2"/><circle cx="310" cy="350" r="11" fill="#c75246" stroke="#182c3b" stroke-width="2"/><text x="575" y="145" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Temperature probe</text><path d="M563 139L312 230" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="575" y="230" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Milk + sodium carbonate</text><text x="575" y="260" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">+ indicator; add lipase to start.</text><text x="575" y="290" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Use the same volumes and</text><text x="575" y="320" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">concentrations for every run.</text><text x="570" y="430" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Controlled water bath</text><path d="M558 424L438 400" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="510" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Time to the same pH endpoint. Repeat at each temperature; include a no-lipase control.</text></g></svg>