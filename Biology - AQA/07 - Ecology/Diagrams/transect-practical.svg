<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" role="img" aria-labelledby="title desc"><title id="title">A line transect: sample at regular distances</title><desc id="desc">Quadrats placed at regular distances along a transect sample an environmental gradient. Record abundance and the environmental factor at each site.</desc><rect width="1000" height="545" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">A line transect: sample at regular distances</text><rect x="45" y="130" width="930" height="270" rx="5" fill="#e4eedb" stroke="#182c3b" stroke-width="2"/><path d="M85 275H915" fill="none" stroke="#17658c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="100" y="220" width="100" height="100" rx="0" fill="none" stroke="#147a70" stroke-width="2"/><text x="150" y="445" font-size="21" fill="#182c3b" font-weight="400" text-anchor="middle">0 m</text><circle cx="125" cy="240" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><circle cx="170" cy="295" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><rect x="290" y="220" width="100" height="100" rx="0" fill="none" stroke="#147a70" stroke-width="2"/><text x="340" y="445" font-size="21" fill="#182c3b" font-weight="400" text-anchor="middle">2 m</text><circle cx="315" cy="240" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><circle cx="360" cy="295" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><rect x="480" y="220" width="100" height="100" rx="0" fill="none" stroke="#147a70" stroke-width="2"/><text x="530" y="445" font-size="21" fill="#182c3b" font-weight="400" text-anchor="middle">4 m</text><circle cx="505" cy="240" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><circle cx="550" cy="295" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><rect x="670" y="220" width="100" height="100" rx="0" fill="none" stroke="#147a70" stroke-width="2"/><text x="720" y="445" font-size="21" fill="#182c3b" font-weight="400" text-anchor="middle">6 m</text><circle cx="695" cy="240" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><circle cx="740" cy="295" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><rect x="860" y="220" width="100" height="100" rx="0" fill="none" stroke="#147a70" stroke-width="2"/><text x="910" y="445" font-size="21" fill="#182c3b" font-weight="400" text-anchor="middle">8 m</text><circle cx="885" cy="240" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><circle cx="930" cy="295" r="5" fill="#5b8750" stroke="#182c3b" stroke-width="2"/><text x="50" y="100" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Shaded end</text><text x="780" y="100" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Open / lighter end</text><text x="35" y="500" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">At each quadrat, record abundance and the environmental factor. Repeat transects.</text></g></svg>