<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="title"><title id="title">Production of monoclonal antibodies</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="520" fill="white"/><rect x="40" y="35" width="320" height="65" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="200.0" y="74.5" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Mouse lymphocyte</text><rect x="640" y="35" width="320" height="65" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="800.0" y="74.5" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Tumour cell</text><text x="200" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Makes a specific antibody</text><text x="800" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18344a">Divides repeatedly</text><path d="M360 68H500V170" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 68H500" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="start" fill="#18344a">Fuse</text><rect x="345" y="175" width="310" height="60" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="500.0" y="212.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Hybridoma</text><text x="500" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Select one making the required antibody</text><path d="M500 283V315" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="320" width="480" height="60" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="500.0" y="357.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Clone → many identical hybridomas</text><path d="M500 385V425" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="430" width="480" height="60" rx="12" fill="#f1f7ff" stroke="#2166ad" stroke-width="2"/><text x="500.0" y="467.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18344a">Collect and purify the antibodies</text></svg>