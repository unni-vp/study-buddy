<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="title"><title id="title">Immune memory: slower primary and faster secondary antibody response</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="460" fill="white"/><text x="500" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#18344a">The same antigen triggers a faster second response</text><path d="M65 300V75" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M65 300H425" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">First exposure</text><text x="245" y="387" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Time after exposure</text><text x="83" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" fill="#18344a">Antibody level</text><path d="M70 298C195 298 190 220 250 220S325 266 410 285" fill="none" stroke="#2166ad" stroke-width="5"/><path d="M555 300V75" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M555 300H915" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><text x="735" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">Later exposure</text><text x="735" y="387" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Time after exposure</text><text x="573" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" fill="#18344a">Antibody level</text><path d="M560 298C600 298 603 100 675 100S815 160 900 195" fill="none" stroke="#20816c" stroke-width="5"/><text x="500" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Schematic curves: compare the delay and size of the response.</text></svg>