<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Medicines &amp; antibodies</title><desc id="map-description">Antibiotics &amp; symptoms: Antibiotics: penicillin and other antibiotics kill bacteria. Choose one effective against that bacterium. Resistance makes infections harder to treat. They do not kill viruses. Viruses reproduce inside cells, making safe targeting difficult. Painkillers: relieve symptoms without killing pathogens. Drug origins: Digitalis: originally from foxgloves. Aspirin: originally from willow. Penicillin: discovered by Alexander Fleming from Penicillium mould. Most new drugs are synthesised. Natural chemicals may provide starting points. Testing sequence: Test toxicity (harm), efficacy (effectiveness) and dose. Preclinical: cells, tissues and live animals. Clinical: start with low doses in healthy volunteers. Use patients to test effectiveness and find the optimum dose. Results undergo peer review before publication. Fair comparisons: Placebo: contains no active drug. Double-blind: patients and assessors do not know who receives which treatment. Random allocation, comparable groups and large samples reduce misleading effects. Compare recovery rates and side effects, rather than raw counts alone. Make monoclonal antibodies: Stimulate mouse lymphocytes with an antigen. Fuse an antibody-producing lymphocyte with a tumour cell to make a hybridoma. Select and clone one hybridoma. It divides and produces antibodies with one specific binding site. Collect and purify the antibodies. Uses &amp; limits: Specific binding allows pregnancy tests, hormone measurement and pathogen detection. Fluorescent tags locate molecules. Attach a toxic drug, radioactive substance or growth blocker to target cancer cells. Targeting reduces unwanted damage. Side effects and unsuitable targets can limit benefit.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,318,352" transform="translate(18 18)"><rect width="318" height="352" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="300" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Antibiotics &amp; symptoms</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Antibiotics:</tspan> penicillin and other</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">antibiotics kill bacteria.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Choose one effective against that</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">bacterium.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Resistance makes infections harder to</text><text class="body-text" x="18" y="185" font-size="16" fill="#000000" font-weight="400" text-anchor="start">treat.</text><path class="section-divider" d="M18 197H300" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">They do not kill viruses.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Viruses reproduce inside cells, making</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">safe targeting difficult.</text><path class="section-divider" d="M18 276H300" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Painkillers:</tspan> relieve symptoms without</text><text class="body-text" x="18" y="321" font-size="16" fill="#000000" font-weight="400" text-anchor="start">killing pathogens.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,318,264" transform="translate(18 382)"><rect width="318" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="300" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Drug origins</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Digitalis:</tspan> originally from foxgloves.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Aspirin:</tspan> originally from willow.</text><path class="section-divider" d="M18 109H300" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Penicillin:</tspan> discovered by Alexander</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fleming from Penicillium mould.</text><path class="section-divider" d="M18 166H300" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Most new drugs are synthesised.</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Natural chemicals may provide starting</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">points.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,308" transform="translate(348 18)"><rect width="350" height="308" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Testing sequence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Test <tspan font-weight="700">toxicity</tspan> (harm), <tspan font-weight="700">efficacy</tspan> (effectiveness)</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and <tspan font-weight="700">dose.</tspan></text><path class="section-divider" d="M18 109H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Preclinical:</tspan> cells, tissues and live animals.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Clinical:</tspan> start with low doses in healthy</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">volunteers.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use patients to test effectiveness and find the</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">optimum dose.</text><path class="section-divider" d="M18 232H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Results undergo <tspan font-weight="700">peer</tspan> <tspan font-weight="700">review</tspan> before</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">publication.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,264" transform="translate(348 338)"><rect width="350" height="264" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Fair comparisons</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Placebo:</tspan> contains no active drug.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Double-blind:</tspan> patients and assessors do not</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">know who receives which treatment.</text><path class="section-divider" d="M18 131H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Random allocation, comparable groups and</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">large samples reduce misleading effects.</text><path class="section-divider" d="M18 188H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare recovery rates and side effects,</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">rather than raw counts alone.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,392,463" transform="translate(710 18)"><rect width="392" height="463" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="374" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Make monoclonal antibodies</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Stimulate mouse lymphocytes with an antigen.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fuse an antibody-producing lymphocyte with a</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">tumour cell to make a <tspan font-weight="700">hybridoma.</tspan></text><g transform="translate(18 137)"><g class="explanatory-diagram" data-diagram="hybridoma"><title>Fusion combines antibody production from a lymphocyte with repeated division from a tumour cell.</title><text class="diagram-label" x="85.44" y="16" font-size="16" fill="#000000" text-anchor="middle">Lymphocyte</text><text class="diagram-label" x="270.56" y="16" font-size="16" fill="#000000" text-anchor="middle">Tumour cell</text><circle cx="85.44" cy="45" r="18" fill="#7651a5" fill-opacity=".12" stroke="#7651a5" stroke-width="1.7"/><circle cx="83.44" cy="44" r="7" fill="#7651a5" fill-opacity=".5"/><circle cx="270.56" cy="45" r="18" fill="#b95619" fill-opacity=".12" stroke="#b95619" stroke-width="1.7"/><circle cx="268.56" cy="44" r="7" fill="#b95619" fill-opacity=".5"/><text class="diagram-label" x="85.44" y="82" font-size="16" fill="#000000" text-anchor="middle">Makes antibody</text><text class="diagram-label" x="270.56" y="82" font-size="16" fill="#000000" text-anchor="middle">Divides</text><path d="M85.44 93L166.0 113" stroke="#7651a5" stroke-width="2.3" fill="none"/><path d="M161.16378079534547 114.26924536813445L166.0 113L162.31894646215443 109.61623806222799" stroke="#7651a5" stroke-width="2" fill="none"/><path d="M270.56 93L190.0 113" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M193.68105353784557 109.61623806222799L190.0 113L194.83621920465453 114.26924536813445" stroke="#b95619" stroke-width="2" fill="none"/><ellipse cx="178.0" cy="136" rx="25" ry="18" fill="#ecedf8" stroke="#2366a0" stroke-width="1.7"/><circle cx="178.0" cy="136" r="9" fill="#aa9aca"/><text class="diagram-label" x="178.0" y="178" font-size="16" fill="#000000" text-anchor="middle">Hybridoma: divides + makes antibody</text></g></g><path class="section-divider" d="M18 337H374" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="360" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Select and clone one hybridoma.</text><text class="body-text" x="18" y="382" font-size="16" fill="#000000" font-weight="400" text-anchor="start">It divides and produces antibodies with <tspan font-weight="700">one</tspan></text><text class="body-text" x="18" y="404" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">specific</tspan> <tspan font-weight="700">binding</tspan> <tspan font-weight="700">site.</tspan></text><path class="section-divider" d="M18 416H374" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="439" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Collect and purify the antibodies.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,392,257" transform="translate(710 493)"><rect width="392" height="257" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="374" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Uses &amp; limits</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Specific binding allows pregnancy tests, hormone</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">measurement and pathogen detection.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fluorescent tags locate molecules.</text><path class="section-divider" d="M18 131H374" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Attach a toxic drug, radioactive substance or</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">growth blocker to target cancer cells.</text><path class="section-divider" d="M18 188H374" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Targeting reduces unwanted damage.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Side effects and unsuitable targets can limit benefit.</text></g></g></svg>