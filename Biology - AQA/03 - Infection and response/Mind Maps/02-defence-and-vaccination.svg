<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Defence &amp; vaccination</title><desc id="map-description">Skin &amp; nose: Skin: a physical barrier. Antimicrobial substances and clotting at cuts help protect it. Nose: hairs and mucus trap pathogens and particles. These barriers are non-specific: they act against many pathogens. Airways &amp; stomach: Trachea and bronchi: mucus traps pathogens. Cilia move mucus to the throat to be swallowed. Stomach: hydrochloric acid kills many swallowed pathogens. White blood cells: Phagocytosis: engulfing and digesting pathogens. Antibodies: bind specific pathogen antigens and help destroy the pathogen. Antitoxins: neutralise bacterial toxins. Different white cells have different roles. Specificity: An antibody binding site is complementary to its antigen, like a key fitting a lock. Antibodies: target antigens. Antitoxins: neutralise toxins. These terms are not interchangeable. Vaccination sequence: A vaccine introduces dead or inactive pathogens, or their antigens. White cells make specific antibodies. Memory cells remain. Later exposure triggers a faster, larger antibody response. Pathogens are destroyed before significant illness develops. Population protection: High uptake leaves fewer susceptible hosts. Transmission falls, helping protect people who cannot be vaccinated. Evaluate disease reduction against reliable evidence about risk, cost, access and uptake. Protection is not identical for every person.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,264" transform="translate(18 18)"><rect width="290" height="264" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Skin &amp; nose</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Skin:</tspan> a physical barrier.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Antimicrobial substances and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">clotting at cuts help protect it.</text><path class="section-divider" d="M18 131H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Nose:</tspan> hairs and mucus trap</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pathogens and particles.</text><path class="section-divider" d="M18 188H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">These barriers are <tspan font-weight="700">non-specific:</tspan></text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">they act against many pathogens.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,229" transform="translate(18 294)"><rect width="290" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Airways &amp; stomach</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Trachea</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">bronchi:</tspan> mucus traps</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pathogens.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cilia move mucus to the throat to be</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">swallowed.</text><path class="section-divider" d="M18 153H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Stomach:</tspan> hydrochloric acid kills</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">many swallowed pathogens.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,322,242" transform="translate(320 18)"><rect width="322" height="242" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">White blood cells</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Phagocytosis:</tspan> engulfing and digesting</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pathogens.</text><path class="section-divider" d="M18 109H304" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Antibodies:</tspan> bind specific pathogen</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">antigens and help destroy the pathogen.</text><path class="section-divider" d="M18 166H304" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Antitoxins:</tspan> neutralise bacterial toxins.</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Different white cells have different roles.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,322,229" transform="translate(320 272)"><rect width="322" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Specificity</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">An antibody binding site is</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">complementary</tspan> to its antigen, like a key</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fitting a lock.</text><path class="section-divider" d="M18 131H304" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Antibodies:</tspan> target antigens.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Antitoxins:</tspan> neutralise toxins.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">These terms are not interchangeable.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,448,441" transform="translate(654 18)"><rect width="448" height="441" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="430" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Vaccination sequence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A vaccine introduces dead or inactive pathogens, or their</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">antigens.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">White cells make <tspan font-weight="700">specific</tspan> <tspan font-weight="700">antibodies.</tspan></text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Memory cells remain.</text><g transform="translate(18 159)"><g class="explanatory-diagram" data-diagram="memory"><title>Matched schematic axes show the shorter delay and higher antibody response on later exposure.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Antibody level</text><path d="M8.0 112L8.0 30" stroke="#000000" stroke-width="2.3" fill="none"/><path d="M10.397127693021014 34.38791280945186L8.0 30L5.602872306978984 34.38791280945186" stroke="#000000" stroke-width="2" fill="none"/><path d="M8.0 112L198.0 112" stroke="#000000" stroke-width="2.3" fill="none"/><path d="M193.61208719054812 114.39712769302102L198.0 112L193.61208719054812 109.60287230697898" stroke="#000000" stroke-width="2" fill="none"/><path d="M10.0 110C53.0 110 50.0 80 73.0 80S173.0 105 193.0 108" stroke="#2366a0" stroke-width="2.5" fill="none"/><text class="diagram-label" x="103.0" y="136" font-size="16" fill="#000000" text-anchor="middle">First exposure</text><path d="M214.0 112L214.0 30" stroke="#000000" stroke-width="2.3" fill="none"/><path d="M216.39712769302102 34.38791280945186L214.0 30L211.60287230697898 34.38791280945186" stroke="#000000" stroke-width="2" fill="none"/><path d="M214.0 112L404.0 112" stroke="#000000" stroke-width="2.3" fill="none"/><path d="M399.61208719054815 114.39712769302102L404.0 112L399.61208719054815 109.60287230697898" stroke="#000000" stroke-width="2" fill="none"/><path d="M216.0 110C232.0 110 232.0 41 259.0 41S378.0 55 399.0 64" stroke="#468133" stroke-width="2.5" fill="none"/><text class="diagram-label" x="309.0" y="136" font-size="16" fill="#000000" text-anchor="middle">Later exposure</text><text class="diagram-label" x="206.0" y="160" font-size="16" fill="#000000" text-anchor="middle">Time after exposure (same scale)</text></g></g><path class="section-divider" d="M18 343H430" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="366" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Later exposure triggers a <tspan font-weight="700">faster,</tspan> <tspan font-weight="700">larger</tspan> <tspan font-weight="700">antibody</tspan></text><text class="body-text" x="18" y="388" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">response.</tspan></text><text class="body-text" x="18" y="410" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Pathogens are destroyed before significant illness develops.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,448,242" transform="translate(654 471)"><rect width="448" height="242" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="430" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Population protection</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">High uptake leaves fewer susceptible hosts.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Transmission falls, helping protect people who cannot be</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">vaccinated.</text><path class="section-divider" d="M18 131H430" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Evaluate disease reduction against reliable evidence about</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">risk, cost, access and uptake.</text><path class="section-divider" d="M18 188H430" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Protection is not identical for every person.</text></g></g></svg>