<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Pathogens &amp; disease</title><desc id="map-description">Four pathogen groups: Bacteria: cells that multiply and may release toxins. Viruses: reproduce inside living cells and damage them. Fungi and protists: can also cause disease. Communicable diseases: can pass between organisms. Break the transmission route: Contact: hygiene and isolation. Water or food: sanitation, clean preparation and thorough cooking. Droplets: reduce exposure and isolate infected people. Vectors: prevent bites and breeding. Vaccination reduces susceptible hosts. Match prevention to the transmission route. Measles: Cause and spread: a virus inhaled in droplets from coughs and sneezes. Symptoms: fever and a red rash. Complications can be fatal. Prevention: childhood vaccination reduces illness and spread. HIV &amp; immune damage: Spread: sexual contact or exchanged body fluids, including blood on shared needles. Initial illness is flu-like. HIV attacks immune cells. AIDS: late-stage damage leaves the body unable to deal with other infections or cancers. Antiretroviral drugs control multiplication. Condoms and avoiding needle sharing reduce spread. Bacterial infections: Salmonella: ingested in contaminated food. Bacteria and toxins cause fever, cramps, vomiting and diarrhoea. Hygiene, cooking and poultry vaccination help. Gonorrhoea: sexual contact. Yellow or green discharge and painful urination. Condoms and effective antibiotics help. Resistant strains limit treatment. Malaria: A protist causes recurrent fever and can be fatal. The mosquito is the vector, not the pathogen. The life cycle includes mosquitoes. Nets prevent bites. Controlling breeding reduces vectors. Plant examples: TMV is viral. Rose black spot is fungal. See the plant-health map.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,342,251" transform="translate(18 18)"><rect width="342" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Four pathogen groups</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Bacteria:</tspan> cells that multiply and may</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">release toxins.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Viruses:</tspan> reproduce inside living cells and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">damage them.</text><path class="section-divider" d="M18 153H324" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fungi</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">protists:</tspan> can also cause disease.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Communicable</tspan> <tspan font-weight="700">diseases:</tspan> can pass</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">between organisms.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,342,314" transform="translate(18 281)"><rect width="342" height="314" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="64" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Break the transmission</text><text class="panel-title" x="50" y="62" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">route</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Contact:</tspan> hygiene and isolation.</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Water</tspan> <tspan font-weight="700">or</tspan> <tspan font-weight="700">food:</tspan> sanitation, clean</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">preparation and thorough cooking.</text><path class="section-divider" d="M18 159H324" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Droplets:</tspan> reduce exposure and isolate</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">infected people.</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Vectors:</tspan> prevent bites and breeding.</text><path class="section-divider" d="M18 238H324" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="261" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Vaccination reduces susceptible hosts.</text><text class="body-text" x="18" y="283" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Match prevention to the transmission route.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,342,242" transform="translate(372 18)"><rect width="342" height="242" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Measles</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cause</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">spread:</tspan> a virus inhaled in</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">droplets from coughs and sneezes.</text><path class="section-divider" d="M18 109H324" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Symptoms:</tspan> fever and a red rash.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Complications can be fatal.</text><path class="section-divider" d="M18 166H324" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Prevention:</tspan> childhood vaccination reduces</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">illness and spread.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,342,330" transform="translate(372 272)"><rect width="342" height="330" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">HIV &amp; immune damage</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Spread:</tspan> sexual contact or exchanged body</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fluids, including blood on shared needles.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Initial illness is flu-like.</text><path class="section-divider" d="M18 131H324" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">HIV attacks immune cells.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">AIDS:</tspan> late-stage damage leaves the body</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">unable to deal with other infections or</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cancers.</text><path class="section-divider" d="M18 232H324" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Antiretroviral drugs control multiplication.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Condoms and avoiding needle sharing</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reduce spread.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,376,273" transform="translate(726 18)"><rect width="376" height="273" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="358" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Bacterial infections</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Salmonella:</tspan> ingested in contaminated food.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bacteria and toxins cause fever, cramps, vomiting</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and diarrhoea.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Hygiene, cooking and poultry vaccination help.</text><path class="section-divider" d="M18 153H358" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gonorrhoea:</tspan> sexual contact.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Yellow or green discharge and painful urination.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Condoms and effective antibiotics help.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Resistant strains limit treatment.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,376,286" transform="translate(726 303)"><rect width="376" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="358" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Malaria</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A <tspan font-weight="700">protist</tspan> causes recurrent fever and can be fatal.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The mosquito is the <tspan font-weight="700">vector,</tspan> not the pathogen.</text><path class="section-divider" d="M18 109H358" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The life cycle includes mosquitoes.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Nets prevent bites.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Controlling breeding reduces vectors.</text><path class="section-divider" d="M18 188H358" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Plant</tspan> <tspan font-weight="700">examples:</tspan> TMV is viral.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rose black spot is fungal.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">See the plant-health map.</text></g></g></svg>