<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Plant health</title><desc id="map-description">Plant infections: TMV: viral mosaic discolouration. Less photosynthesis reduces growth. Limit transfer from infected plants and tools. Rose black spot: fungal purple or black spots. Leaves yellow and fall early, reducing photosynthesis. Wind and water spread spores. Remove infected leaves or use fungicides. Pests &amp; symptoms: Aphids: feed on sugar-rich sap, reducing growth. They may transmit viruses. Look for stunted growth, spots, decay, growths, malformed stems or leaves, discolouration and pests. One symptom may have several possible causes. Mineral deficiencies: Nitrate ions: needed for amino acids and proteins. Shortage causes stunted growth. Magnesium ions: needed for chlorophyll. Shortage causes chlorosis and reduces photosynthesis. Deficiencies are not communicable. Adding minerals cannot cure a virus. Identify the problem: Compare symptoms with reliable gardening references. Laboratories identify pathogens. Monoclonal-antibody kits: test for specific targets. Combine evidence. A negative test for one pathogen does not rule out other causes. Physical &amp; chemical: Physical: cellulose cell walls, a tough waxy cuticle and dead bark resist entry. Shedding bark can remove pathogens. Chemical: antibacterial substances act against bacteria. Poisons deter herbivores. Mechanical adaptations: Thorns and hairs: deter feeding. Leaves: may droop or curl when touched. Mimicry: tricks animals into avoiding plants. Link each feature to how it protects the plant.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,358,273" transform="translate(18 18)"><rect width="358" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="340" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Plant infections</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">TMV:</tspan> viral mosaic discolouration.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Less photosynthesis reduces growth.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Limit transfer from infected plants and tools.</text><path class="section-divider" d="M18 131H340" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Rose</tspan> <tspan font-weight="700">black</tspan> <tspan font-weight="700">spot:</tspan> fungal purple or black spots.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Leaves yellow and fall early, reducing</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">photosynthesis.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Wind and water spread spores.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Remove infected leaves or use fungicides.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,358,286" transform="translate(18 303)"><rect width="358" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="340" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Pests &amp; symptoms</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Aphids:</tspan> feed on sugar-rich sap, reducing</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">growth.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">They may transmit viruses.</text><path class="section-divider" d="M18 131H340" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Look for stunted growth, spots, decay,</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">growths, malformed stems or leaves,</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">discolouration and pests.</text><path class="section-divider" d="M18 210H340" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">One symptom may have several possible</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">causes.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,390,264" transform="translate(388 18)"><rect width="390" height="264" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="372" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Mineral deficiencies</text></g><g class="section-body"><text class="body-text" x="18" y=