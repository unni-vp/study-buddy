<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Potato osmosis: compare mass changes fairly</title><desc id="desc">Equal-sized potato cylinders are immersed in equal volumes of different concentrations, then blotted and reweighed.</desc><rect width="1000" height="560" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Potato osmosis: compare mass changes fairly</text><text x="180" y="100" font-size="22" fill="#182c3b" font-weight="700" text-anchor="middle">Water</text><rect x="88" y="205" width="174" height="162" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M85 140V370H265V140" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M85 140h-10m190 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="145" y="235" width="45" height="105" rx="5" fill="#e8d5a0" stroke="#182c3b" stroke-width="2"/><text x="175" y="410" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">Equal-sized tissue</text><text x="490" y="100" font-size="22" fill="#182c3b" font-weight="700" text-anchor="middle">Dilute solution</text><rect x="398" y="205" width="174" height="162" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M395 140V370H575V140" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M395 140h-10m190 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="455" y="235" width="45" height="105" rx="5" fill="#e8d5a0" stroke="#182c3b" stroke-width="2"/><text x="485" y="410" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">Equal-sized tissue</text><text x="800" y="100" font-size="22" fill="#182c3b" font-weight="700" text-anchor="middle">Concentrated solution</text><rect x="708" y="205" width="174" height="162" rx="0" fill="#d8effa" stroke="none" stroke-width="2"/><path d="M705 140V370H885V140" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M705 140h-10m190 0h10" fill="none" stroke="#182c3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="765" y="235" width="45" height="105" rx="5" fill="#e8d5a0" stroke="#182c3b" stroke-width="2"/><text x="795" y="410" font-size="20" fill="#182c3b" font-weight="400" text-anchor="middle">Equal-sized tissue</text><text x="35" y="475" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Weigh → immerse for the same time → blot consistently → reweigh.</text><text x="35" y="505" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Use equal solution volumes and temperature; repeat at each concentration.</text></g></svg>