<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Prepare a slide: lower the coverslip at an angle</title><desc id="desc">A coverslip is lowered at an angle onto a thin stained specimen on a glass slide, using a mounted needle.</desc><rect width="1000" height="500" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Prepare a slide: lower the coverslip at an angle</text><rect x="80" y="335" width="720" height="22" rx="5" fill="#e9f4fa" stroke="#182c3b" stroke-width="2"/><path d="M350 332Q420 270 490 332Z" fill="#d8effa" stroke="#17658c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="405" y="315" width="85" height="15" rx="5" fill="#d5e4b6" stroke="#182c3b" stroke-width="2"/><path d="M330 330L570 175" fill="none" stroke="#17658c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M650 205L425 270" fill="none" stroke="#b88356" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="125" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Coverslip</text><path d="M151 119L470 235" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="710" y="185" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Mounted needle</text><path d="M698 179L580 225" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="680" y="285" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Thin specimen + stain</text><path d="M668 279L478 320" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="45" y="425" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Glass slide</text><path d="M178 419L240 349" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="480" font-size="21" fill="#182c3b" font-weight="400" text-anchor="start">Lower gently to reduce air bubbles. Start viewing with the lowest-power objective.</text></g></svg>