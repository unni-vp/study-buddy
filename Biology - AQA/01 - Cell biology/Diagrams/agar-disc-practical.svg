<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Antimicrobial discs: compare zones of inhibition</title><desc id="desc">Equal-sized antimicrobial discs sit on an inoculated agar plate. Clear zones differ in diameter; a solvent-only control has no clear zone.</desc><rect width="1000" height="570" fill="#fffefa"/><g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="38" font-size="27" fill="#17658c" font-weight="700" text-anchor="start">Antimicrobial discs: compare zones of inhibition</text><circle cx="300" cy="285" r="180" fill="#eee5bd" stroke="#182c3b" stroke-width="2"/><circle cx="300" cy="285" r="172" fill="#e2d6a4" stroke="#182c3b" stroke-width="2"/><circle cx="225" cy="240" r="60" fill="#fffefa" stroke="#17658c" stroke-width="2"/><circle cx="365" cy="330" r="38" fill="#fffefa" stroke="#17658c" stroke-width="2"/><circle cx="225" cy="240" r="13" fill="#fffefa" stroke="#182c3b" stroke-width="2"/><text x="225" y="246" font-size="16" fill="#182c3b" font-weight="400" text-anchor="middle">A</text><circle cx="365" cy="330" r="13" fill="#fffefa" stroke="#182c3b" stroke-width="2"/><text x="365" y="336" font-size="16" fill="#182c3b" font-weight="400" text-anchor="middle">B</text><circle cx="345" cy="190" r="13" fill="#fffefa" stroke="#182c3b" stroke-width="2"/><text x="345" y="196" font-size="16" fill="#182c3b" font-weight="400" text-anchor="middle">C</text><path d="M165 240H285" fill="none" stroke="#ad4c10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M165 230v20M285 230v20" fill="none" stroke="#ad4c10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="565" y="145" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Agar with bacterial lawn</text><path d="M553 139L400 170" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="565" y="235" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Clear zone: growth inhibited</text><path d="M553 229L269 210" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="565" y="330" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Equal-sized treated discs</text><path d="M553 324L366 330" fill="none" stroke="#65808c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="565" y="405" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">C: solvent-only control</text><text x="35" y="515" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Measure the full zone diameter consistently; radius = diameter ÷ 2.</text><text x="35" y="545" font-size="22" fill="#182c3b" font-weight="400" text-anchor="start">Keep the incubated plate closed. Compare replicate plates.</text></g></svg>