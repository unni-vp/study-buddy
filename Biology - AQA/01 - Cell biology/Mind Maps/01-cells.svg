<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Cells</title><desc id="map-description">Animal cells: Eukaryotic: DNA is enclosed in a nucleus. Nucleus: stores genetic material and controls cell activities. Cytoplasm: enzyme-controlled chemical reactions. Membrane: controls entry and exit. Mitochondria: aerobic respiration transfers energy. Ribosomes: make proteins. Plant cells: Also have the structures found in animal cells. Cellulose wall: strength and support. Algae also have cellulose walls. Permanent vacuole: cell sap. Water helps keep the cell firm. Chloroplasts: chlorophyll absorbs light for photosynthesis. Only photosynthetic cells have them. Root hairs normally do not. Bacterial cells: Prokaryotic: smaller than animal or plant cells. No nucleus: main DNA is a circular loop in the cytoplasm. Some have plasmids: small DNA rings with extra genes. Have membrane, cytoplasm, ribosomes and a non-cellulose wall. No mitochondria or chloroplasts. Sperm cells: Tail: helps the cell swim. Mitochondria: respiration supplies energy for movement. Acrosome enzymes: help penetrate the egg’s outer layers. Nerve &amp; muscle cells: Nerve: a long fibre carries electrical impulses. Branched ends connect to other cells. Muscle: contractile proteins shorten the cell. Mitochondria provide energy for contraction. Root hair cells: Long extension: large absorption area. Water enters by osmosis. Minerals enter by active transport when less concentrated in soil. Mitochondria supply respiration energy. Normally no chloroplasts underground. Xylem &amp; phloem: Xylem: dead, hollow tubes carry water and minerals. Lignin: strengthens walls against collapse. Phloem: sieve tubes transport dissolved sugars. Companion cells supply energy for loading. Link a cell’s structure to its effect and function. Differentiation: Cells develop specialised structures for a particular function. Most animal cells differentiate early in development. Many plant cells can do so throughout life. In mature animals, division mainly repairs or replaces cells. Differentiation is the process. Specialisation is the result.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,317" transform="translate(18 18)"><rect width="290" height="317" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Animal cells</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eukaryotic:</tspan> DNA is enclosed in a</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">nucleus.</text><path class="section-divider" d="M18 109H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Nucleus:</tspan> stores genetic material</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and controls cell activities.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cytoplasm:</tspan> enzyme-controlled</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">chemical reactions.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Membrane:</tspan> controls entry and exit.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Mitochondria:</tspan> aerobic respiration</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">transfers energy.</text><text class="body-text" x="18" y="286" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ribosomes:</tspan> make proteins.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,352" transform="translate(18 347)"><rect width="290" height="352" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Plant cells</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Also have the structures found in</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">animal cells.</text><path class="section-divider" d="M18 109H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cellulose</tspan> <tspan font-weight="700">wall:</tspan> strength and</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">support. Algae also have cellulose</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">walls.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Permanent</tspan> <tspan font-weight="700">vacuole:</tspan> cell sap.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water helps keep the cell firm.</text><path class="section-divider" d="M18 232H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Chloroplasts:</tspan> chlorophyll absorbs</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">light for photosynthesis.</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Only photosynthetic cells have them.</text><text class="body-text" x="18" y="321" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Root hairs normally do not.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,346,291" transform="translate(320 18)"><rect width="346" height="291" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Bacterial cells</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Prokaryotic:</tspan> smaller than animal or plant</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cells.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">No</tspan> <tspan font-weight="700">nucleus:</tspan> main DNA is a circular loop in</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the cytoplasm.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Some have <tspan font-weight="700">plasmids:</tspan> small DNA rings with</text><text class="body-text" x="18" y="185" font-size="16" fill="#000000" font-weight="400" text-anchor="start">extra genes.</text><path class="section-divider" d="M18 197H328" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Have membrane, cytoplasm, ribosomes and</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a <tspan font-weight="700">non-cellulose</tspan> <tspan font-weight="700">wall.</tspan></text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">No mitochondria or chloroplasts.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,346,190" transform="translate(320 321)"><rect width="346" height="190" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Sperm cells</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Tail:</tspan> helps the cell swim.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Mitochondria:</tspan> respiration supplies energy</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">for movement.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Acrosome</tspan> <tspan font-weight="700">enzymes:</tspan> help penetrate the</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">egg’s outer layers.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,346,225" transform="translate(320 523)"><rect width="346" height="225" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Nerve &amp; muscle cells</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Nerve:</tspan> a long fibre carries electrical</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">impulses.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Branched ends connect to other cells.</text><path class="section-divider" d="M18 131H328" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Muscle:</tspan> contractile proteins shorten the cell.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mitochondria provide energy for</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">contraction.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,424,229" transform="translate(678 18)"><rect width="424" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="406" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Root hair cells</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Long</tspan> <tspan font-weight="700">extension:</tspan> large absorption area.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water enters by <tspan font-weight="700">osmosis.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Minerals enter by <tspan font-weight="700">active</tspan> <tspan font-weight="700">transport</tspan> when less</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">concentrated in soil.</text><path class="section-divider" d="M18 153H406" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Mitochondria supply respiration energy. Normally no</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">chloroplasts underground.</text></g></g><g class="map-section" id="section-7" data-source-panel="6" data-bounds="0,0,424,220" transform="translate(678 259)"><rect width="424" height="220" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="406" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">7</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Xylem &amp; phloem</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Xylem:</tspan> dead, hollow tubes carry water and minerals.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Lignin:</tspan> strengthens walls against collapse.</text><path class="section-divider" d="M18 109H406" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Phloem:</tspan> sieve tubes transport dissolved sugars.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Companion cells supply energy for loading.</text><path class="section-divider" d="M18 166H406" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Link a cell’s <tspan font-weight="700">structure</tspan> to its effect and function.</text></g></g><g class="map-section" id="section-8" data-source-panel="7" data-bounds="0,0,424,251" transform="translate(678 491)"><rect width="424" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="406" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">8</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Differentiation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cells develop specialised structures for a particular</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">function.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Most animal cells differentiate <tspan font-weight="700">early</tspan> <tspan font-weight="700">in</tspan> <tspan font-weight="700">development.</tspan></text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many plant cells can do so <tspan font-weight="700">throughout</tspan> <tspan font-weight="700">life.</tspan></text><path class="section-divider" d="M18 153H406" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">In mature animals, division mainly repairs or replaces</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cells.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Differentiation is the process. Specialisation is the result.</text></g></g></svg>