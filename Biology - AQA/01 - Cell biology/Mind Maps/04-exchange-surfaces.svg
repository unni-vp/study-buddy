<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Exchange surfaces</title><desc id="map-description">Why exchange systems?: Single cells have a large surface area to volume ratio. Their outer surface can meet exchange needs. Large multicellular organisms have a lower ratio and longer diffusion distances. They need specialised exchange surfaces and transport systems. Surface area : volume: Cube side a: Surface area = 6a² Volume = a³ 1 cm cube: 6 ÷ 1 = 6:1. 3 cm cube: 54 ÷ 27 = 2:1. A larger cube has more total area, but less area per unit volume. Cutting it into pieces exposes more area without changing total volume. Lung alveoli: Many tiny air sacs give a large surface area. Thin alveolar and capillary walls give a short diffusion path. Blood supply and ventilation maintain steep gradients. Oxygen: air to blood. Carbon dioxide: blood to air. An alveolus is one air sac. Small intestine: Villi and microvilli: large surface area. Thin lining: short diffusion distance. Blood removes absorbed substances, maintaining gradients. Sugars can enter blood by active transport, against a gradient. Fish gills: Many filaments and lamellae: large surface area. Thin surfaces: short diffusion distance. Blood and flowing water maintain gradients. Oxygen moves from water to blood. Carbon dioxide moves out. Plant roots: Root hairs: large contact area with soil. Water enters by osmosis through a partially permeable membrane. Minerals enter against a gradient by active transport, using respiration energy. Plant leaves: Broad: large surface area. Thin: short diffusion distance. Stomata: let gases in and out. Internal air spaces shorten diffusion paths. For photosynthesis, carbon dioxide enters and oxygen can diffuse out. Explain an adaptation: Large area: more particles cross at once. Thin barrier: shorter diffusion path. Blood supply: brings or removes substances to maintain gradients. Ventilation: refreshes air or water. Name the substance and direction. Explain how the feature makes exchange faster.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,294,323" transform="translate(18 18)"><rect width="294" height="323" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="276" height="64" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Why exchange</text><text class="panel-title" x="50" y="62" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">systems?</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Single cells have a <tspan font-weight="700">large</tspan> <tspan font-weight="700">surface</tspan></text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">area</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">volume</tspan> <tspan font-weight="700">ratio.</tspan></text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Their outer surface can meet</text><text class="body-text" x="18" y="169" font-size="16" fill="#000000" font-weight="400" text-anchor="start">exchange needs.</text><path class="section-divider" d="M18 181H276" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Large multicellular organisms have a</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">lower</tspan> <tspan font-weight="700">ratio</tspan> and longer diffusion</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">distances.</text><text class="body-text" x="18" y="270" font-size="16" fill="#000000" font-weight="400" text-anchor="start">They need specialised exchange</text><text class="body-text" x="18" y="292" font-size="16" fill="#000000" font-weight="400" text-anchor="start">surfaces and transport systems.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,294,308" transform="translate(18 353)"><rect width="294" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="276" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Surface area: volume</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cube side a:</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Surface</tspan> <tspan font-weight="700">area</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">6a²</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Volume</tspan> <tspan font-weight="700">=</tspan> <tspan font-weight="700">a³</tspan></text><path class="section-divider" d="M18 131H276" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">1 cm cube: 6 ÷ 1 = <tspan font-weight="700">6:1.</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">3 cm cube: 54 ÷ 27 = <tspan font-weight="700">2:1.</tspan></text><path class="section-divider" d="M18 188H276" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A larger cube has more total area,</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">but less area per unit volume.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Cutting it into pieces exposes more</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">area without changing total volume.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,414,251" transform="translate(324 18)"><rect width="414" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="396" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Lung alveoli</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many tiny air sacs give a <tspan font-weight="700">large</tspan> <tspan font-weight="700">surface</tspan> <tspan font-weight="700">area.</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Thin alveolar and capillary walls give a <tspan font-weight="700">short</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">diffusion</tspan> <tspan font-weight="700">path.</tspan></text><path class="section-divider" d="M18 131H396" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blood supply and ventilation maintain steep gradients.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Oxygen:</tspan> air to blood.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Carbon</tspan> <tspan font-weight="700">dioxide:</tspan> blood to air.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">An alveolus is one air sac.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,414,229" transform="translate(324 281)"><rect width="414" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="396" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Small intestine</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Villi</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">microvilli:</tspan> large surface area.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Thin</tspan> <tspan font-weight="700">lining:</tspan> short diffusion distance.</text><path class="section-divider" d="M18 109H396" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blood removes absorbed substances, maintaining</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gradients.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sugars can enter blood by <tspan font-weight="700">active</tspan> <tspan font-weight="700">transport,</tspan> against a</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gradient.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,414,207" transform="translate(324 522)"><rect width="414" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="396" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Fish gills</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Many <tspan font-weight="700">filaments</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">lamellae:</tspan> large surface area.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Thin</tspan> <tspan font-weight="700">surfaces:</tspan> short diffusion distance.</text><path class="section-divider" d="M18 109H396" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blood and flowing water maintain gradients.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Oxygen moves from water to blood. Carbon dioxide</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">moves out.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,207" transform="translate(750 18)"><rect width="352" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Plant roots</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Root</tspan> <tspan font-weight="700">hairs:</tspan> large contact area with soil.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Water enters by <tspan font-weight="700">osmosis</tspan> through a partially</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">permeable membrane.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Minerals enter against a gradient by <tspan font-weight="700">active</tspan></text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">transport,</tspan> using respiration energy.</text></g></g><g class="map-section" id="section-7" data-source-panel="6" data-bounds="0,0,352,229" transform="translate(750 237)"><rect width="352" height="229" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">7</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Plant leaves</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Broad:</tspan> large surface area.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Thin:</tspan> short diffusion distance.</text><path class="section-divider" d="M18 109H334" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Stomata:</tspan> let gases in and out.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Internal <tspan font-weight="700">air</tspan> <tspan font-weight="700">spaces</tspan> shorten diffusion paths.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">For photosynthesis, carbon dioxide enters</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and oxygen can diffuse out.</text></g></g><g class="map-section" id="section-8" data-source-panel="7" data-bounds="0,0,352,264" transform="translate(750 478)"><rect width="352" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">8</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Explain an adaptation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Large</tspan> <tspan font-weight="700">area:</tspan> more particles cross at once.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Thin</tspan> <tspan font-weight="700">barrier:</tspan> shorter diffusion path.</text><path class="section-divider" d="M18 109H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Blood</tspan> <tspan font-weight="700">supply:</tspan> brings or removes substances</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">to maintain gradients.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ventilation:</tspan> refreshes air or water.</text><path class="section-divider" d="M18 188H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Name the substance and direction. Explain</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">how the feature makes exchange faster.</text></g></g></svg>