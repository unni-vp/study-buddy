<svg xmlns="http://www.w3.org/2000/svg" width="580" height="148" viewBox="0 0 580 148" role="img" font-family="Segoe UI, Arial, sans-serif"><title>A 3 cm cube has three times the drawn side of a 1 cm cube, illustrating the falling surface area to volume ratio.</title><rect width="100%" height="100%" fill="white"/><g class="explanatory-diagram" data-diagram="cubes"><title>A 3 cm cube has three times the drawn side of a 1 cm cube, illustrating the falling surface area to volume ratio.</title><path d="M104.39999999999999 71l6.75 -4.5h25l-6.75 4.5Z" fill="#fff0d8" stroke="#b95619"/><path d="M129.39999999999998 71l6.75 -4.5v25l-6.75 4.5Z" fill="#efd1ad" stroke="#b95619"/><rect x="104.39999999999999" y="71" width="25" height="25" fill="#fce8ce" stroke="#b95619"/><text class="diagram-label" x="116.89999999999999" y="118" font-size="16" fill="#000000" text-anchor="middle">1 cm</text><text class="diagram-label" x="116.89999999999999" y="140" font-size="16" fill="#000000" text-anchor="middle">SA/V = 6</text><path d="M342.2 21l20.25 -13.5h75l-20.25 13.5Z" fill="#fff0d8" stroke="#b95619"/><path d="M417.2 21l20.25 -13.5v75l-20.25 13.5Z" fill="#efd1ad" stroke="#b95619"/><rect x="342.2" y="21" width="75" height="75" fill="#fce8ce" stroke="#b95619"/><text class="diagram-label" x="379.7" y="118" font-size="16" fill="#000000" text-anchor="middle">3 cm</text><text class="diagram-label" x="379.7" y="140" font-size="16" fill="#000000" text-anchor="middle">SA/V = 2</text></g></svg>