<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 410" role="img" aria-labelledby="title desc"><title id="title">Osmosis percentage mass-change graph</title><desc id="desc">A straight line joins concentration zero and mass change plus ten percent to concentration zero point four and minus ten percent. It crosses zero mass change at zero point two moles per cubic decimetre.</desc><rect width="650" height="410" fill="white"/><g font-family="Arial,sans-serif" font-size="18" fill="black"><text x="20" y="28">Mass change (%)</text><text x="235" y="391">Concentration (mol/dm³)</text><g stroke="#ddd"><path d="M100 65V305 M100 65H580"/><path d="M220 65V305 M100 125H580"/><path d="M340 65V305 M100 185H580"/><path d="M460 65V305 M100 245H580"/><path d="M580 65V305 M100 305H580"/></g><path d="M100 60V305 M100 185H590" fill="none" stroke="black" stroke-width="2"/><path d="M100 65L580 305" stroke="#16784c" stroke-width="3"/><g fill="#16784c"><circle cx="100" cy="65" r="5"/><circle cx="220" cy="125" r="5"/><circle cx="340" cy="185" r="5"/><circle cx="460" cy="245" r="5"/><circle cx="580" cy="305" r="5"/></g><text x="100" y="339" text-anchor="middle">0.0</text><text x="83" y="71" text-anchor="end">10</text><text x="220" y="339" text-anchor="middle">0.1</text><text x="83" y="131" text-anchor="end">5</text><text x="340" y="339" text-anchor="middle">0.2</text><text x="83" y="191" text-anchor="end">0</text><text x="460" y="339" text-anchor="middle">0.3</text><text x="83" y="251" text-anchor="end">-5</text><text x="580" y="339" text-anchor="middle">0.4</text><text x="83" y="311" text-anchor="end">-10</text><text x="360" y="141">Zero crossing: 0.20 mol/dm³</text><path d="M340 151V179" stroke="black" stroke-width="1.5"/></g></svg>