<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Geometry and exchange surfaces</title><desc id="map-description">Area formulas: Rectangle: length ×width. Triangle: ½base ×perpendicular height. Areas use squared units. Use consistent lengths. Cube formulas: Surface area = 6a². Volume = a³. SA:V = surface/volume. Double side: fourfold surface, eightfold volume. Same-scale comparison: Larger total surface, smaller surface per volume. Diffusion consequence: Lower SA:V gives less exchange surface per internal volume. Longer distances also slow diffusion. Large organisms need specialised exchange/transport. Total surface area is not the ratio. Circles and zones: Radius = diameter/2. Area = πr². 12 mm diameter: about 113 mm². Subtract disc area only if requested. Use squared length units. Calculation routine: Choose relation and convert units. Show substitution and working. Round only final result. Estimate and explain biological meaning.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,290,207" transform="translate(18 18)"><rect width="290" height="207" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Area formulas</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rectangle: length ×width.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Triangle: ½base ×perpendicular</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">height.</text><path class="section-divider" d="M18 131H272" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Areas use squared units.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use consistent lengths.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,290,207" transform="translate(18 237)"><rect width="290" height="207" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="272" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Cube formulas</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Surface area = 6a².</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Volume = a³.</text><path class="section-divider" d="M18 109H272" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">SA:V = surface/volume.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Double side: fourfold surface,</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">eightfold volume.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,426,272" transform="translate(320 18)"><rect width="426" height="272" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="408" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Same-scale comparison</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Larger total surface, smaller surface per volume.</text><g transform="translate(18 93)"><g class="explanatory-diagram" data-diagram="cubes"><title>A 3 cm cube has three times the drawn side of a 1 cm cube, illustrating the falling surface area to volume ratio.</title><path d="M70.2 71l6.75 -4.5h25l-6.75 4.5Z" fill="#fff0d8" stroke="#b95619"/><path d="M95.2 71l6.75 -4.5v25l-6.75 4.5Z" fill="#efd1ad" stroke="#b95619"/><rect x="70.2" y="71" width="25" height="25" fill="#fce8ce" stroke="#b95619"/><text class="diagram-label" x="82.7" y="118" font-size="16" fill="#000000" text-anchor="middle">1 cm</text><text class="diagram-label" x="82.7" y="140" font-size="16" fill="#000000" text-anchor="middle">SA/V = 6</text><path d="M230.1 21l20.25 -13.5h75l-20.25 13.5Z" fill="#fff0d8" stroke="#b95619"/><path d="M305.1 21l20.25 -13.5v75l-20.25 13.5Z" fill="#efd1ad" stroke="#b95619"/><rect x="230.1" y="21" width="75" height="75" fill="#fce8ce" stroke="#b95619"/><text class="diagram-label" x="267.6" y="118" font-size="16" fill="#000000" text-anchor="middle">3 cm</text><text class="diagram-label" x="267.6" y="140" font-size="16" fill="#000000" text-anchor="middle">SA/V = 2</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,426,207" transform="translate(320 302)"><rect width="426" height="207" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="408" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Diffusion consequence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lower SA:V gives less exchange surface per internal</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">volume.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Longer distances also slow diffusion.</text><path class="section-divider" d="M18 131H408" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Large organisms need specialised exchange/transport.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Total surface area is not the ratio.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,344,207" transform="translate(758 18)"><rect width="344" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="326" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Circles and zones</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Radius = diameter/2.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Area = πr².</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">12 mm diameter: about 113 mm².</text><path class="section-divider" d="M18 131H326" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Subtract disc area only if requested.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use squared length units.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,344,185" transform="translate(758 237)"><rect width="344" height="185" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="326" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Calculation routine</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Choose relation and convert units.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Show substitution and working.</text><path class="section-divider" d="M18 109H326" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Round only final result.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Estimate and explain biological meaning.</text></g></g></svg>