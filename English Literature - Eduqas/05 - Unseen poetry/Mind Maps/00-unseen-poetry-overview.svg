<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Unseen poetry overview</title><desc id="map-description">Understand the whole poem: Speaker: voice in the poem, not automatically the poet. Situation: what happens and where. Overview: what is described and what deeper idea emerges? Read: sentences across line endings. Check title, turns and ending. Language and imagery: Words: precise connotations. Metaphor/simile: qualities transferred by comparison. Personification: attitude towards a non-human subject. Sensory detail: imagined experience. Sound/repetition: explain this effect, not an automatic meaning. Structure and form: Structure: order, stanza shifts, contrasts and ending. Form: overall kind or shape. Enjambment: continuing sentence. Caesura: internal pause. End-stopping: closure or pause at a line end. Turn: show what changes. Free verse still has deliberate organisation. Build a developed reading: Point: answer the task. Evidence: short and precise. Method: particular word, image or arrangement. Meaning: explain the idea and its effect. Development: connect another moment. Avoid: technique lists, unsupported guesses and invented biography. Compare both poems: Shared idea: compare attitudes, images and development, not only matching subjects. Both poems: evidence and analysis within linked paragraphs. Difference: similar objects can express opposing values. Check each ending. Manage the tasks: Single poem: 15 marks, about 20 minutes. Comparison: 25 marks, about 40 minutes. Include reading and planning. Give the comparison its larger share. Check: task focus, accurate evidence, methods and the overall meaning.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,342,264" transform="translate(18 18)"><rect width="342" height="264" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Understand the whole poem</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="