<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Analysis and comparison</title><desc id="map-description">Literal and deeper meaning: Literal: what is directly described. Deeper: what the details imply about experience or values. Waiting: cup and extra place reveal unresolved attachment. Departure: cup and key begin a chosen movement towards independence. Tone and viewpoint: Tone: attitude of the voice. Mood: atmosphere created. They may contrast. Pronouns, questions and changes of certainty help establish viewpoint. Ambiguity: support plausible readings. Do not turn guesses into facts. Analyse a specific choice: Image: name the relevant qualities and connect them to the idea. Example: bus windows carrying other lives place companionship beyond the waiting speaker. Effect: public movement contrasts with private stillness. Trace structure accurately: Opening: establishes expectation. Turn: changes time, place or thought. Ending: resolves or complicates. Waiting: room, street, return indoors. Departure: house, journey, increasing distance. Meaning: similar movement can reinforce attachment or freedom. Different responses to absence: Waiting and Departure are the original practice poems in the notes and Q&amp;A. Comparison: the same general subject does not mean the same attitude. An effective paragraph: Claim: a meaningful similarity or difference. Evidence: details from both poems. Analysis: explain each method and meaning. Link: why the difference matters. Response: informed interpretation with evidence, not only personal liking.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><mark