itude of the voice.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Mood:</tspan> atmosphere created.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">They may contrast.</text><path class="section-divider" d="M18 131H324" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Pronouns, questions and changes of</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">certainty help establish viewpoint.</text><path class="section-divider" d="M18 188H324" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ambiguity:</tspan> support plausible readings.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not turn guesses into facts.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,264" transform="translate(372 18)"><rect width="350" height="264" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Analyse a specific choice</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Image:</tspan> name the relevant qualities and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">connect them to the idea.</text><path class="section-divider" d="M18 109H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Example:</tspan> bus windows carrying other lives</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">place companionship beyond the waiting</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">speaker.</text><path class="section-divider" d="M18 188H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Effect:</tspan> public movement contrasts with</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">private stillness.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,286" transform="translate(372 294)"><rect width="350" height="286" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Trace structure accurately</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Opening:</tspan> establishes expectation.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Turn:</tspan> changes time, place or thought.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ending:</tspan> resolves or complicates.</text><path class="section-divider" d="M18 131H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Waiting:</tspan> room, street, return indoors.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Departure:</tspan> house, journey, increasing</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">distance.</text><path class="section-divider" d="M18 210H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Meaning:</tspan> similar movement can reinforce</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">attachment or freedom.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,368,335" transform="translate(734 18)"><rect width="368" height="335" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="350" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Different responses to absence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Waiting and Departure are the original</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">practice poems in the notes and Q&amp;A.</text><path class="section-divider" d="M18 109H350" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Comparison:</tspan> the same general subject does</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">not mean the same attitude.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Compares the two original practice poems by attitude and ending; similar absence is experienced as unresolved attachment or chosen independence.</title><rect x="0" y="0" width="160.0" height="32" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0" stroke-width="1.5"/><text class="diagram-label" x="80.0" y="21.0" font-size="16" fill="#000000" text-anchor="middle">Waiting</text><rect x="172.0" y="0" width="160.0" height="32" rx="7" fill="#468133" fill-opacity=".06" stroke="#468133" stroke-width="1.5"/><text class="diagram-label" x="252.0" y="21.0" font-size="16" fill="#000000" text-anchor="middle">Departure</text><rect x="0" y="45" width="160.0" height="32" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0" stroke-width="1.5"/><text class="diagram-label" x="80.0" y="66.0" font-size="16" fill="#000000" text-anchor="middle">Attachment</text><rect x="172.0" y="45" width="160.0" height="32" rx="7" fill="#468133" fill-opacity=".06" stroke="#468133" stroke-width="1.5"/><text class="diagram-label" x="252.0" y="66.0" font-size="16" fill="#000000" text-anchor="middle">Independence</text><rect x="0" y="90" width="160.0" height="32" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0" stroke-width="1.5"/><text class="diagram-label" x="80.0" y="111.0" font-size="16" fill="#000000" text-anchor="middle">Unresolved</text><rect x="172.0" y="90" width="160.0" height="32" rx="7" fill="#468133" fill-opacity=".06" stroke="#468133" stroke-width="1.5"/><text class="diagram-label" x="252.0" y="111.0" font-size="16" fill="#000000" text-anchor="middle">Chosen space</text></g></g></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,368,242" transform="translate(734 365)"><rect width="368" height="242" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="350" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">An effective paragraph</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Claim:</tspan> a meaningful similarity or difference.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Evidence:</tspan> details from both poems.</text><path class="section-divider" d="M18 109H350" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Analysis:</tspan> explain each method and meaning.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Link:</tspan> why the difference matters.</text><path class="section-divider" d="M18 166H350" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Response:</tspan> informed interpretation with</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">evidence, not only personal liking.</text></g></g></svg>