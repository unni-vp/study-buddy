<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Characters and responsibility</title><desc id="map-description">Arthur Birling: Role: manufacturer seeking business and status. Dismisses Eva after a strike. Language: commercial priorities frame people through cost and profit. Irony: wrong predictions weaken authority. Ending: welcomes possible escape. Sybil Birling: Role: socially confident charity leader. Rejects Eva through prejudice. Language: distancing class labels replace attention to individual need. Irony: condemns the father before learning he is Eric. Status does not guarantee care. Sheila Birling: Start: jealousy plus customer influence costs Eva a job. Development: admits harm, questions Gerald and challenges comfortable appearances. Ending: responsibility survives doubts about Goole. Growth does not erase guilt. Eric Birling: Conduct: drinking, coercion and stolen money create serious harm. Language: evasive descriptions reveal discomfort. Financial help does not excuse earlier conduct. Ending: admits responsibility. He is flawed, not a simple moral hero. Gerald Croft: Position: socially desirable fiancé. Helps Daisy but holds more power in the affair. Development: confesses, then investigates Goole and shares the family’s relief. Interpretation: recognise kindness and self-interest together. Goole and Eva: Goole: directs questions, challenges evasions and broadens the moral message. Identity stays unresolved. Eva: never appears. Others control the telling of her life. Agency: seeks fair pay and refuses stolen money. Represents vulnerable ordinary people.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" s