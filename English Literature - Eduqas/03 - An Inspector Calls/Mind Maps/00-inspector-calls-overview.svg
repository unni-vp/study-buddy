<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">An Inspector Calls overview</title><desc id="map-description">Act 1: power exposed: Setting: Brumley, 1912. Engagement celebration is interrupted by Goole. Arthur: factory dismissal after a pay strike. Sheila: shop dismissal caused by jealousy. Meaning: comfortable lives can depend on unequal power. Act 2: appearances break: Gerald: protection and shelter coexist with an unequal affair. Sheila returns the ring. Sybil: class prejudice blocks charitable help. She condemns the father before identifying Eric. Method: disclosure and dramatic irony increase pressure. Act 3: lesson tested: Eric: coercive conduct, pregnancy and stolen money. Eva refuses stolen funds. Inspector: connects harm and social duties. Identity later becomes doubtful. Sheila and Eric retain guilt. Others welcome relief. Final call renews investigation. Characters and choices: Arthur and Sybil: status, confidence and resistance. Sheila and Eric: faults, remorse and learning. Gerald: helpful actions and unequal control. Goole: moral investigation. Eva: absent, but morally active. Judge each motive. Do not assume all harms are identical. Shared responsibility: Class: employers, customers and charities control Eva’s options. Gender: economic and sexual vulnerability. Generations: changed attitudes contrast with restored complacency. Reputation: respectability conceals harm. Central question: is avoiding punishment the same as acting responsibly? The ending reopens the case: Cycle: apparent escape is overturned. The lesson still concerns admitted conduct. Audience: Goole’s identity remains uncertain. The ambiguity does not erase responsibility.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,338,308" transform="translate(18 18)"><rect width="338" height="308" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="320" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Act 1: power exposed</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Setting:</tspan> Brumley, 1912.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Engagement celebration is interrupted by</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Goole.</text><path class="section-divider" d="M18 131H320" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Arthur:</tspan> factory dismissal after a pay</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">strike.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Sheila:</tspan> shop dismissal caused by</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">jealousy.</text><path class="section-divider" d="M18 232H320" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Meaning:</tspan> comfortable lives can depend</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">on unequal power.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,338,308" transform="translate(18 338)"><rect width="338" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="320" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Act 2: appearances break</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gerald:</tspan> protection and shelter coexist</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">with an unequal affair.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sheila returns the ring.</text><path class="section-divider" d="M18 131H320" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Sybil:</tspan> class prejudice blocks charitable</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">help.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">She condemns the father before</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">identifying Eric.</text><path class="section-divider" d="M18 232H320" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Method:</tspan> disclosure and dramatic irony</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">increase pressure.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,286" transform="translate(368 18)"><rect width="354" height="286" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Act 3: lesson tested</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eric:</tspan> coercive conduct, pregnancy and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stolen money.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Eva refuses stolen funds.</text><path class="section-divider" d="M18 131H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Inspector:</tspan> connects harm and social duties.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Identity later becomes doubtful.</text><path class="section-divider" d="M18 188H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sheila and Eric retain guilt.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Others welcome relief.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Final call renews investigation.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,308" transform="translate(368 316)"><rect width="354" height="308" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Characters and choices</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Arthur</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">Sybil:</tspan> status, confidence and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">resistance.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Sheila</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">Eric:</tspan> faults, remorse and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">learning.</text><path class="section-divider" d="M18 153H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gerald:</tspan> helpful actions and unequal control.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Goole:</tspan> moral investigation.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Eva:</tspan> absent, but morally active.</text><path class="section-divider" d="M18 232H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Judge each motive.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not assume all harms are identical.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,368,286" transform="translate(734 18)"><rect width="368" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="350" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Shared responsibility</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Class:</tspan> employers, customers and charities</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">control Eva’s options.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gender:</tspan> economic and sexual vulnerability.</text><path class="section-divider" d="M18 131H350" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Generations:</tspan> changed attitudes contrast with</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">restored complacency.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Reputation:</tspan> respectability conceals harm.</text><path class="section-divider" d="M18 210H350" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Central</tspan> <tspan font-weight="700">question:</tspan> is avoiding punishment</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the same as acting responsibly?</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,368,349" transform="translate(734 316)"><rect width="368" height="349" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="350" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">The ending reopens the case</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cycle:</tspan> apparent escape is overturned.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The lesson still concerns admitted conduct.</text><path class="section-divider" d="M18 109H350" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Audience:</tspan> Goole’s identity remains uncertain.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The ambiguity does not erase responsibility.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Shows the cyclical ending: investigation, apparent escape and renewed pressure, making the moral lesson distinct from fear of punishment.</title><rect x="0" y="0" width="332" height="32" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0" stroke-width="1.5"/><text class="diagram-label" x="166.0" y="21.0" font-size="16" fill="#000000" text-anchor="middle">Investigation exposes harm</text><path d="M166.0 35L166.0 49" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M163.60287230697898 44.61208719054814L166.0 49L168.39712769302102 44.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><rect x="0" y="52" width="332" height="32" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619" stroke-width="1.5"/><text class="diagram-label" x="166.0" y="73.0" font-size="16" fill="#000000" text-anchor="middle">Doubts produce relief</text><path d="M166.0 87L166.0 101" stroke="#b95619" stroke-width="2.3" fill="none"/><path d="M163.60287230697898 96.61208719054814L166.0 101L168.39712769302102 96.61208719054814" stroke="#b95619" stroke-width="2" fill="none"/><rect x="0" y="104" width="332" height="32" rx="7" fill="#468133" fill-opacity=".06" stroke="#468133" stroke-width="1.5"/><text class="diagram-label" x="166.0" y="125.0" font-size="16" fill="#000000" text-anchor="middle">Final call renews pressure</text></g></g></g></g></svg>