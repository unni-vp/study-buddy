<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Themes and stagecraft</title><desc id="map-description">Responsibility and guilt: Pattern: separate choices combine to narrow Eva’s options. Contrast: genuine acceptance versus fear of scandal. Remorse matters if values change. Ending: technical doubts do not undo admitted conduct. Class, money and gender: Power: Arthur controls work. Sheila influences a shop. Sybil controls aid. Gerald and Eric: greater social and economic power affects relationships. Contrast: secure dining room versus Eva’s insecurity outside it. Generations and appearances: Sheila and Eric become more willing to learn. Their original faults remain significant. Gerald complicates a simple age divide. Sybil also shows women can defend hierarchy. Respectability: public roles conceal harmful behaviour. Irony and revelation: 1912 setting: audience knows Arthur’s confident predictions are wrong. Sybil: condemns the unknown father before identifying her own son. Ordered disclosures: suspense turns a mystery into a moral enquiry. What the stage shows: Lighting: comfortable atmosphere becomes exposed. Single setting: pressure accumulates. Doorbell: interrupts self-interest. Act endings: recognition and anticipated confession create suspense. Goole: detective and morality-play features, without a proven supernatural identity. A developed answer: Task: use the printed extract and the wider play. Track the character or idea across moments. Evidence: short quotation or precise event. Method: explain meaning and stage effect. Judgement: connect development to the question. Avoid retelling or unrelated history.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,326,264" transform="translate(18 18)"><rect width="326" height="264" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Responsibility and guilt</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Pattern:</tspan> separate choices combine to</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">narrow Eva’s options.</text><path class="section-divider" d="M18 109H308" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Contrast:</tspan> genuine acceptance versus</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fear of scandal.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Remorse matters if values change.</text><path class="section-divider" d="M18 188H308" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ending:</tspan> technical doubts do not undo</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">admitted conduct.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,326,264" transform="translate(18 294)"><rect width="326" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Class, money and gender</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan fo