<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">War &amp; exclusion</title><desc id="map-description">Drummer Hodge: the idea: Hardy names a young drummer hurriedly buried without a coffin. He will become part of land he never understood. Local landscape terms and strange stars separate him from Wessex. Natural continuity does not cancel loss. Hodge: the method: Three six-line stanzas alternating rhyme. Present burial → past home → permanent future. Second Boer War, southern Africa. Ordinary loss challenges glamorous imperial war it is not a First World War setting. Disabled: the idea: Owen contrasts a veteran’s present dependence with sport, attraction and recruitment enthusiasm. Colourful memory meets grey isolation. The public that celebrated enlistment offers little meaningful welcome. Disabled: the method: Past/present shifts deny a simple heroic journey. Repeated final questioning leaves the man waiting. First World War context exposes recruitment glamour and inadequate care. Analyse society’s treatment, not a claim about every disabled life. Kamikaze: the idea: Garland’s returning pilot survives a suicide mission but is shunned. Sea life and childhood memories offer possible reasons for returning. His daughter reconstructs his thoughts the pilot never gives us his own account. Kamikaze: the method: Seven six-line stanzas. Layered voices and fluid enjambment give way to learned silence at home. Second World War military honour conflicts with family affection. Compare social rejection with Disabled and irreversible loss with Hodge.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marke