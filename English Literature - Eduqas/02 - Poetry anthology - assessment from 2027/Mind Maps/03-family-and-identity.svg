<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Family &amp; identity</title><desc id="map-description">Cousin Kate: the idea: Rossetti’s abandoned speaker addresses the cousin who married the lord. The son gives her a final source of pride and power. Glove simile exposes disposability. Direct address makes her account angry and persuasive. Cousin Kate: the method: Six eight-line stanzas delay the revelation of the child. Public shame contrasts with maternal affection. Victorian class, inheritance and sexual double standards explain unequal judgement. Her claims about Kate remain one speaker’s view. Catrin: the idea: Clarke connects childbirth with a later argument over skating. The cord becomes a metaphor for continuing attachment. Love and conflict coexist: mother and daughter seek separate identities without losing their bond. Catrin: the method: Two unequal stanzas link past and present. Free verse and enjambment carry complicated feeling across boundaries. Clinical squares contrast with emotional circles. Motherhood is voiced from lived experience neither side simply wins. Origin Story: the idea: Ewing recounts her parents’ meeting through a comic book, then uses fragile paper to explore their love. A comic may be preserved or worn through use. An ended relationship can still leave value through the child. Origin Story: the method: Two free-verse stanzas move from family narrative to reflection. Lists contrast protection with lived enjoyment. Chicago and Black family experience give personal history significance. Compare Cousin Kate’s defiance with this affectionate reassessment.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,306,273" transform="translate(18 18)"><rect width="306" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="288" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Cousin Kate: the idea</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rossetti’s abandoned speaker</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">addresses the cousin who married</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the lord.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The son gives her a final source of</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pride and power.</text><path class="section-divider" d="M18 175H288" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Glove simile exposes disposability.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Direct address makes her account</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">angry and persuasive.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,306,295" transform="translate(18 303)"><rect width="306" height="295" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="288" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Cousin Kate: the method</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Six eight-line stanzas delay the</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">revelation of the child.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Public shame contrasts with</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">maternal affection.</text><path class="section-divider" d="M18 153H288" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Victorian class, inheritance and</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sexual double standards explain</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">unequal judgement.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Her claims about Kate remain one</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">speaker’s view.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,446,331" transform="translate(336 18)"><rect width="446" height="331" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="428" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Catrin: the idea</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Clarke connects childbirth with a later argument over</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">skating.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The cord becomes a metaphor for continuing attachment.</text><path class="section-divider" d="M18 131H428" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Love</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">conflict</tspan> <tspan font-weight="700">coexist:</tspan> mother and daughter seek</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">separate identities without losing their bond.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Compares the literal birth cord with the continuing metaphorical bond in Catrin.</title><rect x="0" y="0" width="198.0" height="64" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0"/><text class="diagram-label" x="99.0" y="24" font-size="16" fill="#000000" text-anchor="middle">Childbirth</text><text class="diagram-label" x="99.0" y="48" font-size="16" fill="#000000" text-anchor="middle">Physical cord</text><rect x="212.0" y="0" width="198.0" height="64" rx="7" fill="#7651a5" fill-opacity=".06" stroke="#7651a5"/><text class="diagram-label" x="311.0" y="24" font-size="16" fill="#000000" text-anchor="middle">Later conflict</text><text class="diagram-label" x="311.0" y="48" font-size="16" fill="#000000" text-anchor="middle">Metaphorical bond</text><text class="diagram-label" x="205.0" y="96" font-size="16" fill="#000000" text-anchor="middle">Connection survives the wish to separate</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,446,229" transform="translate(336 361)"><rect width="446" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="428" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Catrin: the method</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Two unequal stanzas link past and present.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Free verse and enjambment carry complicated feeling</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">across boundaries.</text><path class="section-divider" d="M18 131H428" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Clinical squares contrast with emotional circles.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Motherhood is voiced from lived experience</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">neither side simply wins.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,308,251" transform="translate(794 18)"><rect width="308" height="251" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="290" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Origin Story: the idea</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ewing recounts her parents’ meeting</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">through a comic book, then uses</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fragile paper to explore their love.</text><path class="section-divider" d="M18 131H290" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A comic may be preserved or worn</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">through use.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">An ended relationship can still leave</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">value through the child.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,308,301" transform="translate(794 281)"><rect width="308" height="301" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="290" height="64" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Origin Story: the</text><text class="panel-title" x="50" y="62" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">method</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Two free-verse stanzas move from</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">family narrative to reflection.</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lists contrast protection with lived</text><text class="body-text" x="18" y="169" font-size="16" fill="#000000" font-weight="400" text-anchor="start">enjoyment.</text><path class="section-divider" d="M18 181H290" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Chicago and Black family experience</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">give personal history significance.</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare Cousin Kate’s defiance with</text><text class="body-text" x="18" y="270" font-size="16" fill="#000000" font-weight="400" text-anchor="start">this affectionate reassessment.</text></g></g></svg>