<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Nature &amp; childhood</title><desc id="map-description">The Schoolboy: meaning: Blake’s child enjoys nature but suffers under fearful schooling. Bird-in-cage and damaged-plant images link restriction to lost development. Cruel eye: authority becomes surveillance. Appeals to parents make adults responsible for the future. Blake: how it works: Six five-line stanzas songlike pattern contrasts with confinement. Questions demand an answer rather than accepting adult power. Context: childhood and resistance to restrictive authority. Compare Catrin’s mother–child conflict. Wordsworth: meaning: A solitary walker finds company in dancing daffodils. Later, the inward eye brings the scene back. Personification moves the flowers’ dance into the heart. The gain is emotional wealth. Wordsworth: how it works: Four six-line stanzas, ABABCC. Final stanza shifts from past encounter to recurring present pleasure. Romantic nature, imagination and personal feeling. Solitude becomes rewarding, unlike the opening loneliness. Blackberry Picking: meaning: Heaney’s remembered childhood moves from eager collecting to rotten fruit. Sensory attraction becomes disgust. Blood, eyes and Bluebeard imagery add unease. Desire outlasts knowledge of inevitable decay. Heaney: how it works: Long first stanza gathers excitement shorter second stanza reverses it. Rural Northern Irish childhood informs concrete details. Compare: Wordsworth preserves pleasure through memory Heaney cannot preserve fruit. Blake blames restriction, not natural decay.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,322,295" transform="translate(18 18)"><rect width="322" height="295" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">The Schoolboy: meaning</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blake’s child enjoys nature but suffers</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">under fearful schooling.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bird-in-cage and damaged-plant</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">images link restriction to lost</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">development.</text><path class="section-divider" d="M18 175H304" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cruel</tspan> <tspan font-weight="700">eye:</tspan> authority becomes</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">surveillance.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Appeals to parents make adults</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">responsible for the future.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,322,273" transform="translate(18 325)"><rect width="322" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Blake: how it works</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Six five-line stanzas</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">songlike pattern contrasts with</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">confinement.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Questions demand an answer rather</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">than accepting adult power.</text><path class="section-divider" d="M18 175H304" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Context:</tspan> childhood and resistance to</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">restrictive authority.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare Catrin’s mother–child conflict.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,302,251" transform="translate(352 18)"><rect width="302" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Wordsworth: meaning</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A solitary walker finds company in</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">dancing daffodils.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Later, the <tspan font-weight="700">inward</tspan> <tspan font-weight="700">eye</tspan> brings the</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">scene back.</text><path class="section-divider" d="M18 153H284" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Personification moves the flowers’</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">dance into the heart.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The gain is emotional wealth.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,302,301" transform="translate(352 281)"><rect width="302" height="301" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="284" height="64" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Wordsworth: how it</text><text class="panel-title" x="50" y="62" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">works</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Four six-line stanzas, ABABCC.</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Final stanza shifts from past</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">encounter to recurring present</text><text class="body-text" x="18" y="169" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pleasure.</text><path class="section-divider" d="M18 181H284" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Romantic nature, imagination and</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">personal feeling.</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Solitude becomes rewarding, unlike</text><text class="body-text" x="18" y="270" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the opening loneliness.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,436,207" transform="translate(666 18)"><rect width="436" height="207" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="418" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Blackberry Picking: meaning</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heaney’s remembered childhood moves from eager</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">collecting to rotten fruit.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Sensory attraction becomes disgust.</text><path class="section-divider" d="M18 131H418" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blood, eyes and Bluebeard imagery add unease.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Desire outlasts knowledge of inevitable decay.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,436,367" transform="translate(666 237)"><rect width="436" height="367" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="418" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Heaney: how it works</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Long first stanza gathers excitement</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">shorter second stanza reverses it.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Rural Northern Irish childhood informs concrete details.</text><path class="section-divider" d="M18 131H418" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Compare:</tspan> Wordsworth preserves pleasure through</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">memory</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Heaney cannot preserve fruit.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Blake blames restriction, not natural decay.</text><g transform="translate(18 238)"><g class="concept-illustration"><title>Compares the different outcomes of remembering nature and trying to preserve fruit.</title><rect x="0" y="0" width="193.0" height="88" rx="7" fill="#468133" fill-opacity=".06" stroke="#468133"/><text class="diagram-label" x="96.5" y="24" font-size="16" fill="#000000" text-anchor="middle">Wordsworth</text><text class="diagram-label" x="96.5" y="48" font-size="16" fill="#000000" text-anchor="middle">Memory recalls</text><text class="diagram-label" x="96.5" y="72" font-size="16" fill="#000000" text-anchor="middle">lasting pleasure</text><rect x="207.0" y="0" width="193.0" height="88" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="303.5" y="24" font-size="16" fill="#000000" text-anchor="middle">Heaney</text><text class="diagram-label" x="303.5" y="48" font-size="16" fill="#000000" text-anchor="middle">Stored fruit</text><text class="diagram-label" x="303.5" y="72" font-size="16" fill="#000000" text-anchor="middle">cannot last</text></g></g></g></g></svg>