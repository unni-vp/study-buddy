<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Love &amp; absence</title><desc id="map-description">Sonnet 29: the idea: Barrett Browning’s thoughts resemble vines growing around the beloved tree. They express desire but can hide the real person. The speaker wants actual presence. Commands make her an active voice in love. Sonnet 29: the method: A Petrarchan sonnet: 14 lines. Early turn with Yet starts rejecting thought as a substitute. Ending reverses the opening. Natural growth becomes release as greenery falls. Context: Sonnets from the Portuguese and love for Robert Browning. Dusting the Phone: the idea: Kay’s speaker fears disaster whether the telephone rings or stays silent. Every outcome feeds uncertainty. Polishing and dressing for the personified phone suggest service to an object that controls the day. Dusting: the method: Free verse and tercets lead to an isolated last line. Fragments and questions interrupt attempts at control. Modern domestic communication makes dependence concrete. The lover’s gender is not specified the speaker is not automatically the poet. A shared problem: Absence makes imagination powerful. Browning uses a growing plant Kay uses a household device. Both speakers address a beloved and want more than imagined contact. Compare how desire is voiced. A different ending: Browning imagines closeness freeing her from thought. Kay’s attempted ultimatum collapses into uncertainty. Build an argument about control, then connect metaphor, changing tone and ending. Do not give two separate summaries.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,322,251" transform="translate(18 18)"><rect width="322" height="251" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Sonnet 29: the idea</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Barrett Browning’s thoughts resemble</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">vines growing around the beloved tree.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">They express desire but can hide the</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">real person.</text><path class="section-divider" d="M18 153H304" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The speaker wants actual presence.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Commands make her an active voice in</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">love.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,322,273" transform="translate(18 281)"><rect width="322" height="273" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Sonnet 29: the method</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A <tspan font-weight="700">Petrarchan</tspan> <tspan font-weight="700">sonnet:</tspan> 14 lines.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Early turn with Yet starts rejecting</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">thought as a substitute.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ending reverses the opening.</text><path class="section-divider" d="M18 153H304" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Natural growth becomes release as</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">greenery falls.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Context:</tspan> Sonnets from the Portuguese</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and love for Robert Browning.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,306,257" transform="translate(352 18)"><rect width="306" height="257" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="288" height="64" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Dusting the Phone: the</text><text class="panel-title" x="50" y="62" font-size="20" fill="#468133" font-weight="700" text-anchor="start">idea</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Kay’s speaker fears disaster whether</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the telephone rings or stays silent.</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Every outcome feeds uncertainty.</text><path class="section-divider" d="M18 159H288" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Polishing and dressing for the</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">personified phone suggest service to</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">an object that controls the day.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,306,295" transform="translate(352 287)"><rect width="306" height="295" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="288" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Dusting: the method</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Free verse and tercets lead to an</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">isolated last line.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fragments and questions interrupt</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">attempts at control.</text><path class="section-divider" d="M18 153H288" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Modern domestic communication</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">makes dependence concrete.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The lover’s gender is not specified</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the speaker is not automatically the</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">poet.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,432,229" transform="translate(670 18)"><rect width="432" height="229" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="414" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">A shared problem</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Absence makes imagination powerful.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Browning uses a growing plant</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Kay uses a household device.</text><path class="section-divider" d="M18 131H414" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Both speakers address a beloved and want more than</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">imagined contact.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare how desire is voiced.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,432,323" transform="translate(670 259)"><rect width="432" height="323" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="414" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">A different ending</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Browning imagines closeness freeing her from thought.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Kay’s attempted ultimatum collapses into uncertainty.</text><path class="section-divider" d="M18 109H414" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Build an argument about <tspan font-weight="700">control,</tspan> then connect</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">metaphor, changing tone and ending.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Do not give two separate summaries.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Compares imagined release with unresolved waiting rather than treating both love poems as identical.</title><rect x="0" y="0" width="191.0" height="88" rx="7" fill="#468133" fill-opacity=".06" stroke="#468133"/><text class="diagram-label" x="95.5" y="24" font-size="16" fill="#000000" text-anchor="middle">Browning</text><text class="diagram-label" x="95.5" y="48" font-size="16" fill="#000000" text-anchor="middle">Imagines release</text><text class="diagram-label" x="95.5" y="72" font-size="16" fill="#000000" text-anchor="middle">through closeness</text><rect x="205.0" y="0" width="191.0" height="88" rx="7" fill="#7651a5" fill-opacity=".06" stroke="#7651a5"/><text class="diagram-label" x="300.5" y="24" font-size="16" fill="#000000" text-anchor="middle">Kay</text><text class="diagram-label" x="300.5" y="48" font-size="16" fill="#000000" text-anchor="middle">Keeps waiting</text><text class="diagram-label" x="300.5" y="72" font-size="16" fill="#000000" text-anchor="middle">without resolution</text></g></g></g></g></svg>