dy-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Duffy questions the audience</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ghose also questions the image-maker.</text></g></g></svg>