<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Witnessing &amp; trauma</title><desc id="map-description">Remains: the idea: Armitage’s soldier recalls a shared shooting, then cannot escape it at home. Uncertainty about the man’s weapon persists. The mark on the road becomes a mental presence. War imagery relocates the conflict inside his head. Remains: the method: Colloquial dramatic monologue enjambment drives the account. Shared pronouns narrow towards isolated responsibility final couplet concentrates it. Veterans’ testimony informed The Not Dead. The poetic speaker is not Armitage himself. War Photographer: the idea: Duffy’s photographer develops film while painful memories return. A few published images receive a brief response. Religious imagery makes his task solemn. Domestic safety contrasts with suffering he witnessed. War Photographer: the method: Four sestets with ABBCDD rhyme impose order beside emotional disturbance. The ending resumes the work cycle. Film darkroom and newspaper culture shape the ethical problem. Professional composure can coexist with distress. Decomposition: the idea: Ghose’s speaker re-examines a photograph of a sleeping beggar in Bombay. Earlier pride becomes shame about turning hardship into art. Stone imagery seems to erase individuality the poem then challenges that way of seeing. Decomposition: the method: Five quatrains in free verse. Past confidence changes to present self-criticism. The beggar is asleep, not confirmed dead. Compare photographer, subject and viewer responsibilities. Duffy questions the audience Ghose also questions the image-maker.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,326,273" transform="translate(18 18)"><rect width="326" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Remains: the idea</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Armitage’s soldier recalls a shared</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">shooting, then cannot escape it at home.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Uncertainty about the man’s weapon</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">persists.</text><path class="section-divider" d="M18 153H308" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The mark on the road becomes a</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">mental presence.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">War imagery relocates the conflict</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">inside his head.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,326,295" transform="translate(18 303)"><rect width="326" height="295" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="308" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Remains: the method</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Colloquial dramatic monologue</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">enjambment drives the account.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Shared pronouns narrow towards</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">isolated responsibility</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">final couplet concentrates it.</text><path class="section-divider" d="M18 175H308" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Veterans’ testimony informed The Not</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dead.</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The poetic speaker is not Armitage</text><text class="body-text" x="18" y="264" font-size="16" fill="#000000" font-weight="400" text-anchor="start">himself.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,390,345" transform="translate(356 18)"><rect width="390" height="345" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="372" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">War Photographer: the idea</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Duffy’s photographer develops film while painful</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">memories return.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A few published images receive a brief response.</text><path class="section-divider" d="M18 131H372" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Religious imagery makes his task solemn.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Domestic safety contrasts with suffering he</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">witnessed.</text><g transform="translate(18 216)"><g class="concept-illustration"><title>Tracks how witnessed suffering is selected and received in War Photographer.</title><rect x="0.0" y="0" width="110.0" height="88" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0"/><text class="diagram-label" x="55.0" y="24" font-size="16" fill="#000000" text-anchor="middle">Witness</text><text class="diagram-label" x="55.0" y="48" font-size="16" fill="#000000" text-anchor="middle">Painful</text><text class="diagram-label" x="55.0" y="72" font-size="16" fill="#000000" text-anchor="middle">events</text><path d="M112.0 44L120.0 44" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M115.61208719054814 46.39712769302101L120.0 44L115.61208719054814 41.60287230697899" stroke="#2366a0" stroke-width="2" fill="none"/><rect x="122.0" y="0" width="110.0" height="88" rx="7" fill="#7651a5" fill-opacity=".06" stroke="#7651a5"/><text class="diagram-label" x="177.0" y="24" font-size="16" fill="#000000" text-anchor="middle">Editor</text><text class="diagram-label" x="177.0" y="48" font-size="16" fill="#000000" text-anchor="middle">Selects</text><text class="diagram-label" x="177.0" y="72" font-size="16" fill="#000000" text-anchor="middle">images</text><path d="M234.0 44L242.0 44" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M237.61208719054812 46.39712769302101L242.0 44L237.61208719054812 41.60287230697899" stroke="#2366a0" stroke-width="2" fill="none"/><rect x="244.0" y="0" width="110.0" height="88" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="299.0" y="24" font-size="16" fill="#000000" text-anchor="middle">Audience</text><text class="diagram-label" x="299.0" y="48" font-size="16" fill="#000000" text-anchor="middle">Brief</text><text class="diagram-label" x="299.0" y="72" font-size="16" fill="#000000" text-anchor="middle">response</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,390,229" transform="translate(356 375)"><rect width="390" height="229" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="372" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">War Photographer: the method</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Four sestets with ABBCDD rhyme impose order</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">beside emotional disturbance.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The ending resumes the work cycle.</text><path class="section-divider" d="M18 131H372" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Film darkroom and newspaper culture shape the</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">ethical problem.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Professional composure can coexist with distress.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,344,295" transform="translate(758 18)"><rect width="344" height="295" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="326" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Decomposition: the idea</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ghose’s speaker re-examines a</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">photograph of a sleeping beggar in</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Bombay.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Earlier pride becomes shame about</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start">turning hardship into art.</text><path class="section-divider" d="M18 175H326" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Stone imagery seems to erase</text><text class="body-text" x="18" y="220"