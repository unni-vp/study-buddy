<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Home &amp; belonging</title><desc id="map-description">I Shall Return: the idea: McKay’s speaker promises a return to cherished landscape, music and community. Precious colours make the remembered homeland valuable. Final pain explains the need for belonging. Repetition expresses resolve and possible self-reassurance. McKay: the method: A Shakespearean sonnet: three quatrains and a couplet. Nature → community → emotional explanation. Jamaican migration and the Harlem Renaissance illuminate cultural attachment. The hoped-for return is not shown happening. Compare Wordsworth: Both connect nature with emotional relief. Wordsworth’s remembered flowers already change his present mood. McKay longs to be physically home. Compare fulfilled recollection with future promise, using each ending. Compare Drummer Hodge: Both place identity in relation to a landscape. Hodge’s unfamiliar sky contrasts with McKay’s cherished colours and music. Hodge cannot return. The landscape absorbs him after death McKay imagines belonging through living participation. Context changes meaning: Wordsworth: Romantic faith in imagination. McKay: separation from a homeland and culture. Hardy: an ordinary life displaced by imperial war. Use these contexts to explain specific choices, not as detached biography. Write a connected argument: Choose the pair that fits the question. Track time: remembered past → present effect → hoped-for or permanent future. Compare language, form and structure as well as content. A shared natural setting does not prove shared emotions.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,378,379" transform="translate(18 18)"><rect width="378" height="379" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="360" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">I Shall Return: the idea</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">McKay’s speaker promises a return to</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cherished landscape, music and community.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Precious colours make the remembered</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">homeland valuable.</text><path class="section-divider" d="M18 153H360" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Final pain explains the need for belonging.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repetition expresses resolve and possible</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">self-reassurance.</text><g transform="translate(18 238)"><g class="concept-illustration"><title>Distinguishes remembered homeland from a hoped-for return that the poem does not show happening.</title><rect x="0" y="0" width="342" height="40" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0"/><text class="diagram-label" x="171.0" y="24" font-size="16" fill="#000000" text-anchor="middle">Remembered homeland</text><path d="M171.0 44L171.0 57" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M168.60287230697898 52.61208719054814L171.0 57L173.39712769302102 52.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><rect x="0" y="60" width="342" height="40" rx="7" fill="#468133" fill-opacity=".06" stroke="#468133"/><text class="diagram-label" x="171.0" y="84" font-size="16" fill="#000000" text-anchor="middle">Return is hoped for, not shown</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,378,229" transform="translate(18 409)"><rect width="378" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="360" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">McKay: the method</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">A</tspan> <tspan font-weight="700">Shakespearean</tspan> <tspan font-weight="700">sonnet:</tspan> three quatrains and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">a couplet.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Nature → community → emotional explanation.</text><path class="section-divider" d="M18 131H360" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Jamaican migration and the Harlem</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Renaissance illuminate cultural attachment.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The hoped-for return is not shown happening.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,330,251" transform="translate(408 18)"><rect width="330" height="251" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Compare Wordsworth</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Both connect nature with emotional</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">relief.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Wordsworth’s remembered flowers</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">already change his present mood.</text><path class="section-divider" d="M18 153H312" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">McKay longs to be physically home.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare <tspan font-weight="700">fulfilled</tspan> <tspan font-weight="700">recollection</tspan> with</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">future</tspan> <tspan font-weight="700">promise,</tspan> using each ending.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,330,273" transform="translate(408 281)"><rect width="330" height="273" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="312" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Compare Drummer Hodge</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Both place identity in relation to a</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">landscape.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Hodge’s unfamiliar sky contrasts with</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">McKay’s cherished colours and music.</text><path class="section-divider" d="M18 153H312" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Hodge cannot return.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The landscape absorbs him after death</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">McKay imagines belonging through</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">living participation.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,273" transform="translate(750 18)"><rect width="352" height="273" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Context changes meaning</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Wordsworth:</tspan> Romantic faith in</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">imagination.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">McKay:</tspan> separation from a homeland and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">culture.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Hardy:</tspan> an ordinary life displaced by</text><text class="body-text" x="18" y="185" font-size="16" fill="#000000" font-weight="400" text-anchor="start">imperial war.</text><path class="section-divider" d="M18 197H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Use these contexts to explain specific</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">choices, not as detached biography.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,251" transform="translate(750 303)"><rect width="352" height="251" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Write a connected argument</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Choose the pair that fits the question.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Track</tspan> <tspan font-weight="700">time:</tspan> remembered past → present</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">effect → hoped-for or permanent future.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare language, form and structure as</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">well as content.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A shared natural setting does not prove</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">shared emotions.</text></g></g></svg>