white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">War beyond the battlefield</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Disabled:</tspan> injury and neglected homecoming.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Kamikaze:</tspan> survival followed by exclusion.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Remains:</tspan> a violent event persists in memory.</text><path class="section-divider" d="M18 131H346" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Distinguish physical loss, social punishment</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and psychological harm.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,364,367" transform="translate(738 237)"><rect width="364" height="367" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="346" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Looking and responsibility</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">War</tspan> <tspan font-weight="700">Photographer:</tspan> witness, editor and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">audience respond differently.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Decomposition:</tspan> an observer rethinks</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">making art from hardship.</text><path class="section-divider" d="M18 153H346" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">For</tspan> <tspan font-weight="700">every</tspan> <tspan font-weight="700">poem:</tspan> voice → changing ideas →</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">language/form/structure → relevant context.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Compare effects with evidence.</text><g transform="translate(18 238)"><g class="concept-illustration"><title>Tracks how witnessed suffering is selected and received in War Photographer.</title><rect x="0.0" y="0" width="101.33333333333333" height="88" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0"/><text class="diagram-label" x="50.666666666666664" y="24" font-size="16" fill="#000000" text-anchor="middle">Witness</text><text class="diagram-label" x="50.666666666666664" y="48" font-size="16" fill="#000000" text-anchor="middle">Painful</text><text class="diagram-label" x="50.666666666666664" y="72" font-size="16" fill="#000000" text-anchor="middle">events</text><path d="M103.33333333333333 44L111.33333333333333 44" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M106.94542052388147 46.39712769302101L111.3333