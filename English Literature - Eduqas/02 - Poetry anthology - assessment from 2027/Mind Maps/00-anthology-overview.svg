<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Poetry anthology</title><desc id="map-description">Nature and childhood: The Schoolboy: fear restricts natural growth. Wordsworth: remembered nature restores joy. Blackberry Picking: desired pleasure gives way to decay. Compare who or what causes change: authority, recollection or time. Home and the past: I Shall Return: homeland remembered return hoped for. Drummer Hodge: burial abroad makes separation permanent. Place can preserve identity or expose distance from it. Compare the endings, not just landscape words. Love and distance: Sonnet 29: thoughts must give way to the real beloved. Dusting the Phone: imagined contact becomes anxious dependence. Cousin Kate: rejection and public judgement meet maternal pride. Compare power and the speaker’s final position. Family and selfhood: Catrin: connection survives conflict over independence. Origin Story: imperfect parental love can leave a valuable legacy. Both look back, but from different generations. A shared theme does not mean the same attitude. War beyond the battlefield: Disabled: injury and neglected homecoming. Kamikaze: survival followed by exclusion. Remains: a violent event persists in memory. Distinguish physical loss, social punishment and psychological harm. Looking and responsibility: War Photographer: witness, editor and audience respond differently. Decomposition: an observer rethinks making art from hardship. For every poem: voice → changing ideas → language/form/structure → relevant context. Compare effects with evidence.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,346,273" transform="translate(18 18)"><rect width="346" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="328" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Nature and childhood</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">The</tspan> <tspan font-weight="700"