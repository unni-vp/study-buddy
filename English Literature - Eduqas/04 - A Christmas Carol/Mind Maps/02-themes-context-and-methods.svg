<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Themes, context and methods</title><desc id="map-description">Poverty and responsibility: Poor people: individuals with dignity, not surplus numbers. Cratchit happiness does not erase deprivation. Marley and children: neglected duties have personal and social consequences. Ending: charity plus better wages makes change practical. Family and Christmas: Shared rooms, meals and invitations: warmth and belonging. Scrooge: cold isolation. Christmas: concentrates generosity, forgiveness and community. Promise: keep its values throughout the year, not only one day. Redemption and time: Past: causes and missed kindness. Present: duties. Future: possible consequences. Future: conditional warning leaves room for choice. Actions: the final stave confirms a lasting change. Context linked to evidence: 1843: industrial growth alongside deprivation. Dickens’s childhood work informs concern for vulnerability. Poor Law and workhouses: harsh relief contrasts with personal compassion. Population arguments: abstract numbers are challenged through Tiny Tim. Form and narrative voice: Novella: concentrated moral journey. Ghost story: fear opens a route to change. Staves: musical title suggests shared celebration. Ending revisits the opening world differently. Narrator: humour, direct address and emotion shape judgement. Imagery and essay writing: Cold/warmth: emotional contrast. Light/dark: insight and fear. Chains: consequences. Food: sharing and need. Evidence: connect a short anchor with method and meaning. Track development. Task: printed extract and wider novella, with relevant context woven into analysis.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,322,286" transform="translate(18 18)"><rect width="322" height="286" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Poverty and responsibility</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill=