weight="400" text-anchor="start"><tspan font-weight="700">Past:</tspan> lonely school, Fan’s kindness,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fezziwig’s party, Belle’s departure.</text><path class="section-divider" d="M18 109H332" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“Another</tspan> <tspan font-weight="700">idol”:</tspan> wealth replaces love</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">through a religious metaphor.</text><path class="section-divider" d="M18 166H332" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Purpose:</tspan> regret and recovered values.</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Explanation is not an excuse.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,286" transform="translate(380 18)"><rect width="354" height="286" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Stave 3: others matter</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Present:</tspan> Cratchit affection, Tiny Tim, Fred’s</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">gathering, Ignorance and Want.</text><path class="section-divider" d="M18 109H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Children:</tspan> allegory makes social neglect</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">visible.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Tim:</tspan> possible loss challenges an abstract</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">view of poverty.</text><path class="section-divider" d="M18 210H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Purpose:</tspan> empathy and shared</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">responsibility.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,264" transform="translate(380 316)"><rect width="354" height="264" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Stave 4: consequences</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Silent</tspan> <tspan font-weight="700">future:</tspan> indifference to a death,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">stolen possessions, family grief and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Scrooge’s grave.</text><path class="section-divider" d="M18 131H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Contrast:</tspan> money cannot buy loving</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">remembrance.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Future is conditional, not fixed.</text><path class="section-divider" d="M18 210H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Purpose:</tspan> fear becomes urgency to act.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,356,264" transform="translate(746 18)"><rect width="356" height="264" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="338" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Stave 5: action proves change</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Scrooge:</tspan> sends food, gives to charity, visits</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fred and raises Bob’s salary.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Tiny Tim survives.</text><path class="section-divider" d="M18 131H338" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“A</tspan> <tspan font-weight="700">second</tspan> <tspan font-weight="700">father”:</tspan> familial metaphor</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">replaces isolation with care.</text><path class="section-divider" d="M18 188H338" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Purpose:</tspan> redemption is sustained conduct,</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">not a cheerful mood.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,356,349" transform="translate(746 294)"><rect width="356" height="349" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="338" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Why three spirits?</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Sequence:</tspan> each spirit teaches a different</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">part of the moral lesson.</text><path class="section-divider" d="M18 109H338" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Connection:</tspan> regret, empathy and urgency</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">help turn knowledge into changed action.</text><g transform="translate(18 172)"><g class="concept-illustration"><title>Shows how the ordered visits build regret, empathy and urgency; avoids presenting Scrooge’s redemption as only fear of death.</title><rect x="0" y="0" width="320" height="32" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0" stroke-width="1.5"/><text class="diagram-label" x="160.0" y="21.0" font-size="16" fill="#000000" text-anchor="middle">Past: regret and reflection</text><path d="M160.0 35L160.0 49" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M157.60287230697898 44.61208719054814L160.0 49L162.39712769302102 44.61208719054814" stroke="#2366a0" stroke-width="2" fill="none"/><rect x="0" y="52" width="320" height="32" rx="7" fill="#468133" fill-opacity=".06" stroke="#468133" stroke-width="1.5"/><text class="diagram-label" x="160.0" y="73.0" font-size="16" fill="#000000" text-anchor="middle">Present: empathy for others</text><path d="M160.0 87L160.0 101" stroke="#468133" stroke-width="2.3" fill="none"/><path d="M157.60287230697898 96.61208719054814L160.0 101L162.39712769302102 96.61208719054814" stroke="#468133" stroke-width="2" fill="none"/><rect x="0" y="104" width="320" height="32" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619" stroke-width="1.5"/><text class="diagram-label" x="160.0" y="125.0" font-size="16" fill="#000000" text-anchor="middle">Future: urgency to change</text></g></g></g></g></svg>