<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">A Christmas Carol overview</title><desc id="map-description">Stave 1: warning: Scrooge: rejects family and charity. Bob works in cold conditions. Marley warns him. Evidence: “solitary as an oyster” suggests emotional enclosure. Chain: selfish choices become a burden. Purpose: expose isolation and make change urgent. Stave 2: remembering: Past: lonely school, Fan’s kindness, Fezziwig’s party, Belle’s departure. “Another idol”: wealth replaces love through a religious metaphor. Purpose: regret and recovered values. Explanation is not an excuse. Stave 3: others matter: Present: Cratchit affection, Tiny Tim, Fred’s gathering, Ignorance and Want. Children: allegory makes social neglect visible. Tim: possible loss challenges an abstract view of poverty. Purpose: empathy and shared responsibility. Stave 4: consequences: Silent future: indifference to a death, stolen possessions, family grief and Scrooge’s grave. Contrast: money cannot buy loving remembrance. Future is conditional, not fixed. Purpose: fear becomes urgency to act. Stave 5: action proves change: Scrooge: sends food, gives to charity, visits Fred and raises Bob’s salary. Tiny Tim survives. “A second father”: familial metaphor replaces isolation with care. Purpose: redemption is sustained conduct, not a cheerful mood. Why three spirits?: Sequence: each spirit teaches a different part of the moral lesson. Connection: regret, empathy and urgency help turn knowledge into changed action.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,350,286" transform="translate(18 18)"><rect width="350" height="286" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Stave 1: warning</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Scrooge:</tspan> rejects family and charity.</text><text class="body-text" x="18" y="97" f