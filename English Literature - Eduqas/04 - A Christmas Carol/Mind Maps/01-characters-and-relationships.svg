t><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">reveal the costs of low wages.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Tiny</tspan> <tspan font-weight="700">Tim:</tspan> a valued individual.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fred</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">Fan:</tspan> invitations and affection</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">offer belonging.</text><path class="section-divider" d="M18 188H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Fezziwig:</tspan> humane employer.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Belle:</tspan> love displaced by wealth.</text></g></g></svg>