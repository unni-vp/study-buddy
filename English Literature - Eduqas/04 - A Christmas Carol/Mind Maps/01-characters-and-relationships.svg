an> generous</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">alternative to hoarding.</text><path class="section-divider" d="M18 109H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Cratchits:</tspan> love has worth without wealth.</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Poverty still harms.</text><path class="section-divider" d="M18 166H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="189" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ignorance</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">Want:</tspan> social deprivation</text><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">threatens the wider community.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,264" transform="translate(750 18)"><rect width="352" height="264" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Christmas Yet to Come</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Silence:</tspan> Scrooge must interpret the scenes.</text><text class="body-text" x="18" y="97" font-size="16" fill="#00