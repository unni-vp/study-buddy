<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Characters and relationships</title><desc id="map-description">Scrooge’s recovery: Start: money, fear and emotional enclosure. Past pain explains but does not excuse cruelty. Change: defends Fezziwig, regrets Belle, cares about Tim and faces his grave. End: salary, charity and family. “Light as a feather” suggests release from a burden. Marley: a warning double: Similarity: another businessman who neglected human duties. Chain: choices forge consequences. “Mankind was my business” redefines work through metaphor. Difference: Scrooge still has time to change. Christmas Past: Light: truth and painful memory. Changing age combines youth with recollection. Scenes: kindness and loneliness reveal values Scrooge has forgotten. Resistance: trying to extinguish the light suggests rejection of self-knowledge. Christmas Present: Warmth and abundance: generous alternative to hoarding. Cratchits: love has worth without wealth. Poverty still harms. Ignorance and Want: social deprivation threatens the wider community. Christmas Yet to Come: Silence: Scrooge must interpret the scenes. Darkness and solemn movement create dread. Contrast: indifference to the rich man versus grief for Tim. Question: can different choices change what may happen? Family and lost kindness: Bob and Mrs Cratchit: care and anger reveal the costs of low wages. Tiny Tim: a valued individual. Fred and Fan: invitations and affection offer belonging. Fezziwig: humane employer. Belle: love displaced by wealth.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,264" transform="translate(18 18)"><rect width="354" height="264" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Scrooge’s recovery</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Start:</tspan> money, fear and emotional enclosure.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Past pain explains but does not excuse</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cruelty.</text><path class="section-divider" d="M18 131H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Change:</tspan> defends Fezziwig, regrets Belle,</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cares about Tim and faces his grave.</text><path class="section-divider" d="M18 188H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">End:</tspan> salary, charity and family. “Light as a</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">feather” suggests release from a burden.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,264" transform="translate(18 294)"><rect width="354" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Marley: a warning double</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Similarity:</tspan> another businessman 