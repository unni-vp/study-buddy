<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Power, violence &amp; guilt</title><desc id="map-description">Ambition with awareness: Macbeth knows duties as relative, subject and host. His soliloquy reveals conscience. “Vaulting ambition” (1.7) is a riding metaphor of excess. His hesitation establishes responsibility: he understands objections before choosing the crime. Violence escalates: Defends Scotland → murders a sleeping guest → hires Banquo’s killers → attacks Macduff’s family. Violence changes from public service to private security and then cruelty. Fear does not excuse the decisions it helps explain. Blood changes meaning: Early blood proves bravery. After Duncan’s murder it becomes evidence and moral contamination. “Neptune’s ocean” (2.2): hyperbole makes guilt seem impossible to cleanse. Macbeth imagines staining the sea. Sleep &amp; washing: Murdering sleep suggests destroying innocence and peace. Lady Macbeth’s confident “little water” fails in the long term. Repeated hand-rubbing in 5.1 makes inner guilt visible. Her command cannot remove an imagined stain. Link the early claim to its later reversal. Kingship vs tyranny: Duncan nurtures loyalty. Macbeth commits regicide and usurps the crown. “Fruitless crown” (3.1): an infertility metaphor of insecurity. Scotland suffers. Malcolm’s recognised claim and moral concerns offer restoration, contrasting with Macbeth’s self-protection. Divine right: belief in God-given royal authority. Macduff’s “anointed temple” (2.3) is a sacred metaphor for Duncan’s body. A tragic ending: “Life’s but a walking shadow” (5.5) empties life of substance power has not brought meaning. Macbeth still fights, but courage cannot cancel murder. Lady Macbeth’s reported death limits what the audience knows. An audience can feel horror, pity and relief together.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,322,273" transform="translate(18 18)"><rect width="322" height="273" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Ambition with awareness</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth knows duties as relative,</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">subject and host.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">His <tspan font-weight="700">soliloquy</tspan> reveals conscience.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">“Vaulting ambition” (1.7) is a riding</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">metaphor</tspan> of excess.</text><path class="section-divider" d="M18 175H304" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">His</tspan> <tspan font-weight="700">hesitation</tspan> <tspan font-weight="700">establishes</tspan></text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">responsibility:</tspan> he understands</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">objections before choosing the crime.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,322,264" transform="translate(18 303)"><rect width="322" height="264" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Violence escalates</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Defends Scotland → murders a</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sleeping guest → hires Banquo’s killers</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">→ attacks Macduff’s family.</text><path class="section-divider" d="M18 131H304" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Violence changes from public service to</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">private security and then cruelty.</text><path class="section-divider" d="M18 188H304" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fear does not excuse the decisions it</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">helps explain.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,386,229" transform="translate(352 18)"><rect width="386" height="229" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="368" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Blood changes meaning</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Early blood proves bravery.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">After Duncan’s murder it becomes evidence and</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">moral contamination.</text><path class="section-divider" d="M18 131H368" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“Neptune’s</tspan> <tspan font-weight="700">ocean”</tspan> <tspan font-weight="700">(2.2):</tspan> hyperbole makes</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">guilt seem impossible to cleanse.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth imagines staining the sea.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,386,438" transform="translate(352 259)"><rect width="386" height="438" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="368" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Sleep &amp; washing</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Murdering sleep suggests destroying innocence</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and peace.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macbeth’s confident “little water” fails in</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the long term.</text><path class="section-divider" d="M18 153H368" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Repeated hand-rubbing in 5.1 makes inner guilt</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">visible.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Her command cannot remove an imagined stain.</text><path class="section-divider" d="M18 232H368" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Link the early claim to its later reversal.</text><g transform="translate(18 273)"><g class="concept-illustration"><title>Places the early dismissal of guilt beside its later reversal in the washing motif.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Act 2:</text><text class="diagram-label" x="183.0" y="16" font-size="16" fill="#000000" text-anchor="start">Act 5:</text><rect x="0" y="30" width="167.0" height="64" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="83.5" y="54" font-size="16" fill="#000000" text-anchor="middle">Physical blood</text><text class="diagram-label" x="83.5" y="78" font-size="16" fill="#000000" text-anchor="middle">“A little water”</text><rect x="183.0" y="30" width="167.0" height="64" rx="7" fill="#7651a5" fill-opacity=".06" stroke="#7651a5"/><text class="diagram-label" x="266.5" y="54" font-size="16" fill="#000000" text-anchor="middle">Imagined stain</text><text class="diagram-label" x="266.5" y="78" font-size="16" fill="#000000" text-anchor="middle">“damned spot”</text><text class="diagram-label" x="175.0" y="124" font-size="16" fill="#000000" text-anchor="middle">Confidence is reversed by lasting guilt</text></g></g></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,374" transform="translate(750 18)"><rect width="352" height="374" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Kingship vs tyranny</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Duncan nurtures loyalty.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth commits <tspan font-weight="700">regicide</tspan> and <tspan font-weight="700">usurps</tspan> the</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">crown. “Fruitless crown” (3.1): an infertility</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">metaphor</tspan> of insecurity.</text><path class="section-divider" d="M18 153H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Scotland suffers.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Malcolm’s recognised claim and moral</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">concerns offer restoration, contrasting with</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth’s self-protection.</text><path class="section-divider" d="M18 254H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Divine</tspan> <tspan font-weight="700">right:</tspan> belief in God-given royal</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">authority.</text><text class="body-text" x="18" y="321" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macduff’s “anointed temple” (2.3) is a</text><text class="body-text" x="18" y="343" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sacred <tspan font-weight="700">metaphor</tspan> for Duncan’s body.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,308" transform="translate(750 404)"><rect width="352" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">A tragic ending</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">“Life’s but a walking shadow” (5.5) empties</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">life of substance</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">power has not brought meaning.</text><path class="section-divider" d="M18 131H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth still fights, but courage cannot</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cancel murder.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macbeth’s reported death limits what</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the audience knows.</text><path class="section-divider" d="M18 232H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">An audience can feel horror, pity and relief</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">together.</text></g></g></svg>