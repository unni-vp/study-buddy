<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Deception, fate &amp; gender</title><desc id="map-description">Fair and foul: “Fair is foul” (1.1): paradox confuses good and evil. Lady Macbeth’s “innocent flower” and “serpent” (1.5) use contrasting images. Duncan trusts the castle’s welcome while the audience knows the murder plan: dramatic irony. Private thought, public mask: Asides and soliloquies let us hear what Macbeth conceals. At the banquet, his reactions undermine the image of a secure king. Ask who knows what at each moment and how that changes audience tension. Predictions are equivocal: Macbeth hears safety in promises with unexpected meanings. Branch-carrying soldiers make Birnam Wood seem to move. Macduff’s unusual birth defeats Macbeth’s interpretation of “woman born”. Hubris: Macbeth treats partial truth as complete protection. Equivocation encourages false certainty. Choice remains visible: Witches act as catalysts Macbeth still plans and chooses. Banquo hears prophecy too, but exercises greater restraint. Dagger vision can show intention and fear. The ghost may suggest guilt, supernatural punishment or both. Support an interpretation with stage action and language. Competing ideas of manhood: Lady Macbeth makes murder proof of manhood: a conditional challenge. Macbeth initially gives courage moral limits. He later questions the murderers’ masculinity, repeating her tactic. Macduff insists grief is human and compatible with courage. Avoid simple labels: Lady Macbeth’s influence changes she does not control every later crime. Banquo is cautious, but interested in his future. Patriarchal expectations help explain the pressure to prove manhood. Royal and witchcraft beliefs can deepen specific interpretations. Distinguish Scotland in the story from Shakespeare’s stage audience.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,354,401" transform="translate(18 18)"><rect width="354" height="401" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Fair and foul</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“Fair</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">foul”</tspan> <tspan font-weight="700">(1.1):</tspan> <tspan font-weight="700">paradox</tspan> confuses</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">good and evil.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macbeth’s “innocent flower” and</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">“serpent” (1.5) use contrasting <tspan font-weight="700">images.</tspan></text><path class="section-divider" d="M18 153H336" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Duncan trusts the castle’s welcome while</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the audience knows the murder plan:</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">dramatic irony.</text><g transform="translate(18 238)"><g class="concept-illustration"><title>Makes the unequal knowledge of Duncan and the audience explicit.</title><rect x="0" y="0" width="318" height="40" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0"/><text class="diagram-label" x="159.0" y="24" font-size="16" fill="#000000" text-anchor="middle">Duncan: trusts the welcome</text><rect x="0" y="52" width="318" height="40" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="159.0" y="76" font-size="16" fill="#000000" text-anchor="middle">Audience: knows the murder plan</text><text class="diagram-label" x="159.0" y="122" font-size="16" fill="#000000" text-anchor="middle">Unequal knowledge creates tension</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,354,229" transform="translate(18 431)"><rect width="354" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Private thought, public mask</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Asides and soliloquies let us hear what</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth conceals.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">At the banquet, his reactions undermine the</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">image of a secure king.</text><path class="section-divider" d="M18 153H336" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ask who knows what at each moment and</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">how that changes audience tension.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,354,308" transform="translate(384 18)"><rect width="354" height="308" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Predictions are equivocal</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth hears safety in promises with</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">unexpected meanings.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Branch-carrying soldiers make Birnam</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Wood seem to move.</text><path class="section-divider" d="M18 153H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macduff’s unusual birth defeats Macbeth’s</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">interpretation of “woman born”.</text><path class="section-divider" d="M18 210H336" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Hubris:</tspan> Macbeth treats partial truth as</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">complete protection.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Equivocation encourages false certainty.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,354,308" transform="translate(384 338)"><rect width="354" height="308" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="336" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Choice remains visible</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Witches act as <tspan font-weight="700">catalysts</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth still plans and chooses.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Banquo hears prophecy too, but exercises</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">greater restraint.</text><path class="section-divider" d="M18 153H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dagger vision can show intention and fear.</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The ghost may suggest guilt, supernatural</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">punishment or both.</text><path class="section-divider" d="M18 232H336" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Support an interpretation with stage action</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and language.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,352,264" transform="translate(750 18)"><rect width="352" height="264" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Competing ideas of manhood</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macbeth makes murder proof of</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">manhood: a <tspan font-weight="700">conditional</tspan> <tspan font-weight="700">challenge.</tspan></text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth initially gives courage moral limits.</text><path class="section-divider" d="M18 131H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">He later questions the murderers’</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">masculinity, repeating her tactic.</text><path class="section-divider" d="M18 188H334" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macduff insists grief is human and</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">compatible with courage.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,352,330" transform="translate(750 294)"><rect width="352" height="330" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="334" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Avoid simple labels</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macbeth’s influence changes</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">she does not control every later crime.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Banquo is cautious, but interested in his</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">future.</text><path class="section-divider" d="M18 153H334" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Patriarchal expectations help explain the</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pressure to prove manhood.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Royal and witchcraft beliefs can deepen</text><