<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Deception, fate &amp; gender</title><desc id="map-description">Fair and foul: Witches join opposites in 1.1, unsettling certainty. Lady Macbeth separates an “innocent flower” from a hidden “serpent” (1.5). Duncan trusts the castle’s welcome while the audience knows the murder plan: dramatic irony. Private thought, public mask: Asides and soliloquies let us hear what Macbeth conceals. At the banquet, his reactions undermine the image of a secure king. Ask who knows what at each moment and how that changes audience tension. Predictions are equivocal: Macbeth hears safety in promises with unexpected meanings. Branch-carrying soldiers make Birnam Wood seem to move. Macduff’s unusual birth defeats Macbeth’s interpretation of “woman born”. Partial truth encourages false certainty. Choice remains visible: Witches tempt, but Macbeth plans and acts. Banquo hears prophecy too and responds more cautiously. Dagger vision can show intention and fear. The ghost may suggest guilt, supernatural punishment or both. Support an interpretation with stage action and language. Competing ideas of manhood: Lady Macbeth links courage to murder. Macbeth initially insists on moral limits to manhood. He later questions the murderers’ masculinity, repeating her tactic. Macduff insists grief is human and compatible with courage. Avoid simple labels: Lady Macbeth’s influence changes she does not control every later crime. Banquo is cautious, but interested in his future. Historical beliefs can illuminate kingship, witchcraft and gender audiences need not respond identically. Distinguish Scotland in the story from Shakespeare’s stage audience.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,390,357" transform="translate(18 18)"><rect width="390" height="357" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="372" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Fair and foul</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Witches join opposites in 1.1, unsettling certainty.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macbeth separates an “innocent flower”</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">from a hidden “serpent” (1.5).</text><path class="section-divider" d="M18 131H372" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Duncan trusts the castle’s welcome while the</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">audience knows the murder plan: dramatic irony.</text><g transform="translate(18 194)"><g class="concept-illustration"><title>Makes the unequal knowledge of Duncan and the audience explicit.</title><rect x="0" y="0" width="354" height="40" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0"/><text class="diagram-label" x="177.0" y="24" font-size="16" fill="#000000" text-anchor="middle">Duncan: trusts the welcome</text><rect x="0" y="52" width="354" height="40" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="177.0" y="76" font-size="16" fill="#000000" text-anchor="middle">Audience: knows the murder plan</text><text class="diagram-label" x="177.0" y="122" font-size="16" fill="#000000" text-anchor="middle">Unequal knowledge creates tension</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,390,229" transform="translate(18 387)"><rect width="390" height="229" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="372" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Private thought, public mask</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Asides and soliloquies let us hear what Macbeth</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">conceals.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">At the banquet, his reactions undermine the</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">image of a secure king.</text><path class="section-divider" d="M18 153H372" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ask who knows what at each moment and how</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">that changes audience tension.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,342,264" transform="translate(420 18)"><rect width="342" height="264" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Predictions are equivocal</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth hears safety in promises with</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">unexpected meanings.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Branch-carrying soldiers make Birnam</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Wood seem to move.</text><path class="section-divider" d="M18 153H324" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macduff’s unusual birth defeats Macbeth’s</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">interpretation of “woman born”.</text><path class="section-divider" d="M18 210H324" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Partial truth encourages false certainty.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,342,330" transform="translate(420 294)"><rect width="342" height="330" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="324" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Choice remains visible</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Witches tempt, but Macbeth plans and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">acts.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Banquo hears prophecy too and responds</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">more cautiously.</text><path class="section-divider" d="M18 153H324" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Dagger vision can show intention and</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fear.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The ghost may suggest guilt, supernatural</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">punishment or both.</text><path class="section-divider" d="M18 254H324" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Support an interpretation with stage</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">action and language.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,328,292" transform="translate(774 18)"><rect width="328" height="292" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="310" height="64" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Competing ideas of</text><text class="panel-title" x="50" y="62" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">manhood</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macbeth links courage to murder.</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth initially insists on moral limits</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">to manhood.</text><path class="section-divider" d="M18 159H310" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start">He later questions the murderers’</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">masculinity, repeating her tactic.</text><path class="section-divider" d="M18 216H310" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="239" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macduff insists grief is human and</text><text class="body-text" x="18" y="261" font-size="16" fill="#000000" font-weight="400" text-anchor="start">compatible with courage.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,328,308" transform="translate(774 322)"><rect width="328" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="310" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Avoid simple labels</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macbeth’s influence changes</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">she does not control every later crime.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Banquo is cautious, but interested in his</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">future.</text><path class="section-divider" d="M18 153H310" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Historical beliefs can illuminate</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">kingship, witchcraft and gender</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">audiences need not respond identically.</text><path class="section-divider" d="M18 232H310" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Distinguish Scotland in the story from</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Shakespeare’s stage audience.</text></g></g></svg>