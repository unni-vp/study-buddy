<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Characters &amp; relationships</title><desc id="map-description">Macbeth’s transformation: “Brave Macbeth” (1.2) → secret desire → hesitation → murder → independent tyranny. “Fruitless crown” (3.1): power without secure inheritance. “Walking shadow” (5.5): achievement feels empty. Hubris: overconfidence in prophecy. Hamartia: ambition overriding judgement. Pity for wasted potential can coexist with condemnation. Lady Macbeth’s change: “Unsex me here” (1.5): an imperative asking to suppress compassion. Manhood challenges pressure Macbeth into murder. “A little water” (2.2) minimises guilt sleepwalking and “damned spot” (5.1) expose its persistence. Her requests for cruelty can reveal vulnerability, not effortless evil. Marriage: power shifts: Act 1: “partner of greatness” shared ambition. Act 2: she returns daggers and covers panic. Act 3: he plans Banquo’s death without her she tries to protect his image at the banquet. Act 5: emotional isolation. He is not controlled by her throughout. Banquo &amp; Macduff: Banquo is a foil: tempted but more restrained. “Instruments of darkness” (1.3) uses evil imagery to question prophecy. Fleance escapes. Macduff resists tyranny and grieves. “I must also feel it as a man” (4.3): the inclusive adverb joins feeling to courage. His duty to Scotland conflicts painfully with family safety. Duncan &amp; Malcolm: Duncan rewards service but misjudges loyalty. His welcome creates dramatic irony: the audience knows the danger he cannot see. Malcolm is the named heir. He tests loyalty “king-becoming graces” (4.3) uses ethical vocabulary to define responsible rule. Ending restores political order, without undoing suffering. Witches &amp; innocents: Witches are deceptive catalysts, offering tempting predictions and double meanings. They never tell Macbeth to kill Duncan. Lady Macduff and her son make the cost of tyranny visible through domestic dialogue and stage violence. Fleance escapes the play does not show his future kingship.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,350,330" transform="translate(18 18)"><rect width="350" height="330" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Macbeth’s transformation</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">“Brave Macbeth” (1.2) → secret desire →</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">hesitation → murder → independent</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">tyranny.</text><path class="section-divider" d="M18 131H332" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“Fruitless</tspan> <tspan font-weight="700">crown”</tspan> <tspan font-weight="700">(3.1):</tspan> power without</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">secure inheritance. “Walking shadow” (5.5):</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">achievement feels empty.</text><path class="section-divider" d="M18 210H332" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Hubris:</tspan> overconfidence in prophecy.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Hamartia:</tspan> ambition overriding judgement.</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Pity for wasted potential can coexist with</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">condemnation.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,350,308" transform="translate(18 360)"><rect width="350" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Lady Macbeth’s change</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“Unsex</tspan> <tspan font-weight="700">me</tspan> <tspan font-weight="700">here”</tspan> <tspan font-weight="700">(1.5):</tspan> an <tspan font-weight="700">imperative</tspan></text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">asking to suppress compassion.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Manhood challenges pressure Macbeth</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">into murder.</text><path class="section-divider" d="M18 153H332" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">“A little water” (2.2) minimises guilt</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sleepwalking and “damned spot” (5.1)</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">expose its persistence.</text><path class="section-divider" d="M18 232H332" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Her requests for cruelty can reveal</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">vulnerability, not effortless evil.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,358,414" transform="translate(380 18)"><rect width="358" height="414" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="340" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Marriage: power shifts</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">1:</tspan> “partner of greatness”</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">shared ambition.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">2:</tspan> she returns daggers and covers panic.</text><path class="section-divider" d="M18 131H340" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">3:</tspan> he plans Banquo’s death without her</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">she tries to protect his image at the banquet.</text><path class="section-divider" d="M18 188H340" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">5:</tspan> emotional isolation.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">He is not controlled by her throughout.</text><g transform="translate(18 251)"><g class="concept-illustration"><title>Compares the couple’s early shared knowledge with later secrecy and isolation.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Early:</text><text class="diagram-label" x="169.0" y="16" font-size="16" fill="#000000" text-anchor="start">Later:</text><rect x="0" y="29" width="153.0" height="64" rx="7" fill="#7651a5" fill-opacity=".06" stroke="#7651a5"/><text class="diagram-label" x="76.5" y="53" font-size="16" fill="#000000" text-anchor="middle">Shared plot</text><text class="diagram-label" x="76.5" y="77" font-size="16" fill="#000000" text-anchor="middle">Her direction</text><rect x="169.0" y="29" width="153.0" height="64" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="245.5" y="53" font-size="16" fill="#000000" text-anchor="middle">His secret plans</text><text class="diagram-label" x="245.5" y="77" font-size="16" fill="#000000" text-anchor="middle">Her isolation</text><text class="diagram-label" x="161.0" y="125" font-size="16" fill="#000000" text-anchor="middle">Power and knowledge become unequal</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,358,305" transform="translate(380 444)"