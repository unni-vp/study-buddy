<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Characters &amp; relationships</title><desc id="map-description">Macbeth’s transformation: “Brave Macbeth” (1.2) → secret desire → hesitation → murder → independent tyranny. “Fruitless crown” (3.1): power without secure inheritance. “Walking shadow” (5.5): achievement feels empty. Pity for wasted potential can coexist with condemnation. Lady Macbeth’s change: “Unsex me here” (1.5): she tries to suppress compassion. Challenges manhood controls the plan. “A little water” (2.2) minimises guilt sleepwalking and “damned spot” (5.1) expose its persistence. Her requests for cruelty can reveal vulnerability, not effortless evil. Marriage: power shifts: Act 1: “partner of greatness” shared ambition. Act 2: she returns daggers and covers panic. Act 3: he plans Banquo’s death without her she tries to protect his image at the banquet. Act 5: emotional isolation. He is not controlled by her throughout. Banquo &amp; Macduff: Banquo is a foil: shares curiosity about prophecy but warns of deception Fleance’s escape keeps Macbeth insecure. Macduff resists tyranny and grieves: “I must also feel it as a man” (4.3). His duty to Scotland conflicts painfully with family safety. Duncan &amp; Malcolm: Duncan rewards service but misjudges loyalty. His trust makes Macbeth’s betrayal more disturbing. Malcolm tests Macduff before trusting him responsible kingship contrasts with self-protection. Ending restores political order, without undoing suffering. Witches &amp; innocents: Witches offer tempting predictions and double meanings they never tell Macbeth to kill Duncan. Lady Macduff and her son make the cost of tyranny visible through domestic dialogue and stage violence. Fleance escapes the play does not show his future kingship.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,294,336" transform="translate(18 18)"><rect width="294" height="336" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="276" height="64" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Macbeth’s</text><text class="panel-title" x="50" y="62" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">transformation</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start">“Brave Macbeth” (1.2) → secret</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">desire → hesitation → murder →</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">independent tyranny.</text><path class="section-divider" d="M18 159H276" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“Fruitless</tspan> <tspan font-weight="700">crown”</tspan> <tspan font-weight="700">(3.1):</tspan> power</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">without secure inheritance.</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">“Walking shadow” (5.5):</text><text class="body-text" x="18" y="248" font-size="16" fill="#000000" font-weight="400" text-anchor="start">achievement feels empty.</text><path class="section-divider" d="M18 260H276" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="283" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Pity for wasted potential can</text><text class="body-text" x="18" y="305" font-size="16" fill="#000000" font-weight="400" text-anchor="start">coexist with condemnation.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,294,308" transform="translate(18 366)"><rect width="294" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="276" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Lady Macbeth’s change</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">“Unsex</tspan> <tspan font-weight="700">me</tspan> <tspan font-weight="700">here”</tspan> <tspan font-weight="700">(1.5):</tspan> she tries</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">to suppress compassion.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Challenges manhood</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">controls the plan.</text><path class="section-divider" d="M18 153H276" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">“A little water” (2.2) minimises guilt</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">sleepwalking and “damned spot”</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">(5.1) expose its persistence.</text><path class="section-divider" d="M18 232H276" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Her requests for cruelty can reveal</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">vulnerability, not effortless evil.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,442,417" transform="translate(324 18)"><rect width="442" height="417" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="424" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">Marriage: power shifts</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">1:</tspan> “partner of greatness”</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">shared ambition.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">2:</tspan> she returns daggers and covers panic.</text><path class="section-divider" d="M18 131H424" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">3:</tspan> he plans Banquo’s death without her</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">she tries to protect his image at the banquet.</text><path class="section-divider" d="M18 188H424" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">5:</tspan> emotional isolation.</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">He is not controlled by her throughout.</text><g transform="translate(18 251)"><g class="concept-illustration"><title>Compares the couple’s early shared knowledge with later secrecy and isolation.</title><text class="diagram-label" x="0" y="16" font-size="16" fill="#000000" text-anchor="start">Early:</text><text class="diagram-label" x="211.0" y="16" font-size="16" fill="#000000" text-anchor="start">Later:</text><rect x="0" y="29" width="195.0" height="64" rx="7" fill="#7651a5" fill-opacity=".06" stroke="#7651a5"/><text class="diagram-label" x="97.5" y="53" font-size="16" fill="#000000" text-anchor="middle">Shared plot</text><text class="diagram-label" x="97.5" y="77" font-size="16" fill="#000000" text-anchor="middle">Her direction</text><rect x="211.0" y="29" width="195.0" height="64" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="308.5" y="53" font-size="16" fill="#000000" text-anchor="middle">His secret plans</text><text class="diagram-label" x="308.5" y="77" font-size="16" fill="#000000" text-anchor="middle">Her isolation</text><text class="diagram-label" x="203.0" y="125" font-size="16" fill="#000000" text-anchor="middle">Power and knowledge become unequal</text></g></g></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,442,242" transform="translate(324 447)"><rect width="442" height="242" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="424" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Banquo &amp; Macduff</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Banquo</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">a</tspan> <tspan font-weight="700">foil:</tspan> shares curiosity about prophecy but</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">warns of deception</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fleance’s escape keeps Macbeth insecure.</text><path class="section-divider" d="M18 131H424" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Macduff</tspan> <tspan font-weight="700">resists</tspan> <tspan font-weight="700">tyranny</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">grieves:</tspan> “I must also feel</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">it as a man” (4.3).</text><path class="section-divider" d="M18 188H424" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">His duty to Scotland conflicts painfully with family safety.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,324,330" transform="translate(778 18)"><rect width="324" height="330" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="306" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Duncan &amp; Malcolm</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Duncan rewards service but misjudges</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">loyalty.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">His trust makes Macbeth’s betrayal</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">more disturbing.</text><path class="section-divider" d="M18 153H306" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Malcolm tests Macduff before trusting</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">him</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">responsible kingship contrasts with</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">self-protection.</text><path class="section-divider" d="M18 254H306" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Ending restores political order, without</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">undoing suffering.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,324,308" transform="translate(778 360)"><rect width="324" height="308" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="306" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Witches &amp; innocents</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Witches offer tempting predictions and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">double meanings</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">they never tell Macbeth to kill Duncan.</text><path class="section-divider" d="M18 131H306" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macduff and her son make the</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">cost of tyranny visible through</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">domestic dialogue and stage violence.</text><path class="section-divider" d="M18 210H306" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Fleance escapes</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">the play does not show his future</text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">kingship.</text></g></g></svg>