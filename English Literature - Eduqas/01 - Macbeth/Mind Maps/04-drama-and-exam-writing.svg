<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Drama &amp; exam writing</title><desc id="map-description">What an audience knows: Soliloquy: private thoughts. Aside: concealed from other characters. Dramatic irony: audience knows what a character does not. Track contrasts between public behaviour and private speech, rather than treating the play as a novel. How the action is staged: Duncan’s murder is offstage: anticipation and aftermath dominate. Macduff’s family faces violence onstage. Knocking interrupts the murder aftermath. Banquet shifts from ceremony to chaos. Explain why the order and staging matter. Sound, form &amp; imagery: Much speech is blank verse rhythmic patterns can vary. Witches’ rhyme can sound ritual-like. Lady Macbeth’s fragmented sleepwalking prose contrasts with earlier control. Blood, sleep, darkness and clothing develop repeated ideas explain effects, not just technique names. 15-mark extract: About 20 minutes. Give a clear overview, then follow changes across the printed passage. Short evidence → precise word/action analysis → meaning → possible audience response. Keep focus on this passage avoid retelling the whole play. 25-mark essay: About 40 minutes. 20 literary marks + 5 for writing accuracy. Select relevant themes and three/four developing moments. Link beginning, middle and end show how Shakespeare presents the idea. Claim → evidence → method → meaning/effect → question. Develop connected paragraphs, rather than listing every theme. Flexible evidence: “Vaulting ambition”: riding metaphor. “Fruitless crown”: infertility metaphor. “Little water” to “damned spot”: structural reversal. “also feel it as a man” (4.3): inclusive adverb. “Walking shadow”: insubstantial-life metaphor. Explain evidence in its moment, then link it to the argument.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,418,379" transform="translate(18 18)"><rect width="418" height="379" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="400" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">What an audience knows</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Soliloquy:</tspan> private thoughts.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Aside:</tspan> concealed from other characters.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Dramatic</tspan> <tspan font-weight="700">irony:</tspan> audience knows what a character</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">does not.</text><path class="section-divider" d="M18 153H400" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Track contrasts between public behaviour and private</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">speech, rather than treating the play as a novel.</text><g transform="translate(18 216)"><g class="concept-illustration"><title>Makes the unequal knowledge of Duncan and the audience explicit.</title><rect x="0" y="0" width="382" height="40" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0"/><text class="diagram-label" x="191.0" y="24" font-size="16" fill="#000000" text-anchor="middle">Duncan: trusts the welcome</text><rect x="0" y="52" width="382" height="40" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="191.0" y="76" font-size="16" fill="#000000" text-anchor="middle">Audience: knows the murder plan</text><text class="diagram-label" x="191.0" y="122" font-size="16" fill="#000000" text-anchor="middle">Unequal knowledge creates tension</text></g></g></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,418,242" transform="translate(18 409)"><rect width="418" height="242" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="400" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">How the action is staged</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Duncan’s</tspan> <tspan font-weight="700">murder</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">offstage:</tspan> anticipation and</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">aftermath dominate.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macduff’s family faces violence onstage.</text><path class="section-divider" d="M18 131H400" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Knocking interrupts the murder aftermath.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Banquet shifts from ceremony to chaos.</text><path class="section-divider" d="M18 188H400" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Explain why the order and staging matter.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,298,352" transfo