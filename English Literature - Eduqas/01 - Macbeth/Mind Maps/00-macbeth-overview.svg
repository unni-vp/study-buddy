<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Macbeth</title><desc id="map-description">Five-act journey: Act 1: prophecy and choice. Act 2: Duncan murdered. Macbeth crowned. Act 3: Banquo killed. Fleance escapes. Ghost at banquet. Act 4: misleading assurances. Macduff’s family killed. Act 5: Lady Macbeth dies. Resistance defeats Macbeth. Malcolm restores rule. Ambition → insecurity: A praised defender becomes a king who attacks his own people. He gains power but loses peace. The witches tempt Macbeth chooses. “Vaulting ambition” (1.7) shows he understands the danger. New crimes try to protect the first crime violence escalates. The marriage changes: Lady Macbeth initially directs the plot and challenges his manhood. After Duncan’s murder she manages his panic. Macbeth later excludes her from plans. Her sleepwalking reveals guilt his power leaves him isolated. Shared ambition → divided knowledge → loneliness. Contrasts &amp; victims: Banquo hears prophecy but warns of “instruments of darkness” (1.3). Macduff combines courage with grief. Duncan’s trust exposes betrayal Lady Macduff and her son reveal tyranny’s human cost. Malcolm offers a different model of leadership. Motifs &amp; stagecraft: Blood: bravery → murder → guilt. Sleep: rest → lost innocence. Washing cannot erase responsibility. Asides/soliloquies expose hidden thoughts. Dramatic irony makes trust dangerous. Public banquet exposes private fear. Answer the question: Extract: follow language, behaviour and shifts across the passage explain audience effects. Essay: argue across beginning, middle and end. Use precise evidence and analyse Shakespeare’s choices. 15-mark extract 25-mark essay includes 5 for writing accuracy.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,434,216" transform="translate(18 18)"><rect width="434" height="216" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">Five-act journey</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">1:</tspan> prophecy and choice.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">2:</tspan> Duncan murdered. Macbeth crowned.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">3:</tspan> Banquo killed. Fleance escapes. Ghost at banquet.</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">4:</tspan> misleading assurances. Macduff’s family killed.</text><text class="body-text" x="18" y="163" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Act</tspan> <tspan font-weight="700">5:</tspan> Lady Macbeth dies. Resistance defeats Macbeth.</text><text class="body-text" x="18" y="185" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Malcolm restores rule.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,434,402" transform="translate(18 246)"><rect width="434" height="402" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="416" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Ambition → insecurity</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">A praised defender becomes a king who attacks his</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">own people.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">He gains power but loses peace.</text><path class="section-divider" d="M18 131H416" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The witches tempt</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth chooses. “Vaulting ambition” (1.7) shows he</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">understands the danger.</text><path class="section-divider" d="M18 210H416" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">New crimes try to protect the first crime</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">violence escalates.</text><g transform="translate(18 273)"><g class="concept-illustration"><title>Tracks the changing purpose of Macbeth’s violence through his character arc.</title><rect x="0.0" y="0" width="124.66666666666667" height="88" rx="7" fill="#2366a0" fill-opacity=".06" stroke="#2366a0"/><text class="diagram-label" x="62.333333333333336" y="24" font-size="16" fill="#000000" text-anchor="middle">Defender</text><text class="diagram-label" x="62.333333333333336" y="48" font-size="16" fill="#000000" text-anchor="middle">Protects</text><text class="diagram-label" x="62.333333333333336" y="72" font-size="16" fill="#000000" text-anchor="middle">Scotland</text><path d="M126.66666666666667 44L134.66666666666669 44" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M130.2787538572148 46.39712769302101L134.66666666666669 44L130.2787538572148 41.60287230697899" stroke="#2366a0" stroke-width="2" fill="none"/><rect x="136.66666666666669" y="0" width="124.66666666666667" height="88" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="199.00000000000003" y="24" font-size="16" fill="#000000" text-anchor="middle">Regicide</text><text class="diagram-label" x="199.00000000000003" y="48" font-size="16" fill="#000000" text-anchor="middle">Kills</text><text class="diagram-label" x="199.00000000000003" y="72" font-size="16" fill="#000000" text-anchor="middle">Duncan</text><path d="M263.33333333333337 44L271.33333333333337 44" stroke="#2366a0" stroke-width="2.3" fill="none"/><path d="M266.9454205238815 46.39712769302101L271.33333333333337 44L266.9454205238815 41.60287230697899" stroke="#2366a0" stroke-width="2" fill="none"/><rect x="273.33333333333337" y="0" width="124.66666666666667" height="88" rx="7" fill="#b95619" fill-opacity=".06" stroke="#b95619"/><text class="diagram-label" x="335.6666666666667" y="24" font-size="16" fill="#000000" text-anchor="middle">Tyrant</text><text class="diagram-label" x="335.6666666666667" y="48" font-size="16" fill="#000000" text-anchor="middle">Attacks</text><text class="diagram-label" x="335.6666666666667" y="72" font-size="16" fill="#000000" text-anchor="middle">innocents</text></g></g></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,310,330" transform="translate(464 18)"><rect width="310" height="330" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="292" height="36" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">The marriage changes</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Lady Macbeth initially directs the plot</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">and challenges his manhood.</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">After Duncan’s murder she manages</text><text class="body-text" x="18" y="141" font-size="16" fill="#000000" font-weight="400" text-anchor="start">his panic.</text><path class="section-divider" d="M18 153H292" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth later excludes her from</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">plans.</text><text class="body-text" x="18" y="220" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Her sleepwalking reveals guilt</text><text class="body-text" x="18" y="242" font-size="16" fill="#000000" font-weight="400" text-anchor="start">his power leaves him isolated.</text><path class="section-divider" d="M18 254H292" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Shared ambition → divided</text><text class="body-text" x="18" y="299" font-size="16" fill="#000000" font-weight="400" text-anchor="start">knowledge → loneliness.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,310,286" transform="translate(464 360)"><rect width="310" height="286" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="292" height="36" rx="11" fill=