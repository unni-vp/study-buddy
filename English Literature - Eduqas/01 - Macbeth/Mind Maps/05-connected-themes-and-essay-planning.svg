<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1645.7142857142858" viewBox="0 0 1120 768" role="img" aria-labelledby="map-title map-description" data-print-width-mm="277" font-family="Segoe UI,Arial,sans-serif"><title id="map-title">Connected themes &amp; essay planning</title><desc id="map-description">V + A: violence and ambition: Violence: service to Scotland becomes murder for personal power, then attacks on innocents. Ambition: “vaulting ambition” (1.7), a riding metaphor, shows Macbeth knows the danger. Connect cause and consequence: desire for power changes the purpose of violence. G + G: guilt and gender: Guilt: “Out, damned spot” (5.1), a failed imperative in fragmented prose, exposes lost control. Gender: “then you were a man” (1.7) makes identity conditional on murder. Macduff’s “also” (4.3) joins grief to courage. Feeling does not cancel manhood. A + S: concealment and prophecy: Appearance and reality: “Stars, hide your fires” (1.4), an imperative with light-dark imagery, hides desire. Supernatural: “none of woman born” (4.1) uses equivocation, not a reliable guarantee. Witches are catalysts Macbeth’s choices remain visible. Kingship remains important: Regicide: killing a king. Usurpation: taking power without a legitimate right. Duncan names Malcolm heir. Responsible rule serves Scotland tyranny serves Macbeth. Divine right: belief in God-given authority. The sacred “anointed temple” metaphor (2.3) makes murder sacrilegious. Build a whole-play argument: VAGGAS: a memory aid, not a required checklist. Choose connections that fit the question. Inner conflict: conscience against ambition pressure about manhood guilt becoming renewed violence. For each idea: accurate evidence, a method, meaning and effect. Explain change across the play. Choose the right evidence: 15-mark extract: analyse the printed passage throughout. Avoid switching to a whole-play essay. 25-mark essay: select developing moments from across the play. Three strong ideas can work no fixed paragraph count. Qualify claims: influence is not compulsion courage does not excuse cruelty. Context supports close analysis.</desc><defs><marker id="arrow-2366a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2366a0" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-468133" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#468133" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-7651a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7651a5" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-167d87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#167d87" stroke-width="2" stroke-linejoin="round"/></marker><marker id="arrow-b95619" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b95619" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1120" height="768" fill="#fffdf8"/><g class="map-section" id="section-1" data-source-panel="0" data-bounds="0,0,322,336" transform="translate(18 18)"><rect width="322" height="336" rx="16" fill="white" stroke="#2366a0" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="64" rx="11" fill="#2366a0" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#2366a0"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text class="panel-title" x="50" y="34" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">V + A: violence and</text><text class="panel-title" x="50" y="62" font-size="20" fill="#2366a0" font-weight="700" text-anchor="start">ambition</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Violence:</tspan> service to Scotland becomes</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">murder for personal power, then</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">attacks on innocents.</text><path class="section-divider" d="M18 159H304" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Ambition:</tspan> “vaulting ambition” (1.7), a</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">riding <tspan font-weight="700">metaphor,</tspan> shows Macbeth</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">knows the danger.</text><path class="section-divider" d="M18 238H304" stroke="#2366a0" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="261" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Connect</tspan> <tspan font-weight="700">cause</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">consequence:</tspan></text><text class="body-text" x="18" y="283" font-size="16" fill="#000000" font-weight="400" text-anchor="start">desire for power changes the purpose</text><text class="body-text" x="18" y="305" font-size="16" fill="#000000" font-weight="400" text-anchor="start">of violence.</text></g></g><g class="map-section" id="section-2" data-source-panel="1" data-bounds="0,0,322,286" transform="translate(18 366)"><rect width="322" height="286" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="304" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">G + G: guilt and gender</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Guilt:</tspan> “Out, damned spot” (5.1), a failed</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">imperative</tspan> in fragmented prose,</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">exposes lost control.</text><path class="section-divider" d="M18 131H304" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Gender:</tspan> “then you were a man” (1.7)</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">makes identity conditional on murder.</text><path class="section-divider" d="M18 188H304" stroke="#b95619" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macduff’s “also” (4.3) joins grief to</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">courage.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Feeling does not cancel manhood.</text></g></g><g class="map-section" id="section-3" data-source-panel="2" data-bounds="0,0,350,314" transform="translate(352 18)"><rect width="350" height="314" rx="16" fill="white" stroke="#468133" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="64" rx="11" fill="#468133" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#468133"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text class="panel-title" x="50" y="34" font-size="20" fill="#468133" font-weight="700" text-anchor="start">A + S: concealment and</text><text class="panel-title" x="50" y="62" font-size="20" fill="#468133" font-weight="700" text-anchor="start">prophecy</text></g><g class="section-body"><text class="body-text" x="18" y="103" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Appearance</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">reality:</tspan> “Stars, hide your</text><text class="body-text" x="18" y="125" font-size="16" fill="#000000" font-weight="400" text-anchor="start">fires” (1.4), an <tspan font-weight="700">imperative</tspan> with light-dark</text><text class="body-text" x="18" y="147" font-size="16" fill="#000000" font-weight="400" text-anchor="start">imagery, hides desire.</text><path class="section-divider" d="M18 159H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="182" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Supernatural:</tspan> “none of woman born” (4.1)</text><text class="body-text" x="18" y="204" font-size="16" fill="#000000" font-weight="400" text-anchor="start">uses <tspan font-weight="700">equivocation,</tspan> not a reliable</text><text class="body-text" x="18" y="226" font-size="16" fill="#000000" font-weight="400" text-anchor="start">guarantee.</text><path class="section-divider" d="M18 238H332" stroke="#468133" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="261" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Witches are catalysts</text><text class="body-text" x="18" y="283" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Macbeth’s choices remain visible.</text></g></g><g class="map-section" id="section-4" data-source-panel="3" data-bounds="0,0,350,308" transform="translate(352 344)"><rect width="350" height="308" rx="16" fill="white" stroke="#7651a5" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="332" height="36" rx="11" fill="#7651a5" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#7651a5"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text class="panel-title" x="50" y="34" font-size="20" fill="#7651a5" font-weight="700" text-anchor="start">Kingship remains important</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Regicide:</tspan> killing a king.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Usurpation:</tspan> taking power without a</text><text class="body-text" x="18" y="119" font-size="16" fill="#000000" font-weight="400" text-anchor="start">legitimate right.</text><path class="section-divider" d="M18 131H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Duncan names Malcolm heir.</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Responsible rule serves Scotland</text><text class="body-text" x="18" y="198" font-size="16" fill="#000000" font-weight="400" text-anchor="start">tyranny serves Macbeth.</text><path class="section-divider" d="M18 210H332" stroke="#7651a5" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Divine</tspan> <tspan font-weight="700">right:</tspan> belief in God-given authority.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">The sacred “anointed temple” <tspan font-weight="700">metaphor</tspan></text><text class="body-text" x="18" y="277" font-size="16" fill="#000000" font-weight="400" text-anchor="start">(2.3) makes murder sacrilegious.</text></g></g><g class="map-section" id="section-5" data-source-panel="4" data-bounds="0,0,388,286" transform="translate(714 18)"><rect width="388" height="286" rx="16" fill="white" stroke="#167d87" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="370" height="36" rx="11" fill="#167d87" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#167d87"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text class="panel-title" x="50" y="34" font-size="20" fill="#167d87" font-weight="700" text-anchor="start">Build a whole-play argument</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">VAGGAS:</tspan> a memory aid, not a required checklist.</text><text class="body-text" x="18" y="97" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Choose connections that fit the question.</text><path class="section-divider" d="M18 109H370" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="132" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">Inner</tspan> <tspan font-weight="700">conflict:</tspan> conscience against ambition</text><text class="body-text" x="18" y="154" font-size="16" fill="#000000" font-weight="400" text-anchor="start">pressure about manhood</text><text class="body-text" x="18" y="176" font-size="16" fill="#000000" font-weight="400" text-anchor="start">guilt becoming renewed violence.</text><path class="section-divider" d="M18 188H370" stroke="#167d87" stroke-opacity=".25" stroke-width="1" fill="none"/><text class="body-text" x="18" y="211" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">For</tspan> <tspan font-weight="700">each</tspan> <tspan font-weight="700">idea:</tspan> accurate evidence, a method,</text><text class="body-text" x="18" y="233" font-size="16" fill="#000000" font-weight="400" text-anchor="start">meaning and effect.</text><text class="body-text" x="18" y="255" font-size="16" fill="#000000" font-weight="400" text-anchor="start">Explain change across the play.</text></g></g><g class="map-section" id="section-6" data-source-panel="5" data-bounds="0,0,388,330" transform="translate(714 316)"><rect width="388" height="330" rx="16" fill="white" stroke="#b95619" stroke-width="1.8"/><g class="section-heading"><rect x="9" y="9" width="370" height="36" rx="11" fill="#b95619" opacity=".09"/><circle cx="29" cy="27" r="12" fill="#b95619"/><text class="diagram-label" x="29" y="32" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text class="panel-title" x="50" y="34" font-size="20" fill="#b95619" font-weight="700" text-anchor="start">Choose the right evidence</text></g><g class="section-body"><text class="body-text" x="18" y="75" font-size="16" fill="#000000" font-weight="400" text-anchor="start"><tspan font-weight="700">15-mark</tspan> <tspan font-weight="700">extract:</t