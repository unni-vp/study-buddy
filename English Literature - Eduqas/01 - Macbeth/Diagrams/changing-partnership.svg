<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title"><title id="title">Parallel changes in Macbeth and Lady Macbeth across the play</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3L0 6" fill="#2166ad"/></marker></defs><rect width="1000" height="480" fill="white"/><text x="500" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#18344a">Power grows; the partnership breaks</text><text x="20" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="start" fill="#18344a">Macbeth</text><rect x="10" y="100" width="230" height="115" rx="12" fill="#e7f0fb" stroke="#587285"/><text x="125" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Act 1</text><text x="125" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Hesitates; knows</text><text x="125" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">murder is wrong</text><path d="M245 157H256" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="100" width="230" height="115" rx="12" fill="#e7f0fb" stroke="#587285"/><text x="375" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Act 2</text><text x="375" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Kills Duncan;</text><text x="375" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">fears discovery</text><path d="M495 157H506" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="100" width="230" height="115" rx="12" fill="#e7f0fb" stroke="#587285"/><text x="625" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Act 3</text><text x="625" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Plans more murder;</text><text x="625" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">keeps his wife out</text><path d="M745 157H756" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="100" width="230" height="115" rx="12" fill="#e7f0fb" stroke="#587285"/><text x="875" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Acts 4–5</text><text x="875" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Acts as a tyrant;</text><text x="875" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">ends isolated</text><text x="20" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="start" fill="#18344a">Lady Macbeth</text><rect x="10" y="290" width="230" height="115" rx="12" fill="#f5e7ee" stroke="#587285"/><text x="125" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Act 1</text><text x="125" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Directs the plot;</text><text x="125" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">challenges Macbeth</text><path d="M245 347H256" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="290" width="230" height="115" rx="12" fill="#f5e7ee" stroke="#587285"/><text x="375" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Act 2</text><text x="375" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Returns daggers;</text><text x="375" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">dismisses guilt</text><path d="M495 347H506" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="290" width="230" height="115" rx="12" fill="#f5e7ee" stroke="#587285"/><text x="625" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Act 3</text><text x="625" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Excluded from plans;</text><text x="625" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">manages the banquet</text><path d="M745 347H756" fill="none" stroke="#2166ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="290" width="230" height="115" rx="12" fill="#f5e7ee" stroke="#587285"/><text x="875" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#18344a">Act 5</text><text x="875" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">Sleepwalks; cannot</text><text x="875" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#18344a">escape imagined blood</text><text x="500" y="453" font-family="Segoe UI, Arial, sans-serif" font-size="23" text-anchor="middle" fill="#18344a">Shared ambition → hidden plans → isolation</text></svg>